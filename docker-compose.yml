# Продовый docker-compose: Django + Playwright Chromium (headless), Postgres,
# отдельный scheduler-контейнер, фронтенд (dev по умолчанию).
#
# Перед запуском: скопировать .env.example → .env и заполнить секреты.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-dashboard}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dashboard}
      POSTGRES_DB: ${DB_NAME:-dashboard}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dashboard}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DB_HOST: postgres
      DB_PORT: "5432"
      BROWSER_HEADLESS: "true"
      RUN_SCHEDULER: "false"
      BROWSER_PROFILE_DIR: /app/.browser-profile
    ports:
      - "8000:8000"
    volumes:
      - browser_profile:/app/.browser-profile
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build: ./backend
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DB_HOST: postgres
      DB_PORT: "5432"
      BROWSER_HEADLESS: "true"
      RUN_SCHEDULER: "true"
      BROWSER_PROFILE_DIR: /app/.browser-profile
    command: ["python", "manage.py", "run_scheduler"]
    volumes:
      - browser_profile:/app/.browser-profile
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host

volumes:
  postgres_data:
  browser_profile:
