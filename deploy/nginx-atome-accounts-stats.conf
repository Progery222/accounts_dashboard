# Фрагмент для /opt/nginx-proxy.conf (HTTPS server block).
# Вставить после set $streamcut и ДО location /api/

    set $dashboard_web http://dashboard-frontend:80;
    set $dashboard_api http://dashboard-backend:8000;

    # AccountsStats (dashboard) — Atomic UI + Django API под тем же доменом
    location ^~ /accounts-stats/api/ {
        client_max_body_size 128m;
        rewrite ^/accounts-stats/api/(.*)$ /api/$1 break;
        proxy_pass $dashboard_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location ^~ /accounts-stats/ {
        rewrite ^/accounts-stats/(.*)$ /$1 break;
        proxy_pass $dashboard_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
