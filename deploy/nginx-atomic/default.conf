# :80 — LAN (без пароля). :81 — публичный туннель (Basic Auth).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index app.html;
    include /etc/nginx/conf.d/dashboard-locations.inc;
}

server {
    listen 81;
    server_name _;
    root /usr/share/nginx/html;
    index app.html;

    auth_basic "AccountsStats";
    auth_basic_user_file /etc/nginx/.htpasswd;

    include /etc/nginx/conf.d/dashboard-locations.inc;
}
