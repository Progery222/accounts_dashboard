# Quick Tunnel (npm run tunnel): публичный https://….trycloudflare.com без своего домена.
# Один hostname — статика new_frontend (5174) и Django API по путям ниже.
# Без path-правил /api/… запросы ушли бы только на :5174 и фронт не достучался до API.
# ВАЖНО: path — это regexp в Go. Нельзя писать /api* (это «/ap» + ноль или больше «i»,
# совпадает с /app.html и уводит статику на Django → 404). Используйте якорь ^/api.
# Нужны: npm run dev (5174) и python manage.py runserver (8000).
# Разово: cloudflared tunnel login. В backend/.env при DEBUG=false — DJANGO_USE_TLS_PROXY_HEADERS=1
# (см. корневой .env.example), иначе POST к API через туннель может получить 403 CSRF.
# DNS: если в браузере DNS_PROBE_FINISHED_NXDOMAIN, а cloudflared запущен — проверьте резолвер.
# Часто роутер/гостевой Wi‑Fi (DNS вроде 10.x.x.x) не отдаёт A‑записи для *.trycloudflare.com;
# укажите в Windows DNS 1.1.1.1 / 8.8.8.8 или включите DoH в Chrome — через публичный DNS имя резолвится.
ingress:
  - path: ^/api
    service: http://127.0.0.1:8000
  - path: ^/admin
    service: http://127.0.0.1:8000
  - path: ^/static
    service: http://127.0.0.1:8000
  - path: ^/media
    service: http://127.0.0.1:8000
  - path: ^/healthz
    service: http://127.0.0.1:8000
  - service: http://127.0.0.1:5174
