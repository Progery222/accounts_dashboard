const { useState: useStateDetail, useEffect: useEffectDetail } = React;

function AccountDetailScreen({ accountId, onBack, onDataChanged }) {
  const isMobile = useIsMobile(980);
  const [loading, setLoading] = useStateDetail(true);
  const [account, setAccount] = useStateDetail(null);
  const [posts, setPosts] = useStateDetail([]);
  const [tab, setTab] = useStateDetail('posts');
  const [busy, setBusy] = useStateDetail(false);
  const [softLoading, setSoftLoading] = useStateDetail(false);
  const [analyticsPosts, setAnalyticsPosts] = useStateDetail([]);
  const [postThumbState, setPostThumbState] = useStateDetail({});

  const load = async ({ silent = false } = {}) => {
    if (silent) setSoftLoading(true);
    else setLoading(true);
    try {
      const [a, p] = await Promise.all([
        _fetchJson(`/api/accounts/${accountId}/`),
        _fetchJson(`/api/accounts/${accountId}/posts/`),
      ]);
      setAccount(a);
      setPosts(Array.isArray(p) ? p : []);
    } catch (e) {
      await uiAlert(`Не удалось загрузить аккаунт: ${e instanceof Error ? e.message : String(e)}`, 'Ошибка');
    } finally {
      if (silent) setSoftLoading(false);
      else setLoading(false);
    }
  };

  useEffectDetail(() => { void load(); }, [accountId]);

  useEffectDetail(() => {
    let cancelled = false;
    (async () => {
      try {
        const res = await _fetchJson(`/api/accounts/analytics/top-posts/?period=30d&account_id=${accountId}&sort_by=view_delta&page_size=20&min_views=0`);
        if (!cancelled) setAnalyticsPosts(Array.isArray(res?.items) ? res.items : []);
      } catch {
        if (!cancelled) setAnalyticsPosts([]);
      }
    })();
    return () => { cancelled = true; };
  }, [accountId]);

  const refreshAccount = async () => {
    setBusy(true);
    try {
      await _postJson(`/api/accounts/${accountId}/refresh/`, {});
      await load({ silent: true });
      await onDataChanged?.();
    } finally {
      setBusy(false);
    }
  };

  const deleteAccount = async () => {
    if (!(await uiConfirm('Удалить аккаунт?', 'Подтвердите удаление'))) return;
    setBusy(true);
    try {
      await _delete(`/api/accounts/${accountId}/`);
      await onDataChanged?.();
      onBack?.();
    } finally {
      setBusy(false);
    }
  };

  if (loading || !account) {
    return (
      <div style={{ minHeight: '100vh', padding: 28, color: 'var(--ink-mute)' }}>
        Загрузка аккаунта...
      </div>
    );
  }

  const profileLabel = PROFILE_META[String(account.profile_id)]?.label || account.profile_name || 'Без профиля';
  const isUnavailable = !!(account.profile_unavailable || account.unavailable);
  const unavailableReason = String(account.profile_unavailable_reason || account.unavailable_reason || '');
  const externalProfileUrl = _externalProfileUrl(account.platform, account.username);
  return (
    <div style={{ minHeight: '100vh', padding: isMobile ? '14px 12px 28px' : '28px 36px 80px' }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 18 }}>
        <button onClick={onBack} style={{ border: 'none', background: 'transparent', color: 'var(--ink-dim)', cursor: 'pointer', fontSize: 14 }}>← Аккаунты</button>
        <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
          {(busy || softLoading) && (
            <span className="mono" style={{ fontSize: 11, color: 'var(--ink-mute)', letterSpacing: '0.08em' }}>ОБНОВЛЕНИЕ...</span>
          )}
          <button onClick={refreshAccount} disabled={busy} style={{ padding: '8px 14px', borderRadius: 10, border: '1px solid var(--line)', background: 'rgba(255,255,255,0.04)', color: 'var(--ink)', cursor: 'pointer', opacity: busy ? 0.7 : 1 }}>
            {busy ? '↻ Обновление...' : '↻ Обновить'}
          </button>
          <button onClick={deleteAccount} disabled={busy} style={{ padding: '8px 14px', borderRadius: 10, border: '1px solid #ef444455', background: '#ef444415', color: '#fca5a5', cursor: 'pointer' }}>✕ Удалить</button>
        </div>
      </div>

      <div style={{ display: 'flex', alignItems: 'center', gap: 14, marginBottom: 16 }}>
        <AccountAvatar
          src={_pickAvatarUrl(account)}
          name={String(account.display_name || account.username || '?')}
          size={58}
          borderColor="rgba(106,169,255,0.35)"
          fallbackBg="linear-gradient(135deg, #6aa9ff40, #ec489940)"
        />
        <div>
          <div style={{ fontSize: 28, fontWeight: 700 }}>{account.display_name || account.username}</div>
          <div className="mono" style={{ color: 'var(--ink-mute)', fontSize: 13 }}>
            {externalProfileUrl ? (
              <a
                href={externalProfileUrl}
                target="_blank"
                rel="noopener noreferrer"
                style={{ color: '#93c5fd', textDecoration: 'none', borderBottom: '1px dashed rgba(147,197,253,0.45)' }}
                title={`Открыть профиль ${account.username} на ${account.platform_label || account.platform}`}
              >
                @{account.username}
              </a>
            ) : (
              `@${account.username}`
            )} · {account.platform_label || account.platform} · {profileLabel}
          </div>
          <div style={{ marginTop: 6 }}>
            <AvailabilityBadge unavailable={isUnavailable} reason={unavailableReason} />
          </div>
          {account.bio ? <div style={{ color: 'var(--ink-dim)', fontSize: 13, marginTop: 4 }}>{account.bio}</div> : null}
        </div>
      </div>
      {isUnavailable && (
        <div style={{ marginBottom: 14, padding: '10px 12px', borderRadius: 10, border: '1px solid rgba(239,68,68,0.35)', background: 'rgba(239,68,68,0.12)', color: '#fecaca', fontSize: 13 }}>
          Аккаунт сейчас недоступен для сбора данных.{unavailableReason ? ` Причина: ${unavailableReason}` : ''}
        </div>
      )}

      <div style={{ display: 'grid', gridTemplateColumns: isMobile ? '1fr 1fr' : 'repeat(4, minmax(120px, 1fr))', gap: 10, marginBottom: 16 }}>
        {[
          ['Подписчики', Number(account.follower_count || 0), Number(account.follower_delta || 0)],
          ['Просмотры', Number(account.view_count || 0), Number(account.view_delta || 0)],
          ['Лайки', Number(account.like_count || 0), Number(account.like_delta || 0)],
          ['Публикации', Number(account.post_count || 0), Number(account.post_delta || 0)],
        ].map(([label, val, delta]) => (
          <div key={label} style={{ border: '1px solid var(--line)', borderRadius: 12, background: 'rgba(255,255,255,0.02)', padding: 14 }}>
            <div style={{ fontSize: 13, color: 'var(--ink-mute)' }}>{label}</div>
            <div className="tnum" style={{ fontSize: 26, fontWeight: 700 }}>{fmt(val)}</div>
            {_hasDelta(delta) && (
              <div className="mono" style={{ fontSize: 12, color: Number(delta) >= 0 ? '#4ade80' : '#fca5a5' }}>
                {Number(delta) >= 0 ? '+' : ''}{fmt(Number(delta))}
              </div>
            )}
          </div>
        ))}
      </div>

      <div style={{ display: 'flex', gap: 8, marginBottom: 14 }}>
        <Pill active={tab === 'posts'} onClick={() => setTab('posts')}>Публикации ({posts.length})</Pill>
        <Pill active={tab === 'analytics'} onClick={() => setTab('analytics')}>Аналитика</Pill>
      </div>

      {tab === 'posts' ? (
        posts.length === 0 ? (
          <div style={{ color: 'var(--ink-mute)' }}>Нет публикаций.</div>
        ) : (
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(260px, 1fr))', gap: 12 }}>
            {posts.map((p, idx) => {
              const thumbKey = String(p.id || p.external_id || p.post_url || idx);
              const thumbState = postThumbState[thumbKey] || 'idle';
              return (
              <div key={thumbKey} style={{ border: '1px solid var(--line)', borderRadius: 12, overflow: 'hidden', background: 'rgba(255,255,255,0.02)' }}>
                <div style={{ position: 'relative', height: 160, background: 'rgba(15,23,42,0.7)' }}>
                  {!!p.thumbnail_url && (
                    <img
                      src={p.thumbnail_url}
                      alt=""
                      loading="lazy"
                      decoding="async"
                      onLoad={() => setPostThumbState((prev) => ({ ...prev, [thumbKey]: 'loaded' }))}
                      onError={() => setPostThumbState((prev) => ({ ...prev, [thumbKey]: 'error' }))}
                      style={{
                        width: '100%',
                        height: 160,
                        objectFit: 'cover',
                        display: 'block',
                        opacity: thumbState === 'loaded' ? 1 : 0,
                        transition: 'opacity 220ms ease',
                      }}
                    />
                  )}
                  {!!p.thumbnail_url && thumbState !== 'loaded' && thumbState !== 'error' && (
                    <div className="mono" style={{ position: 'absolute', inset: 0, display: 'grid', placeItems: 'center', color: 'var(--ink-mute)', fontSize: 11 }}>
                      Загрузка...
                    </div>
                  )}
                  {(!p.thumbnail_url || thumbState === 'error') && (
                    <div style={{ position: 'absolute', inset: 0, display: 'grid', placeItems: 'center', color: 'var(--ink-mute)' }}>
                      NO IMAGE
                    </div>
                  )}
                </div>
                <div style={{ padding: 10 }}>
                  <div style={{ fontSize: 13, color: 'var(--ink-dim)', minHeight: 36 }}>{String(p.description || '').slice(0, 90)}</div>
                  <div className="mono" style={{ marginTop: 8, fontSize: 12, color: 'var(--ink-mute)' }}>
                    <span style={{ display: 'inline-flex', alignItems: 'center', gap: 4 }}>
                      <EyeIcon size={12} color="currentColor" /> {fmt(Number(p.view_count || 0))}
                    </span> · ♥ {fmt(Number(p.like_count || 0))}
                  </div>
                </div>
              </div>
            )})}
          </div>
        )
      ) : (
        analyticsPosts.length === 0 ? (
          <div style={{ color: 'var(--ink-mute)' }}>Нет данных аналитики.</div>
        ) : (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
            {analyticsPosts.map((p, i) => (
              <div key={p.id || i} style={{ border: '1px solid var(--line)', borderRadius: 12, background: 'rgba(255,255,255,0.02)', padding: 12 }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', gap: 12 }}>
                  <div style={{ color: 'var(--ink-dim)', fontSize: 13 }}>{String(p.description || '').slice(0, 120)}</div>
                  <div className="mono" style={{ color: '#4ade80', fontSize: 12 }}>+{fmt(Number(p.view_delta || 0))}</div>
                </div>
              </div>
            ))}
          </div>
        )
      )}
    </div>
  );
}

// Analytics screen — atomic-themed redesign of "Аналитика" tab.

const { useState: useStateAn, useEffect: useEffectAn } = React;

function AnalyticsScreen({ tweaks, onOpenGlobalModal }) {
  const isMobile = useIsMobile(980);
  const accent = tweaks.accent || '#6aa9ff';
  const pageSize = isMobile ? 5 : 20;
  const [period, setPeriod] = useStateAn('1d');
  const [platform, setPlatform] = useStateAn('all');
  const [sortBy, setSortBy] = useStateAn('view_delta');
  const [minViews, setMinViews] = useStateAn(10);
  const [hashtagSort, setHashtagSort] = useStateAn('count');
  const [topPosts, setTopPosts] = useStateAn([]);
  const [page, setPage] = useStateAn(1);
  const [pages, setPages] = useStateAn(1);
  const [totalPosts, setTotalPosts] = useStateAn(0);
  const [insights, setInsights] = useStateAn(null);
  const [loading, setLoading] = useStateAn(false);
  const [initialReady, setInitialReady] = useStateAn(false);

  useEffectAn(() => {
    let cancelled = false;
    (async () => {
      setLoading(true);
      try {
        const params = new URLSearchParams({
          period,
          sort_by: sortBy,
          page_size: String(pageSize),
          page: String(page),
          min_views: String(minViews),
        });
        if (platform !== 'all') params.set('platform', platform);
        const [res, insightsRes] = await Promise.all([
          _fetchJson(`/api/accounts/analytics/top-posts/?${params.toString()}`),
          _fetchJson(`/api/accounts/analytics/insights/?period=${encodeURIComponent(period)}${platform !== 'all' ? `&platform=${encodeURIComponent(platform)}` : ''}&min_views=${encodeURIComponent(String(minViews))}`).catch(() => null),
        ]);
        const mapped = Array.isArray(res?.items) ? res.items.map((p) => ({
          handle: p?.account?.platform === 'rumble'
            ? String(p?.account?.username || '')
            : `@${String(p?.account?.username || '')}`,
          platform: String(p?.account?.platform || ''),
          date: _ruShortDate(p?.posted_at || '').slice(0, 8).replace(/\./g, '.'),
          text: String(p?.description || ''),
          delta: Number(p?.view_delta || 0),
          views: Number(p?.view_count || 0),
          likes: Number(p?.like_count || 0),
          er: Number(p?.engagement_rate || 0),
          thumb: String(p?.thumbnail_url || ''),
          postUrl: String(p?.post_url || ''),
        })) : [];
        if (!cancelled) {
          setTopPosts(mapped);
          setPages(Math.max(1, Number(res?.pages || 1)));
          setTotalPosts(Math.max(0, Number(res?.total || 0)));
          setInsights(insightsRes && typeof insightsRes === 'object' ? insightsRes : null);
          setInitialReady(true);
        }
      } catch {
        if (!cancelled) {
          setTopPosts([]);
          setPages(1);
          setTotalPosts(0);
          setInsights(null);
          setInitialReady(true);
        }
      } finally {
        if (!cancelled) setLoading(false);
      }
    })();
    return () => { cancelled = true; };
  }, [period, platform, sortBy, page, minViews, pageSize]);

  React.useEffect(() => {
    setPage(1);
  }, [period, platform, sortBy, minViews]);

  const sortOptions = [
    { id: 'view_delta', label: 'Прирост просмотров' },
    { id: 'like_delta', label: 'Прирост лайков' },
    { id: 'views', label: 'Просмотры (всего)' },
    { id: 'likes', label: 'Лайки (всего)' },
    { id: 'er', label: 'Вовлеченность (ER)' },
  ];

  const analyticsRows = topPosts;
  const safeRows = analyticsRows.length > 0 ? analyticsRows : [{ delta: 0, views: 0, er: 0 }];
  const hourRows = Array.isArray(insights?.best_hours) ? insights.best_hours : [];
  const platformRows = Array.isArray(insights?.platform_comparison) ? insights.platform_comparison : [];
  const totalDelta = platformRows.reduce((acc, r) => acc + (Number(r.avg_views || 0) * Number(r.post_count || 0)), 0);
  const totalPostsCount = platformRows.reduce((acc, r) => acc + Number(r.post_count || 0), 0);
  const avgEr = totalPostsCount > 0
    ? (platformRows.reduce((acc, r) => acc + (Number(r.avg_er || 0) * Number(r.post_count || 0)), 0) / totalPostsCount)
    : (safeRows.reduce((acc, p) => acc + Number(p.er || 0), 0) / Math.max(1, safeRows.length));
  const engagementSpark = hourRows.length > 0
    ? hourRows.map((h) => Math.max(0, Number(h.avg_views || 0)))
    : safeRows.map((p) => Math.max(0, Number(p.delta || 0))).reverse();
  const viewsSpark = hourRows.length > 0
    ? hourRows.map((h) => Math.max(0, Number(h.avg_views || 0)))
    : safeRows.map((p) => Math.max(0, Number(p.views || 0))).reverse();
  const erSpark = hourRows.length > 0
    ? hourRows.map((h) => Number(h.avg_er || 0))
    : safeRows.map((p) => Number(p.er || 0));
  const postDeltas = safeRows
    .map((p) => Math.max(0, Number(p.delta || 0)))
    .filter((v) => Number.isFinite(v));
  const viralitySpark = postDeltas.length > 0
    ? postDeltas.slice().reverse()
    : (hourRows.length > 0 ? hourRows.map((h) => Number(h.avg_views || 0)) : [0, 0]);
  const viralCount = postDeltas.filter((v) => v >= 200).length;
  const maxPostDelta = postDeltas.length > 0 ? Math.max(...postDeltas) : 0;
  let viralityLevel = 'LOW';
  if (maxPostDelta >= 1000) viralityLevel = 'VERY HIGH';
  else if (maxPostDelta >= 500) viralityLevel = 'HIGH';
  else if (maxPostDelta >= 200) viralityLevel = 'MEDIUM';
  const platformComparison = platformRows;
  const topHashtagsRaw = Array.isArray(insights?.top_hashtags) ? insights.top_hashtags : [];
  const bestHours = Array.isArray(insights?.best_hours) ? insights.best_hours : [];
  const bestWeekdays = Array.isArray(insights?.best_weekdays) ? insights.best_weekdays : [];
  const hashtagSorted = [...topHashtagsRaw].sort((a, b) => {
    const av = Number(a?.[hashtagSort] || 0);
    const bv = Number(b?.[hashtagSort] || 0);
    return bv - av;
  }).slice(0, 20);
  const maxHourViews = Math.max(1, ...bestHours.map((h) => Number(h.avg_views || 0)));
  const maxWeekdayViews = Math.max(1, ...bestWeekdays.map((d) => Number(d.avg_views || 0)));

  if (!initialReady) {
    return (
      <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column' }} data-screen-label="Analytics">
        <TopBar
          accent={accent}
          onRefreshAll={() => onOpenGlobalModal?.('refresh_all')}
          onOpenSchedule={() => onOpenGlobalModal?.('schedule')}
          onOpenAddList={() => onOpenGlobalModal?.('add_list')}
          onOpenAddOne={() => onOpenGlobalModal?.('add_one')}
        />
        <main style={{ flex: 1, padding: isMobile ? '12px 10px 132px' : '28px 36px 60px', maxWidth: 1600, width: '100%', margin: '0 auto' }}>
          <div style={{ display: 'grid', gridTemplateColumns: isMobile ? '1fr' : '1.6fr 1fr 1fr 1fr', gap: 12, marginBottom: 18 }}>
            {[0, 1, 2, 3].map((i) => (
              <div
                key={`an-sk-${i}`}
                style={{
                  height: isMobile && i > 0 ? 128 : 186,
                  borderRadius: 16,
                  border: '1px solid var(--line)',
                  background: 'linear-gradient(90deg, rgba(255,255,255,0.015) 0%, rgba(255,255,255,0.055) 45%, rgba(255,255,255,0.015) 100%)',
                  backgroundSize: '220% 100%',
                  animation: 'anShimmer 1.4s linear infinite',
                }}
              />
            ))}
          </div>
          <style>{`@keyframes anShimmer { 0% { background-position: 220% 0; } 100% { background-position: -220% 0; } }`}</style>
        </main>
      </div>
    );
  }

  return (
    <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column' }} data-screen-label="Analytics">
      <TopBar
        accent={accent}
        onRefreshAll={() => onOpenGlobalModal?.('refresh_all')}
        onOpenSchedule={() => onOpenGlobalModal?.('schedule')}
        onOpenAddList={() => onOpenGlobalModal?.('add_list')}
        onOpenAddOne={() => onOpenGlobalModal?.('add_one')}
      />
      <main style={{ flex: 1, padding: isMobile ? '12px 10px 132px' : '28px 36px 60px', maxWidth: 1600, width: '100%', margin: '0 auto', animation: 'anFadeIn .24s ease-out' }}>
        {/* Hero band */}
        <div style={{ display: 'grid', gridTemplateColumns: isMobile ? '1fr' : '1.6fr 1fr 1fr 1fr', gap: 12, marginBottom: 18 }}>
          <div style={{ borderRadius: 16, border: '1px solid var(--line)', background: 'rgba(255,255,255,0.015)', padding: 24, position: 'relative', overflow: 'hidden' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
              <div style={{ fontSize: 13, color: 'var(--ink-dim)', fontWeight: 500, letterSpacing: 0 }}>Вовлеченность</div>
              <div className="mono tnum" style={{ fontSize: 11, color: 'var(--ink-mute)', letterSpacing: '0.16em' }}>{period === '1d' ? '24H' : period.toUpperCase()}</div>
            </div>
            <div style={{ position: 'absolute', top: 10, right: 10 }}>
              <InfoButton
                onClick={() => uiAlert('Вовлеченность отражает суммарную динамику просмотров по реальным данным из аналитики за выбранный период.', 'Вовлеченность')}
                title="Подробнее: Вовлеченность"
                size={11}
              />
            </div>
            <div className="tnum" style={{ fontSize: isMobile ? 46 : 64, fontWeight: 700, lineHeight: 1, marginTop: 8, letterSpacing: '-0.02em' }}>{fmt(totalDelta)}</div>
            <div className="mono tnum" style={{ marginTop: 4, fontSize: 14, color: '#4ade80' }}>▲ динамика по реальным данным</div>
            <div style={{ marginTop: 12, height: 60 }}><Sparkline data={engagementSpark.length > 1 ? engagementSpark : TREND_24H} color={accent} width={isMobile ? 320 : 500} height={60} /></div>
          </div>
          {[
            {
              l: 'Топ постов',
              v: String(totalPostsCount || analyticsRows.length),
              d: `${fmt(totalDelta)} / ${period === '1d' ? '24h' : period.toUpperCase()}`,
              c: '#ec4899',
              spark: viewsSpark,
              infoTitle: 'Топ постов',
              infoText: 'График показывает тренд просмотров в блоке топ-постов за выбранный период.',
            },
            {
              l: 'Средний ER',
              v: `${avgEr.toFixed(1)}%`,
              d: `${analyticsRows.length} постов`,
              c: '#f59e0b',
              spark: erSpark,
              infoTitle: 'Средний ER',
              infoText: 'График показывает изменение среднего ER (engagement rate) за выбранный период.',
            },
            {
              l: 'Вирусность',
              v: viralityLevel,
              d: `${viralCount} поста >+200 · пик +${fmt(maxPostDelta)}`,
              c: '#4ade80',
              spark: viralitySpark,
              infoTitle: 'Вирусность',
              infoText: 'Уровень вирусности считается по реальному приросту просмотров постов (view_delta): MEDIUM от +200, HIGH от +500, VERY HIGH от +1000.',
            },
          ].map(s => (
            <div key={s.l} style={{ borderRadius: 16, border: '1px solid var(--line)', background: 'rgba(255,255,255,0.015)', padding: 20, position: 'relative' }}>
              <div style={{ position: 'absolute', top: 10, right: 10 }}>
                <InfoButton
                  onClick={() => uiAlert(String(s.infoText || ''), String(s.infoTitle || s.l))}
                  title={`Подробнее: ${s.l}`}
                  size={11}
                />
              </div>
              <div style={{ fontSize: 13, color: 'var(--ink-dim)', fontWeight: 500 }}>{s.l}</div>
              <div className="tnum" style={{ fontSize: isMobile ? 30 : 36, fontWeight: 700, marginTop: 8, letterSpacing: '-0.02em' }}>{s.v}</div>
              <div className="mono" style={{ fontSize: 12, color: s.c, marginTop: 4 }}>{s.d}</div>
              <div style={{ marginTop: 10, height: 36 }}>
                <Sparkline
                  data={Array.isArray(s.spark) && s.spark.length > 1 ? s.spark : TREND_24H.map(v => v * 0.4)}
                  color={s.c}
                  width={isMobile ? 360 : 220}
                  height={36}
                  dot={false}
                  stretch
                />
              </div>
            </div>
          ))}
        </div>

        {/* Period + platform */}
        <div style={{ display: 'flex', gap: 10, marginBottom: 18, flexWrap: 'wrap' }}>
          <div style={{ display: 'flex', gap: 6, padding: 4, borderRadius: 12, background: 'rgba(255,255,255,0.025)', border: '1px solid var(--line)' }}>
            {[['1d', 'Сутки'], ['7d', '7 дней'], ['30d', '30 дней']].map(([id, l]) => (
              <button key={id} onClick={() => setPeriod(id)} style={{
                padding: '8px 14px', borderRadius: 9, border: 'none', cursor: 'pointer',
                background: period === id ? '#fff' : 'transparent',
                color: period === id ? '#000' : 'var(--ink-dim)', fontSize: 13, fontWeight: 500,
              }}>{l}</button>
            ))}
          </div>
          <Pill active={platform === 'all'} onClick={() => setPlatform('all')}>Все</Pill>
          {PLATFORMS.map(p => (
            <Pill key={p.id} active={platform === p.id} onClick={() => setPlatform(p.id)} dot={isMobile ? undefined : p.color}>
              {isMobile ? <PlatformGlyph id={p.id} size={14} /> : p.label}
            </Pill>
          ))}
        </div>

        <SectionHeader
          kicker="TOP MOVERS"
          title={<>Топ постов <span style={{ color: 'var(--ink-mute)', fontWeight: 400, marginLeft: 8 }}>({totalPosts || topPosts.length})</span></>}
          right={
            <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
              {loading && <span className="mono" style={{ fontSize: 11, color: 'var(--ink-mute)' }}>Загрузка...</span>}
              <select
                value={String(minViews)}
                onChange={(e) => setMinViews(Math.max(0, Number(e.target.value || 0)))}
                title="Минимум просмотров для топа постов"
                style={{
                  minWidth: isMobile ? 140 : 160,
                  padding: '8px 10px',
                  borderRadius: 10,
                  border: '1px solid var(--line)',
                  background: 'rgba(148,163,184,0.16)',
                  color: '#ffffff',
                  fontSize: 14,
                  fontFamily: 'inherit',
                  cursor: 'pointer',
                }}
              >
                {[0, 10, 25, 50, 100, 250, 500, 1000].map((v) => (
                  <option key={v} value={String(v)} style={{ color: '#ffffff', background: '#374151' }}>

                  </option>
                ))}
              </select>
              <select
                value={sortBy}
                onChange={(e) => setSortBy(String(e.target.value || 'view_delta'))}
                style={{
                  minWidth: isMobile ? 180 : 240,
                  padding: '8px 10px',
                  borderRadius: 10,
                  border: '1px solid var(--line)',
                  background: 'rgba(148,163,184,0.16)',

                  fontSize: 14,
                  fontFamily: 'inherit',
                  cursor: 'pointer',
                }}
              >
                {sortOptions.map((o) => (
                  <option

                  </option>

              </select>
            </div>
          }
        />

        <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
          <div style={{ display: 'grid', gridTemplateColumns: isMobile ? '1fr' : '1fr 1fr', gap: 10 }}>
            {topPosts.map((p, i) => (
              <PostRow
                key={`${p.postUrl || p.handle}-${i}`}
                p={p}
                accent={accent}
                rank={((page - 1) * pageSize) + i + 1}
                max={(topPosts[0]?.delta || 1)}

              />
            ))}
          </div>
        </div>

          </div>

        <style>{`@keyframes anFadeIn { from { opacity: 0; } to { opacity: 1; } }`}</style>
        <div style={{ display: 'flex', justifyContent: 'center', alignItems: 'center', gap: 10, marginTop: 12, marginBottom: 4 }}>
          <button
            onClick={() => setPage((v) => Math.max(1, v - 1))}
            disabled={page <= 1}
            style={{ padding: '8px 12px', borderRadius: 10, border: '1px solid var(--line)', background: 'rgba(255,255,255,0.03)', color: 'var(--ink)', cursor: page <= 1 ? 'default' : 'pointer', opacity: page <= 1 ? 0.45 : 1 }}
          >
            ← Назад

          <span className="mono" style={{ fontSize: 12, color: 'var(--ink-mute)' }}>Стр. {page} / {pages}</span>
          <button
            onClick={() => setPage((v) => Math.min(pages, v + 1))}
            disabled={page >= pages}
            style={{ padding: '8px 12px', borderRadius: 10, border: '1px solid var(--line)', background: 'rgba(255,255,255,0.03)', color: 'var(--ink)', cursor: page >= pages ? 'default' : 'pointer', opacity: page >= pages ? 0.45 : 1 }}
          >

          </button>
        </div>

        <div style={{ marginTop: 20, display: 'grid', gridTemplateColumns: '1fr', gap: 14 }}>
          <div style={{ borderRadius: 14, border: '1px solid var(--line)', background: 'rgba(255,255,255,0.015)', overflow: 'hidden' }}>
            <div style={{ padding: '14px 16px', borderBottom: '1px solid var(--line)', fontWeight: 600 }}>Сравнение платформ</div>
            <div style={{ overflowX: 'auto' }}>
              <div style={{ minWidth: 620 }}>
                <div className="mono" style={{ display: 'grid', gridTemplateColumns: '1.4fr 0.8fr 0.8fr 0.8fr 0.8fr', gap: 10, padding: '10px 16px', fontSize: 11, color: 'var(--ink-mute)', borderBottom: '1px solid var(--line)' }}>

function PostRow({ p, accent, rank, max, isMobile = false }) {
  const meta = PLATFORM_META[p.platform] || { color: '#9ca3af', label: p.platform || 'Unknown' };
  const w = Math.max(0, (p.delta / Math.max(1, max)) * 100);
  const [thumbBroken, setThumbBroken] = React.useState(false);
  React.useEffect(() => {
    setThumbBroken(false);
  }, [p.thumb]);
  return (
    <div style={{
      position: 'relative',
      display: 'grid',
      gridTemplateColumns: isMobile ? '1fr' : '40px 64px minmax(120px, 1fr) auto 82px',
      gap: isMobile ? 10 : 14,
      alignItems: 'center',
      padding: isMobile ? '12px 12px' : '14px 18px', borderRadius: 14, border: '1px solid var(--line)',
      background: 'rgba(255,255,255,0.015)', overflow: 'hidden',
    }}>
      <div style={{ position: 'absolute', top: 0, bottom: 0, left: 0, width: `${w}%`, background: `linear-gradient(90deg, ${meta.color}10, transparent)`, opacity: 0.8 }} />
      <div className="mono tnum" style={{ position: 'relative', fontSize: isMobile ? 15 : 18, fontWeight: 700, color: rank <= 3 ? accent : 'var(--ink-mute)' }}>
        {String(rank).padStart(2, '0')}
      </div>
      {!isMobile && (
        <div style={{
          position: 'relative',
          width: 64,
          height: 64,
          borderRadius: 8,
          background: p.thumb && !thumbBroken ? '#0b1220' : `linear-gradient(135deg, ${meta.color}40, rgba(255,255,255,0.05))`,
          border: '1px solid var(--line)',
          overflow: 'hidden',
        }}>
          {p.thumb && !thumbBroken ? (
            <img
              src={p.thumb}
              alt=""
              onError={() => setThumbBroken(true)}
              style={{ width: '100%', height: '100%', objectFit: 'cover', display: 'block' }}
            />
          ) : (
            <div style={{ width: '100%', height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', fontFamily: 'JetBrains Mono, monospace', fontSize: 8, color: 'var(--ink-mute)', letterSpacing: '0.1em' }}>NO IMAGE</div>
          )}
        </div>
      )}
      <div style={{ position: 'relative', minWidth: 0 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 4, minWidth: 0 }}>
          <PlatformGlyph id={p.platform} size={14} />
          <span style={{ fontSize: 14, fontWeight: 500, minWidth: 0, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{p.handle}</span>
          <span className="mono" style={{ fontSize: 11, color: 'var(--ink-mute)', marginLeft: 'auto', flexShrink: 0 }}>{p.date}</span>
        </div>
        <div style={{ fontSize: 13, color: 'var(--ink-dim)', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{p.text}</div>
      </div>
      <div style={{ position: 'relative', display: 'flex', gap: 14, fontSize: 13, flexWrap: 'nowrap', justifyContent: isMobile ? 'flex-start' : 'flex-end' }}>
        <div className="mono tnum" style={{ color: 'var(--ink-dim)', display: 'inline-flex', alignItems: 'center', gap: 4 }}>
          <EyeIcon size={12} color="currentColor" /> {fmt(p.views)}
        </div>
        <div className="mono tnum" style={{ color: 'var(--ink-dim)' }}>♥ {fmt(p.likes)}</div>
        <div className="mono tnum" style={{ color: 'var(--ink-mute)' }}>ER {p.er.toFixed(1)}%</div>
      </div>
      <div className="mono tnum" style={{ position: 'relative', fontSize: isMobile ? 20 : 22, fontWeight: 600, color: '#4ade80', textAlign: isMobile ? 'left' : 'right' }}>
        +{fmt(p.delta)}
      </div>
    </div>
  );
}

// Settings (auth) screen — atomic-themed redesign of "Настройки авторизации".

function _authStartEndpoint(platformId) {
  return `/api/settings/${platformId}/start-auth/`;
}

function _authLogoutEndpoint(platformId) {
  return `/api/settings/${platformId}/logout/`;
}

function _authImportCookiesEndpoint(platformId) {
  const supported = new Set(['tiktok', 'instagram', 'x', 'threads', 'facebook', 'rumble', 'reddit']);
  if (!supported.has(platformId)) return null;
  return `/api/settings/${platformId}/import-cookies/`;
}

function SettingsScreen({ tweaks, onBack, onDataChanged, onOpenGlobalModal }) {
  const isMobile = useIsMobile(980);
  const accent = tweaks.accent || '#6aa9ff';
  const fallbackPlatforms = [
    { id: 'tiktok',    name: 'TikTok',    state: 'active', expires: '5 дн.', meta: 'perf_feed_cache', warn: true,  account: null },
    { id: 'instagram', name: 'Instagram', state: 'active', updated: '2026-05-04 08:47 UTC', warn: false, account: '@asti22297' },
    { id: 'telegram',  name: 'Telegram',  state: 'detected', meta: 'Данные хранятся в браузерном профиле', warn: false, account: null },
    { id: 'youtube',   name: 'YouTube',   state: 'active', updated: '2026-05-06 14:12 UTC', warn: false, account: '@phil.studio' },
    { id: 'x',         name: 'X (Twitter)', state: 'expired', warn: true, account: null },
    { id: 'threads',   name: 'Threads',   state: 'active', updated: '2026-05-05 10:24 UTC', warn: false, account: '@asti22297' },
  ];
  const platforms = AUTH_SESSIONS.length > 0 ? AUTH_SESSIONS : fallbackPlatforms;
  const activeCount = platforms.filter((p) => p.state === 'active' || p.state === 'detected').length;
  const expiringCount = platforms.filter((p) => p.warn).length;
  const expiredCount = platforms.filter((p) => p.state === 'expired').length;
  return (
    <div style={{ minHeight: '100vh' }} data-screen-label="Settings">
      <TopBar
        accent={accent}
        onRefreshAll={() => onOpenGlobalModal?.('refresh_all')}
        onOpenSchedule={() => onOpenGlobalModal?.('schedule')}
        onOpenAddList={() => onOpenGlobalModal?.('add_list')}
        onOpenAddOne={() => onOpenGlobalModal?.('add_one')}
      />
      <main style={{ maxWidth: 1100, margin: '0 auto', padding: isMobile ? '12px 10px 132px' : '28px 36px 80px' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 14, marginBottom: isMobile ? 14 : 24, flexWrap: isMobile ? 'wrap' : 'nowrap' }}>
          <button onClick={onBack} style={{ padding: '8px 14px', borderRadius: 10, background: 'rgba(255,255,255,0.04)', border: '1px solid var(--line)', color: 'var(--ink)', fontSize: 13, cursor: 'pointer', fontFamily: 'inherit' }}>← Назад</button>
          <div>
            <div className="mono" style={{ fontSize: 11, color: 'var(--ink-mute)', letterSpacing: '0.22em' }}>SECURITY · SESSIONS</div>
            <div style={{ fontSize: isMobile ? 22 : 26, fontWeight: 600, marginTop: 2, letterSpacing: '-0.01em' }}>Настройки авторизации</div>
          </div>
        </div>
        <p style={{ color: 'var(--ink-dim)', fontSize: 14, lineHeight: 1.6, marginBottom: isMobile ? 16 : 24, maxWidth: 720 }}>
          Для сбора данных приложение использует авторизованные сессии в браузере. Нажмите кнопку — откроется окно, войдите в аккаунт, и данные будут обновляться автоматически.
        </p>

        {/* Summary tile */}
        <div style={{ display: 'grid', gridTemplateColumns: isMobile ? '1fr 1fr 1fr' : '1fr 1fr 1fr', gap: isMobile ? 8 : 14, marginBottom: isMobile ? 16 : 28 }}>
          <SummaryTile label="АКТИВНЫХ" value={String(activeCount)} color="#4ade80" />
          <SummaryTile label="ИСТЕКАЮТ" value={String(expiringCount)} color="#f59e0b" warn />
          <SummaryTile label="ИСТЕКЛО" value={String(expiredCount)} color="#ef4444" />
        </div>

        <div style={{ display: 'grid', gridTemplateColumns: isMobile ? '1fr' : '1fr 1fr', gap: 14 }}>
          {platforms.map(p => <SessionCard key={p.id} p={p} accent={accent} onDataChanged={onDataChanged} />)}
        </div>
      </main>
    </div>
  );
}

function SummaryTile({ label, value, color, warn }) {
  const isMobile = useIsMobile(980);
  return (
    <div style={{ padding: isMobile ? 14 : 20, borderRadius: 14, border: '1px solid var(--line)', background: 'rgba(255,255,255,0.015)', position: 'relative', overflow: 'hidden' }}>
      <div style={{ position: 'absolute', top: 0, left: 0, width: 4, bottom: 0, background: color, opacity: 0.6 }} />
      <div className="mono" style={{ fontSize: 11, color: 'var(--ink-mute)', letterSpacing: '0.22em' }}>{label}</div>
      <div className="tnum" style={{ fontSize: isMobile ? 34 : 40, fontWeight: 700, color, marginTop: 4, letterSpacing: '-0.02em' }}>{value}</div>
    </div>
  );
}

function SessionCard({ p, accent, onDataChanged }) {
  const isMobile = useIsMobile(980);
  const meta = PLATFORM_META[p.id];
  const stateColor = p.state === 'active' || p.state === 'detected' ? '#4ade80' : p.state === 'expired' ? '#ef4444' : '#f59e0b';
  const stateLabel = p.state === 'active' ? 'Авторизован' : p.state === 'detected' ? 'Обнаружено' : 'Истекло';
  const stateLabelMobile = p.state === 'active' ? 'Акт.' : p.state === 'detected' ? 'Найд.' : 'Истек';
  const [busy, setBusy] = useStateMd(false);
  const [showImport, setShowImport] = useStateMd(false);
  const [cookiesRaw, setCookiesRaw] = useStateMd('');
  const [importBusy, setImportBusy] = useStateMd(false);
  const importEndpoint = _authImportCookiesEndpoint(p.id);
  const doAuth = async () => {
    setBusy(true);
    try {
      await _postJson(_authStartEndpoint(p.id), {});
      await uiAlert('Окно авторизации запущено.', 'Авторизация');
      await onDataChanged?.();
    } catch (e) {
      await uiAlert(`Не удалось запустить авторизацию: ${e instanceof Error ? e.message : String(e)}`, 'Ошибка');
    } finally {
      setBusy(false);
    }
  };
  const doLogout = async () => {
    setBusy(true);
    try {
      await _postJson(_authLogoutEndpoint(p.id), {});
      await onDataChanged?.();
    } catch (e) {
      await uiAlert(`Не удалось завершить сессию: ${e instanceof Error ? e.message : String(e)}`, 'Ошибка');
    } finally {
      setBusy(false);
    }
  };
  const doImportCookies = async () => {
    if (!importEndpoint) return;
    if (!cookiesRaw.trim()) {
      await uiAlert('Вставь JSON cookies.', 'Импорт cookies');
      return;
    }
    setImportBusy(true);
    try {
      await _postJson(importEndpoint, { cookies: cookiesRaw.trim() });
      setShowImport(false);
      setCookiesRaw('');
      await onDataChanged?.();
      await uiAlert('Cookies импортированы, дождись завершения job.', 'Импорт cookies');
    } catch (e) {
      await uiAlert(`Не удалось импортировать cookies: ${e instanceof Error ? e.message : String(e)}`, 'Ошибка');
    } finally {
      setImportBusy(false);
    }
  };
  return (
    <div style={{ padding: isMobile ? 14 : 22, borderRadius: 16, border: '1px solid var(--line)', background: 'rgba(255,255,255,0.015)', position: 'relative', overflow: 'hidden' }}>
      <div style={{ position: 'absolute', top: 0, left: 0, right: 0, height: 1, background: `linear-gradient(90deg, transparent, ${meta?.color || accent}, transparent)`, opacity: 0.5 }} />
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 12, gap: 10 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
          <span style={{
            width: isMobile ? 32 : 36, height: isMobile ? 32 : 36, borderRadius: 10, background: 'rgba(255,255,255,0.04)',
            border: `1px solid ${meta?.color}40`, display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
            color: meta?.color, fontWeight: 700, fontFamily: 'JetBrains Mono, monospace',
          }}>{p.name.charAt(0)}</span>
          <div style={{ fontSize: isMobile ? 24 : 18, fontWeight: 600 }}>{p.name}</div>
        </div>
        <div style={{
          display: 'inline-flex',
          alignItems: 'center',
          gap: 6,
          flexShrink: 0,
          padding: isMobile ? '4px 8px' : '3px 8px',
          borderRadius: 999,
          background: `${stateColor}1f`,
          border: `1px solid ${stateColor}4d`,
        }}>
          <span style={{ width: 7, height: 7, borderRadius: 999, background: stateColor, boxShadow: `0 0 8px ${stateColor}` }} />
          <span className="mono" style={{ fontSize: isMobile ? 10 : 11, color: stateColor, letterSpacing: isMobile ? '0.06em' : '0.14em', textTransform: 'uppercase' }}>
            {isMobile ? stateLabelMobile : stateLabel}
          </span>
        </div>
      </div>

      {p.account && <div className="mono" style={{ fontSize: isMobile ? 12 : 13, color: 'var(--ink-dim)', marginBottom: 4 }}>{p.account}</div>}
      {p.updated && <div className="mono" style={{ fontSize: isMobile ? 11 : 12, color: 'var(--ink-mute)' }}>Обновлено: {p.updated}</div>}
      {p.expires && (
        <div style={{ marginTop: 10, padding: '6px 10px', display: 'inline-flex', gap: 8, alignItems: 'center', borderRadius: 8, background: '#ef444415', border: '1px solid #ef444433', flexWrap: 'wrap' }}>
          <span className="mono" style={{ fontSize: 11, color: '#ef4444' }}>● {p.expires}</span>
          <span className="mono" style={{ fontSize: 11, color: 'var(--ink-mute)' }}>{p.meta}</span>
        </div>
      )}
      {p.meta && !p.expires && <div className="mono" style={{ fontSize: isMobile ? 11 : 12, color: 'var(--ink-mute)', marginTop: 4, lineHeight: 1.35 }}>{p.meta}</div>}

      {p.warn && p.state === 'active' && (
        <div style={{ marginTop: 14, padding: '10px 12px', borderRadius: 10, background: '#f59e0b15', border: '1px solid #f59e0b40', display: 'flex', gap: 8, alignItems: 'flex-start' }}>
          <span style={{ color: '#f59e0b' }}>⚠</span>
          <span style={{ fontSize: isMobile ? 11 : 12, color: '#fbbf24', lineHeight: 1.35 }}>Cookies скоро истекут — обновите авторизацию.</span>
        </div>
      )}

      <div style={{ display: 'flex', flexDirection: isMobile ? 'column' : 'row', gap: 10, marginTop: 16, alignItems: isMobile ? 'stretch' : 'center' }}>
        <button onClick={doAuth} disabled={busy} style={{ width: isMobile ? '100%' : 'auto', minHeight: isMobile ? 42 : undefined, padding: '8px 14px', borderRadius: 10, background: '#fff', color: '#000', border: 'none', fontSize: 13, fontWeight: 500, cursor: 'pointer', opacity: busy ? 0.6 : 1 }}>
          {busy ? '...' : (p.hasSession ? 'Обновить авторизацию' : `Войти в ${p.name}`)}
        </button>
        {p.hasSession && (
          <button onClick={doLogout} disabled={busy} style={{ width: isMobile ? '100%' : 'auto', minHeight: isMobile ? 42 : undefined, padding: '8px 14px', borderRadius: 10, background: 'transparent', border: '1px solid var(--line)', color: 'var(--ink-dim)', fontSize: 13, cursor: 'pointer', fontFamily: 'inherit', opacity: busy ? 0.6 : 1 }}>
            Завершить сессию
          </button>
        )}
        {importEndpoint && (
          <button onClick={() => setShowImport((v) => !v)} style={{ width: isMobile ? '100%' : 'auto', minHeight: isMobile ? 42 : undefined, padding: '8px 14px', borderRadius: 10, background: 'transparent', border: '1px solid var(--line)', color: 'var(--ink-dim)', fontSize: 13, cursor: 'pointer', fontFamily: 'inherit' }}>
            Импорт cookies
          </button>
        )}
      </div>
      {showImport && importEndpoint && (
        <div style={{ marginTop: 12, border: '1px solid var(--line)', borderRadius: 10, padding: 10 }}>
          <div className="mono" style={{ fontSize: 11, color: 'var(--ink-mute)', marginBottom: 6 }}>JSON cookies для {p.name}</div>
          <textarea
            value={cookiesRaw}
            onChange={(e) => setCookiesRaw(e.target.value)}
            placeholder='[{"domain":".example.com","name":"sessionid","value":"..."}]'
            style={{ width: '100%', minHeight: 100, resize: 'vertical', background: 'rgba(255,255,255,0.03)', border: '1px solid var(--line)', borderRadius: 8, color: 'var(--ink)', fontSize: 12, fontFamily: 'JetBrains Mono, monospace', padding: 8 }}
          />
          <div style={{ display: 'flex', justifyContent: 'flex-end', gap: 8, marginTop: 8 }}>
            <button onClick={() => setShowImport(false)} style={{ padding: '7px 12px', borderRadius: 8, border: '1px solid var(--line)', background: 'transparent', color: 'var(--ink-dim)', fontSize: 12, cursor: 'pointer' }}>Отмена</button>
            <button onClick={doImportCookies} disabled={importBusy} style={{ padding: '7px 12px', borderRadius: 8, border: 'none', background: '#fff', color: '#000', fontSize: 12, fontWeight: 600, cursor: 'pointer', opacity: importBusy ? 0.6 : 1 }}>
              {importBusy ? 'Импорт...' : 'Импортировать'}
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

  const createProfileInline = async ({ name, color }) => {
    const profileName = String(name || '').trim();

    setProfileBusy(true);
    try {
      const created = await _postJson('/api/accounts/profiles/', { name: profileName, color: color || '#6366f1' });

      setProfileBusy(false);
    }
  };

          username: parsed.username.replace(/^@/, ''),

      setRaw('');
    } catch (e) {
      await uiAlert(`Ошибка импорта: ${e instanceof Error ? e.message : String(e)}`, 'Ошибка');

      setBusy(false);

function ScheduleModal({ accent, onDataChanged, onClose }) {
  const isMobile = useIsMobile(760);
  const PRESET_TIMES = ['06:00', '09:00', '12:00', '15:00', '18:00', '21:00', '00:00'];
  const SKIP_OPTIONS = [0, 1, 3, 6, 12, 24];
  const [loading, setLoading] = useStateMd(true);
  const [saving, setSaving] = useStateMd(false);
  const [status, setStatus] = useStateMd(null);
  const [mode, setMode] = useStateMd('times');
  const [auto, setAuto] = useStateMd(true);
  const [intervalHours, setIntervalHours] = useStateMd(6);
  const [skipRecent, setSkipRecent] = useStateMd(0);
  const [selectedTimes, setSelectedTimes] = useStateMd(['06:00', '12:00', '18:00']);
  const [customTime, setCustomTime] = useStateMd('');
  const [csvReport, setCsvReport] = useStateMd(true);
  const [includeHiddenPlatform, setIncludeHiddenPlatform] = useStateMd(false);
  const [includeHiddenProfile, setIncludeHiddenProfile] = useStateMd(false);
  const [includeUnavailable, setIncludeUnavailable] = useStateMd(false);
  const [reportDownloading, setReportDownloading] = useStateMd(false);
  const [runBusy, setRunBusy] = useStateMd(false);
  const [runDetailOpen, setRunDetailOpen] = useStateMd(false);
  const prevRunningRef = React.useRef(false);

  const refreshAutoStatus = async () => {
    const st = await _fetchJson('/api/accounts/auto-refresh-status/').catch(() => null);
    setStatus(st);
    return st;
  };

  useEffect(() => {
    let mounted = true;
    (async () => {
      try {
        const [sched, st] = await Promise.all([
          _fetchJson('/api/accounts/schedule/'),
          _fetchJson('/api/accounts/auto-refresh-status/').catch(() => null),
        ]);
        if (!mounted || !sched) return;
        setMode(sched.mode || 'times');
        setAuto(!!sched.enabled);
        setIntervalHours(Number(sched.interval_hours || 6));
        setSkipRecent(Number(sched.skip_recent_hours ?? 0));
        setSelectedTimes(
          Array.isArray(sched.times) && sched.times.length > 0
            ? sched.times.filter((t) => /^\d{2}:\d{2}$/.test(String(t)))
            : ['06:00', '12:00', '18:00']
        );
        setCsvReport(!!sched.auto_refresh_csv_report);
        setIncludeHiddenPlatform(!!sched.include_hidden_platform_accounts);
        setIncludeHiddenProfile(!!sched.include_hidden_profile_accounts);
        setIncludeUnavailable(!!sched.include_unavailable_accounts);
        setStatus(st);
      } catch (e) {
        await uiAlert(`Не удалось загрузить расписание: ${e instanceof Error ? e.message : String(e)}`, 'Ошибка');
      } finally {
        if (mounted) setLoading(false);
      }
    })();
    return () => { mounted = false; };
  }, []);

  useEffect(() => {
    if (!status?.is_running && !runBusy) return undefined;
    const timer = setInterval(() => { void refreshAutoStatus(); }, 2500);
    return () => clearInterval(timer);
  }, [status?.is_running, runBusy]);

  useEffect(() => {
    const wasRunning = !!prevRunningRef.current;
    const isRunning = !!status?.is_running;
    if (wasRunning && !isRunning) {
      void onDataChanged?.();
    }
    prevRunningRef.current = isRunning;
  }, [status?.is_running, onDataChanged]);

  const buildSchedulePayload = () => {
    const times = selectedTimes
      .map((t) => String(t).trim())
      .filter((t) => /^\d{2}:\d{2}$/.test(t))
      .sort();
    return {
      enabled: auto,
      mode,
      interval_hours: Math.max(1, Number(intervalHours || 1)),
      skip_recent_hours: Math.max(0, Number(skipRecent ?? 0)),
      auto_refresh_csv_report: csvReport,
      include_hidden_platform_accounts: includeHiddenPlatform,
      include_hidden_profile_accounts: includeHiddenProfile,
      include_unavailable_accounts: includeUnavailable,
      times: mode === 'times' ? times : [],
    };
  };

  const saveSchedule = async ({ silent = false } = {}) => {
    if (!silent) setSaving(true);
    try {
      await _postJson('/api/accounts/schedule/', buildSchedulePayload());
      await onDataChanged?.();
      if (!silent) await uiAlert('Расписание сохранено.', 'Расписание');
    } catch (e) {
      if (!silent) await uiAlert(`Ошибка сохранения: ${e instanceof Error ? e.message : String(e)}`, 'Ошибка');
      throw e;
    } finally {
      if (!silent) setSaving(false);
    }
  };

  const toggleTime = (timeValue) => {
    setSelectedTimes((prev) => {
      const has = prev.includes(timeValue);
      if (has) return prev.filter((t) => t !== timeValue);
      return [...prev, timeValue];
    });
  };

  const addCustomTime = () => {
    const t = String(customTime || '').trim();
    if (!/^\d{2}:\d{2}$/.test(t)) return;
    setSelectedTimes((prev) => (prev.includes(t) ? prev : [...prev, t]));
    setCustomTime('');
  };

  const runNow = async () => {
    setRunBusy(true);
    try {
      // Ensure skip/include settings are persisted before manual start.
      await saveSchedule({ silent: true });
      const candidates = _apiBaseCandidates();
      let started = false;
      let alreadyRunning = false;
      let lastErr = null;
      for (const base of candidates) {
        try {
          const res = await fetch(`${base}/api/accounts/auto-refresh-run-now/`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: '{}',
          });
          let body = null;
          try { body = await res.json(); } catch {}
          if (res.ok) {
            started = !!(body?.started ?? true);
            break;
          }
          if (res.status === 409) {
            alreadyRunning = true;
            break;
          }
          throw new Error(body?.detail || `HTTP ${res.status}`);
        } catch (e) {
          lastErr = e;
        }
      }
      await new Promise((r) => setTimeout(r, 500));
      await refreshAutoStatus();
      if (alreadyRunning) {
        await uiAlert('Автообновление уже выполняется.', 'Автообновление');
      } else if (started) {
        await uiAlert('Автообновление запущено.', 'Автообновление');
      } else if (lastErr) {
        throw lastErr;
      }
    } catch (e) {
      await uiAlert(`Не удалось запустить: ${e instanceof Error ? e.message : String(e)}`, 'Ошибка');
    } finally {
      setRunBusy(false);
    }
  };

  const stopNow = async () => {
    try {
      await _postJson('/api/accounts/auto-refresh-stop/', {});
      const st = await _fetchJson('/api/accounts/auto-refresh-status/').catch(() => null);
      setStatus(st);
      await uiAlert('Остановка отправлена.', 'Автообновление');
    } catch (e) {
      const msg = String(e instanceof Error ? e.message : e || '');
      if (msg.includes('HTTP 409')) {
        const st = await _fetchJson('/api/accounts/auto-refresh-status/').catch(() => null);
        setStatus(st);
        await uiAlert('Автообновление сейчас не выполняется.', 'Автообновление');
        return;
      }
      await uiAlert(`Не удалось остановить: ${msg}`, 'Ошибка');
    }
  };

  const downloadLastAutoRefreshReport = async () => {
    setReportDownloading(true);
    try {
      const candidates = _apiBaseCandidates();
      let blob = null;
      let lastStatus = 0;
      for (const base of candidates) {
        try {
          const res = await fetch(`${base}/api/accounts/auto-refresh-report/`);
          lastStatus = res.status;
          if (!res.ok) continue;
          blob = await res.blob();
          break;
        } catch (_) {}
      }
      if (!blob) {
        if (lastStatus === 404) {
          throw new Error('Отчёт не найден. Если запуск был прерван перезапуском бэка, новый CSV мог не успеть сохраниться.');
        }
        throw new Error(`HTTP ${lastStatus || 0}`);
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `auto-refresh-report-${new Date().toISOString().replace(/[:.]/g, '-')}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    } catch (e) {
      await uiAlert(`Не удалось скачать отчёт: ${e instanceof Error ? e.message : String(e)}`, 'Ошибка');
    } finally {
      setReportDownloading(false);
    }
  };

  if (loading) {
    return (
      <ModalShell title="Расписание обновлений" kicker="AUTOMATION" accent={accent} width={620} onClose={onClose}>
        <div className="mono" style={{ color: 'var(--ink-mute)' }}>Загрузка…</div>
      </ModalShell>
    );
  }

  return (
    <ModalShell title="Расписание обновлений" kicker="AUTOMATION" accent={accent} width={620} onClose={onClose}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '14px 16px', borderRadius: 12, background: 'rgba(255,255,255,0.025)', border: '1px solid var(--line)', marginBottom: 18 }}>

            <div style={{ fontSize: 14, color: 'var(--ink)' }}>После завершения автообновления сохранять CSV-отчёт</div>

          </span>

  const [profileBusy, setProfileBusy] = useStateMd(false);
  const [profileEditorOpen, setProfileEditorOpen] = useStateMd(false);
  const createProfileInline = async ({ name, color }) => {
    const profileName = String(name || '').trim();
    if (!profileName) return;
    setProfileBusy(true);
    try {
      const created = await _postJson('/api/accounts/profiles/', { name: profileName, color: color || '#6366f1' });
      const createdId = created?.id != null ? String(created.id) : null;
      await onDataChanged?.();
      if (createdId) setProfileId(createdId);
      await uiAlert(`Профиль "${profileName}" добавлен.`, 'Профили');
      setProfileEditorOpen(false);
    } catch (e) {
      await uiAlert(`Не удалось добавить профиль: ${e instanceof Error ? e.message : String(e)}`, 'Ошибка');
    } finally {
      setProfileBusy(false);
    }
  };
  const addOne = async () => {
    if (!username.trim()) return;
    setBusy(true);
    try {
      await _postJson('/api/accounts/', {
        platform,
        username: username.trim().replace(/^@/, ''),
        profile_id: profileId === 'none' ? null : Number(profileId),

      await onDataChanged?.();
      setUsername('');
      await uiAlert('Аккаунт добавлен.', 'Добавление аккаунта');
    } catch (e) {
      await uiAlert(`Ошибка добавления: ${e instanceof Error ? e.message : String(e)}`, 'Ошибка');
    } finally {
      setBusy(false);
    }

    <ModalShell title="Добавить аккаунт" kicker="QUICK ADD" accent={accent} width={900} offsetY="-20%" onClose={onClose}>

          <select value={platform} onChange={(e) => setPlatform(e.target.value)} style={{ width: '100%', padding: '11px 14px', borderRadius: 10, background: 'rgba(255,255,255,0.04)', border: '1px solid var(--line-2)', color: 'var(--ink)', fontSize: 13, fontFamily: 'inherit' }}>
            {PLATFORMS.map(p => <option key={p.id} value={p.id} style={{ color: '#ffffff', background: '#374151' }}>{p.label}</option>)}
          </select>
        </div>
        <div style={{ minWidth: 0 }}>
          <div className="mono" style={{ fontSize: 11, color: 'var(--ink-mute)', letterSpacing: '0.2em', marginBottom: 8 }}>USERNAME</div>
          <input value={username} onChange={(e) => setUsername(e.target.value)} placeholder="@username" style={{ width: '100%', padding: '11px 14px', borderRadius: 10, background: 'rgba(255,255,255,0.025)', border: '1px solid var(--line-2)', color: 'var(--ink)', fontSize: 14, fontFamily: 'JetBrains Mono, monospace' }} />

function RefreshAllModal({ accent, onDataChanged, onClose }) {
  const platformOptions = React.useMemo(() => {
    const known = [
      ['tiktok', 'TikTok'],
      ['instagram', 'Instagram'],
      ['youtube', 'YouTube'],
      ['telegram', 'Telegram'],
      ['x', 'X (Twitter)'],
      ['threads', 'Threads'],
      ['facebook', 'Facebook'],
      ['rumble', 'Rumble'],
      ['reddit', 'Reddit'],
    ];
    const map = new Map(known.map(([id, label]) => [id, { id, label, color: PLATFORM_COLORS[id] || '#9ca3af' }]));
    for (const p of PLATFORMS) {
      if (!map.has(p.id)) map.set(p.id, { id: p.id, label: p.label, color: p.color || '#9ca3af' });
    }
    return Array.from(map.values());
  }, []);
  const [selectedPlatforms, setSelectedPlatforms] = useStateMd(() => new Set(platformOptions.map((p) => p.id)));
  const [selectedProfiles, setSelectedProfiles] = useStateMd(() => new Set(PROFILES.map((p) => p.id)));
  const [availability, setAvailability] = useStateMd('all'); // all | avail | unavail
  const [search, setSearch] = useStateMd('');
  const [includeHiddenPlatform, setIncludeHiddenPlatform] = useStateMd(false);
  const [includeHiddenProfile, setIncludeHiddenProfile] = useStateMd(false);
  const [includeUnavailable, setIncludeUnavailable] = useStateMd(false);
  const [selectedIds, setSelectedIds] = useStateMd(() => new Set(ACCOUNTS.map((a) => a.id)));
  const [busy, setBusy] = useStateMd(false);
  const [downloadCsvAfter, setDownloadCsvAfter] = useStateMd(false);
  const [updatedSortOrder, setUpdatedSortOrder] = useStateMd('desc'); // desc=newest first, asc=oldest first

  const togglePlatform = (id) => {
    setSelectedPlatforms((prev) => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id); else next.add(id);
      return next;
    });
  };
  const toggleProfile = (id) => {
    setSelectedProfiles((prev) => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id); else next.add(id);
      return next;
    });
  };

  const filtered = ACCOUNTS.filter((a) => {
    if (!includeHiddenPlatform && a.isPlatformHidden) return false;
    if (!includeHiddenProfile && a.isProfileHidden) return false;
    if (availability === 'all' && !includeUnavailable && a.unavailable) return false;
    if (selectedPlatforms.size === 0) return false;
    if (!selectedPlatforms.has(a.platform)) return false;
    if (selectedProfiles.size > 0 && !selectedProfiles.has(a.profile)) return false;
    if (availability === 'avail' && a.unavailable) return false;
    if (availability === 'unavail' && !a.unavailable) return false;
    if (search.trim()) {
      const q = search.toLowerCase();
      if (!a.name.toLowerCase().includes(q) && !a.handle.toLowerCase().includes(q)) return false;
    }
    return true;
  });

  const filteredSorted = [...filtered].sort((a, b) => {
    const at = Number(a.updatedTs || 0);
    const bt = Number(b.updatedTs || 0);
    return updatedSortOrder === 'asc' ? (at - bt) : (bt - at);
  });

  const filteredIds = filteredSorted.map((a) => a.id);
  const selectedVisibleCount = filteredIds.reduce((acc, id) => acc + (selectedIds.has(id) ? 1 : 0), 0);
  const allVisibleSelected = filteredIds.length > 0 && selectedVisibleCount === filteredIds.length;

  const setAllVisible = (checked) => {
    setSelectedIds((prev) => {
      const next = new Set(prev);
      for (const id of filteredIds) {
        if (checked) next.add(id);
        else next.delete(id);
      }
      return next;
    });
  };
  const syncSelectionToFilter = () => setAllVisible(true);
  const clearSelection = () => setAllVisible(false);

  const toggleOne = (id) => {
    setSelectedIds((prev) => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id); else next.add(id);
      return next;
    });
  };

  const runRefresh = async () => {
    const ids = Array.from(selectedIds).filter((id) => filtered.some((a) => a.id === id));
    if (ids.length === 0) {
      await uiAlert('Ничего не выбрано.', 'Обновить аккаунты');
      return;
    }
    setBusy(true);
    try {
      const selectedAll = ids.length === ACCOUNTS.length;
      if (downloadCsvAfter && selectedAll) {
        const includeUnavailableParam = includeUnavailable ? '&include_unavailable_accounts=1' : '';
        const blob = await _postBlobWithApiBases(`/api/accounts/refresh_all/?download_csv=1${includeUnavailableParam}`, {});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `refresh-report-${new Date().toISOString().replace(/[:.]/g, '-')}.csv`;
        a.click();
        URL.revokeObjectURL(url);
      } else {
        await _postJson('/api/accounts/bulk-refresh/', { ids });
      }
      await onDataChanged?.();
      await uiAlert(`Обновлено: ${ids.length}`, 'Обновить аккаунты');
      onClose?.();
    } catch (e) {
      await uiAlert(`Ошибка обновления: ${e instanceof Error ? e.message : String(e)}`, 'Ошибка');
    } finally {
      setBusy(false);
    }
  };

  const stopRefresh = async () => {
    try {
      await _postJson('/api/accounts/auto-refresh-stop/', {});
      await uiAlert('Остановка запрошена. Текущий аккаунт завершится и процесс остановится.', 'Остановка обновления');
    } catch (e) {
      await uiAlert(`Не удалось остановить: ${e instanceof Error ? e.message : String(e)}`, 'Ошибка');
    }
  };

  const exportCsv = async () => {
    try {
      const blob = await _fetchBlobWithApiBases('/api/accounts/export-snapshot/');
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `dashboard-snapshot-${new Date().toISOString().replace(/[:.]/g, '-')}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    } catch (e) {
      await uiAlert(`Не удалось экспортировать CSV: ${e instanceof Error ? e.message : String(e)}`, 'Ошибка');
    }
  };

  const importCsv = async () => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.csv,text/csv';
    input.onchange = async () => {
      const f = input.files?.[0];
      if (!f) return;
      try {
        await _postFormDataJsonWithApiBases('/api/accounts/import-snapshot/', f, 'file');
        await onDataChanged?.();
        await uiAlert('CSV импортирован.', 'CSV');
      } catch (e) {
        await uiAlert(`Не удалось импортировать CSV: ${e instanceof Error ? e.message : String(e)}`, 'Ошибка');
      }
    };
    input.click();
  };

  return (
    <ModalShell title="Обновить выбранные аккаунты" kicker="REFRESH" accent={accent} width={860} onClose={onClose}>
      <div style={{ display: 'flex', justifyContent: 'flex-end', gap: 8, marginBottom: 10 }}>
        <button onClick={exportCsv} style={{ padding: '8px 12px', borderRadius: 10, border: '1px solid var(--line)', background: 'rgba(255,255,255,0.03)', color: 'var(--ink)', cursor: 'pointer' }}>Экспорт CSV</button>
        <button onClick={importCsv} style={{ padding: '8px 12px', borderRadius: 10, border: '1px solid var(--line)', background: 'rgba(255,255,255,0.03)', color: 'var(--ink)', cursor: 'pointer' }}>Импорт CSV</button>
      </div>
      <div className="mono" style={{ fontSize: 11, color: 'var(--ink-mute)', letterSpacing: '0.2em', marginBottom: 8 }}>ПЛАТФОРМЫ</div>
      <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8, marginBottom: 12 }}>
        {platformOptions.map((p) => (
          <Pill key={p.id} active={selectedPlatforms.has(p.id)} onClick={() => togglePlatform(p.id)} dot={p.color}>{p.label}</Pill>
        ))}
        <button
          onClick={() => setSelectedPlatforms(new Set(platformOptions.map((p) => p.id)))}
          style={{ padding: '8px 12px', borderRadius: 999, border: '1px solid var(--line)', background: 'rgba(255,255,255,0.03)', color: 'var(--ink)', cursor: 'pointer', fontSize: 12 }}
        >
          Все
        </button>
        <button
          onClick={() => setSelectedPlatforms(new Set())}
          style={{ padding: '8px 12px', borderRadius: 999, border: '1px solid var(--line)', background: 'rgba(255,255,255,0.03)', color: 'var(--ink)', cursor: 'pointer', fontSize: 12 }}
        >
          Сброс
        </button>
      </div>
      <div style={{ marginBottom: 12, display: 'grid', gridTemplateColumns: '1fr auto', gap: 10 }}>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8, padding: 10, border: '1px solid var(--line)', borderRadius: 10 }}>
          <label style={{ display: 'flex', justifyContent: 'space-between', color: 'var(--ink-dim)', fontSize: 13 }}>
            <span>Включать аккаунты скрытых платформ</span>
            <input type="checkbox" checked={includeHiddenPlatform} onChange={(e) => setIncludeHiddenPlatform(e.target.checked)} />
          </label>
          <label style={{ display: 'flex', justifyContent: 'space-between', color: 'var(--ink-dim)', fontSize: 13 }}>
            <span>Включать аккаунты скрытых профилей</span>
            <input type="checkbox" checked={includeHiddenProfile} onChange={(e) => setIncludeHiddenProfile(e.target.checked)} />
          </label>
          <label style={{ display: 'flex', justifyContent: 'space-between', color: 'var(--ink-dim)', fontSize: 13 }}>
            <span>Учитывать недоступные аккаунты</span>
            <input type="checkbox" checked={includeUnavailable} onChange={(e) => setIncludeUnavailable(e.target.checked)} />
          </label>
        </div>
        <div style={{ display: 'flex', gap: 8 }}>
          <button onClick={syncSelectionToFilter} style={{ padding: '8px 12px', borderRadius: 10, border: '1px solid var(--line)', background: 'rgba(255,255,255,0.03)', color: 'var(--ink)', cursor: 'pointer' }}>Выбрать все</button>
          <button onClick={clearSelection} style={{ padding: '8px 12px', borderRadius: 10, border: '1px solid var(--line)', background: 'rgba(255,255,255,0.03)', color: 'var(--ink)', cursor: 'pointer' }}>Снять все</button>
        </div>
      </div>

      <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8, marginBottom: 12 }}>
        {PROFILES.map((p) => (
          <Pill key={p.id} active={selectedProfiles.has(p.id)} onClick={() => toggleProfile(p.id)} dot={p.color}>{p.label}</Pill>
        ))}
      </div>
      <div style={{ display: 'flex', gap: 8, marginBottom: 12 }}>
        <Pill active={availability === 'all'} onClick={() => setAvailability('all')}>Все</Pill>
        <Pill active={availability === 'avail'} onClick={() => setAvailability('avail')}>Только доступные</Pill>
        <Pill active={availability === 'unavail'} onClick={() => setAvailability('unavail')}>Только недоступные</Pill>
      </div>
      <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Поиск: username, имя" style={{ width: '100%', marginBottom: 10, padding: '10px 12px', borderRadius: 10, background: 'rgba(255,255,255,0.025)', border: '1px solid var(--line)', color: 'var(--ink)', fontSize: 13, fontFamily: 'inherit' }} />
      <div style={{ display: 'flex', gap: 8, marginBottom: 10 }}>
        <Pill active={updatedSortOrder === 'desc'} onClick={() => setUpdatedSortOrder('desc')}>Сначала новые</Pill>
        <Pill active={updatedSortOrder === 'asc'} onClick={() => setUpdatedSortOrder('asc')}>Сначала старые</Pill>
      </div>

      <label style={{ display: 'inline-flex', alignItems: 'center', gap: 8, marginBottom: 10, color: 'var(--ink-dim)', fontSize: 13, cursor: 'pointer' }}>
        <input
          type="checkbox"
          checked={allVisibleSelected}
          onChange={(e) => setAllVisible(e.target.checked)}
        />
        Выбрать все в списке ({selectedVisibleCount}/{filtered.length})
      </label>

      <div style={{ maxHeight: 300, overflowY: 'auto', border: '1px solid var(--line)', borderRadius: 10, marginBottom: 12 }}>
        {filteredSorted.map((a) => (
          <label key={a.id} style={{ display: 'grid', gridTemplateColumns: '24px 1fr auto', gap: 10, padding: '10px 12px', borderBottom: '1px solid var(--line)', cursor: 'pointer' }}>
            <input type="checkbox" checked={selectedIds.has(a.id)} onChange={() => toggleOne(a.id)} />
            <span><span style={{ color: 'var(--ink-dim)' }}>{PLATFORM_META[a.platform]?.label || a.platform}</span> &nbsp; <b style={{ color: '#fff' }}>{a.name}</b> <span style={{ color: 'var(--ink-mute)' }}>{a.handle}</span></span>
            <span className="mono" style={{ color: 'var(--ink-mute)', fontSize: 12 }}>{a.updated}</span>
          </label>
        ))}
      </div>
      <label style={{ display: 'flex', alignItems: 'center', gap: 8, color: 'var(--ink-dim)', fontSize: 13, marginBottom: 12 }}>
        <input type="checkbox" checked={downloadCsvAfter} onChange={(e) => setDownloadCsvAfter(e.target.checked)} />
        Скачать CSV после завершения
      </label>

      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <button onClick={onClose} style={{ padding: '10px 16px', borderRadius: 10, border: '1px solid var(--line)', background: 'transparent', color: 'var(--ink-dim)', cursor: 'pointer' }}>Закрыть</button>
        <div style={{ display: 'flex', gap: 8 }}>
          {busy && (
            <button
              onClick={stopRefresh}
              style={{ padding: '10px 16px', borderRadius: 10, border: '1px solid rgba(239,68,68,0.45)', background: 'rgba(239,68,68,0.12)', color: '#fecaca', fontWeight: 600, cursor: 'pointer' }}
            >
              Остановить
            </button>
          )}
          <button onClick={runRefresh} disabled={busy} style={{ padding: '10px 18px', borderRadius: 10, border: 'none', background: '#fff', color: '#000', fontWeight: 600, cursor: 'pointer', opacity: busy ? 0.6 : 1 }}>
            {busy ? 'Обновление...' : `Обновить (${Array.from(selectedIds).filter((id) => filtered.some((a) => a.id === id)).length})`}
          </button>
        </div>
      </div>
    </ModalShell>
  );
}
