function RefreshAllModal({ accent, onDataChanged, onClose }) {
  const platformOptions = React.useMemo(() => {
    const known = [
      ['tiktok', 'TikTok'],
      ['instagram', 'Instagram'],
      ['youtube', 'YouTube'],
      ['telegram', 'Telegram'],
      ['x', 'X (Twitter)'],
      ['threads', 'Threads'],
      ['facebook', 'Facebook'],
      ['rumble', 'Rumble'],
      ['reddit', 'Reddit'],
    ];
    const map = new Map(known.map(([id, label]) => [id, { id, label, color: PLATFORM_COLORS[id] || '#9ca3af' }]));
    for (const p of PLATFORMS) {
      if (!map.has(p.id)) map.set(p.id, { id: p.id, label: p.label, color: p.color || '#9ca3af' });
    }
    return Array.from(map.values());
  }, []);
  const [selectedPlatforms, setSelectedPlatforms] = useStateMd(() => new Set(platformOptions.map((p) => p.id)));
  const [selectedProfiles, setSelectedProfiles] = useStateMd(() => new Set(PROFILES.map((p) => p.id)));
  const [availability, setAvailability] = useStateMd('all'); // all | avail | unavail
  const [search, setSearch] = useStateMd('');
  const [includeHiddenPlatform, setIncludeHiddenPlatform] = useStateMd(false);
  const [includeHiddenProfile, setIncludeHiddenProfile] = useStateMd(false);
  const [includeUnavailable, setIncludeUnavailable] = useStateMd(false);
  const [selectedIds, setSelectedIds] = useStateMd(() => new Set(ACCOUNTS.map((a) => a.id)));
  const [busy, setBusy] = useStateMd(false);
  const [runStatus, setRunStatus] = useStateMd(null);
  const [downloadCsvAfter, setDownloadCsvAfter] = useStateMd(false);
  const [updatedSortOrder, setUpdatedSortOrder] = useStateMd('desc'); // desc=newest first, asc=oldest first
  const SKIP_OPTIONS = [0, 1, 3, 6, 12, 24];
  const [skipRecent, setSkipRecent] = useStateMd(0);
  const [warmEnabled, setWarmEnabled] = useStateMd(true);
  const [runDetailOpen, setRunDetailOpen] = useStateMd(false);
  const [stopBusy, setStopBusy] = useStateMd(false);
  const [csvImport, setCsvImport] = useStateMd(null);
  const refreshModeRef = React.useRef(null);
  const pendingRunRef = React.useRef(null);
  const prevRunningRef = React.useRef(false);
  /** true только после is_running для текущего pendingRunRef (не ловим хвост прошлого прогона). */
  const runSeenActiveRef = React.useRef(false);

  React.useEffect(() => {
    let mounted = true;
    (async () => {
      try {
        const sched = await _fetchJson('/api/accounts/schedule/');
        if (!mounted || !sched) return;
        setSkipRecent(Number(sched.skip_recent_hours ?? 0));
        setWarmEnabled(sched.refresh_warm_enabled !== false);
      } catch (_) { /* ignore */ }
    })();
    return () => { mounted = false; };
  }, []);

  const persistRefreshSettings = async () => {
    await _postJson('/api/accounts/schedule/', {
      skip_recent_hours: skipRecent,
      refresh_warm_enabled: !!warmEnabled,
    });
  };

  const refreshRunStatus = async () => {
    const st = await _fetchJson('/api/accounts/auto-refresh-status/').catch(() => null);
    setRunStatus(st);
    return st;
  };

  const pipelineLabel = (st) => {
    if (!st?.is_running) return 'не идёт';
    if (st.active_pipeline === 'refresh_all') return 'идёт сбор всех';
    if (st.active_pipeline === 'bulk_refresh') return 'идёт обновление выбранных';
    return 'идёт автообновление по расписанию';
  };

  React.useEffect(() => {
    let mounted = true;
    (async () => {
      const st = await refreshRunStatus();
      if (!mounted || !st?.is_running) return;
      if (st.active_pipeline === 'refresh_all') {
        refreshModeRef.current = 'refresh_all';
      } else if (st.active_pipeline === 'bulk_refresh') {
        refreshModeRef.current = 'bulk';
        setBusy(true);
      }
    })();
    return () => { mounted = false; };
  }, []);

  React.useEffect(() => {
    if (!runStatus?.is_running && !runStatus?.cancel_requested) return undefined;
    const timer = setInterval(() => { void refreshRunStatus(); }, runStatus?.cancel_requested ? 1500 : 2000);
    return () => clearInterval(timer);
  }, [runStatus?.is_running, runStatus?.cancel_requested]);

  const finishBulkRefreshRun = async (pending) => {
    const lastSt = await refreshRunStatus().catch(() => null);
    const failedN = Number(lastSt?.failed_accounts || 0);
    const successN = Number(lastSt?.success_accounts || 0);
    const warn = (lastSt && lastSt.last_error) ? String(lastSt.last_error) : '';
    const n = Number(pending?.idsCount || 0);
    if (warn || failedN > 0) {
      await uiAlert(
        `Обновление завершено. Успешно: ${successN} из ${n}.${failedN > 0 ? ` Ошибок: ${failedN}.` : ''}${warn ? `\n\n${warn}` : ''}`,
        'Обновить аккаунты',
      );
    } else if (n > 0) {
      await uiAlert(`Обновлено: ${n}`, 'Обновить аккаунты');
    }
    await onDataChanged?.();
    onClose?.();
  };

  const finishRefreshAllRun = async (pending) => {
    const lastSt = await refreshRunStatus().catch(() => null);
    if (pending?.downloadCsv && lastSt?.has_csv_report) {
      try {
        const blob = await _fetchBlobWithApiBases('/api/accounts/refresh-all-report/');
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `refresh-report-${new Date().toISOString().replace(/[:.]/g, '-')}.csv`;
        a.click();
        URL.revokeObjectURL(url);
      } catch (_) { /* отчёт на сервере всё равно есть */ }
    }
    const failedN = Number(lastSt?.failed_accounts || 0);
    const warn = (lastSt && lastSt.last_error) ? String(lastSt.last_error) : '';
    const n = Number(pending?.idsCount || 0);
    if (warn || failedN > 0) {
      await uiAlert(
        `Сбор завершён.${failedN > 0 ? ` Ошибок по аккаунтам: ${failedN}.` : ''}${warn ? `\n\n${warn}` : ''}\n\nРасширенный CSV-отчёт сохранён на сервере.`,
        'Обновить аккаунты',
      );
    } else if (n > 0) {
      await uiAlert(
        `Обновлено: ${n}. Расширенный CSV с приростами и временем по аккаунтам сохранён на сервере.`,
        'Обновить аккаунты',
      );
    }
    await onDataChanged?.();
    onClose?.();
  };

  React.useEffect(() => {
    const wasRunning = !!prevRunningRef.current;
    const isRunning = !!runStatus?.is_running;
    const pending = pendingRunRef.current;
    if (pending && isRunning) {
      runSeenActiveRef.current = true;
    }
    if (runSeenActiveRef.current && wasRunning && !isRunning && pending) {
      pendingRunRef.current = null;
      refreshModeRef.current = null;
      runSeenActiveRef.current = false;
      setBusy(false);
      if (pending.mode === 'refresh_all') {
        void finishRefreshAllRun(pending);
      } else if (pending.mode === 'bulk') {
        void finishBulkRefreshRun(pending);
      }
    } else if (wasRunning && !isRunning && !pending) {
      void onDataChanged?.();
    }
    prevRunningRef.current = isRunning;
  }, [runStatus?.is_running, onDataChanged, onClose]);

  const opInProgress = !!(runStatus?.is_running);

  const togglePlatform = (id) => {
    setSelectedPlatforms((prev) => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id); else next.add(id);
      return next;
    });
  };
  const toggleProfile = (id) => {
    setSelectedProfiles((prev) => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id); else next.add(id);
      return next;
    });
  };

  const filtered = ACCOUNTS.filter((a) => {
    if (!includeHiddenPlatform && a.isPlatformHidden) return false;
    if (!includeHiddenProfile && a.isProfileHidden) return false;
    if (availability === 'all' && !includeUnavailable && a.unavailable) return false;
    if (selectedPlatforms.size === 0) return false;
    if (!selectedPlatforms.has(a.platform)) return false;
    if (selectedProfiles.size > 0 && !selectedProfiles.has(a.profile)) return false;
    if (availability === 'avail' && a.unavailable) return false;
    if (availability === 'unavail' && !a.unavailable) return false;
    if (search.trim()) {
      const q = search.toLowerCase();
      if (!a.name.toLowerCase().includes(q) && !a.handle.toLowerCase().includes(q)) return false;
    }
    return true;
  });

  const filteredSorted = [...filtered].sort((a, b) => {
    const at = Number(a.updatedTs || 0);
    const bt = Number(b.updatedTs || 0);
    return updatedSortOrder === 'asc' ? (at - bt) : (bt - at);
  });

  const filteredIds = filteredSorted.map((a) => a.id);
  const selectedVisibleCount = filteredIds.reduce((acc, id) => acc + (selectedIds.has(id) ? 1 : 0), 0);
  const allVisibleSelected = filteredIds.length > 0 && selectedVisibleCount === filteredIds.length;

  const setAllVisible = (checked) => {
    setSelectedIds((prev) => {
      const next = new Set(prev);
      for (const id of filteredIds) {
        if (checked) next.add(id);
        else next.delete(id);
      }
      return next;
    });
  };
  const syncSelectionToFilter = () => setAllVisible(true);
  const clearSelection = () => setAllVisible(false);

  const toggleOne = (id) => {
    setSelectedIds((prev) => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id); else next.add(id);
      return next;
    });
  };

  const selectedCount = Array.from(selectedIds).filter((id) => filtered.some((a) => a.id === id)).length;

  const runRefreshClicks = async () => {
    const ids = Array.from(selectedIds).filter((id) => filtered.some((a) => a.id === id));
    if (ids.length === 0) {
      await uiAlert('Ничего не выбрано.', 'Переходы');
      return;
    }
    if (opInProgress) {
      await uiAlert('Сейчас идёт сбор/обновление аккаунтов. Дождитесь завершения или остановите его.', 'Переходы');
      return;
    }
    setBusy(true);
    try {
      const res = await _postJson('/api/accounts/refresh-link-clicks/', { ids });
      const updated = Number(res?.updated || 0);
      const changed = Number(res?.changed ?? updated);
      const skipped = Number(res?.skipped || 0);
      const total = Number(res?.total || ids.length);
      const errs = Array.isArray(res?.errors) ? res.errors : [];
      let msg = `Обработано: ${updated} из ${total}. Изменилось значений: ${changed}.`;
      if (skipped > 0) {
        msg += `\nПропущено (нет URL профиля или данных Links): ${skipped}.`;
      }
      if (updated > 0 && changed === 0) {
        msg += '\n\nЧисла в БД совпали с ответом Links — прирост на экране мог не измениться.';
      }
      if (errs.length) {
        const last = errs[errs.length - 1];
        msg += `\n\nОшибок: ${errs.length}.`;
        if (last?.detail) msg += `\nПоследняя: ${last.detail}`;
      }
      await onDataChanged?.();
      await uiAlert(msg, errs.length ? 'Переходы — с ошибками' : 'Переходы');
    } catch (e) {
      await uiAlert(`Ошибка: ${e instanceof Error ? e.message : String(e)}`, 'Переходы');
    } finally {
      setBusy(false);
    }
  };

  const runRefresh = async () => {
    const ids = Array.from(selectedIds).filter((id) => filtered.some((a) => a.id === id));
    if (ids.length === 0) {
      await uiAlert('Ничего не выбрано.', 'Обновить аккаунты');
      return;
    }
    if (opInProgress) {
      await uiAlert('Уже выполняется обновление. Дождитесь завершения или нажмите «Остановить».', 'Обновить аккаунты');
      return;
    }
    setBusy(true);
    prevRunningRef.current = false;
    runSeenActiveRef.current = false;
    try {
      await persistRefreshSettings();
      const selectedAll = ids.length === ACCOUNTS.length;
      const mode = selectedAll ? 'refresh_all' : 'bulk';
      refreshModeRef.current = mode;
      pendingRunRef.current = { mode, downloadCsv: downloadCsvAfter, idsCount: ids.length };
      if (selectedAll) {
        const params = new URLSearchParams();
        if (includeUnavailable) params.set('include_unavailable_accounts', '1');
        if (downloadCsvAfter) params.set('download_csv', '1');
        const qs = params.toString();
        await _postJson(`/api/accounts/refresh_all/${qs ? `?${qs}` : ''}`, {});
        await refreshRunStatus();
        return;
      } else {
        await _postJson('/api/accounts/bulk-refresh/', { ids });
        await refreshRunStatus();
        return;
      }
    } catch (e) {
      pendingRunRef.current = null;
      runSeenActiveRef.current = false;
      await uiAlert(`Ошибка обновления: ${e instanceof Error ? e.message : String(e)}`, 'Ошибка');
    } finally {
      const pendingMode = pendingRunRef.current?.mode;
      if (pendingMode !== 'refresh_all' && pendingMode !== 'bulk') {
        refreshModeRef.current = null;
        setBusy(false);
      }
    }
  };

  const downloadSavedRefreshReport = async () => {
    try {
      const blob = await _fetchBlobWithApiBases('/api/accounts/refresh-all-report/');
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `refresh-all-saved-${new Date().toISOString().replace(/[:.]/g, '-')}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    } catch (e) {
      await uiAlert(
        `Нет сохранённого отчёта или ошибка сети: ${e instanceof Error ? e.message : String(e)}`,
        'CSV отчёт',
      );
    }
  };

  const refreshLastAutoRefreshErrors = async () => {
    let j;
    try {
      j = await _fetchJson('/api/accounts/auto-refresh-last-error-ids/');
    } catch (e) {
      await uiAlert(`Не удалось получить список: ${e instanceof Error ? e.message : String(e)}`, 'Ошибка');
      return;
    }
    const serverIds = Array.isArray(j?.ids) ? j.ids.map((x) => Number(x)).filter((n) => Number.isFinite(n)) : [];
    const known = new Set(ACCOUNTS.map((a) => a.id));
    const ids = serverIds.filter((id) => known.has(id));
    if (serverIds.length === 0) {
      await uiAlert(
        'В последнем завершённом автообновлении по расписанию не было аккаунтов со статусом «ошибка», либо прогон ещё ни разу не завершился.',
        'Повторить ошибки',
      );
      return;
    }
    if (ids.length === 0) {
      await uiAlert(
        'Аккаунты с ошибками из последнего автообновления отсутствуют в текущем списке (удалены или не попали в выгрузку API).',
        'Повторить ошибки',
      );
      return;
    }
    setBusy(true);
    prevRunningRef.current = false;
    runSeenActiveRef.current = false;
    refreshModeRef.current = 'bulk';
    pendingRunRef.current = { mode: 'bulk', idsCount: ids.length };
    try {
      await _postJson('/api/accounts/bulk-refresh/', { ids });
      await refreshRunStatus();
    } catch (e) {
      pendingRunRef.current = null;
      runSeenActiveRef.current = false;
      refreshModeRef.current = null;
      await uiAlert(`Ошибка обновления: ${e instanceof Error ? e.message : String(e)}`, 'Ошибка');
      setBusy(false);
    }
  };

  const stopRefresh = async () => {
    if (stopBusy) return;
    setStopBusy(true);
    try {
      const pipeline = runStatus?.active_pipeline || (
        refreshModeRef.current === 'refresh_all' ? 'refresh_all' : 'bulk_refresh'
      );
      setRunStatus((prev) => (prev ? { ...prev, cancel_requested: true } : prev));
      await _stopActiveRefreshPipeline(pipeline);
      await refreshRunStatus();
      await uiAlert(
        pipeline === 'refresh_all'
          ? 'Остановка сбора всех запрошена. Текущие аккаунты в воркерах завершатся, затем процесс остановится.'
          : 'Остановка запрошена. Текущий аккаунт завершится и процесс остановится.',
        'Остановка обновления',
      );
    } catch (e) {
      await refreshRunStatus().catch(() => null);
      await uiAlert(`Не удалось остановить: ${e instanceof Error ? e.message : String(e)}`, 'Ошибка');
    } finally {
      setStopBusy(false);
    }
  };

  const exportCsv = async () => {
    try {
      const blob = await _fetchBlobWithApiBases('/api/accounts/export-snapshot/');
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `dashboard-snapshot-${new Date().toISOString().replace(/[:.]/g, '-')}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    } catch (e) {
      await uiAlert(`Не удалось экспортировать CSV: ${e instanceof Error ? e.message : String(e)}`, 'Ошибка');
    }
  };

  const importCsv = async () => {
    if (csvImport && (csvImport.phase === 'upload' || csvImport.phase === 'processing')) return;
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.csv,text/csv';
    input.onchange = async () => {
      const f = input.files?.[0];
      if (!f) return;
      const fileLabel = `${f.name} (${(f.size / (1024 * 1024)).toFixed(1)} МБ)`;
      setCsvImport({
        phase: 'upload',
        percent: 0,
        fileName: f.name,
        fileLabel,
        statusText: 'Подготовка…',
      });
      try {
        const summary = await _postFormDataJsonWithUploadProgress(
          '/api/accounts/import-snapshot/',
          f,
          'file',
          {
            onUploadPercent: (pct, loaded, total) => {
              const mbLoaded = (loaded / (1024 * 1024)).toFixed(1);
              const mbTotal = total ? (total / (1024 * 1024)).toFixed(1) : '?';
              setCsvImport({
                phase: 'upload',
                percent: pct,
                fileName: f.name,
                fileLabel,
                statusText: `Загрузка на сервер… ${pct}% (${mbLoaded} / ${mbTotal} МБ)`,
              });
            },
            onPhase: (phase) => {
              if (phase === 'processing') {
                setCsvImport({
                  phase: 'processing',
                  percent: 92,
                  fileName: f.name,
                  fileLabel,
                  statusText: 'Обработка CSV на сервере (большие файлы — несколько минут)…',
                });
              }
            },
          },
        );
        await onDataChanged?.();
        const { msg, errs } = _formatImportSummaryMessage(summary);
        const donePhase = errs.length ? 'done-warn' : 'done-ok';
        setCsvImport({
          phase: donePhase,
          percent: 100,
          fileName: f.name,
          fileLabel,
          statusText: errs.length ? 'Импорт завершён с ошибками' : 'Импорт успешно завершён',
          summary: msg,
          errorCount: errs.length,
        });
        await uiAlert(
          errs.length
            ? `${msg}\n\nПроверьте список ошибок в модалке.`
            : `${msg}\n\nДанные на сервере обновлены.`,
          errs.length ? 'CSV — с ошибками' : 'Импорт завершён',
        );
      } catch (e) {
        const errMsg = e instanceof Error ? e.message : String(e);
        setCsvImport({
          phase: 'error',
          percent: 0,
          fileName: f.name,
          fileLabel,
          statusText: 'Импорт не выполнен',
          summary: errMsg,
        });
        await uiAlert(`Не удалось импортировать CSV: ${errMsg}`, 'Ошибка');
      }
    };
    input.click();
  };

  return (
    <ModalShell title="Обновить выбранные аккаунты" kicker="REFRESH" accent={accent} width={860} onClose={onClose}>
      <div style={{ display: 'flex', justifyContent: 'flex-end', gap: 8, marginBottom: 10, flexWrap: 'wrap' }}>
        <button onClick={exportCsv} disabled={csvImport && (csvImport.phase === 'upload' || csvImport.phase === 'processing')} style={{ padding: '8px 12px', borderRadius: 10, border: '1px solid var(--line)', background: 'rgba(255,255,255,0.03)', color: 'var(--ink)', cursor: 'pointer', opacity: csvImport && (csvImport.phase === 'upload' || csvImport.phase === 'processing') ? 0.5 : 1 }}>Экспорт CSV</button>
        <button onClick={importCsv} disabled={csvImport && (csvImport.phase === 'upload' || csvImport.phase === 'processing')} style={{ padding: '8px 12px', borderRadius: 10, border: '1px solid var(--line)', background: 'rgba(255,255,255,0.03)', color: 'var(--ink)', cursor: csvImport && (csvImport.phase === 'upload' || csvImport.phase === 'processing') ? 'default' : 'pointer', opacity: csvImport && (csvImport.phase === 'upload' || csvImport.phase === 'processing') ? 0.5 : 1 }}>
          {csvImport && (csvImport.phase === 'upload' || csvImport.phase === 'processing') ? 'Импорт…' : 'Импорт CSV'}
        </button>
      </div>
      {csvImport && (
        <div style={{
          marginBottom: 14,
          padding: '12px 14px',
          borderRadius: 12,
          border: `1px solid ${csvImport.phase === 'error' ? '#ef444455' : csvImport.phase === 'done-warn' ? '#f59e0b55' : csvImport.phase === 'done-ok' ? '#4ade8055' : 'var(--line)'}`,
          background: csvImport.phase === 'error' ? 'rgba(239,68,68,0.08)' : csvImport.phase === 'done-ok' ? 'rgba(74,222,128,0.08)' : csvImport.phase === 'done-warn' ? 'rgba(245,158,11,0.08)' : 'rgba(255,255,255,0.02)',
        }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 10, marginBottom: 8 }}>
            <div>
              <div style={{ fontSize: 13, fontWeight: 600, color: 'var(--ink)' }}>{csvImport.statusText}</div>
              <div className="mono" style={{ fontSize: 11, color: 'var(--ink-mute)', marginTop: 4 }}>{csvImport.fileLabel || csvImport.fileName}</div>
            </div>
            {(csvImport.phase === 'done-ok' || csvImport.phase === 'done-warn' || csvImport.phase === 'error') && (
              <button
                type="button"
                onClick={() => setCsvImport(null)}
                aria-label="Закрыть"
                style={{ width: 28, height: 28, borderRadius: 8, border: '1px solid var(--line)', background: 'transparent', color: 'var(--ink-mute)', cursor: 'pointer', fontSize: 14 }}
              >✕</button>
            )}
          </div>
          {(csvImport.phase === 'upload' || csvImport.phase === 'processing') && (
            <>
              <div style={{ height: 8, borderRadius: 999, border: '1px solid var(--line)', background: 'rgba(255,255,255,0.04)', overflow: 'hidden' }}>
                <div style={{
                  width: `${Math.max(4, Math.min(100, Number(csvImport.percent || 0)))}%`,
                  height: '100%',
                  borderRadius: 999,
                  background: csvImport.phase === 'processing'
                    ? 'linear-gradient(90deg, #38bdf8, #4ade80, #38bdf8)'
                    : 'linear-gradient(90deg, #22c55e, #4ade80)',
                  backgroundSize: csvImport.phase === 'processing' ? '200% 100%' : '100% 100%',
                  animation: csvImport.phase === 'processing' ? 'csvImportPulse 1.2s ease infinite' : 'none',
                  transition: 'width 200ms ease',
                }} />
              </div>
              <style>{`@keyframes csvImportPulse { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }`}</style>
            </>
          )}
          {(csvImport.phase === 'done-ok' || csvImport.phase === 'done-warn' || csvImport.phase === 'error') && csvImport.summary && (
            <pre style={{
              margin: '10px 0 0',
              padding: '10px 12px',
              borderRadius: 8,
              background: 'rgba(0,0,0,0.2)',
              border: '1px solid var(--line)',
              fontSize: 11,
              lineHeight: 1.45,
              color: 'var(--ink-dim)',
              whiteSpace: 'pre-wrap',
              wordBreak: 'break-word',
              maxHeight: 220,
              overflow: 'auto',
              fontFamily: 'JetBrains Mono, monospace',
            }}>{csvImport.summary}</pre>
          )}
        </div>
      )}
      <div className="mono" style={{ fontSize: 11, color: 'var(--ink-mute)', letterSpacing: '0.2em', marginBottom: 8 }}>ПЛАТФОРМЫ</div>
      <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8, marginBottom: 12 }}>
        {platformOptions.map((p) => (
          <Pill key={p.id} active={selectedPlatforms.has(p.id)} onClick={() => togglePlatform(p.id)} dot={p.color}>{p.label}</Pill>
        ))}
        <button
          onClick={() => setSelectedPlatforms(new Set(platformOptions.map((p) => p.id)))}
          style={{ padding: '8px 12px', borderRadius: 999, border: '1px solid var(--line)', background: 'rgba(255,255,255,0.03)', color: 'var(--ink)', cursor: 'pointer', fontSize: 12 }}
        >
          Все
        </button>
        <button
          onClick={() => setSelectedPlatforms(new Set())}
          style={{ padding: '8px 12px', borderRadius: 999, border: '1px solid var(--line)', background: 'rgba(255,255,255,0.03)', color: 'var(--ink)', cursor: 'pointer', fontSize: 12 }}
        >
          Сброс
        </button>
      </div>
      <div style={{ marginBottom: 12, display: 'grid', gridTemplateColumns: '1fr auto', gap: 10 }}>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8, padding: 10, border: '1px solid var(--line)', borderRadius: 10 }}>
          <label style={{ display: 'flex', justifyContent: 'space-between', color: 'var(--ink-dim)', fontSize: 13 }}>
            <span>Включать аккаунты скрытых платформ</span>
            <input type="checkbox" checked={includeHiddenPlatform} onChange={(e) => setIncludeHiddenPlatform(e.target.checked)} />
          </label>
          <label style={{ display: 'flex', justifyContent: 'space-between', color: 'var(--ink-dim)', fontSize: 13 }}>
            <span>Включать аккаунты скрытых профилей</span>
            <input type="checkbox" checked={includeHiddenProfile} onChange={(e) => setIncludeHiddenProfile(e.target.checked)} />
          </label>
          <label style={{ display: 'flex', justifyContent: 'space-between', color: 'var(--ink-dim)', fontSize: 13 }}>
            <span>Учитывать недоступные аккаунты</span>
            <input type="checkbox" checked={includeUnavailable} onChange={(e) => setIncludeUnavailable(e.target.checked)} />
          </label>
        </div>
        <div style={{ display: 'flex', gap: 8 }}>
          <button onClick={syncSelectionToFilter} style={{ padding: '8px 12px', borderRadius: 10, border: '1px solid var(--line)', background: 'rgba(255,255,255,0.03)', color: 'var(--ink)', cursor: 'pointer' }}>Выбрать все</button>
          <button onClick={clearSelection} style={{ padding: '8px 12px', borderRadius: 10, border: '1px solid var(--line)', background: 'rgba(255,255,255,0.03)', color: 'var(--ink)', cursor: 'pointer' }}>Снять все</button>
        </div>
      </div>

      <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8, marginBottom: 12 }}>
        {PROFILES.map((p) => (
          <Pill key={p.id} active={selectedProfiles.has(p.id)} onClick={() => toggleProfile(p.id)} dot={p.color}>{p.label}</Pill>
        ))}
      </div>
      <div style={{ display: 'flex', gap: 8, marginBottom: 12 }}>
        <Pill active={availability === 'all'} onClick={() => setAvailability('all')}>Все</Pill>
        <Pill active={availability === 'avail'} onClick={() => setAvailability('avail')}>Только доступные</Pill>
        <Pill active={availability === 'unavail'} onClick={() => setAvailability('unavail')}>Только недоступные</Pill>
      </div>
      <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Поиск: username, имя" style={{ width: '100%', marginBottom: 10, padding: '10px 12px', borderRadius: 10, background: 'rgba(255,255,255,0.025)', border: '1px solid var(--line)', color: 'var(--ink)', fontSize: 13, fontFamily: 'inherit' }} />
      <div style={{ display: 'flex', gap: 8, marginBottom: 10 }}>
        <Pill active={updatedSortOrder === 'desc'} onClick={() => setUpdatedSortOrder('desc')}>Сначала новые</Pill>
        <Pill active={updatedSortOrder === 'asc'} onClick={() => setUpdatedSortOrder('asc')}>Сначала старые</Pill>
      </div>

      <label style={{ display: 'inline-flex', alignItems: 'center', gap: 8, marginBottom: 10, color: 'var(--ink-dim)', fontSize: 13, cursor: 'pointer' }}>
        <input
          type="checkbox"
          checked={allVisibleSelected}
          onChange={(e) => setAllVisible(e.target.checked)}
        />
        Выбрать все в списке ({selectedVisibleCount}/{filtered.length})
      </label>

      <div style={{ maxHeight: 300, overflowY: 'auto', border: '1px solid var(--line)', borderRadius: 10, marginBottom: 12 }}>
        {filteredSorted.map((a) => (
          <label key={a.id} style={{ display: 'grid', gridTemplateColumns: '24px 1fr auto', gap: 10, padding: '10px 12px', borderBottom: '1px solid var(--line)', cursor: 'pointer' }}>
            <input type="checkbox" checked={selectedIds.has(a.id)} onChange={() => toggleOne(a.id)} />
            <span><span style={{ color: 'var(--ink-dim)' }}>{PLATFORM_META[a.platform]?.label || a.platform}</span> &nbsp; <b style={{ color: '#fff' }}>{a.name}</b> <span style={{ color: 'var(--ink-mute)' }}>{a.handle}</span></span>
            <span className="mono" style={{ color: 'var(--ink-mute)', fontSize: 12 }}>{a.updated}</span>
          </label>
        ))}
      </div>
      <label style={{ display: 'flex', alignItems: 'center', gap: 8, color: 'var(--ink-dim)', fontSize: 13, marginBottom: 6 }}>
        <input type="checkbox" checked={downloadCsvAfter} onChange={(e) => setDownloadCsvAfter(e.target.checked)} />
        Сразу скачать CSV в браузере после завершения
      </label>
      <div style={{ fontSize: 12, color: 'var(--ink-mute)', marginBottom: 10, lineHeight: 1.45 }}>
        Обновление (и часть аккаунтов, и все) идёт в фоне: прогресс, прогрев Facebook и «Остановить» — в этой модалке. Расширенный CSV-отчёт с приростами сохраняется на сервере только при сборе всех аккаунтов.
      </div>
      <button
        type="button"
        onClick={() => { void downloadSavedRefreshReport(); }}
        style={{ padding: '8px 14px', borderRadius: 10, border: '1px solid var(--line)', background: 'rgba(255,255,255,0.04)', color: 'var(--ink)', fontSize: 13, cursor: 'pointer', marginBottom: 8 }}
      >
        Скачать сохранённый отчёт последнего сбора (CSV)
      </button>
      <button
        type="button"
        disabled={busy || opInProgress}
        onClick={() => { void refreshLastAutoRefreshErrors(); }}
        style={{ padding: '8px 14px', borderRadius: 10, border: '1px solid var(--line)', background: 'rgba(255,255,255,0.04)', color: 'var(--ink)', fontSize: 13, cursor: (busy || opInProgress) ? 'default' : 'pointer', marginBottom: 12, display: 'block', opacity: (busy || opInProgress) ? 0.6 : 1 }}
      >
        Повторить ошибки последнего автообновления
      </button>

      {(runStatus?.is_running || (Array.isArray(runStatus?.run_detail?.items) && runStatus.run_detail.items.length > 0) || (runStatus?.run_detail?.warm && typeof runStatus.run_detail.warm === 'object' && Object.keys(runStatus.run_detail.warm).length > 0)) && (

      {runDetailOpen && (
        <AutoRefreshRunDetailOverlay status={runStatus} accent={accent} onClose={() => setRunDetailOpen(false)} refreshAutoStatus={refreshRunStatus} />

      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>

        <div style={{ display: 'flex', gap: 8 }}>
          {opInProgress && (
            <button
              type="button"
              onClick={() => { void stopRefresh(); }}
              disabled={stopBusy || !!runStatus?.cancel_requested}
              style={{
                padding: '10px 16px',
                borderRadius: 10,
                border: '1px solid rgba(239,68,68,0.45)',
                background: 'rgba(239,68,68,0.12)',
                color: '#fecaca',
                fontWeight: 600,
                cursor: stopBusy || runStatus?.cancel_requested ? 'default' : 'pointer',
                opacity: stopBusy || runStatus?.cancel_requested ? 0.65 : 1,
              }}
            >
              {stopBusy || runStatus?.cancel_requested ? 'Остановка…' : 'Остановить'}
            </button>
          )}
          <button
            type="button"
            onClick={() => { void runRefreshClicks(); }}
            disabled={busy || opInProgress}
            title="Запросить total_clicks из Links для выбранных аккаунтов (без scrape платформ)"
            style={{
              padding: '10px 16px',
              borderRadius: 10,
              border: '1px solid #a78bfa88',
              background: 'rgba(167,139,250,0.14)',
              color: '#e9d5ff',
              fontWeight: 600,
              cursor: (busy || opInProgress) ? 'default' : 'pointer',
              opacity: (busy || opInProgress) ? 0.6 : 1,
            }}
          >
            {busy && !opInProgress ? 'Переходы…' : `↻ Переходы (${selectedCount})`}
          </button>
          <button
            type="button"
            onClick={() => { void runRefresh(); }}
            disabled={busy || opInProgress}
            style={{ padding: '10px 18px', borderRadius: 10, border: 'none', background: '#fff', color: '#000', fontWeight: 600, cursor: (busy || opInProgress) ? 'default' : 'pointer', opacity: (busy || opInProgress) ? 0.6 : 1 }}
          >
            {(busy || opInProgress) ? 'Обновление...' : `Обновить (${selectedCount})`}
          </button>
        </div>
      </div>
    </ModalShell>
  );
}

// ===== app.jsx =====
// Root app — routes between TV broadcast and main interface screens, hosts Tweaks panel.

const { useState: useStateApp, useEffect: useEffectApp } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "tv_mood": "mission",
  "accent": "#6aa9ff",
  "accounts_view": "table",
  "start_screen": "accounts"
}/*EDITMODE-END*/;

function NFUiHost() {
  const [alertState, setAlertState] = useStateApp(null); // {title,message,resolve}
  const [confirmState, setConfirmState] = useStateApp(null); // {title,message,resolve}
  const [promptState, setPromptState] = useStateApp(null); // {title,label,value,resolve}
  const [promptValue, setPromptValue] = useStateApp('');

  useEffectApp(() => {
    window.__nf_ui = {
      alert: (message, title = 'Уведомление') => new Promise((resolve) => {
        setAlertState({ message, title, resolve });
      }),
      confirm: (message, title = 'Подтверждение') => new Promise((resolve) => {
        setConfirmState({ message, title, resolve });
      }),
      prompt: (label, value = '', title = 'Ввод') => new Promise((resolve) => {
        setPromptValue(value);
        setPromptState({ label, title, resolve });
      }),
    };
    return () => { delete window.__nf_ui; };
  }, []);

  return (
    <>
      {alertState && (
        <ModalOverlay onClose={() => { alertState.resolve(); setAlertState(null); }}>
          <ModalShell title={alertState.title} kicker="INFO" accent="#6aa9ff" width={460} onClose={() => { alertState.resolve(); setAlertState(null); }}>
            <div style={{ color: 'var(--ink-dim)', fontSize: 14, marginBottom: 16, lineHeight: 1.5 }}>{alertState.message}</div>
            <div style={{ display: 'flex', justifyContent: 'flex-end' }}>
              <button onClick={() => { alertState.resolve(); setAlertState(null); }} style={{ padding: '10px 16px', borderRadius: 10, border: 'none', background: '#fff', color: '#000', fontWeight: 600, cursor: 'pointer' }}>ОК</button>
            </div>
          </ModalShell>
        </ModalOverlay>
      )}
      {confirmState && (
        <ModalOverlay onClose={() => { confirmState.resolve(false); setConfirmState(null); }}>
          <ModalShell title={confirmState.title} kicker="CONFIRM" accent="#6aa9ff" width={500} onClose={() => { confirmState.resolve(false); setConfirmState(null); }}>
            <div style={{ color: 'var(--ink-dim)', fontSize: 14, marginBottom: 16, lineHeight: 1.5 }}>{confirmState.message}</div>
            <div style={{ display: 'flex', justifyContent: 'flex-end', gap: 10 }}>
              <button onClick={() => { confirmState.resolve(false); setConfirmState(null); }} style={{ padding: '10px 16px', borderRadius: 10, border: '1px solid var(--line)', background: 'transparent', color: 'var(--ink-dim)', cursor: 'pointer' }}>Отмена</button>
              <button onClick={() => { confirmState.resolve(true); setConfirmState(null); }} style={{ padding: '10px 16px', borderRadius: 10, border: 'none', background: '#fff', color: '#000', fontWeight: 600, cursor: 'pointer' }}>Подтвердить</button>
            </div>
          </ModalShell>
        </ModalOverlay>
      )}
      {promptState && (
        <ModalOverlay onClose={() => { promptState.resolve(null); setPromptState(null); }}>
          <ModalShell title={promptState.title} kicker="INPUT" accent="#6aa9ff" width={520} onClose={() => { promptState.resolve(null); setPromptState(null); }}>
            <div style={{ color: 'var(--ink-dim)', fontSize: 13, marginBottom: 8 }}>{promptState.label}</div>
            <input
              value={promptValue}
              onChange={(e) => setPromptValue(e.target.value)}
              autoFocus
              style={{ width: '100%', marginBottom: 16, padding: '11px 12px', borderRadius: 10, background: 'rgba(255,255,255,0.03)', border: '1px solid var(--line)', color: 'var(--ink)', fontSize: 14, fontFamily: 'inherit' }}
            />
            <div style={{ display: 'flex', justifyContent: 'flex-end', gap: 10 }}>
              <button onClick={() => { promptState.resolve(null); setPromptState(null); }} style={{ padding: '10px 16px', borderRadius: 10, border: '1px solid var(--line)', background: 'transparent', color: 'var(--ink-dim)', cursor: 'pointer' }}>Отмена</button>
              <button onClick={() => { promptState.resolve(promptValue); setPromptState(null); }} style={{ padding: '10px 16px', borderRadius: 10, border: 'none', background: '#fff', color: '#000', fontWeight: 600, cursor: 'pointer' }}>ОК</button>
            </div>
          </ModalShell>
        </ModalOverlay>
      )}
    </>
  );
}

function _initialRouteFromUrl() {
  try {
    const q = new URLSearchParams(window.location.search);
    const r = (q.get('route') || q.get('screen') || '').trim().toLowerCase();
    if (['tv', 'accounts', 'analytics', 'settings', 'modals'].includes(r)) return r;
    const path = (window.location.pathname || '').replace(/\/+$/, '');
    if (path.endsWith('/analytics') || path === '/analytics') return 'analytics';
    if (path.endsWith('/accounts') || path === '/accounts') return 'accounts';
    if (path.endsWith('/settings') || path === '/settings') return 'settings';
    if (path.endsWith('/tv') || path === '/tv') return 'tv';
  } catch (_) {}
  return null;
}

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [route, setRoute] = useStateApp(_initialRouteFromUrl() || tweaks.start_screen || 'tv');
  const [dataReady, setDataReady] = useStateApp(false);
  const [dataKey, setDataKey] = useStateApp(0);
  const [reloading, setReloading] = useStateApp(false);
  const [selectedAccountId, setSelectedAccountId] = useStateApp(null);
  const [globalModal, setGlobalModal] = useStateApp(null); // refresh_all | schedule | add_list | add_one
  const autoRefreshInFlightRef = React.useRef(false);

  // Auto-apply accent to CSS variables
  useEffectApp(() => {
    document.documentElement.style.setProperty('--accent', tweaks.accent);
  }, [tweaks.accent]);

  useEffectApp(() => {
    if (!_isEmbedMode()) return;
    const root = document.getElementById('root');
    const prevPb = document.body.style.paddingBottom;
    const prevHtmlH = document.documentElement.style.height;
    const prevHtmlMinH = document.documentElement.style.minHeight;
    const prevHtmlW = document.documentElement.style.width;
    const prevBodyH = document.body.style.height;
    const prevBodyMinH = document.body.style.minHeight;
    const prevBodyW = document.body.style.width;
    const prevBodyM = document.body.style.margin;
    const prevOx = document.body.style.overflowX;
    const prevRootH = root ? root.style.height : '';
    const prevRootMinH = root ? root.style.minHeight : '';
    document.documentElement.classList.add('nf-embed');
    document.documentElement.style.width = '100%';
    document.documentElement.style.height = '100%';
    document.documentElement.style.minHeight = '0';
    document.body.style.width = '100%';
    document.body.style.height = '100%';
    document.body.style.minHeight = '0';
    document.body.style.margin = '0';
    document.body.style.overflowX = 'hidden';
    document.body.style.paddingBottom = '0';
    if (root) {
      root.style.height = '100%';
      root.style.minHeight = '0';
      root.style.display = 'flex';
      root.style.flexDirection = 'column';
    }
    return () => {
      document.documentElement.classList.remove('nf-embed');
      document.body.style.paddingBottom = prevPb;
      document.documentElement.style.height = prevHtmlH;
      document.documentElement.style.minHeight = prevHtmlMinH;
      document.documentElement.style.width = prevHtmlW;
      document.body.style.height = prevBodyH;
      document.body.style.minHeight = prevBodyMinH;
      document.body.style.width = prevBodyW;
      document.body.style.margin = prevBodyM;
      document.body.style.overflowX = prevOx;
      if (root) {
        root.style.height = prevRootH;
        root.style.minHeight = prevRootMinH;
        root.style.display = '';
        root.style.flexDirection = '';
      }
    };
  }, []);

  useEffectApp(() => {
    let cancelled = false;
    loadDashboardData()
      .catch((e) => console.error('[new_frontend] failed to load API data', e))
      .finally(() => {
        if (!cancelled) {
          setDataReady(true);
          setDataKey((v) => v + 1);
        }
      });
    return () => {
      cancelled = true;
    };
  }, []);

  const reloadData = async () => {
    setReloading(true);
    try {
      await loadDashboardData();
      setDataKey((v) => v + 1);
    } finally {
      setReloading(false);
    }
  };

  useEffectApp(() => {
    const intervalMs = route === 'tv' ? 15 * 1000 : 10 * 60 * 1000; // TV updates much faster
    const id = setInterval(async () => {
      if (autoRefreshInFlightRef.current) return;
      autoRefreshInFlightRef.current = true;
      try {
        await loadDashboardData();
        setDataKey((v) => v + 1);
      } catch (e) {
        // Silent background refresh: keep UI running with last known data.
        console.warn('[new_frontend] background refresh failed', e);
      } finally {
        autoRefreshInFlightRef.current = false;
      }
    }, intervalMs);
    return () => clearInterval(id);
  }, [route]);

  // После полуночи по Москве summary должен отдать новые yesterday_* — подтягиваем даже на вкладках с редким автообновлением.
  useEffectApp(() => {
    let lastMsk = _mskCalendarDateKey();
    const id = setInterval(() => {
      const cur = _mskCalendarDateKey();
      if (cur === lastMsk) return;
      lastMsk = cur;
      if (autoRefreshInFlightRef.current) return;
      autoRefreshInFlightRef.current = true;
      (async () => {
        try {
          await loadDashboardData();
          setDataKey((v) => v + 1);
        } catch (e) {
          console.warn('[new_frontend] calendar day change refresh failed', e);
        } finally {
          autoRefreshInFlightRef.current = false;
        }
      })();
    }, 30000);
    return () => clearInterval(id);
  }, []);

  useEffectApp(() => {
    if (route !== 'tv') return;
    if (autoRefreshInFlightRef.current) return;
    autoRefreshInFlightRef.current = true;
    (async () => {
      try {
        await loadDashboardData();
        setDataKey((v) => v + 1);
      } catch (e) {
        console.warn('[new_frontend] tv immediate refresh failed', e);
      } finally {
        autoRefreshInFlightRef.current = false;
      }
    })();
  }, [route]);

  const ROUTES = [
    { id: 'tv',        label: 'TV Broadcast' },
    { id: 'accounts',  label: 'Аккаунты' },
    { id: 'account_detail', label: 'Аккаунт' },
    { id: 'analytics', label: 'Аналитика' },
    { id: 'settings',  label: 'Настройки' },
  ];

  if (!dataReady) {
    return (
      <div style={{ minHeight: '100vh', display: 'grid', placeItems: 'center', color: 'var(--ink-dim)' }}>
        <div className="mono">Загрузка данных...</div>
      </div>
    );
  }

  return (
    <>
      {route === 'tv'        && <TVScreen tweaks={tweaks} onExit={() => setRoute('accounts')} />}
      {route === 'accounts'  && <AccountsScreen key={`acc-${dataKey}`} tweaks={tweaks} onNavigate={setRoute} onDataChanged={reloadData} onOpenGlobalModal={setGlobalModal} onOpenAccount={(id) => { setSelectedAccountId(id); setRoute('account_detail'); }} />}
      {route === 'account_detail' && selectedAccountId != null && <AccountDetailScreen key={`detail-${selectedAccountId}-${dataKey}`} accountId={selectedAccountId} onBack={() => setRoute('accounts')} onDataChanged={reloadData} />}
      {route === 'analytics' && (
        <AnalyticsScreen
          key={`an-${dataKey}`}
          tweaks={tweaks}
          onOpenGlobalModal={setGlobalModal}
          onOpenAccount={(id) => { setSelectedAccountId(id); setRoute('account_detail'); }}
        />
      )}
      {route === 'settings'  && <SettingsScreen key={`set-${dataKey}`} tweaks={tweaks} onBack={() => setRoute('accounts')} onDataChanged={reloadData} onOpenGlobalModal={setGlobalModal} />}

      {globalModal && (
        <ModalOverlay onClose={() => setGlobalModal(null)}>
          {globalModal === 'refresh_all' && (
            <RefreshAllModal
              key={`refresh-all-${dataKey}`}
              accent={tweaks.accent}
              onClose={() => setGlobalModal(null)}
              onDataChanged={reloadData}
            />
          )}
          {globalModal === 'schedule' && (
            <ScheduleModal
              accent={tweaks.accent}
              onDataChanged={reloadData}
              onClose={() => setGlobalModal(null)}
            />
          )}
          {globalModal === 'add_list' && (
            <AddListModal
              accent={tweaks.accent}
              onDataChanged={reloadData}
              onClose={() => setGlobalModal(null)}
            />
          )}
          {globalModal === 'add_one' && (
            <AddOneInline
              accent={tweaks.accent}
              onDataChanged={reloadData}
              onClose={() => setGlobalModal(null)}
            />
          )}
        </ModalOverlay>
      )}

      {route !== 'tv' && route !== 'account_detail' && (
        <RouteFloater route={route} setRoute={setRoute} routes={ROUTES} accent={tweaks.accent} />
      )}

      {!_isEmbedMode() && <TweaksPanel title="Tweaks">
        <TweakSection title="Данные">
          <TweakButton label={reloading ? 'Обновление…' : 'Перезагрузить данные'} onClick={() => { void reloadData(); }} />
        </TweakSection>
        <TweakSection title="Старт + навигация">
          <TweakSelect label="Экран" value={route} onChange={v => setRoute(v)} options={ROUTES.map(r => ({ value: r.id, label: r.label }))} />
        </TweakSection>
        <TweakSection title="TV-режим">
          <TweakRadio label="Настроение" value={tweaks.tv_mood} onChange={v => setTweak('tv_mood', v)} options={[
            { value: 'mission', label: 'Mission' },
            { value: 'bloomberg', label: 'Bloom' },
            { value: 'calm', label: 'Calm' },
          ]} />
        </TweakSection>
        <TweakSection title="Акцент">
          <TweakColor label="Цвет" value={tweaks.accent} onChange={v => setTweak('accent', v)} options={['#6aa9ff', '#4ade80', '#f59e0b', '#ec4899', '#ffffff']} />
        </TweakSection>
        <TweakSection title="Список аккаунтов">
          <TweakRadio label="Вид" value={tweaks.accounts_view} onChange={v => setTweak('accounts_view', v)} options={[
            { value: 'table', label: 'Таблица' },
            { value: 'cards', label: 'Карточки' },
          ]} />
        </TweakSection>
      </TweaksPanel>}
      <NFUiHost />
      <MobileGlobalStyle />
    </>
  );
}

function RouteFloater({ route, setRoute, routes, accent }) {
  const isMobile = useIsMobile(980);
  const embed = _isEmbedMode();
  const navRoutes = routes.filter((r) => r.id !== 'account_detail');

    if (!isMobile) return label;

  return (

      {isMobile && (
        <div style={{

          left: 0,
          right: 0,

          pointerEvents: 'none',
        }} />
      )}
      <div style={{
        position: 'fixed',
        bottom: embed ? (isMobile ? 6 : 12) : (isMobile ? 8 : 24),

        right: isMobile ? 8 : 'auto',
        transform: isMobile ? 'none' : 'translateX(-50%)',
        display: 'flex', gap: 4, padding: 6, borderRadius: 999,
        background: isMobile ? 'rgba(10,12,18,0.96)' : 'rgba(10,12,18,0.85)',
        backdropFilter: 'blur(16px)',
        border: '1px solid var(--line-2)', zIndex: 90, boxShadow: '0 8px 30px rgba(0,0,0,0.5)',
      }}>
        {navRoutes.map(r => (
          <button key={r.id} onClick={() => setRoute(r.id)} style={{
            flex: isMobile ? 1 : 'unset',
            minWidth: 0,
            padding: isMobile ? '9px 8px' : '9px 16px', borderRadius: 999, border: 'none', cursor: 'pointer',
            background: route === r.id ? accent : 'transparent',
            color: route === r.id ? '#000' : 'var(--ink-dim)',
            fontSize: isMobile ? 11 : 12, fontWeight: route === r.id ? 600 : 500, letterSpacing: '0.02em',
            fontFamily: 'inherit',
            whiteSpace: 'nowrap',
            overflow: 'hidden',
            textOverflow: 'ellipsis',
          }}>{mobileLabel(r.id, r.label)}</button>
        ))}
      </div>
    </>
  );
}

try {
  if (typeof React === 'undefined' || typeof ReactDOM === 'undefined' || typeof Babel === 'undefined') {
    throw new Error('React / ReactDOM / Babel не загрузились (папка new_frontend/vendor/)');
  }
  window.__nfAppMounted = true;
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
} catch (bootErr) {
  window.__nfBootError(bootErr && bootErr.message ? bootErr.message : String(bootErr));
  console.error('[new_frontend] boot failed', bootErr);
}


</script>

</body>
</html>
