<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<title>AccountsStats — Atomic</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23050608' stroke='%236aa9ff' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%236aa9ff'/%3E%3C/svg%3E" />
<script>
  (function () {
    try {
      if (window.location.pathname.endsWith('/app.html')) {
        window.history.replaceState({}, '', '/');
      }
    } catch (_) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050608;
    --bg-1: #0a0c12;
    --bg-2: #11141c;
    --bg-3: #1a1f2b;
    --line: #1f2533;
    --line-2: #2a3142;
    --ink: #eef2fb;
    --ink-dim: #8a93a8;
    --ink-mute: #525a70;
    --accent: #6aa9ff;
    --accent-2: #4ade80;
    --accent-3: #f59e0b;
    --pink: #ec4899;
    --orange: #fb923c;
    --warn: #f59e0b;
    --danger: #ef4444;
    --grid: rgba(106,169,255,0.06);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: 'Space Grotesk', -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  body {
    background-image:
      radial-gradient(circle at 80% -10%, rgba(106,169,255,0.08), transparent 50%),
      radial-gradient(circle at -10% 110%, rgba(74,222,128,0.05), transparent 50%);
    min-height: 100vh;
  }
  .mono { font-family: 'JetBrains Mono', monospace; font-feature-settings: "tnum"; letter-spacing: -0.01em; }
  .tnum { font-variant-numeric: tabular-nums; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 6px; }
  button { font-family: inherit; }
  a { color: inherit; }
  #root { min-height: 100vh; }
  .switch-btn {
    display: inline-block;
    width: 48px;
    height: 26px;
    border-radius: 13px;
    background: #bfbfbf;
    z-index: 0;
    margin: 0;
    padding: 0;
    border: none;
    cursor: pointer;
    position: relative;
    transition-duration: 300ms;
    flex-shrink: 0;
  }
  .switch-btn::after {
    content: "";
    height: 20px;
    width: 20px;
    border-radius: 10px;
    background: #fff;
    top: 3px;
    left: 3px;
    transition-duration: 300ms;
    position: absolute;
    z-index: 1;
  }
  .switch-btn.switch-on {
    background: #ef4444;
  }
  .switch-btn.switch-on::after {
    left: 25px;
  }
  .switch-btn:disabled {
    opacity: 0.55;
    cursor: not-allowed;
  }
  .switch-btn:focus-visible {
    outline: 2px solid var(--danger, #ef4444);
    outline-offset: 2px;
  }
  .nf-emu-settings-screen {
    min-height: 100vh;
    max-width: 960px;
    margin: 0 auto;
    padding: 0 20px 80px;
  }
  .nf-emu-settings-toolbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 50;
    background: rgba(5, 6, 8, 0.96);
    border-bottom: 1px solid var(--line);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
  }
  .nf-emu-settings-toolbar-inner {
    max-width: 960px;
    margin: 0 auto;
    padding: 16px 20px 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }
</style>
<link rel="stylesheet" href="checkbox-radio.css" />
</head>
<body>
<div id="root">
  <div id="nf-boot" style="min-height:100vh;background:var(--bg,#050608)"></div>
</div>
<script>
  window.__nfSetBoot = function () {};
  window.__nfBootError = function (msg) {
    var el = document.getElementById('root');
    if (!el) return;
    el.innerHTML = '<div style="min-height:100vh;padding:24px;color:#f87171;font-family:system-ui,sans-serif;max-width:720px;line-height:1.5">'
      + '<div style="font-weight:600;margin-bottom:8px">Не удалось запустить интерфейс</div>'
      + '<div style="color:#8a93a8;font-size:14px;white-space:pre-wrap">' + String(msg || 'неизвестная ошибка') + '</div>'
      + '<div style="margin-top:16px;color:#6aa9ff;font-size:13px">Проверьте Django на :8000 и вкладку Console (F12)</div></div>';
  };
  window.addEventListener('error', function (e) {
    if (e && e.target && e.target.tagName === 'SCRIPT') {
      window.__nfBootError('Скрипт не загрузился: ' + (e.target.src || ''));
    }
  }, true);
  setTimeout(function () {
    if (typeof React === 'undefined') {
      window.__nfBootError('Не загрузились скрипты React. Обновите страницу (Ctrl+Shift+R).');
    }
  }, 120000);
  setTimeout(function () {
    if (!window.__nfAppMounted) {
      window.__nfBootError('Таймаут запуска (3 мин).\nОткройте F12 → Console и пришлите ошибки.');
    }
  }, 180000);
</script>
<script>
(function () {
    var p = window.location.pathname || '';
    var prefix = (p === '/accounts-stats' || p.indexOf('/accounts-stats/') === 0) ? '/accounts-stats' : '';
    window.__NF_STATIC_PREFIX = prefix;
    window.__NF_PRECOMPILED = true;
    var base = prefix + '/vendor/';
    ['react.development.js', 'react-dom.development.js'].forEach(function (f) {
      document.write('<script src="' + base + f + '"><\/script>');
    });
    document.write('<script src="' + prefix + '/app.bundle.js?v=emu-tabs-v2-' + Date.now() + '"><\/script>');
  })();
</script>


</body>
</html>
