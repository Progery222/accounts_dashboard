  const [rowBusyId, setRowBusyId] = useStateAcc(null);
  const [profileEditor, setProfileEditor] = useStateAcc(null); // { mode, id?, name, color }
  const [profileEditorBusy, setProfileEditorBusy] = useStateAcc(false);

  React.useEffect(() => { window.localStorage.setItem('nf_platform', platform); }, [platform]);
  React.useEffect(() => { window.localStorage.setItem('nf_profile', profile); }, [profile]);
  React.useEffect(() => { window.localStorage.setItem('nf_status', status); }, [status]);
  React.useEffect(() => { window.localStorage.setItem('nf_search', search); }, [search]);
  React.useEffect(() => { window.localStorage.setItem('nf_show_hidden', showHidden ? '1' : '0'); }, [showHidden]);
  React.useEffect(() => { window.localStorage.setItem('nf_sort_by_delta', sortByDelta ? '1' : '0'); }, [sortByDelta]);

  React.useEffect(() => {
    let mounted = true;
    (async () => {
      try {
        const v = await _fetchJson('/api/accounts/visibility/');
        if (!mounted) return;
        setHiddenPlatforms(new Set((v?.hidden_platforms || []).map(String)));
        setHiddenProfileIds(new Set((v?.hidden_profile_ids || []).map((x) => String(x))));
      } catch {
        // ignore
      }
    })();
    return () => { mounted = false; };
  }, []);

  const setTabAndNavigate = (nextTab) => {
    setTab(nextTab);
    if (nextTab === 'analytics') onNavigate?.('analytics');
  };

  const resetFilters = () => {
    setPlatform('all');
    setProfile('all');
    setStatus('all');
    setSearch('');
    setProfileSearch('');
    setShowHidden(false);
    setSortKey('views');
    setSortOrder('desc');
    setSortByDelta(false);
  };

  const cycleAccountDeltaPeriod = async () => {
    if (deltaPeriodSaving) return;
    const next = _nextDeltaPeriodDays(ACCOUNT_DELTA_PERIOD_DAYS);
    const cached = DELTA_PERIOD_CACHE[next];
    if (cached) {
      const snap = {
        accounts: cached.accounts.map((x) => ({ ...x })),
        total: JSON.parse(JSON.stringify(cached.total)),
        platforms: cached.platforms.map((x) => ({ ...x })),
      };
      if (_applyDeltaSnapshotToGlobals(snap)) {
        ACCOUNT_DELTA_PERIOD_DAYS = next;
        bumpDeltaUi();
      }
      void _postJson('/api/accounts/schedule/', { account_delta_period_days: next }).catch(() => {});
      _scheduleDeltaPrefetchExcept(next);
      return;
    }
    setDeltaPeriodSaving(true);
    try {
      const [sr, ar] = await Promise.all([
        _fetchJsonSoft(`/api/accounts/summary/?include_hidden=1&delta_period_days=${next}`),
        _fetchJsonSoft(`/api/accounts/?include_hidden=1&delta_period_days=${next}`),
      ]);
      if (sr.ok && ar.ok && Array.isArray(ar.data) && sr.data) {
        const snap = _buildDeltaSnapshot(sr.data, ar.data);
        if (snap && _applyDeltaSnapshotToGlobals(snap)) {
          ACCOUNT_DELTA_PERIOD_DAYS = next;
          _storeDeltaCacheForPeriod(next, snap);
          bumpDeltaUi();
        }
      } else {
        await _postJson('/api/accounts/schedule/', { account_delta_period_days: next });
        await onDataChanged?.();
        return;
      }
      void _postJson('/api/accounts/schedule/', { account_delta_period_days: next }).catch(() => {});
      _scheduleDeltaPrefetchExcept(next);
    } catch (e) {
      await uiAlert(`Не удалось переключить период: ${e instanceof Error ? e.message : String(e)}`, 'Ошибка');
    } finally {
      setDeltaPeriodSaving(false);
    }
  };

  const saveVisibility = async (nextPlatforms, nextProfileIds) => {
    await _postJson('/api/accounts/visibility/', {
      hidden_platforms: Array.from(nextPlatforms),
      hidden_profile_ids: Array.from(nextProfileIds).map((x) => Number(x)),
    });
    setHiddenPlatforms(new Set(nextPlatforms));
    setHiddenProfileIds(new Set(nextProfileIds));
    await onDataChanged?.();
  };

  const togglePlatformHidden = async (platformId) => {
    const nextPlatforms = new Set(hiddenPlatforms);
    if (nextPlatforms.has(platformId)) nextPlatforms.delete(platformId); else nextPlatforms.add(platformId);
    await saveVisibility(nextPlatforms, hiddenProfileIds);
  };

  const toggleProfileHidden = async (profileId) => {
    const nextProfiles = new Set(hiddenProfileIds);
    if (nextProfiles.has(profileId)) nextProfiles.delete(profileId); else nextProfiles.add(profileId);
    await saveVisibility(hiddenPlatforms, nextProfiles);
  };

  const createProfile = async ({ name, color }) => {
    const profileName = String(name || '').trim();
    if (!profileName) return;
    try {
      await _postJson('/api/accounts/profiles/', { name: profileName, color: color || '#6366f1' });
      await onDataChanged?.();
      setProfileSearch('');
      await uiAlert(`Профиль "${profileName}" добавлен.`, 'Профили');
    } catch (e) {
      await uiAlert(`Не удалось добавить профиль: ${e instanceof Error ? e.message : String(e)}`, 'Ошибка');
    }
  };

  const saveProfileEditor = async ({ name, color }) => {
    const profileName = String(name || '').trim();
    if (!profileName) return;
    setProfileEditorBusy(true);
    try {
      if (profileEditor?.mode === 'edit' && profileEditor?.id != null) {
        await _patchJson(`/api/accounts/profiles/${profileEditor.id}/`, { name: profileName, color: color || '#6366f1' });
      } else {
        await createProfile({ name: profileName, color });
      }
      setProfileEditor(null);
    } finally {
      setProfileEditorBusy(false);
    }
  };

  const deleteProfile = async (profileToDelete) => {
    if (!profileToDelete?.id) return;
    const confirmed = await uiConfirm(
      `Удалить профиль "${profileToDelete.label}"?`,
      'Подтвердите удаление профиля'
    );
    if (!confirmed) return;
    try {
      await _delete(`/api/accounts/profiles/${profileToDelete.id}/`);
      await onDataChanged?.();
      if (profile === profileToDelete.id) setProfile('all');
      await uiAlert(`Профиль "${profileToDelete.label}" удален.`, 'Профили');
    } catch (e) {
      await uiAlert(`Не удалось удалить профиль: ${e instanceof Error ? e.message : String(e)}`, 'Ошибка');
    }
  };

  const handleRefreshAll = async () => {
    setBusy(true);
    try {
      await _postJson('/api/accounts/refresh_all/', {});
      await onDataChanged?.();
    } catch (e) {
      await uiAlert(`Не удалось обновить: ${e instanceof Error ? e.message : String(e)}`, 'Ошибка');
    } finally {
      setBusy(false);
    }
  };

  const { filtered, barStats } = useMemoAcc(() => {
    const rows = ACCOUNTS.filter(a =>
      (showHidden || (!a.isPlatformHidden && !a.isProfileHidden)) &&
      (platform === 'all' || a.platform === platform) &&
      (profile === 'all' || a.profile === profile) &&
      (status === 'all' || (status === 'avail' ? !a.unavailable : a.unavailable)) &&
      (!search.trim() || a.name.toLowerCase().includes(search.toLowerCase()) || a.handle.toLowerCase().includes(search.toLowerCase()))
    );
    const barStats = _aggregateBarStatsFromAccountRows(rows);
    const getter = (a) => {
      if (sortKey === 'updated') return _toSortableNumber(a.updatedTs);
      if (sortByDelta) {
        if (sortKey === 'followers') return _toSortableNumber(a.dFollowers);
        if (sortKey === 'likes') return _toSortableNumber(a.dLikes);
        if (sortKey === 'posts') return _toSortableNumber(a.dPosts);
        if (sortKey === 'clicks') return _toSortableNumber(a.dClicks);
        return _toSortableNumber(a.dViews);
      }
      if (sortKey === 'followers') return _toSortableNumber(a.followers);
      if (sortKey === 'likes') return _toSortableNumber(a.likes);
      if (sortKey === 'posts') return _toSortableNumber(a.posts);
      if (sortKey === 'clicks') return _toSortableNumber(a.clicks);
      return _toSortableNumber(a.views);
    };
    rows.sort((a, b) => {
      const diff = getter(a) - getter(b);
      return sortOrder === 'asc' ? diff : -diff;
    });
    return { filtered: rows, barStats };
  }, [platform, profile, status, search, showHidden, sortKey, sortOrder, sortByDelta, deltaUiEpoch]);

  const platformFilterOptions = useMemoAcc(() => {
    const fromAll = (ALL_PLATFORMS || []).map((p) => ({
      id: p.id,
      label: p.label,
      color: p.color,
      hidden: hiddenPlatforms.has(String(p.id)),
    }));
    if (fromAll.length > 0) {
      return showHidden ? fromAll : fromAll.filter((p) => !p.hidden);
    }
    const fallback = (PLATFORMS || []).map((p) => ({
      id: p.id,
      label: p.label,
      color: p.color,
      hidden: hiddenPlatforms.has(String(p.id)),
    }));
    return showHidden ? fallback : fallback.filter((p) => !p.hidden);
  }, [showHidden, hiddenPlatforms]);

  const profileFilterOptions = useMemoAcc(() => {
    const rows = (PROFILES || []).filter((p) => p.id !== 'none');
    const visible = showHidden
      ? rows
      : rows.filter((p) => !hiddenProfileIds.has(String(p.id)));
    return visible.map((p) => ({
      id: String(p.id),
      label: p.label,
      color: p.color,
      accounts: Number(p.accounts || 0),
    }));
  }, [showHidden, hiddenProfileIds]);

  const handleMetricSort = (key) => {
    if (sortKey === key) {
      setSortOrder((prev) => (prev === 'desc' ? 'asc' : 'desc'));
    } else {
      setSortKey(key);
      setSortOrder('desc');
    }
  };

  return (
    <div style={_pageShellStyle()} data-screen-label="Accounts List">
      <TopBar
        accent={accent}
        barStats={barStats}
        onRefreshAll={() => onOpenGlobalModal?.('refresh_all')}
        onOpenSchedule={() => onOpenGlobalModal?.('schedule')}
        onOpenAddList={() => onOpenGlobalModal?.('add_list')}
        onOpenAddOne={() => onOpenGlobalModal?.('add_one')}
        busy={busy}
        deltaPeriodDays={ACCOUNT_DELTA_PERIOD_DAYS}
        onDeltaPeriodCycle={cycleAccountDeltaPeriod}
        deltaPeriodBusy={deltaPeriodSaving}
      />
      <div style={{ flex: 1, display: 'grid', gridTemplateColumns: isMobile ? '1fr' : '280px 1fr', gap: 0 }}>
        <Sidebar
          profile={profile}
          setProfile={setProfile}
          tab={tab}
          setTab={setTabAndNavigate}
          accent={accent}
          profileSearch={profileSearch}
          setProfileSearch={setProfileSearch}
          hiddenProfileIds={hiddenProfileIds}
          onToggleProfileHidden={toggleProfileHidden}
          showHidden={showHidden}
          onCreateProfile={() => setProfileEditor({ mode: 'create', name: '', color: '#6366f1' })}
          onEditProfile={(profileToEdit) => setProfileEditor({
            mode: 'edit',
            id: profileToEdit.id,
            name: profileToEdit.label || '',
            color: profileToEdit.color || '#6366f1',
          })}
          onDeleteProfile={deleteProfile}
          stackOrder={isMobile ? 2 : 0}
        />
        <main style={{
          padding: _isEmbedMode()
            ? (isMobile ? '14px 12px 64px' : '20px 20px 64px')
            : (isMobile ? '14px 12px 104px' : '28px 36px 60px'),
          minWidth: 0,
          order: isMobile ? 1 : 0,
          flex: _isEmbedMode() ? 1 : undefined,
          minHeight: _isEmbedMode() ? 0 : undefined,
          overflow: _isEmbedMode() ? 'auto' : undefined,
        }}>
          <FilterBar
            platform={platform}
            setPlatform={setPlatform}
            profile={profile}
            setProfile={setProfile}
            profileOptions={profileFilterOptions}
            status={status}
            setStatus={setStatus}
            accent={accent}
            search={search}
            setSearch={setSearch}
            onReset={resetFilters}
            showHidden={showHidden}
            setShowHidden={setShowHidden}
          hiddenPlatforms={hiddenPlatforms}
          onTogglePlatformHidden={togglePlatformHidden}
            platformOptions={platformFilterOptions}
            sortKey={sortKey}
            sortOrder={sortOrder}
            onMetricSort={isMobile ? handleMetricSort : undefined}
            sortByDelta={sortByDelta}
            onToggleSortByDelta={() => setSortByDelta((v) => !v)}
          />
          {LOAD_STATE.hasError && (
            <div style={{ marginBottom: 14, padding: '10px 12px', borderRadius: 10, border: '1px solid #ef444455', background: '#ef444415', color: '#fca5a5', fontSize: 13 }}>
              {LOAD_STATE.errorMessage}
            </div>
          )}
          {filtered.length === 0 ? (
            <div style={{ borderRadius: 14, border: '1px solid var(--line)', background: 'rgba(255,255,255,0.015)', padding: 28, color: 'var(--ink-mute)' }}>
              Ничего не найдено по текущим фильтрам.
            </div>
          ) : ((isMobile ? 'cards' : view) === 'table'
            ? <AccountsTable rows={filtered} accent={accent} sortKey={sortKey} sortOrder={sortOrder} setSortKey={setSortKey} setSortOrder={setSortOrder} sortByDelta={sortByDelta} setSortByDelta={setSortByDelta} onOpenAccount={onOpenAccount} onRefreshOne={async (id) => {
                setRowBusyId(id);
                try {
                  await _postJson(`/api/accounts/${id}/refresh/`, {});
                  await onDataChanged?.();
                } catch (e) {
                  await uiAlert(`Не удалось обновить аккаунт: ${e instanceof Error ? e.message : String(e)}`, 'Ошибка');
                } finally {
                  setRowBusyId(null);
                }
              }} onDeleteOne={async (id) => {
                if (!(await uiConfirm('Удалить аккаунт?', 'Подтвердите удаление'))) return;
                setRowBusyId(id);
                try {
                  await _delete(`/api/accounts/${id}/`);
                  await onDataChanged?.();
                } catch (e) {
                  await uiAlert(`Не удалось удалить аккаунт: ${e instanceof Error ? e.message : String(e)}`, 'Ошибка');
                } finally {
                  setRowBusyId(null);
                }
              }} rowBusyId={rowBusyId} />
            : <AccountsCards rows={filtered} accent={accent} onOpenAccount={onOpenAccount} onRefreshOne={async (id) => {
                setRowBusyId(id);
                try {
                  await _postJson(`/api/accounts/${id}/refresh/`, {});
                  await onDataChanged?.();
                } catch (e) {
                  await uiAlert(`Не удалось обновить аккаунт: ${e instanceof Error ? e.message : String(e)}`, 'Ошибка');
                } finally {
                  setRowBusyId(null);
                }
              }} onDeleteOne={async (id) => {
                if (!(await uiConfirm('Удалить аккаунт?', 'Подтвердите удаление'))) return;
                setRowBusyId(id);
                try {
                  await _delete(`/api/accounts/${id}/`);
                  await onDataChanged?.();
                } catch (e) {
                  await uiAlert(`Не удалось удалить аккаунт: ${e instanceof Error ? e.message : String(e)}`, 'Ошибка');
                } finally {
                  setRowBusyId(null);
                }
              }} rowBusyId={rowBusyId} />)}
        </main>
      </div>
      {profileEditor && (
        <ProfileEditorModal
          accent={accent}
          mode={profileEditor.mode}
          initialName={profileEditor.name}
          initialColor={profileEditor.color}
          busy={profileEditorBusy}
          onSubmit={saveProfileEditor}
          onClose={() => { if (!profileEditorBusy) setProfileEditor(null); }}
        />
      )}
    </div>
  );
}

function _topBarStatsFromTotal() {
  return {
    followers: { value: TOTAL.followers.value, delta: TOTAL.followers.delta },
    views: { value: TOTAL.views.value, delta: TOTAL.views.delta },
    likes: { value: TOTAL.likes.value, delta: TOTAL.likes.delta },
    posts: { value: TOTAL.posts.value, delta: TOTAL.posts.delta },
    clicks: { value: TOTAL.clicks.value, delta: TOTAL.clicks.delta },
  };
}

/** Суммы по списку аккаунтов (как на старом фронте) — для шапки при активных фильтрах. */
function _aggregateBarStatsFromAccountRows(rows) {
  const z = { value: 0, delta: 0 };
  const out = { followers: { ...z }, views: { ...z }, likes: { ...z }, posts: { ...z }, clicks: { ...z }, count: 0 };
  if (!Array.isArray(rows) || rows.length === 0) return out;
  out.count = rows.length;
  for (const a of rows) {
    out.followers.value += Number(a.followers || 0);
    out.views.value += Number(a.views || 0);
    out.likes.value += Number(a.likes || 0);
    out.posts.value += Number(a.posts || 0);
    out.clicks.value += Number(a.clicks || 0);
    out.followers.delta += Number(a.dFollowers ?? 0);
    out.views.delta += Number(a.dViews ?? 0);
    out.likes.delta += Number(a.dLikes ?? 0);
    out.posts.delta += Number(a.dPosts ?? 0);
    out.clicks.delta += Number(a.dClicks ?? 0);
  }
  return out;
}

      <div style={{

        <div style={{
          display: 'grid',
          gridTemplateColumns: isMobile ? 'repeat(4, minmax(0, 1fr))' : 'repeat(4, auto)',

          <Btn onClick={onRefreshAll} style={isMobile ? { width: '100%', justifyContent: 'center' } : undefined}>{isMobile ? '↻' : (busy ? 'Обновление...' : '↻ Обновить всё')}</Btn>
          <Btn accent={accent} onClick={onOpenSchedule} style={isMobile ? { width: '100%', justifyContent: 'center' } : undefined}>{isMobile ? '⏱' : <><span style={{ width: 8, height: 8, borderRadius: 999, background: '#4ade80', display: 'inline-block', marginRight: 6, boxShadow: '0 0 8px #4ade80' }} />Автообновление</>}</Btn>
          <Btn onClick={onOpenAddList} style={isMobile ? { width: '100%', justifyContent: 'center' } : undefined}>{isMobile ? '≡' : '+ Список'}</Btn>
          <Btn onClick={onOpenAddOne} style={isMobile ? { width: '100%', justifyContent: 'center' } : undefined}>{isMobile ? '+' : '+ Добавить'}</Btn>

    </header>
  );

function Sidebar({ profile, setProfile, tab, setTab, accent, profileSearch, setProfileSearch, hiddenProfileIds, onToggleProfileHidden, showHidden, onCreateProfile, onEditProfile, onDeleteProfile, stackOrder = 0 }) {
  const isMobile = useIsMobile(980);
  const matchedProfiles = PROFILES.filter((p) => {
    const matches = p.id === 'none' || p.label.toLowerCase().includes(profileSearch.toLowerCase());
    if (!matches) return false;
    return true;
  });
  const visibleProfiles = matchedProfiles.filter((p) => {
    if (p.id === 'none') return true;
    return !hiddenProfileIds?.has(String(p.id));
  });
  const hiddenProfiles = matchedProfiles.filter((p) => p.id !== 'none' && hiddenProfileIds?.has(String(p.id)));
  const totalProfileAccounts = PROFILES.reduce((sum, p) => sum + Number(p.accounts || 0), 0);
  return (
    <aside style={{
      order: stackOrder,
      borderRight: isMobile ? 'none' : '1px solid var(--line)',
      borderBottom: isMobile ? '1px solid var(--line)' : 'none',
      padding: isMobile ? '12px' : '24px 20px',
      position: isMobile ? 'static' : 'sticky',
      top: isMobile ? 'auto' : 80,
      height: isMobile ? 'auto' : 'calc(100vh - 80px)',
      maxHeight: isMobile ? 'none' : 'calc(100vh - 80px)',
      overflowY: isMobile ? 'visible' : 'auto',
    }}>
      <div style={{ display: 'flex', gap: 4, padding: 4, background: 'rgba(255,255,255,0.025)', borderRadius: 12, border: '1px solid var(--line)' }}>
        {[{ id: 'accounts', label: 'Аккаунты' }, { id: 'analytics', label: 'Аналитика' }].map(t => (
          <button key={t.id} onClick={() => setTab(t.id)} style={{
            flex: 1, padding: '8px 12px', borderRadius: 9, border: 'none', cursor: 'pointer',
            background: tab === t.id ? '#fff' : 'transparent',
            color: tab === t.id ? '#000' : 'var(--ink-dim)',
            fontSize: 13, fontWeight: tab === t.id ? 600 : 500,
          }}>{t.label}</button>
        ))}
      </div>
      {!isMobile && (
      <div style={{ marginTop: 24 }}>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr auto', gap: 8, marginBottom: 14 }}>
          <div style={{ position: 'relative' }}>
            <input value={profileSearch} onChange={(e) => setProfileSearch(e.target.value)} placeholder="Поиск профилей" style={{
              width: '100%', padding: '10px 14px 10px 34px', borderRadius: 10,
              background: 'rgba(255,255,255,0.025)', border: '1px solid var(--line)',
              color: 'var(--ink)', fontSize: 13, fontFamily: 'inherit',
            }} />
            <span style={{ position: 'absolute', left: 12, top: '50%', transform: 'translateY(-50%)', color: 'var(--ink-mute)', fontSize: 12 }}>⌕</span>
          </div>
          <button
            onClick={() => onCreateProfile?.()}
            title="Добавить профиль"
            style={{
              width: 34,
              height: 34,
              borderRadius: 10,
              border: '1px solid var(--line)',
              background: 'rgba(255,255,255,0.06)',
              color: '#fff',
              cursor: 'pointer',
              fontSize: 20,
              lineHeight: '30px',
              padding: 0,
            }}
          >
            +
          </button>
        </div>
        <SidebarItem active={profile === 'all'} onClick={() => setProfile('all')} label="Все профили" count={totalProfileAccounts} dot="ring" accent={accent} />
        <SidebarItem active={profile === 'none'} onClick={() => setProfile('none')} label="Без профиля" count={PROFILE_META.none?.accounts || 0} dim />
        <div style={{ height: 1, background: 'var(--line)', margin: '14px 0' }} />
        {visibleProfiles.filter((p) => p.id !== 'none').map(p => (
          <SidebarItem
            key={p.id}
            active={profile === p.id}
            onClick={() => setProfile(p.id)}
            label={p.label}
            count={p.accounts}
            color={p.color}
            hidden={hiddenProfileIds?.has(String(p.id))}
            onToggleHidden={() => onToggleProfileHidden?.(String(p.id))}
            onEdit={() => onEditProfile?.(p)}
            onDelete={() => onDeleteProfile?.(p)}
          />
        ))}
        {hiddenProfiles.length > 0 && showHidden && (
          <>
            <div style={{ height: 1, background: 'var(--line)', margin: '14px 0' }} />
            <div className="mono" style={{ fontSize: 10, color: '#86efac', letterSpacing: '0.16em', marginBottom: 8 }}>
              СКРЫТЫЕ ПРОФИЛИ
            </div>
            {hiddenProfiles.map((p) => (
              <SidebarItem
                key={`hidden-${p.id}`}
                active={profile === p.id}
                onClick={() => setProfile(p.id)}
                label={p.label}
                count={p.accounts}
                color={p.color}
                hidden
                onToggleHidden={() => onToggleProfileHidden?.(String(p.id))}
                onEdit={() => onEditProfile?.(p)}
                onDelete={() => onDeleteProfile?.(p)}
              />
            ))}
          </>
        )}
      </div>
      )}
    </aside>
  );
}

function SidebarItem({ active, onClick, label, count, color, dot, dim, accent, hidden, onToggleHidden, onEdit, onDelete }) {
  const isMobile = useIsMobile(980);
  const hasActions = !!(onToggleHidden || onEdit || onDelete);
  const [menuOpen, setMenuOpen] = React.useState(false);
  const [hovered, setHovered] = React.useState(false);
  const menuRef = React.useRef(null);
  const showMoreButton = isMobile || hovered || menuOpen;

  React.useEffect(() => {
    if (!menuOpen) return undefined;
    const onDocMouseDown = (e) => {
      if (menuRef.current && !menuRef.current.contains(e.target)) {
        setMenuOpen(false);
      }
    };
    document.addEventListener('mousedown', onDocMouseDown);
    return () => document.removeEventListener('mousedown', onDocMouseDown);
  }, [menuOpen]);

  return (
    <div
      onClick={onClick}
      onMouseEnter={() => setHovered(true)}
      onMouseLeave={() => setHovered(false)}
      style={{
      position: 'relative',
      display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 10,
      padding: '10px 12px', borderRadius: 10, cursor: 'pointer',
      background: active ? 'rgba(255,255,255,0.04)' : 'transparent',
      border: `1px solid ${active ? 'var(--line-2)' : 'transparent'}`,
      marginBottom: 2,
    }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
        {color
          ? <span style={{ width: 22, height: 22, borderRadius: 999, background: `${color}26`, color, fontSize: 11, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', fontWeight: 700 }}>{label.charAt(0)}</span>
          : <span style={{ width: 22, height: 22, borderRadius: 999, border: `1.5px solid ${active ? 'var(--ink-dim)' : 'var(--line-2)'}`, opacity: dim ? 0.4 : 1 }} />
        }
        <span style={{ fontSize: 14, color: dim ? 'var(--ink-mute)' : 'var(--ink)' }}>{label}</span>
      </div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginLeft: 'auto' }}>
        {hasActions && (
          <div ref={menuRef} style={{ position: 'relative', display: 'inline-flex', alignItems: 'center' }}>
            <button
              onClick={(e) => { e.stopPropagation(); setMenuOpen((v) => !v); }}
              title="Действия с профилем"
              style={{
                width: 22,
                height: 22,
                borderRadius: 7,
                border: '1px solid var(--line)',
                background: menuOpen ? 'rgba(255,255,255,0.10)' : 'rgba(255,255,255,0.03)',
                color: '#cbd5e1',
                cursor: 'pointer',
                display: 'inline-flex',
                alignItems: 'center',
                justifyContent: 'center',
                padding: 0,
                fontSize: 14,
                lineHeight: 1,
                opacity: showMoreButton ? 1 : 0,
                pointerEvents: showMoreButton ? 'auto' : 'none',
                transition: 'opacity .14s ease',
              }}
            >
              ⋯
            </button>
            {menuOpen && (
              <div
                onClick={(e) => e.stopPropagation()}
                style={{
                  position: 'absolute',
                  top: 'calc(100% + 6px)',
                  right: 0,
                  minWidth: 152,
                  borderRadius: 10,
                  border: '1px solid var(--line-2)',
                  background: 'rgba(18,20,28,0.96)',
                  backdropFilter: 'blur(10px)',
                  boxShadow: '0 10px 28px rgba(0,0,0,0.45)',
                  padding: 6,
                  zIndex: 30,
                }}
              >
                {onEdit && (
                  <button
                    onClick={(e) => { e.stopPropagation(); setMenuOpen(false); onEdit?.(); }}
                    style={{
                      width: '100%',
                      border: 'none',
                      background: 'transparent',
                      color: 'var(--ink)',
                      cursor: 'pointer',
                      textAlign: 'left',
                      fontSize: 12,
                      padding: '8px 10px',
                      borderRadius: 8,
                      fontFamily: 'inherit',
                    }}
                  >
                    ✎ Редактировать
                  </button>
                )}
                {onToggleHidden && (
                  <button
                    onClick={(e) => { e.stopPropagation(); setMenuOpen(false); onToggleHidden?.(); }}
                    style={{
                      width: '100%',
                      border: 'none',
                      background: 'transparent',
                      color: hidden ? '#86efac' : 'var(--ink)',
                      cursor: 'pointer',
                      textAlign: 'left',
                      fontSize: 12,
                      padding: '8px 10px',
                      borderRadius: 8,
                      fontFamily: 'inherit',
                    }}
                  >
                    {hidden ? '◉ Показать профиль' : '◉ Скрыть профиль'}
                  </button>
                )}
                {onDelete && (
                  <button
                    onClick={(e) => { e.stopPropagation(); setMenuOpen(false); onDelete?.(); }}
                    style={{
                      width: '100%',
                      border: 'none',
                      background: 'transparent',
                      color: '#fca5a5',
                      cursor: 'pointer',
                      textAlign: 'left',
                      fontSize: 12,
                      padding: '8px 10px',
                      borderRadius: 8,
                      fontFamily: 'inherit',
                    }}
                  >
                    ✕ Удалить
                  </button>
                )}
              </div>
            )}
          </div>
        )}
        <span className="mono tnum" style={{ fontSize: 12, color: 'var(--ink-mute)', minWidth: 20, textAlign: 'right', lineHeight: '18px' }}>{count}</span>
      </div>
    </div>
  );
}

function FilterBar({
  platform, setPlatform, profile, setProfile, profileOptions,

  sortKey, sortOrder, onMetricSort, sortByDelta, onToggleSortByDelta,
}) {
  const isMobile = useIsMobile(980);
  const activeProfileMeta = profile === 'all'
    ? null
    : profile === 'none'
      ? { label: 'Без профиля', color: '#525a70' }
      : (profileOptions || []).find((p) => p.id === profile)
        || PROFILE_META[profile]
        || null;
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 14, marginBottom: 20 }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap' }}>

            width: '100%', padding: '12px 16px 12px 40px', borderRadius: 12,
            background: 'rgba(255,255,255,0.025)', border: '1px solid var(--line)',

          }} />

        </div>
        <Pill active={platform === 'all'} onClick={() => setPlatform('all')}>{isMobile ? 'Все' : 'Все'}</Pill>
        <button
          onClick={() => setShowHidden(!showHidden)}
          title={showHidden ? 'Скрыть скрытые аккаунты/платформы/профили' : 'Показать скрытые аккаунты/платформы/профили'}
          style={{
            width: 30,
            height: 30,
            borderRadius: 999,
            border: '1px solid ' + (showHidden ? 'rgba(34,197,94,0.5)' : 'var(--line)'),
            background: showHidden ? 'rgba(34,197,94,0.16)' : 'rgba(255,255,255,0.03)',
            color: showHidden ? '#86efac' : '#9ca3af',
            cursor: 'pointer',
            fontSize: 13,
            display: 'inline-flex',
            alignItems: 'center',
            justifyContent: 'center',
            padding: 0,
          }}
        >
          <EyeIcon size={13} color={showHidden ? '#86efac' : '#9ca3af'} />
        </button>
        {(platformOptions || []).map(p => (
          <div key={p.id} style={{ position: 'relative', display: 'inline-flex', alignItems: 'center' }}>
            <Pill active={platform === p.id} onClick={() => setPlatform(p.id)} dot={isMobile ? undefined : p.color}>
              {isMobile ? <PlatformGlyph id={p.id} size={14} /> : p.label}
            </Pill>
            <button
              onClick={() => onTogglePlatformHidden?.(p.id)}
              title={(hiddenPlatforms?.has(p.id) ? 'Показать платформу' : 'Скрыть платформу')}
              style={{
                position: 'absolute',
                top: -6,
                right: -6,
                width: 18,
                height: 18,
                borderRadius: 999,
                border: `1px solid ${hiddenPlatforms?.has(p.id) ? 'rgba(34,197,94,0.45)' : 'var(--line)'}`,
                background: hiddenPlatforms?.has(p.id) ? 'rgba(34,197,94,0.16)' : 'rgba(255,255,255,0.03)',
                color: hiddenPlatforms?.has(p.id) ? '#86efac' : '#cbd5e1',
                cursor: 'pointer',
                fontSize: 9,
                lineHeight: '16px',
                padding: 0,
                display: 'inline-flex',
                alignItems: 'center',
                justifyContent: 'center',
              }}
            >
              <EyeIcon size={10} color={hiddenPlatforms?.has(p.id) ? '#86efac' : '#cbd5e1'} />
            </button>
          </div>
        ))}
      </div>
      {isMobile && typeof setProfile === 'function' && (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
          <div className="mono" style={{ fontSize: 10, color: 'var(--ink-mute)', letterSpacing: '0.16em', textTransform: 'uppercase' }}>
            Профиль
            {activeProfileMeta?.label ? (
              <span style={{ marginLeft: 8, color: accent, letterSpacing: '0.06em', textTransform: 'none' }}>
                · {activeProfileMeta.label}
              </span>
            ) : null}
          </div>
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8, alignItems: 'center' }}>
            <Pill active={profile === 'all'} onClick={() => setProfile('all')} title="Все профили">Все</Pill>
            <Pill active={profile === 'none'} onClick={() => setProfile('none')} title="Без профиля">Без проф.</Pill>
            {(profileOptions || []).map((p) => (
              <Pill
                key={p.id}
                active={profile === p.id}
                onClick={() => setProfile(p.id)}
                dot={p.color}
                title={`${p.label} (${p.accounts})`}
                style={{ maxWidth: 'min(100%, 168px)' }}
              >
                <span style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{p.label}</span>
              </Pill>
            ))}
          </div>
        </div>
      )}
      <div style={isMobile && typeof onMetricSort === 'function' ? { display: 'flex', flexDirection: 'column', gap: 14 } : undefined}>
        {isMobile && typeof onMetricSort === 'function' && (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8, order: 2 }}>
            <div className="mono" style={{ fontSize: 10, color: 'var(--ink-mute)', letterSpacing: '0.16em', textTransform: 'uppercase' }}>
              Сортировка по показателю
            </div>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8, alignItems: 'center' }}>
              <button
                type="button"
                onClick={() => onToggleSortByDelta?.()}
                title={sortByDelta ? 'Сортировка по приросту включена. Нажмите — по абсолютным значениям.' : 'Сортировать по приросту выбранного показателя (дельта)'}
                aria-pressed={sortByDelta ? 'true' : 'false'}
                aria-label={sortByDelta ? 'Выключить сортировку по приросту' : 'Включить сортировку по приросту'}
                style={{
                  width: 32,
                  height: 32,
                  borderRadius: 8,
                  border: '1px solid ' + (sortByDelta ? accent : 'var(--line)'),
                  background: sortByDelta ? `${accent}22` : 'rgba(255,255,255,0.03)',
                  color: sortByDelta ? accent : 'var(--ink-mute)',
                  cursor: 'pointer',
                  display: 'inline-flex',
                  alignItems: 'center',
                  justifyContent: 'center',
                  padding: 0,
                  flexShrink: 0,
                }}
              >
                <DeltaGrowthIcon size={15} color={sortByDelta ? accent : 'var(--ink-mute)'} />
              </button>
              {[
                { key: 'followers', short: 'Подп', title: 'Подписчики' },
                { key: 'views', short: 'Просм', title: 'Просмотры' },
                { key: 'likes', short: 'Лайки', title: 'Лайки' },
                { key: 'posts', short: 'Публ', title: 'Публикации' },
                { key: 'clicks', short: 'Пер', title: 'Переходы' },
                { key: 'updated', short: 'Обн', title: 'Обновлён' },
              ].map(({ key, short, title }) => {
                const active = sortKey === key;
                const mark = active ? (sortOrder === 'desc' ? ' ↓' : ' ↑') : '';
                const hint = active ? (sortOrder === 'desc' ? `${title} — от большего к меньшему` : `${title} — от меньшего к большему`) : title;
                return (
                  <Pill key={key} active={active} onClick={() => onMetricSort(key)} title={hint}>
                    {short}{mark}
                  </Pill>
                );
              })}
            </div>
          </div>
        )}
        <div style={{
          display: 'flex',
          alignItems: 'center',
          gap: 10,
          flexWrap: 'wrap',
          ...(isMobile && typeof onMetricSort === 'function' ? { order: 1 } : {}),
        }}
        >
          <Pill active={false} onClick={onReset}>{isMobile ? '↻' : '↺ Сбросить фильтры'}</Pill>
          <Pill active={status === 'all'} onClick={() => setStatus('all')}>{isMobile ? 'Все ст.' : 'Все статусы'}</Pill>
          <Pill active={status === 'avail'} onClick={() => setStatus('avail')}>{isMobile ? 'Дост.' : 'Доступные'}</Pill>
          <Pill active={status === 'unavail'} onClick={() => setStatus('unavail')}>{isMobile ? 'Недост.' : 'Недоступные'}</Pill>
        </div>
      </div>
    </div>
  );
}

function Pill({ active, onClick, children, dot, title, style: styleProp }) {
  const isMobile = useIsMobile(980);
  return (
    <button type="button" title={title} onClick={onClick} style={{
      minHeight: isMobile ? 40 : undefined,
      padding: isMobile ? '8px 12px' : '8px 14px', borderRadius: 999, cursor: 'pointer',
      background: active ? '#fff' : 'rgba(255,255,255,0.025)',
      color: active ? '#000' : 'var(--ink-dim)',
      border: '1px solid ' + (active ? '#fff' : 'var(--line)'),
      fontSize: isMobile ? 12 : 13, fontWeight: active ? 600 : 500,
      display: 'inline-flex', alignItems: 'center', gap: 6,
      ...styleProp,
    }}>
      {dot && <span style={{ width: 6, height: 6, borderRadius: 999, background: dot }} />}
      {children}
    </button>
  );
}

function AccountsTable({ rows, accent, sortKey, sortOrder, setSortKey, setSortOrder, sortByDelta, setSortByDelta, onOpenAccount, onRefreshOne, onDeleteOne, rowBusyId }) {
  const onSort = (key) => {
    if (sortKey === key) {
      setSortOrder((prev) => (prev === 'desc' ? 'asc' : 'desc'));
    } else {
      setSortKey(key);
      setSortOrder('desc');
    }
  };
  const sortMark = (key) => (sortKey === key ? (sortOrder === 'desc' ? ' ↓' : ' ↑') : '');
  const metricBtn = (key, label, { showDelta = true } = {}) => (
    <button
      type="button"
      key={key}
      onClick={() => onSort(key)}
      style={{
        textAlign: 'right',
        border: 'none',
        background: 'transparent',
        color: sortKey === key ? accent : 'var(--ink-mute)',
        cursor: 'pointer',
        font: 'inherit',
        letterSpacing: '0.18em',
        textTransform: 'uppercase',
        whiteSpace: 'nowrap',
        maxWidth: '100%',
      }}
    >
      {label}{sortByDelta && showDelta ? ' Δ' : ''}{sortMark(key)}
    </button>
  );
  return (
    <div style={{ borderRadius: 14, border: '1px solid var(--line)', background: 'rgba(255,255,255,0.015)', overflow: 'hidden' }}>
      <div style={{
        display: 'grid', gridTemplateColumns: '2fr 1fr 1fr 0.8fr 1fr 0.8fr 0.8fr 0.8fr 1.1fr 1.2fr',
        padding: '10px 20px', gap: 16, borderBottom: '1px solid var(--line)',
        fontSize: 11, color: 'var(--ink-mute)', letterSpacing: '0.18em', textTransform: 'uppercase',
        fontFamily: 'JetBrains Mono, monospace',
        alignItems: 'center',
      }}>
        <div style={{ display: 'flex', alignItems: 'center', minWidth: 0 }}>
          <span>Аккаунт</span>
        </div>
        <div>Платформа</div>
        <div>Профиль</div>
        {metricBtn('followers', 'Подписчики')}
        {metricBtn('views', 'Просмотры')}
        {metricBtn('likes', 'Лайки')}
        {metricBtn('posts', 'Публ.')}
        {metricBtn('clicks', 'Переходы')}
        <div style={{ textAlign: 'right' }}>
          {metricBtn('updated', 'Обновлён', { showDelta: false })}
        </div>
        <div style={{ display: 'flex', flexDirection: 'row', alignItems: 'center', justifyContent: 'flex-end', gap: 8, minWidth: 0 }}>
          <span style={{ letterSpacing: '0.18em', textTransform: 'uppercase', fontSize: 11, color: 'var(--ink-mute)', fontFamily: 'JetBrains Mono, monospace', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>
            Действия
          </span>
          <button
            type="button"
            onClick={() => setSortByDelta((v) => !v)}
            title={sortByDelta ? 'Сортировка по приросту включена. Нажмите — по абсолютным значениям.' : 'Сортировать по приросту выбранного показателя (дельта за период снимков)'}
            aria-pressed={sortByDelta ? 'true' : 'false'}
            aria-label={sortByDelta ? 'Выключить сортировку по приросту' : 'Включить сортировку по приросту'}
            style={{
              flexShrink: 0,
              width: 26,
              height: 26,
              borderRadius: 6,
              border: '1px solid ' + (sortByDelta ? accent : 'var(--line)'),
              background: sortByDelta ? `${accent}22` : 'rgba(255,255,255,0.03)',
              color: sortByDelta ? accent : 'var(--ink-mute)',
              cursor: 'pointer',
              display: 'inline-flex',
              alignItems: 'center',
              justifyContent: 'center',
              padding: 0,
            }}
          >
            <DeltaGrowthIcon size={13} color={sortByDelta ? accent : 'var(--ink-mute)'} />
          </button>
        </div>
      </div>
      {rows.map((a, i) => (
        <AccountRow key={a.id || `${a.platform}:${a.username || a.handle}`} a={a} i={i} onOpenAccount={onOpenAccount} onRefreshOne={onRefreshOne} onDeleteOne={onDeleteOne} rowBusyId={rowBusyId} />
      ))}
    </div>
  );
}

function AccountRow({ a, i, onOpenAccount, onRefreshOne, onDeleteOne, rowBusyId }) {

const { useState: useStateDetail, useEffect: useEffectDetail } = React;

function AccountDetailScreen({ accountId, onBack, onDataChanged }) {
  const isMobile = useIsMobile(980);
  const [loading, setLoading] = useStateDetail(true);
  const [account, setAccount] = useStateDetail(null);
  const [posts, setPosts] = useStateDetail([]);
  const [tab, setTab] = useStateDetail('posts');
  const [busy, setBusy] = useStateDetail(false);
  const [softLoading, setSoftLoading] = useStateDetail(false);
  const [analyticsPosts, setAnalyticsPosts] = useStateDetail([]);
  const [postThumbState, setPostThumbState] = useStateDetail({});
  const [postMissingModal, setPostMissingModal] = useStateDetail(null);
  const [postDeleteBusy, setPostDeleteBusy] = useStateDetail(false);

  const load = async ({ silent = false } = {}) => {
    if (silent) setSoftLoading(true);
    else setLoading(true);
    try {
      const [a, p] = await Promise.all([
        _fetchJson(`/api/accounts/${accountId}/`),
        _fetchJson(`/api/accounts/${accountId}/posts/`),
      ]);
      setAccount(a);
      const postList = Array.isArray(p) ? p : [];
      setPosts(postList);
      setPostMissingModal((prev) => {
        if (!prev) return null;
        const updated = postList.find((x) => x.id === prev.id);
        return updated && _postScrapeNotFound(updated) ? prev : null;
      });
    } catch (e) {
      await uiAlert(`Не удалось загрузить аккаунт: ${e instanceof Error ? e.message : String(e)}`, 'Ошибка');
    } finally {
      if (silent) setSoftLoading(false);
      else setLoading(false);
    }
  };

  useEffectDetail(() => { void load(); }, [accountId]);

  const deleteMissingPost = async (post) => {
    if (!post?.id) return;
    if (!(await uiConfirm('Удалить публикацию из дашборда? Действие необратимо.', 'Подтверждение'))) return;
    setPostDeleteBusy(true);
    try {
      await _deleteJson(`/api/accounts/${accountId}/posts/${post.id}/`);
      setPostMissingModal(null);
      await load({ silent: true });
      if (typeof onDataChanged === 'function') onDataChanged();
    } catch (e) {
      await uiAlert(`Не удалось удалить: ${e instanceof Error ? e.message : String(e)}`, 'Ошибка');
    } finally {
      setPostDeleteBusy(false);
    }
  };

  const openAccountOnPlatform = () => {
    if (!account) return;
    const href = _externalProfileUrl(account.platform, account.username);
    if (!href) {
      void uiAlert('Не удалось собрать ссылку на профиль.', 'Аккаунт');
      return;
    }
    window.open(href, '_blank', 'noopener,noreferrer');
  };

  useEffectDetail(() => {
    let cancelled = false;
    (async () => {
      try {
        const res = await _fetchJson(`/api/accounts/analytics/top-posts/?period=30d&account_id=${accountId}&sort_by=view_delta&page_size=20&min_views=0`);
        if (!cancelled) setAnalyticsPosts(Array.isArray(res?.items) ? res.items : []);
      } catch {
        if (!cancelled) setAnalyticsPosts([]);
      }
    })();
    return () => { cancelled = true; };
  }, [accountId]);

  const refreshAccount = async () => {
    setBusy(true);
    try {
      await _postJson(`/api/accounts/${accountId}/refresh/`, {});
      await load({ silent: true });
      await onDataChanged?.();
    } finally {
      setBusy(false);
    }
  };

  const deleteAccount = async () => {
    if (!(await uiConfirm('Удалить аккаунт?', 'Подтвердите удаление'))) return;
    setBusy(true);
    try {
      await _delete(`/api/accounts/${accountId}/`);
      await onDataChanged?.();
      onBack?.();
    } finally {
      setBusy(false);
    }
  };

  if (loading || !account) {
    return (
      <div style={{ minHeight: '100vh', padding: 28, color: 'var(--ink-mute)' }}>
        Загрузка аккаунта...
      </div>
    );
  }

  const profileLabel = PROFILE_META[String(account.profile_id)]?.label || account.profile_name || 'Без профиля';
  const isUnavailable = !!(account.profile_unavailable || account.unavailable);
  const unavailableReason = String(account.profile_unavailable_reason || account.unavailable_reason || '');
  const externalProfileUrl = _externalProfileUrl(account.platform, account.username);
  return (
    <div style={{ minHeight: '100vh', padding: isMobile ? '14px 12px 28px' : '28px 36px 80px' }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 18 }}>
        <button onClick={onBack} style={{ border: 'none', background: 'transparent', color: 'var(--ink-dim)', cursor: 'pointer', fontSize: 14 }}>← Аккаунты</button>
        <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
          {(busy || softLoading) && (
            <span className="mono" style={{ fontSize: 11, color: 'var(--ink-mute)', letterSpacing: '0.08em' }}>ОБНОВЛЕНИЕ...</span>
          )}
          <button onClick={refreshAccount} disabled={busy} style={{ padding: '8px 14px', borderRadius: 10, border: '1px solid var(--line)', background: 'rgba(255,255,255,0.04)', color: 'var(--ink)', cursor: 'pointer', opacity: busy ? 0.7 : 1 }}>
            {busy ? '↻ Обновление...' : '↻ Обновить'}
          </button>
          <button onClick={deleteAccount} disabled={busy} style={{ padding: '8px 14px', borderRadius: 10, border: '1px solid #ef444455', background: '#ef444415', color: '#fca5a5', cursor: 'pointer' }}>✕ Удалить</button>
        </div>
      </div>

      <div style={{ display: 'flex', alignItems: 'center', gap: 14, marginBottom: 16 }}>
        <AccountAvatar
          src={_pickAvatarUrl(account)}
          name={String(account.display_name || account.username || '?')}
          size={58}
          borderColor="rgba(106,169,255,0.35)"
          fallbackBg="linear-gradient(135deg, #6aa9ff40, #ec489940)"
        />
        <div>
          <div style={{ fontSize: 28, fontWeight: 700 }}>{account.display_name || account.username}</div>
          <div className="mono" style={{ color: 'var(--ink-mute)', fontSize: 13 }}>
            {externalProfileUrl ? (
              <a
                href={externalProfileUrl}
                target="_blank"
                rel="noopener noreferrer"
                style={{ color: '#93c5fd', textDecoration: 'none', borderBottom: '1px dashed rgba(147,197,253,0.45)' }}
                title={`Открыть профиль ${account.username} на ${account.platform_label || account.platform}`}
              >
                @{account.username}
              </a>
            ) : (
              `@${account.username}`
            )} · {account.platform_label || account.platform} · {profileLabel}
          </div>
          <div style={{ marginTop: 6 }}>
            <AvailabilityBadge unavailable={isUnavailable} reason={unavailableReason} />
          </div>
          {account.bio ? <div style={{ color: 'var(--ink-dim)', fontSize: 13, marginTop: 4 }}>{account.bio}</div> : null}
        </div>
      </div>
      {isUnavailable && (
        <div style={{ marginBottom: 14, padding: '10px 12px', borderRadius: 10, border: '1px solid rgba(239,68,68,0.35)', background: 'rgba(239,68,68,0.12)', color: '#fecaca', fontSize: 13 }}>

        </div>
      )}

      <div style={{ display: 'grid', gridTemplateColumns: isMobile ? '1fr 1fr' : 'repeat(5, minmax(100px, 1fr))', gap: 10, marginBottom: 16 }}>
        {[
          ['Подписчики', Number(account.follower_count || 0), Number(account.follower_delta || 0)],
          ['Просмотры', Number(account.view_count || 0), Number(account.view_delta || 0)],
          ['Лайки', Number(account.like_count || 0), Number(account.like_delta || 0)],
          ['Публикации', Number(account.post_count || 0), Number(account.post_delta || 0)],

      </div>

      <div style={{ display: 'flex', gap: 8, marginBottom: 14 }}>
        <Pill active={tab === 'posts'} onClick={() => setTab('posts')}>Публикации ({posts.length})</Pill>
        <Pill active={tab === 'analytics'} onClick={() => setTab('analytics')}>Аналитика</Pill>
      </div>

      {tab === 'posts' ? (
        posts.length === 0 ? (
          <div style={{ color: 'var(--ink-mute)' }}>Нет публикаций.</div>
        ) : (
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(260px, 1fr))', gap: 12 }}>
            {posts.map((p, idx) => {
              const thumbKey = String(p.id || p.external_id || p.post_url || idx);
              const thumbState = postThumbState[thumbKey] || 'idle';
              const postHref = _postOpenUrl(account.platform, account.username, p.external_id, p.post_url);
              const scrapeMissing = _postScrapeNotFound(p);
              return (
              <div
                key={thumbKey}
                role={postHref ? 'link' : undefined}

                title={postHref ? 'Открыть публикацию на площадке' : undefined}

                onKeyDown={(e) => {
                  if (!postHref) return;

                    e.preventDefault();
                    _openPostInNewTab(account.platform, account.username, p.external_id, p.post_url);

                style={{

                      right: 6,

              background: 'rgba(18,20,28,0.98)',

              boxShadow: '0 24px 56px rgba(0,0,0,0.65)',

            onClick={(e) => e.stopPropagation()}

                  Публикация не найдена
                </h3>

                  При последнем обновлении этой публикации не было в ответе скрапера. Она сохранена в дашборде.
                  Откройте профиль на площадке и проверьте вручную — затем удалите запись здесь, если поста больше нет.
                </p>
                {postMissingModal.external_id ? (
                  <p className="mono" style={{ margin: '8px 0 0', fontSize: 11, color: 'var(--ink-dim)' }}>
                    ID: {String(postMissingModal.external_id)}

            <div style={{ display: 'flex', flexDirection: isMobile ? 'column' : 'row', gap: 10, justifyContent: 'flex-end' }}>
              <button
                type="button"
                disabled={postDeleteBusy}
                onClick={() => setPostMissingModal(null)}
                style={{
                  padding: '10px 14px',
                  borderRadius: 10,
                  border: '1px solid var(--line)',
                  background: 'rgba(255,255,255,0.04)',
                  color: 'var(--ink)',
                  cursor: postDeleteBusy ? 'default' : 'pointer',
                  opacity: postDeleteBusy ? 0.6 : 1,
                }}
              >
                Закрыть
              </button>
              <button
                type="button"
                disabled={postDeleteBusy}
                onClick={() => openAccountOnPlatform()}
                style={{
                  padding: '10px 14px',
                  borderRadius: 10,
                  border: '1px solid rgba(106,169,255,0.45)',
                  background: 'rgba(106,169,255,0.12)',
                  color: '#93c5fd',
                  cursor: postDeleteBusy ? 'default' : 'pointer',
                  opacity: postDeleteBusy ? 0.6 : 1,
                }}
              >
                Перейти в аккаунт
              </button>
              <button
                type="button"
                disabled={postDeleteBusy}
                onClick={() => { void deleteMissingPost(postMissingModal); }}
                style={{
                  padding: '10px 14px',
                  borderRadius: 10,
                  border: '1px solid rgba(239,68,68,0.45)',
                  background: 'rgba(239,68,68,0.15)',
                  color: '#fca5a5',
                  cursor: postDeleteBusy ? 'default' : 'pointer',
                  opacity: postDeleteBusy ? 0.6 : 1,
                }}
              >
                {postDeleteBusy ? 'Удаление…' : 'Удалить'}
              </button>
            </div>
          </div>
        </div>
      ) : null}
    </div>
  );
}

// Analytics screen — atomic-themed redesign of "Аналитика" tab.

const { useState: useStateAn, useEffect: useEffectAn } = React;

function AnalyticsScreen({ tweaks, onOpenGlobalModal, onOpenAccount }) {
  const isMobile = useIsMobile(980);
  const accent = tweaks.accent || '#6aa9ff';
  const pageSize = isMobile ? 5 : 20;
  const [period, setPeriod] = useStateAn('1d');
  const [platform, setPlatform] = useStateAn('all');
  const [scrapeFilter, setScrapeFilter] = useStateAn('active');
  const [sortBy, setSortBy] = useStateAn('view_delta');
  const [minViews, setMinViews] = useStateAn(10);
  const [hashtagSort, setHashtagSort] = useStateAn('count');
  const [topPosts, setTopPosts] = useStateAn([]);
  const [page, setPage] = useStateAn(1);
  const [pages, setPages] = useStateAn(1);
  const [totalPosts, setTotalPosts] = useStateAn(0);
  const [insights, setInsights] = useStateAn(null);
  const [loading, setLoading] = useStateAn(false);
  const [initialReady, setInitialReady] = useStateAn(false);

  useEffectAn(() => {
    let cancelled = false;
    (async () => {
      setLoading(true);
      try {
        const params = new URLSearchParams({
          period,
          sort_by: sortBy,
          page_size: String(pageSize),
          page: String(page),
          min_views: String(minViews),
        });
        if (platform !== 'all') params.set('platform', platform);
        if (scrapeFilter === 'missing') {
          params.set('scrape_filter', 'missing');
          if (minViews > 0) params.set('min_views', String(minViews));
          else params.set('min_views', '0');
        } else {
          params.set('scrape_filter', 'active');
          params.set('min_views', String(minViews));
        }
        const insightsUrl = `/api/accounts/analytics/insights/?period=${encodeURIComponent(period)}${platform !== 'all' ? `&platform=${encodeURIComponent(platform)}` : ''}&min_views=${encodeURIComponent(String(minViews))}&scrape_filter=active`;
        const [res, insightsRes] = await Promise.all([
          _fetchJson(`/api/accounts/analytics/top-posts/?${params.toString()}`),
          scrapeFilter === 'missing' ? Promise.resolve(null) : _fetchJson(insightsUrl).catch(() => null),
        ]);
        const mapped = Array.isArray(res?.items) ? res.items.map((p) => ({
          handle: p?.account?.platform === 'rumble'
            ? String(p?.account?.username || '')
            : `@${String(p?.account?.username || '')}`,
          username: String(p?.account?.username || ''),
          platform: String(p?.account?.platform || ''),
          accountId: Number(p?.account?.id || 0) || null,
          postId: Number(p?.id || 0) || null,
          date: _ruShortDate(p?.posted_at || '').slice(0, 8).replace(/\./g, '.'),
          missingSince: p?.missing_from_scrape_at ? _ruShortDate(String(p.missing_from_scrape_at)) : '',
          text: String(p?.description || ''),
          delta: Number(p?.view_delta || 0),
          views: Number(p?.view_count || 0),
          likes: Number(p?.like_count || 0),
          er: Number(p?.engagement_rate || 0),
          thumb: String(p?.thumbnail_url || ''),
          postUrl: String(p?.post_url || ''),
          externalId: String(p?.external_id || ''),
          scrapeNotFound: Boolean(p?.scrape_not_found || p?.missing_from_scrape_at),
        })) : [];
        if (!cancelled) {
          setTopPosts(mapped);
          setPages(Math.max(1, Number(res?.pages || 1)));
          setTotalPosts(Math.max(0, Number(res?.total || 0)));
          setInsights(insightsRes && typeof insightsRes === 'object' ? insightsRes : null);
          setInitialReady(true);
        }
      } catch {
        if (!cancelled) {
          setTopPosts([]);
          setPages(1);
          setTotalPosts(0);
          setInsights(null);
          setInitialReady(true);
        }
      } finally {
        if (!cancelled) setLoading(false);
      }
    })();
    return () => { cancelled = true; };
  }, [period, platform, scrapeFilter, sortBy, page, minViews, pageSize]);

  React.useEffect(() => {
    setPage(1);
  }, [period, platform, scrapeFilter, sortBy, minViews]);

  const sortOptions = [
    { id: 'view_delta', label: 'Прирост просмотров' },
    { id: 'like_delta', label: 'Прирост лайков' },
    { id: 'views', label: 'Просмотры (всего)' },
    { id: 'likes', label: 'Лайки (всего)' },
    { id: 'er', label: 'Вовлеченность (ER)' },
  ];

  const analyticsRows = topPosts;
  const safeRows = analyticsRows.length > 0 ? analyticsRows : [{ delta: 0, views: 0, er: 0 }];
  const hourRows = Array.isArray(insights?.best_hours) ? insights.best_hours : [];
  const platformRows = Array.isArray(insights?.platform_comparison) ? insights.platform_comparison : [];
  const totalDelta = platformRows.reduce((acc, r) => acc + (Number(r.avg_views || 0) * Number(r.post_count || 0)), 0);
  const totalPostsCount = platformRows.reduce((acc, r) => acc + Number(r.post_count || 0), 0);
  const avgEr = totalPostsCount > 0
    ? (platformRows.reduce((acc, r) => acc + (Number(r.avg_er || 0) * Number(r.post_count || 0)), 0) / totalPostsCount)
    : (safeRows.reduce((acc, p) => acc + Number(p.er || 0), 0) / Math.max(1, safeRows.length));
  const engagementSpark = hourRows.length > 0
    ? hourRows.map((h) => Math.max(0, Number(h.avg_views || 0)))
    : safeRows.map((p) => Math.max(0, Number(p.delta || 0))).reverse();
  const viewsSpark = hourRows.length > 0
    ? hourRows.map((h) => Math.max(0, Number(h.avg_views || 0)))
    : safeRows.map((p) => Math.max(0, Number(p.views || 0))).reverse();
  const erSpark = hourRows.length > 0
    ? hourRows.map((h) => Number(h.avg_er || 0))
    : safeRows.map((p) => Number(p.er || 0));
  const postDeltas = safeRows
    .map((p) => Math.max(0, Number(p.delta || 0)))
    .filter((v) => Number.isFinite(v));
  const viralitySpark = postDeltas.length > 0
    ? postDeltas.slice().reverse()
    : (hourRows.length > 0 ? hourRows.map((h) => Number(h.avg_views || 0)) : [0, 0]);
  const viralCount = postDeltas.filter((v) => v >= 200).length;
  const maxPostDelta = postDeltas.length > 0 ? Math.max(...postDeltas) : 0;
  let viralityLevel = 'LOW';
  if (maxPostDelta >= 1000) viralityLevel = 'VERY HIGH';
  else if (maxPostDelta >= 500) viralityLevel = 'HIGH';
  else if (maxPostDelta >= 200) viralityLevel = 'MEDIUM';
  const platformComparison = platformRows;
  const topHashtagsRaw = Array.isArray(insights?.top_hashtags) ? insights.top_hashtags : [];
  const bestHours = Array.isArray(insights?.best_hours) ? insights.best_hours : [];
  const bestWeekdays = Array.isArray(insights?.best_weekdays) ? insights.best_weekdays : [];
  const hashtagSorted = [...topHashtagsRaw].sort((a, b) => {
    const av = Number(a?.[hashtagSort] || 0);
    const bv = Number(b?.[hashtagSort] || 0);
    return bv - av;
  }).slice(0, 20);
  const maxHourViews = Math.max(1, ...bestHours.map((h) => Number(h.avg_views || 0)));
  const maxWeekdayViews = Math.max(1, ...bestWeekdays.map((d) => Number(d.avg_views || 0)));

  if (!initialReady) {
    return (
      <div style={_pageShellStyle()} data-screen-label="Analytics">
        <TopBar
          accent={accent}
          onRefreshAll={() => onOpenGlobalModal?.('refresh_all')}
          onOpenSchedule={() => onOpenGlobalModal?.('schedule')}
          onOpenAddList={() => onOpenGlobalModal?.('add_list')}
          onOpenAddOne={() => onOpenGlobalModal?.('add_one')}
        />
        <main style={_embedShellStyle(isMobile)}>
          <div style={{ display: 'grid', gridTemplateColumns: isMobile ? '1fr' : '1.6fr 1fr 1fr 1fr', gap: 12, marginBottom: 18 }}>
            {[0, 1, 2, 3].map((i) => (
              <div
                key={`an-sk-${i}`}
                style={{
                  height: isMobile && i > 0 ? 128 : 186,
                  borderRadius: 16,
                  border: '1px solid var(--line)',
                  background: 'linear-gradient(90deg, rgba(255,255,255,0.015) 0%, rgba(255,255,255,0.055) 45%, rgba(255,255,255,0.015) 100%)',
                  backgroundSize: '220% 100%',
                  animation: 'anShimmer 1.4s linear infinite',
                }}
              />
            ))}
          </div>
          <style>{`@keyframes anShimmer { 0% { background-position: 220% 0; } 100% { background-position: -220% 0; } }`}</style>
        </main>
      </div>
    );
  }

  return (
    <div style={_pageShellStyle()} data-screen-label="Analytics">
      <TopBar
        accent={accent}
        onRefreshAll={() => onOpenGlobalModal?.('refresh_all')}
        onOpenSchedule={() => onOpenGlobalModal?.('schedule')}
        onOpenAddList={() => onOpenGlobalModal?.('add_list')}
        onOpenAddOne={() => onOpenGlobalModal?.('add_one')}
      />
      <main style={_embedShellStyle(isMobile, { animation: 'anFadeIn .24s ease-out' })}>
        {/* Hero band */}
        <div style={{ display: 'grid', gridTemplateColumns: isMobile ? '1fr' : '1.6fr 1fr 1fr 1fr', gap: 12, marginBottom: 18 }}>
          <div style={{ borderRadius: 16, border: '1px solid var(--line)', background: 'rgba(255,255,255,0.015)', padding: 24, position: 'relative', overflow: 'hidden' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
              <div style={{ fontSize: 13, color: 'var(--ink-dim)', fontWeight: 500, letterSpacing: 0 }}>Вовлеченность</div>
              <div className="mono tnum" style={{ fontSize: 11, color: 'var(--ink-mute)', letterSpacing: '0.16em' }}>{period === '1d' ? '24H' : period.toUpperCase()}</div>
            </div>
            <div style={{ position: 'absolute', top: 10, right: 10 }}>
              <InfoButton
                onClick={() => uiAlert('Вовлеченность отражает суммарную динамику просмотров по реальным данным из аналитики за выбранный период.', 'Вовлеченность')}
                title="Подробнее: Вовлеченность"
                size={11}
              />
            </div>
            <div className="tnum" style={{ fontSize: isMobile ? 46 : 64, fontWeight: 700, lineHeight: 1, marginTop: 8, letterSpacing: '-0.02em' }}>{fmt(totalDelta)}</div>
            <div className="mono tnum" style={{ marginTop: 4, fontSize: 14, color: '#4ade80' }}>▲ динамика по реальным данным</div>
            <div style={{ marginTop: 12, height: 60 }}><Sparkline data={engagementSpark.length > 1 ? engagementSpark : TREND_24H} color={accent} width={isMobile ? 320 : 500} height={60} /></div>
          </div>
          {[
            {
              l: 'Топ постов',
              v: String(totalPostsCount || analyticsRows.length),
              d: `${fmt(totalDelta)} / ${period === '1d' ? '24h' : period.toUpperCase()}`,
              c: '#ec4899',
              spark: viewsSpark,
              infoTitle: 'Топ постов',
              infoText: 'График показывает тренд просмотров в блоке топ-постов за выбранный период.',
            },
            {
              l: 'Средний ER',
              v: `${avgEr.toFixed(1)}%`,
              d: `${analyticsRows.length} постов`,
              c: '#f59e0b',
              spark: erSpark,
              infoTitle: 'Средний ER',
              infoText: 'График показывает изменение среднего ER (engagement rate) за выбранный период.',
            },
            {
              l: 'Вирусность',
              v: viralityLevel,
              d: `${viralCount} поста >+200 · пик +${fmt(maxPostDelta)}`,
              c: '#4ade80',
              spark: viralitySpark,
              infoTitle: 'Вирусность',
              infoText: 'Уровень вирусности считается по реальному приросту просмотров постов (view_delta): MEDIUM от +200, HIGH от +500, VERY HIGH от +1000.',
            },
          ].map(s => (
            <div key={s.l} style={{ borderRadius: 16, border: '1px solid var(--line)', background: 'rgba(255,255,255,0.015)', padding: 20, position: 'relative' }}>
              <div style={{ position: 'absolute', top: 10, right: 10 }}>
                <InfoButton
                  onClick={() => uiAlert(String(s.infoText || ''), String(s.infoTitle || s.l))}
                  title={`Подробнее: ${s.l}`}
                  size={11}
                />
              </div>
              <div style={{ fontSize: 13, color: 'var(--ink-dim)', fontWeight: 500 }}>{s.l}</div>
              <div className="tnum" style={{ fontSize: isMobile ? 30 : 36, fontWeight: 700, marginTop: 8, letterSpacing: '-0.02em' }}>{s.v}</div>
              <div className="mono" style={{ fontSize: 12, color: s.c, marginTop: 4 }}>{s.d}</div>
              <div style={{ marginTop: 10, height: 36 }}>
                <Sparkline
                  data={Array.isArray(s.spark) && s.spark.length > 1 ? s.spark : TREND_24H.map(v => v * 0.4)}
                  color={s.c}
                  width={isMobile ? 360 : 220}
                  height={36}
                  dot={false}
                  stretch
                />
              </div>
            </div>
          ))}
        </div>

        {/* Period + platform */}
        <div style={{ display: 'flex', gap: 10, marginBottom: 18, flexWrap: 'wrap' }}>
          <div style={{ display: 'flex', gap: 6, padding: 4, borderRadius: 12, background: 'rgba(255,255,255,0.025)', border: '1px solid var(--line)' }}>
            {[['1d', 'Сутки'], ['7d', '7 дней'], ['30d', '30 дней']].map(([id, l]) => (
              <button key={id} onClick={() => setPeriod(id)} style={{
                padding: '8px 14px', borderRadius: 9, border: 'none', cursor: 'pointer',
                background: period === id ? '#fff' : 'transparent',
                color: period === id ? '#000' : 'var(--ink-dim)', fontSize: 13, fontWeight: 500,
              }}>{l}</button>
            ))}
          </div>
          <Pill active={platform === 'all'} onClick={() => setPlatform('all')}>Все</Pill>
          {PLATFORMS.map(p => (
            <Pill key={p.id} active={platform === p.id} onClick={() => setPlatform(p.id)} dot={isMobile ? undefined : p.color}>
              {isMobile ? <PlatformGlyph id={p.id} size={14} /> : p.label}
            </Pill>
          ))}
        </div>

        <div style={{ display: 'flex', gap: 8, marginBottom: 16, flexWrap: 'wrap', alignItems: 'center' }}>
          <span className="mono" style={{ fontSize: 11, color: 'var(--ink-mute)', letterSpacing: '0.12em' }}>ПОСТЫ</span>
          <Pill active={scrapeFilter === 'active'} onClick={() => setScrapeFilter('active')}>Активные в съёме</Pill>
          <Pill
            active={scrapeFilter === 'missing'}
            onClick={() => setScrapeFilter('missing')}
            style={scrapeFilter === 'missing' ? {
              borderColor: 'rgba(251,146,60,0.65)',
              background: 'rgba(251,146,60,0.22)',
              color: '#ffedd5',
            } : undefined}
          >
            <ScrapeMissingDot />
            Возможно удалённые
          </Pill>
        </div>

        <SectionHeader
          kicker={scrapeFilter === 'missing' ? 'ВОЗМОЖНО УДАЛЕНЫ' : 'TOP MOVERS'}
          title={(
            <>
              {scrapeFilter === 'missing' ? 'Посты не найдены при обновлении' : 'Топ постов'}
              <span style={{ color: 'var(--ink-mute)', fontWeight: 400, marginLeft: 8 }}>({totalPosts || topPosts.length})</span>

          )}
          right={
            <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
              {loading && <span className="mono" style={{ fontSize: 11, color: 'var(--ink-mute)' }}>Загрузка...</span>}
              <select
                value={String(minViews)}
                onChange={(e) => setMinViews(Math.max(0, Number(e.target.value || 0)))}
                title="Минимум просмотров для топа постов"
                style={{
                  minWidth: isMobile ? 140 : 160,
                  padding: '8px 10px',
                  borderRadius: 10,
                  border: '1px solid var(--line)',
                  background: 'rgba(148,163,184,0.16)',
                  color: '#ffffff',
                  fontSize: 14,
                  fontFamily: 'inherit',
                  cursor: 'pointer',
                }}
              >
                {[0, 10, 25, 50, 100, 250, 500, 1000].map((v) => (
                  <option key={v} value={String(v)} style={{ color: '#ffffff', background: '#374151' }}>
                    Мин: {v}+
                  </option>
                ))}
              </select>
              {scrapeFilter !== 'missing' ? (
                <select
                  value={sortBy}
                  onChange={(e) => setSortBy(String(e.target.value || 'view_delta'))}
                  style={{
                    minWidth: isMobile ? 180 : 240,
                    padding: '8px 10px',
                    borderRadius: 10,
                    border: '1px solid var(--line)',
                    background: 'rgba(148,163,184,0.16)',
                    color: '#ffffff',
                    fontSize: 14,
                    fontFamily: 'inherit',
                    cursor: 'pointer',
                  }}
                >
                  {sortOptions.map((o) => (

                      key={o.id}
                      value={o.id}
                      style={{ color: '#ffffff', background: '#374151' }}
                    >
                      {o.label}
                    </option>
                  ))}
                </select>
              ) : null}
            </div>
          }
        />

        {scrapeFilter === 'missing' ? (
          <p style={{ margin: '0 0 12px', fontSize: 13, color: 'rgba(251,191,36,0.92)', lineHeight: 1.45 }}>
            Посты, которые не попали в последний съём аккаунта. Сортировка — по дате пометки (новые сверху). Откройте карточку аккаунта для проверки и удаления.
          </p>
        ) : null}

        <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
          <div style={{ display: 'grid', gridTemplateColumns: isMobile ? '1fr' : '1fr 1fr', gap: 10 }}>
            {topPosts.map((p, i) => (
              <PostRow
                key={`${p.postId || p.postUrl || p.handle}-${i}`}
                p={p}
                accent={accent}
                rank={((page - 1) * pageSize) + i + 1}
                max={(topPosts[0]?.delta || 1)}
                isMobile={isMobile}
                onOpenAccount={onOpenAccount}
              />
            ))}
          </div>
        </div>
        {topPosts.length === 0 && !loading && (
          <div style={{ marginTop: 10, borderRadius: 12, border: '1px solid var(--line)', background: 'rgba(255,255,255,0.015)', padding: 14, fontSize: 13, color: 'var(--ink-mute)' }}>
            {scrapeFilter === 'missing'
              ? 'Нет постов с пометкой «не найден при обновлении» для выбранных фильтров.'
              : 'Нет данных для выбранных фильтров.'}
          </div>
        )}
        <style>{`@keyframes anFadeIn { from { opacity: 0; } to { opacity: 1; } }`}</style>
        <div style={{ display: 'flex', justifyContent: 'center', alignItems: 'center', gap: 10, marginTop: 12, marginBottom: 4 }}>
          <button
            onClick={() => setPage((v) => Math.max(1, v - 1))}
            disabled={page <= 1}
            style={{ padding: '8px 12px', borderRadius: 10, border: '1px solid var(--line)', background: 'rgba(255,255,255,0.03)', color: 'var(--ink)', cursor: page <= 1 ? 'default' : 'pointer', opacity: page <= 1 ? 0.45 : 1 }}
          >

function _authStartEndpoint(platformId) {
  return `/api/settings/${platformId}/start-auth/`;
}

function _authLogoutEndpoint(platformId) {
  return `/api/settings/${platformId}/logout/`;
}

function _authImportCookiesEndpoint(platformId) {
  const supported = new Set(['tiktok', 'instagram', 'x', 'threads', 'facebook', 'rumble', 'reddit']);
  if (!supported.has(platformId)) return null;
  return `/api/settings/${platformId}/import-cookies/`;
}

/** Ожидание фоновой задачи входа (POST …/start-auth/ → job_id). */
async function _pollAuthJob(jobId, { maxMs = 240000, intervalMs = 700 } = {}) {
  const deadline = Date.now() + maxMs;
  let lastMsg = '';
  while (Date.now() < deadline) {
    const st = await _fetchJson(`/api/settings/job/${encodeURIComponent(jobId)}/`);
    const msg = String(st?.message || '').trim();
    if (msg) lastMsg = msg;
    if (st?.status === 'done') return st;
    if (st?.status === 'error') {
      throw new Error(msg || 'Ошибка авторизации');
    }
    await new Promise((r) => setTimeout(r, intervalMs));
  }
  throw new Error(
    lastMsg
      ? `${lastMsg}\n\nПревышено время ожидания. Проверьте панель задач — окно Chromium могло открыться за другими окнами.`
      : 'Превышено время ожидания. Проверьте, открылось ли окно браузера (панель задач).',
  );
}

const BROWSER_PROFILE_PLATFORMS = {
  tiktok: { label: 'TikTok', apiPath: '/api/settings/tiktok/browser-profile/', hint: 'Два отдельных Chrome-профиля для обновления аккаунтов; вход и прогрев — всегда в профиле с авторизацией.' },
  facebook: { label: 'Facebook', apiPath: '/api/settings/facebook/browser-profile/', hint: 'Используются при входе, обновлении страниц и Reels. Для RU-аккаунтов оставьте locale ru-RU.' },
};

/** Параметры окна/движка, в котором открыт этот интерфейс (не Playwright). */
function _draftFromCurrentBrowserWindow() {
  const langs = (typeof navigator !== 'undefined' && navigator.languages?.length)
    ? [...navigator.languages].map((l) => String(l).trim()).filter(Boolean)
    : [];
  const locale = (typeof navigator !== 'undefined' && navigator.language)
    ? String(navigator.language).trim()
    : 'en-US';
  const clamp = (n, lo, hi, fallback) => {
    const v = Math.round(Number(n) || fallback);
    return Math.max(lo, Math.min(hi, v));
  };
  return {
    user_agent: typeof navigator !== 'undefined' ? String(navigator.userAgent || '') : '',
    viewport_width: clamp(window.innerWidth, 320, 7680, 1280),
    viewport_height: clamp(window.innerHeight, 240, 4320, 900),
    locale: locale || 'en-US',
    languages: langs.length ? langs.join(', ') : (locale || 'en-US'),
  };
}

  const meta = BROWSER_PROFILE_PLATFORMS[platform] || BROWSER_PROFILE_PLATFORMS.tiktok;
  const [loading, setLoading] = useStateMd(true);
  const [saving, setSaving] = useStateMd(false);
  const [draft, setDraft] = useStateMd(null);
  const [error, setError] = useStateMd('');

  useEffect(() => {
    let cancelled = false;
    (async () => {
      setLoading(true);
      setError('');
      try {
        const data = await _fetchJson(meta.apiPath);
        if (cancelled) return;
        const langs = Array.isArray(data?.languages) ? data.languages.join(', ') : String(data?.languages || '');
        setDraft({
          user_agent: String(data?.user_agent || ''),
          viewport_width: Number(data?.viewport_width) || 1280,
          viewport_height: Number(data?.viewport_height) || 900,
          locale: String(data?.locale || 'en-US'),
          languages: langs,
          stealth_enabled: data?.stealth_enabled !== false,
          hide_automation_flags: data?.hide_automation_flags !== false,
          refresh_browser_slot: String(data?.refresh_browser_slot || 'authorized'),
          browser_slots: Array.isArray(data?.browser_slots) ? data.browser_slots : [],
          sadcaptcha_enabled: data?.sadcaptcha_enabled === true,
          sadcaptcha_api_key_set: !!data?.sadcaptcha_api_key_set,
          sadcaptcha_api_key_masked: String(data?.sadcaptcha_api_key_masked || ''),
          sadcaptcha_api_key: '',
        });
      } catch (e) {
        if (!cancelled) setError(e instanceof Error ? e.message : String(e));
      } finally {
        if (!cancelled) setLoading(false);
      }
    })();
    return () => { cancelled = true; };
  }, [platform]);

  const setField = (key, value) => setDraft((d) => (d ? { ...d, [key]: value } : d));

  const applyCurrentBrowserParams = () => {
    const cur = _draftFromCurrentBrowserWindow();

                    type="radio"

            <label style={{ fontSize: 11, color: 'var(--ink-mute)' }}>

            <label style={{ fontSize: 11, color: 'var(--ink-mute)' }}>

              <input type="text" value={draft.languages} onChange={(e) => setField('languages', e.target.value)}

            <label style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 12, color: 'var(--ink-dim)', cursor: 'pointer' }}>

            <label style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 12, color: 'var(--ink-dim)', cursor: 'pointer' }}>
              <input type="checkbox" checked={draft.hide_automation_flags}

            {platform === 'tiktok' && (
              <div style={{ marginTop: 4, paddingTop: 12, borderTop: '1px solid var(--line)' }}>
                <div style={{ fontSize: 12, fontWeight: 600, color: 'var(--ink)', marginBottom: 6 }}>
                  SadCaptcha (капча TikTok)
