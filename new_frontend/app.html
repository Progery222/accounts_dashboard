                <p style={{ margin: '0 0 10px', fontSize: 11, color: 'var(--ink-mute)', lineHeight: 1.45 }}>
                  Автоматическое решение капчи при входе, прогреве и обновлении. Ключ с{' '}
                  <a href="https://www.sadcaptcha.com" target="_blank" rel="noopener noreferrer" style={{ color: accent || '#6aa9ff' }}>
                    sadcaptcha.com
                  </a>
                  . Пустое поле при сохранении — ключ не меняется.
                </p>
                <label style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 12, color: 'var(--ink-dim)', cursor: 'pointer', marginBottom: 10 }}>
                  <input
                    type="checkbox"
                    checked={!!draft.sadcaptcha_enabled}
                    onChange={(e) => setField('sadcaptcha_enabled', e.target.checked)}
                  />
                  Автоматически проходить капчу
                </label>
                <label style={{ fontSize: 11, color: 'var(--ink-mute)' }}>
                  API-ключ SadCaptcha
                  <input
                    type="password"
                    autoComplete="off"
                    value={draft.sadcaptcha_api_key}
                    onChange={(e) => setField('sadcaptcha_api_key', e.target.value)}
                    placeholder={
                      draft.sadcaptcha_api_key_set
                        ? `Сохранён: ${draft.sadcaptcha_api_key_masked || '••••'}`
                        : 'Вставьте ключ'
                    }
                    style={{ ...inputStyle, marginTop: 4 }}
                  />
                </label>
                {draft.sadcaptcha_api_key_set && (
                  <button
                    type="button"
                    onClick={() => setDraft((d) => (d ? {
                      ...d,
                      sadcaptcha_api_key: '',
                      sadcaptcha_api_key_set: false,
                      sadcaptcha_api_key_masked: '',
                      clear_sadcaptcha_api_key: true,
                      sadcaptcha_enabled: false,
                    } : d))}
                    style={{
                      marginTop: 8,
                      padding: '6px 10px',
                      borderRadius: 8,
                      border: '1px solid var(--line)',
                      background: 'transparent',
                      color: 'var(--ink-mute)',
                      fontSize: 11,
                      cursor: 'pointer',
                    }}
                  >
                    Удалить сохранённый ключ
                  </button>
                )}
              </div>
            )}
          </div>
        )}
        <div style={{ display: 'flex', flexWrap: 'wrap', justifyContent: 'flex-end', alignItems: 'center', gap: 8, marginTop: 18 }}>
          <button type="button" disabled={saving || loading} onClick={() => save(true)}
            style={{ padding: '8px 12px', borderRadius: 8, border: '1px solid var(--line)', background: 'transparent', color: 'var(--ink-dim)', fontSize: 12, cursor: 'pointer' }}>
            Сбросить по умолчанию
          </button>
          <button type="button" disabled={saving} onClick={onClose}
            style={{ padding: '8px 12px', borderRadius: 8, border: '1px solid var(--line)', background: 'transparent', color: 'var(--ink-dim)', fontSize: 12, cursor: 'pointer' }}>
            Отмена
          </button>
          <button type="button" disabled={saving || loading || !draft} onClick={() => save(false)}
            style={{ padding: '8px 14px', borderRadius: 8, border: 'none', background: accent || '#6aa9ff', color: '#000', fontSize: 12, fontWeight: 600, cursor: 'pointer', opacity: (saving || loading) ? 0.6 : 1 }}>
            {saving ? 'Сохранение…' : 'Сохранить'}
          </button>
        </div>
      </div>
    </div>
  );
}

    { id: 'telegram',  name: 'Telegram',  state: 'detected', meta: 'Данные хранятся в браузерном профиле', warn: false, account: null },
    { id: 'youtube',   name: 'YouTube',   state: 'active', updated: '2026-05-06 14:12 UTC', warn: false, account: '@phil.studio' },
    { id: 'x',         name: 'X (Twitter)', state: 'expired', warn: true, account: null },

        </p>
        {browserProfilePlatform && (

        {/* Summary tile */}

          <SummaryTile label="ИСТЕКАЮТ" value={String(expiringCount)} color="#f59e0b" warn />

}

function SessionCard({ p, accent, onDataChanged, onOpenBrowserProfile }) {
  const isMobile = useIsMobile(980);
  const meta = PLATFORM_META[p.id];
  const stateColor = p.state === 'active' || p.state === 'detected' ? '#4ade80' : p.state === 'expired' ? '#ef4444' : '#f59e0b';
  const stateLabel = p.state === 'active' ? 'Авторизован' : p.state === 'detected' ? 'Обнаружено' : 'Истекло';
  const stateLabelMobile = p.state === 'active' ? 'Акт.' : p.state === 'detected' ? 'Найд.' : 'Истек';
  const [busy, setBusy] = useStateMd(false);
  const [showImport, setShowImport] = useStateMd(false);
  const [cookiesRaw, setCookiesRaw] = useStateMd('');
  const [importBusy, setImportBusy] = useStateMd(false);
  const importEndpoint = _authImportCookiesEndpoint(p.id);
  const doAuth = async () => {
    setBusy(true);
    try {
      const res = await _postJson(_authStartEndpoint(p.id), {});
      const jobId = res?.job_id;
      if (!jobId) {
        throw new Error('Сервер не вернул идентификатор задачи (job_id).');
      }
      const st = await _pollAuthJob(jobId);
      await uiAlert(String(st?.message || 'Авторизация завершена.'), 'Авторизация');
      await onDataChanged?.();
    } catch (e) {
      await uiAlert(`Не удалось выполнить авторизацию: ${e instanceof Error ? e.message : String(e)}`, 'Ошибка');
    } finally {
      setBusy(false);
    }
  };
  const doLogout = async () => {
    setBusy(true);
    try {
      await _postJson(_authLogoutEndpoint(p.id), {});
      await onDataChanged?.();
    } catch (e) {
      await uiAlert(`Не удалось завершить сессию: ${e instanceof Error ? e.message : String(e)}`, 'Ошибка');
    } finally {
      setBusy(false);
    }
  };
  const doImportCookies = async () => {
    if (!importEndpoint) return;
    if (!cookiesRaw.trim()) {
      await uiAlert('Вставь JSON cookies.', 'Импорт cookies');
      return;
    }
    setImportBusy(true);
    try {
      const res = await _postJson(importEndpoint, { cookies: cookiesRaw.trim() });
      const jobId = res?.job_id;
      if (!jobId) {
        throw new Error('Сервер не вернул идентификатор задачи (job_id).');
      }
      const st = await _pollAuthJob(jobId, { maxMs: 120000 });
      setShowImport(false);
      setCookiesRaw('');
      await onDataChanged?.();
      await uiAlert(String(st?.message || 'Cookies импортированы.'), 'Импорт cookies');
    } catch (e) {
      await uiAlert(`Не удалось импортировать cookies: ${e instanceof Error ? e.message : String(e)}`, 'Ошибка');
    } finally {
      setImportBusy(false);
    }
  };
  return (
    <div style={{ padding: isMobile ? 14 : 22, borderRadius: 16, border: '1px solid var(--line)', background: 'rgba(255,255,255,0.015)', position: 'relative', overflow: 'hidden' }}>
      <div style={{ position: 'absolute', top: 0, left: 0, right: 0, height: 1, background: `linear-gradient(90deg, transparent, ${meta?.color || accent}, transparent)`, opacity: 0.5 }} />
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 12, gap: 10 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
          <span style={{
            width: isMobile ? 32 : 36, height: isMobile ? 32 : 36, borderRadius: 10, background: 'rgba(255,255,255,0.04)',
            border: `1px solid ${meta?.color}40`, display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
            color: meta?.color, fontWeight: 700, fontFamily: 'JetBrains Mono, monospace',
          }}>{p.name.charAt(0)}</span>
          <div style={{ fontSize: isMobile ? 24 : 18, fontWeight: 600 }}>{p.name}</div>
        </div>
        <div style={{
          display: 'inline-flex',
          alignItems: 'center',
          gap: 6,
          flexShrink: 0,
          padding: isMobile ? '4px 8px' : '3px 8px',
          borderRadius: 999,
          background: `${stateColor}1f`,
          border: `1px solid ${stateColor}4d`,
        }}>
          <span style={{ width: 7, height: 7, borderRadius: 999, background: stateColor, boxShadow: `0 0 8px ${stateColor}` }} />
          <span className="mono" style={{ fontSize: isMobile ? 10 : 11, color: stateColor, letterSpacing: isMobile ? '0.06em' : '0.14em', textTransform: 'uppercase' }}>
            {isMobile ? stateLabelMobile : stateLabel}
          </span>
        </div>
      </div>

      {p.account && <div className="mono" style={{ fontSize: isMobile ? 12 : 13, color: 'var(--ink-dim)', marginBottom: 4 }}>{p.account}</div>}
      {p.updated && <div className="mono" style={{ fontSize: isMobile ? 11 : 12, color: 'var(--ink-mute)' }}>Обновлено: {p.updated}</div>}
      {p.expires && (
        <div style={{ marginTop: 10, padding: '6px 10px', display: 'inline-flex', gap: 8, alignItems: 'center', borderRadius: 8, background: '#ef444415', border: '1px solid #ef444433', flexWrap: 'wrap' }}>
          <span className="mono" style={{ fontSize: 11, color: '#ef4444' }}>● {p.expires}</span>
          <span className="mono" style={{ fontSize: 11, color: 'var(--ink-mute)' }}>{p.meta}</span>
        </div>
      )}
      {p.meta && !p.expires && <div className="mono" style={{ fontSize: isMobile ? 11 : 12, color: 'var(--ink-mute)', marginTop: 4, lineHeight: 1.35 }}>{p.meta}</div>}

      {p.warn && p.state === 'active' && (
        <div style={{ marginTop: 14, padding: '10px 12px', borderRadius: 10, background: '#f59e0b15', border: '1px solid #f59e0b40', display: 'flex', gap: 8, alignItems: 'flex-start' }}>
          <span style={{ color: '#f59e0b' }}>⚠</span>
          <span style={{ fontSize: isMobile ? 11 : 12, color: '#fbbf24', lineHeight: 1.35 }}>Cookies скоро истекут — обновите авторизацию.</span>
        </div>
      )}

      <div style={{ display: 'flex', flexDirection: isMobile ? 'column' : 'row', gap: 10, marginTop: 16, alignItems: isMobile ? 'stretch' : 'center' }}>
        <button onClick={doAuth} disabled={busy} style={{ width: isMobile ? '100%' : 'auto', minHeight: isMobile ? 42 : undefined, padding: '8px 14px', borderRadius: 10, background: '#fff', color: '#000', border: 'none', fontSize: 13, fontWeight: 500, cursor: 'pointer', opacity: busy ? 0.6 : 1 }}>
          {busy ? '...' : (p.hasSession ? 'Обновить авторизацию' : `Войти в ${p.name}`)}
        </button>
        {p.hasSession && (
          <button onClick={doLogout} disabled={busy} style={{ width: isMobile ? '100%' : 'auto', minHeight: isMobile ? 42 : undefined, padding: '8px 14px', borderRadius: 10, background: 'transparent', border: '1px solid var(--line)', color: 'var(--ink-dim)', fontSize: 13, cursor: 'pointer', fontFamily: 'inherit', opacity: busy ? 0.6 : 1 }}>
            Завершить сессию
          </button>
        )}
        {importEndpoint && (
          <button onClick={() => setShowImport((v) => !v)} style={{ width: isMobile ? '100%' : 'auto', minHeight: isMobile ? 42 : undefined, padding: '8px 14px', borderRadius: 10, background: 'transparent', border: '1px solid var(--line)', color: 'var(--ink-dim)', fontSize: 13, cursor: 'pointer', fontFamily: 'inherit' }}>
            Импорт cookies
          </button>
        )}
        {onOpenBrowserProfile && (
          <button
            type="button"
            onClick={onOpenBrowserProfile}
            style={{ width: isMobile ? '100%' : 'auto', minHeight: isMobile ? 42 : undefined, padding: '8px 14px', borderRadius: 10, background: 'transparent', border: '1px solid var(--line)', color: 'var(--ink-dim)', fontSize: 13, cursor: 'pointer', fontFamily: 'inherit' }}
          >
            Параметры браузера
          </button>
        )}
      </div>
      {showImport && importEndpoint && (
        <div style={{ marginTop: 12, border: '1px solid var(--line)', borderRadius: 10, padding: 10 }}>
          <div className="mono" style={{ fontSize: 11, color: 'var(--ink-mute)', marginBottom: 6 }}>
            {p.id === 'tiktok' ? 'Куки для Playwright-воркера (отдельный Chrome)' : `JSON cookies для ${p.name}`}
          </div>
          {p.id === 'tiktok' && (
            <p style={{ margin: '0 0 8px', fontSize: 11, color: 'var(--ink-dim)', lineHeight: 1.45 }}>
              Окно воркера ≠ ваш браузер. После «Импортировать» дождитесь «Готово», затем снова откройте съём.
              Лучше вставить <strong style={{ color: 'var(--ink)' }}>JSON всех куков</strong> .tiktok.com (расширение Cookie-Editor → Export).
              Одного sessionid из DevTools часто мало; тот же VPN, что при входе. «Слишком много попыток» — пауза 12–24 ч.
            </p>
          )}
          <textarea
            value={cookiesRaw}
            onChange={(e) => setCookiesRaw(e.target.value)}
            placeholder={p.id === 'tiktok'
              ? '[{"domain":".tiktok.com","name":"sessionid","value":"..."}, … все куки tiktok.com]'
              : '[{"domain":".example.com","name":"sessionid","value":"..."}]'}
            style={{ width: '100%', minHeight: 100, resize: 'vertical', background: 'rgba(255,255,255,0.03)', border: '1px solid var(--line)', borderRadius: 8, color: 'var(--ink)', fontSize: 12, fontFamily: 'JetBrains Mono, monospace', padding: 8 }}
          />
          <div style={{ display: 'flex', justifyContent: 'flex-end', gap: 8, marginTop: 8 }}>
            <button onClick={() => setShowImport(false)} style={{ padding: '7px 12px', borderRadius: 8, border: '1px solid var(--line)', background: 'transparent', color: 'var(--ink-dim)', fontSize: 12, cursor: 'pointer' }}>Отмена</button>
            <button onClick={doImportCookies} disabled={importBusy} style={{ padding: '7px 12px', borderRadius: 8, border: 'none', background: '#fff', color: '#000', fontSize: 12, fontWeight: 600, cursor: 'pointer', opacity: importBusy ? 0.6 : 1 }}>
              {importBusy ? 'Импорт...' : 'Импортировать'}
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

Object.assign(window, { SettingsScreen });

function ModalOverlay({ children, onClose }) {

function AddListModal({ accent, onDataChanged, onClose }) {
  const isMobile = useIsMobile(760);
  const [raw, setRaw] = useStateMd('');
  const [busy, setBusy] = useStateMd(false);
  const [profileId, setProfileId] = useStateMd('none');
  const [profileBusy, setProfileBusy] = useStateMd(false);
  const [profileEditorOpen, setProfileEditorOpen] = useStateMd(false);
  const createProfileInline = async ({ name, color }) => {
    const profileName = String(name || '').trim();
    if (!profileName) return;
    setProfileBusy(true);
    try {
      const created = await _postJson('/api/accounts/profiles/', { name: profileName, color: color || '#6366f1' });
      const createdId = created?.id != null ? String(created.id) : null;
      await onDataChanged?.();
      if (createdId) setProfileId(createdId);
      await uiAlert(`Профиль "${profileName}" добавлен.`, 'Профили');
      setProfileEditorOpen(false);
    } catch (e) {
      await uiAlert(`Не удалось добавить профиль: ${e instanceof Error ? e.message : String(e)}`, 'Ошибка');
    } finally {
      setProfileBusy(false);
    }
  };
  const importBulk = async () => {
    const lines = raw.split(/\r?\n|,/).map((s) => s.trim()).filter(Boolean);
    if (lines.length === 0) return;
    setBusy(true);
    let ok = 0;
    try {
      for (const line of lines) {
        const parsed = _parseBulkLine(line);
        if (!parsed || !parsed.username) continue;
        await _postJson('/api/accounts/', {
          platform: parsed.platform,
          username: parsed.username.replace(/^@/, ''),
          profile_id: profileId === 'none' ? null : Number(profileId),
        });
        ok += 1;
      }
      await onDataChanged?.();
      await uiAlert(`Импортировано: ${ok}`, 'Импорт списка');
      setRaw('');
    } catch (e) {
      await uiAlert(`Ошибка импорта: ${e instanceof Error ? e.message : String(e)}`, 'Ошибка');
    } finally {
      setBusy(false);
    }
  };
  return (
    <ModalShell title="Добавить список аккаунтов" kicker="BATCH IMPORT" accent={accent} width={760} offsetY="-10%" onClose={onClose}>
      <div style={{ fontSize: 13, color: 'var(--ink-dim)', marginBottom: 12 }}>Вставь URL аккаунтов — по одному на строку или через запятую</div>
      <textarea value={raw} onChange={(e) => setRaw(e.target.value)} placeholder={'https://www.tiktok.com/@username\nhttps://www.youtube.com/@channel\nhttps://www.threads.com/@user\nhttps://t.me/channel'} style={{
        width: '100%', minHeight: 160, padding: 16, borderRadius: 12,
        background: 'rgba(255,255,255,0.025)', border: '1px solid var(--line-2)',
        color: 'var(--ink-dim)', fontSize: 13, fontFamily: 'JetBrains Mono, monospace', lineHeight: 1.6, resize: 'vertical',
      }} />
      <div style={{ display: 'flex', alignItems: 'center', gap: 14, marginTop: 18, flexWrap: 'wrap' }}>
        <span className="mono" style={{ fontSize: 11, color: 'var(--ink-mute)', letterSpacing: '0.2em' }}>ПРОФИЛЬ</span>
        <ProfilePicker accent={accent} value={profileId} onChange={setProfileId} />
        <button
          onClick={() => setProfileEditorOpen(true)}
          disabled={profileBusy}
          style={{ padding: '8px 14px', borderRadius: 999, background: 'rgba(255,255,255,0.04)', border: '1px solid var(--line)', color: 'var(--ink-dim)', cursor: profileBusy ? 'default' : 'pointer', fontSize: 13, fontFamily: 'inherit', display: 'inline-flex', alignItems: 'center', gap: 6, opacity: profileBusy ? 0.7 : 1 }}
        >
          {profileBusy ? '...' : '+ Новый'}
        </button>
      </div>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 28, gap: 10, flexWrap: isMobile ? 'wrap' : 'nowrap' }}>
        <button onClick={onClose} style={{ padding: '8px 0', background: 'transparent', border: 'none', color: 'var(--ink-dim)', fontSize: 13, cursor: 'pointer', fontFamily: 'inherit' }}>Отмена</button>
        <button onClick={importBulk} disabled={busy} style={{ padding: '12px 28px', borderRadius: 12, background: accent, color: '#000', border: 'none', fontSize: 14, fontWeight: 600, cursor: 'pointer', opacity: busy ? 0.6 : 1, width: isMobile ? '100%' : 'auto' }}>{busy ? 'Импорт...' : 'Импортировать'}</button>
      </div>
      {profileEditorOpen && (
        <ProfileEditorModal
          accent={accent}
          mode="create"
          busy={profileBusy}
          onSubmit={createProfileInline}
          onClose={() => { if (!profileBusy) setProfileEditorOpen(false); }}
        />
      )}
    </ModalShell>
  );
}

const _AUTO_RUN_STATUS_RU = {
  queued: 'В очереди', running: 'Обновляется', done: 'Готово', skipped: 'Пропущен', error: 'Ошибка', cancelled: 'Отменён',
};
const _RUN_DETAIL_STATUS_AT = new Set(['done', 'skipped', 'error']);
function _fmtRunDetailStatusAt(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return '';
  return d.toLocaleString('ru-RU', {
    timeZone: 'Europe/Moscow',
    day: '2-digit',
    month: '2-digit',
    hour: '2-digit',
    minute: '2-digit',
  }).replace(',', '');
}
const _WARM_STATUS_RU = {
  queued: 'В очереди', running: 'Прогрев', done: 'Готово', error: 'Ошибка', cancelled: 'Остановлен',
};
const _WARM_PLATFORM_ORDER = ['facebook'];

function AutoRefreshRunDetailOverlay({ status, accent, onClose, refreshAutoStatus }) {
  React.useEffect(() => {
    const t = setInterval(() => { void refreshAutoStatus?.(); }, 6000);
    return () => clearInterval(t);
  }, [refreshAutoStatus]);
  const pipeline = status?.active_pipeline || '';
  const overlayKicker = pipeline === 'refresh_all'
    ? 'СБОР ВСЕХ'
    : pipeline === 'bulk_refresh'
      ? 'ВЫБРАННЫЕ'
      : 'АВТООБНОВЛЕНИЕ';
  const overlayTitle = pipeline === 'refresh_all'
    ? 'Детали сбора всех'
    : pipeline === 'bulk_refresh'
      ? 'Детали обновления выбранных'
      : 'Детали прогона';
  const rd = status?.run_detail && typeof status.run_detail === 'object' ? status.run_detail : {};
  const items = Array.isArray(rd.items) ? rd.items : [];
  const wc = Number(rd.worker_count || 0);
  const warmMap = rd.warm && typeof rd.warm === 'object' ? rd.warm : {};
  const warmRows = _WARM_PLATFORM_ORDER.filter((p) => warmMap[p]).map((p) => ({ platform: p, ...warmMap[p] }));
  const fmtWarmTime = (sec) => {
    const s = Math.max(0, Math.floor(Number(sec) || 0));
    const m = Math.floor(s / 60);
    const r = s % 60;
    return `${m}:${String(r).padStart(2, '0')}`;
  };
  const pick = (s) => items.filter((it) => it.status === s);
  const buckets = { running: pick('running'), queued: pick('queued'), done: pick('done'), skipped: pick('skipped'), error: pick('error'), cancelled: pick('cancelled') };
  const warmSection = warmRows.length > 0 ? (
    <div style={{ marginBottom: 18 }}>
      <div className="mono" style={{ fontSize: 11, color: 'var(--ink-mute)', letterSpacing: '0.12em', marginBottom: 8 }}>ПРОГРЕВ · {warmRows.length}</div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
        {warmRows.map((w) => {
          const pct = Math.max(0, Math.min(100, Number(w.progress_percent || 0)));
          const st = w.status || 'queued';
          const isRun = st === 'running';
          const planned = Number(w.planned_sec || 0);
          const elapsed = Number(w.elapsed_sec || 0);
          const minM = Number(w.min_minutes || 0);
          const maxM = Number(w.max_minutes || 0);
          const planLabel = minM > 0 && maxM > 0
            ? `план ~${minM.toFixed(0)}–${maxM.toFixed(0)} мин`
            : (planned > 0 ? `план ~${Math.ceil(planned / 60)} мин` : '');
          return (
            <div key={w.platform} style={{ padding: '10px 12px', borderRadius: 10, border: '1px solid var(--line)', background: isRun ? 'rgba(56,189,248,0.08)' : 'rgba(255,255,255,0.03)' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 8 }}>
                <PlatformGlyph id={w.platform} size={14} />
                <div style={{ flex: 1, fontSize: 13, fontWeight: 500, color: 'var(--ink)' }}>
                  {PLATFORM_META[w.platform]?.label || w.platform}
                  {w.detail ? <span style={{ color: 'var(--ink-mute)', fontWeight: 400 }}> · {w.detail}</span> : null}
                </div>
                <div style={{ fontSize: 10, fontWeight: 600, padding: '3px 8px', borderRadius: 6, border: '1px solid var(--line)', background: isRun ? 'rgba(56,189,248,0.12)' : st === 'done' ? 'rgba(74,222,128,0.12)' : 'rgba(255,255,255,0.04)' }}>
                  {_WARM_STATUS_RU[st] || st}
                </div>
              </div>
              {(isRun || st === 'done') && (
                <>
                  <div style={{ height: 8, borderRadius: 999, border: '1px solid var(--line)', background: 'rgba(255,255,255,0.04)', overflow: 'hidden', marginBottom: 6 }}>
                    <div style={{ width: `${pct}%`, height: '100%', borderRadius: 999, background: st === 'done' ? 'linear-gradient(90deg, #22c55e, #4ade80)' : 'linear-gradient(90deg, #38bdf8, #4ade80)', transition: 'width 260ms ease' }} />
                  </div>
                  <div className="mono" style={{ fontSize: 11, color: 'var(--ink-mute)', display: 'flex', justifyContent: 'space-between', flexWrap: 'wrap', gap: 6 }}>
                    <span>{pct}%{planned > 0 ? ` · ${fmtWarmTime(elapsed)} / ${fmtWarmTime(planned)}` : (elapsed > 0 ? ` · ${fmtWarmTime(elapsed)}` : '')}</span>
                    <span>роликов {Number(w.videos || 0)} · лайков {Number(w.likes || 0)}</span>
                  </div>
                  {planLabel ? <div style={{ fontSize: 10, color: 'var(--ink-mute)', marginTop: 4 }}>{planLabel}</div> : null}
                </>
              )}
              {st === 'queued' && planLabel ? (
                <div style={{ fontSize: 11, color: 'var(--ink-mute)' }}>{planLabel} — скоро старт</div>
              ) : null}
              {st === 'error' && w.detail ? (
                <div style={{ fontSize: 11, color: '#fecaca', marginTop: 6, lineHeight: 1.35 }}>{w.detail}</div>
              ) : null}
            </div>
          );
        })}
      </div>
    </div>
  ) : null;
  const section = (title, list, emptyHint) => (
    <div style={{ marginBottom: 16 }}>
      <div className="mono" style={{ fontSize: 11, color: 'var(--ink-mute)', letterSpacing: '0.12em', marginBottom: 8 }}>{title} · {list.length}</div>
      {list.length === 0 ? (
        <div style={{ fontSize: 12, color: 'var(--ink-mute)' }}>{emptyHint || '—'}</div>
      ) : (
        <div style={{ maxHeight: 160, overflowY: 'auto', borderRadius: 10, border: '1px solid var(--line)', background: 'rgba(0,0,0,0.2)' }}>
          {list.map((it) => {
            const atLabel = _RUN_DETAIL_STATUS_AT.has(it.status) ? _fmtRunDetailStatusAt(it.status_at) : '';
            return (
            <div key={it.account_id} style={{ display: 'flex', alignItems: 'flex-start', gap: 8, padding: '8px 10px', borderBottom: '1px solid rgba(255,255,255,0.06)' }}>
              <PlatformGlyph id={it.platform} size={14} />
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontSize: 13, color: 'var(--ink)', fontWeight: 500 }}>@{it.username} <span style={{ color: 'var(--ink-mute)', fontWeight: 400 }}>· {it.platform}</span></div>
                {it.detail ? <div style={{ fontSize: 11, color: 'var(--ink-mute)', marginTop: 4, lineHeight: 1.35 }}>{it.detail}</div> : null}
              </div>
              <div style={{ textAlign: 'right', flexShrink: 0 }}>
                <div style={{ fontSize: 10, fontWeight: 600, padding: '3px 8px', borderRadius: 6, border: '1px solid var(--line)', background: it.status === 'running' ? 'rgba(56,189,248,0.12)' : it.status === 'done' ? 'rgba(74,222,128,0.12)' : 'rgba(255,255,255,0.04)', color: 'var(--ink)' }}>{_AUTO_RUN_STATUS_RU[it.status] || it.status}</div>
                {atLabel ? <div className="mono" style={{ fontSize: 10, color: 'var(--ink-mute)', marginTop: 4 }} title="Время перехода в этот статус (МСК)">{atLabel}</div> : null}
                {it.worker != null && it.status === 'running' ? <div className="mono" style={{ fontSize: 10, color: 'var(--ink-mute)', marginTop: 4 }}>слот {Number(it.worker) + 1}</div> : null}
              </div>
            </div>
            );
          })}
        </div>
      )}
    </div>
  );
  return (
    <div style={{ position: 'fixed', inset: 0, zIndex: 80, display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'rgba(0,0,0,0.72)', padding: 16 }} onClick={(e) => e.target === e.currentTarget && onClose()}>
      <div style={{ width: '100%', maxWidth: 520, maxHeight: 'min(88vh, 620px)', overflowY: 'auto', borderRadius: 16, border: '1px solid var(--line)', background: 'rgba(18,20,28,0.98)', padding: 20 }} onClick={(e) => e.stopPropagation()}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 12, marginBottom: 16 }}>
          <div>
            <div className="mono" style={{ fontSize: 10, color: 'var(--ink-mute)', letterSpacing: '0.2em', marginBottom: 6 }}>{overlayKicker}</div>
            <div style={{ fontSize: 17, fontWeight: 600, color: '#fff' }}>{overlayTitle}</div>
            <div style={{ fontSize: 12, color: 'var(--ink-mute)', marginTop: 8, lineHeight: 1.45 }}>Параллельных потоков: {wc || '—'}. Номер слота 1…N — только у строки «Обновляется».</div>
          </div>
          <button type="button" onClick={onClose} style={{ padding: '8px 12px', borderRadius: 10, border: '1px solid var(--line)', background: 'transparent', color: 'var(--ink-dim)', cursor: 'pointer' }}>✕</button>
        </div>
        {warmSection}
        {items.length === 0 && warmRows.length === 0 ? (
          <p style={{ fontSize: 13, color: 'var(--ink-mute)' }}>Список ещё не пришёл с сервера (нужна миграция 0023 и обновлённый бэкенд).</p>
        ) : (
          <>
            {section('Сейчас обновляются', buckets.running, 'Никто')}
            {section('В очереди', buckets.queued, 'Пусто')}
            {section('Уже готово', buckets.done, '—')}
            {section('Пропущены', buckets.skipped, '—')}
            {section('Ошибки', buckets.error, '—')}
            {section('Отменены / не дошли', buckets.cancelled, '—')}
          </>
        )}
        <button type="button" onClick={onClose} style={{ width: '100%', marginTop: 12, padding: 12, borderRadius: 12, border: '1px solid var(--line)', background: 'rgba(255,255,255,0.04)', color: 'var(--ink)', cursor: 'pointer', fontSize: 14 }}>Закрыть</button>
      </div>
    </div>
  );
}

function _scopePickerSummary(selectedCount, totalCount) {
  if (!totalCount || selectedCount >= totalCount) return 'все';
  if (selectedCount <= 0) return 'ничего';
  return `${selectedCount} из ${totalCount}`;
}

function AutoRefreshScopePickerModal({ title, hint, accent, options, selectedIds, onClose, onApply }) {
  const [draft, setDraft] = useStateMd(() => new Set(selectedIds));

  const toggle = (id) => {
    const key = String(id);
    setDraft((prev) => {
      const next = new Set(prev);
      if (next.has(key)) next.delete(key);
      else next.add(key);
      return next;
    });
  };

  const selectAll = () => setDraft(new Set(options.map((o) => String(o.id))));
  const clearAll = () => setDraft(new Set());

  const apply = () => {
    onApply(draft);
    onClose();
  };

  return (
    <div
      style={{
        position: 'fixed',
        inset: 0,
        zIndex: 110,
        display: 'flex',
        alignItems: 'center',
        justifyContent: 'center',
        background: 'rgba(0,0,0,0.72)',
        padding: 16,
      }}
      onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}
    >
      <div
        role="dialog"
        aria-modal
        onClick={(e) => e.stopPropagation()}
        style={{
          width: '100%',
          maxWidth: 520,
          borderRadius: 16,
          border: '1px solid var(--line)',
          background: 'rgba(18,20,28,0.98)',
          padding: 20,
          boxShadow: '0 24px 56px rgba(0,0,0,0.65)',
        }}
      >
        <h3 style={{ margin: '0 0 8px', fontSize: 17, color: '#fff' }}>{title}</h3>
        {hint ? (
          <p style={{ margin: '0 0 14px', fontSize: 12, color: 'var(--ink-mute)', lineHeight: 1.45 }}>{hint}</p>
        ) : null}
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8, marginBottom: 14 }}>
          {options.map((o) => (
            <Pill
              key={o.id}
              active={draft.has(String(o.id))}
              onClick={() => toggle(o.id)}
              dot={o.color}
            >
              {o.glyph ? <span style={{ display: 'inline-flex', marginRight: 6 }}>{o.glyph}</span> : null}
              {o.label}
            </Pill>
          ))}
        </div>
        <div style={{ display: 'flex', gap: 8, marginBottom: 16, flexWrap: 'wrap' }}>
          <button
            type="button"
            onClick={selectAll}
            style={{ padding: '8px 12px', borderRadius: 999, border: '1px solid var(--line)', background: 'rgba(255,255,255,0.03)', color: 'var(--ink)', cursor: 'pointer', fontSize: 12 }}
          >
            Все
          </button>
          <button
            type="button"
            onClick={clearAll}
            style={{ padding: '8px 12px', borderRadius: 999, border: '1px solid var(--line)', background: 'rgba(255,255,255,0.03)', color: 'var(--ink)', cursor: 'pointer', fontSize: 12 }}
          >
            Сброс
          </button>
        </div>
        <div style={{ display: 'flex', gap: 10, justifyContent: 'flex-end' }}>
          <button
            type="button"
            onClick={onClose}
            style={{ padding: '10px 16px', borderRadius: 10, border: '1px solid var(--line)', background: 'transparent', color: 'var(--ink-dim)', cursor: 'pointer', fontSize: 13 }}
          >
            Отмена
          </button>
          <button
            type="button"
            onClick={apply}
            style={{ padding: '10px 16px', borderRadius: 10, border: 'none', background: accent, color: '#000', cursor: 'pointer', fontSize: 13, fontWeight: 600 }}
          >
            Готово
          </button>
        </div>
      </div>
    </div>
  );
}

function ScheduleModal({ accent, onDataChanged, onClose }) {
  const isMobile = useIsMobile(760);
  const SKIP_OPTIONS = [0, 1, 3, 6, 12, 24];
  const platformOptions = React.useMemo(() => {
    const known = [
      ['tiktok', 'TikTok'],
      ['instagram', 'Instagram'],
      ['youtube', 'YouTube'],
      ['telegram', 'Telegram'],
      ['x', 'X (Twitter)'],
      ['threads', 'Threads'],
      ['facebook', 'Facebook'],
      ['rumble', 'Rumble'],
      ['reddit', 'Reddit'],
    ];
    const map = new Map(known.map(([id, label]) => [id, { id, label, color: PLATFORM_COLORS[id] || '#9ca3af' }]));
    for (const p of PLATFORMS) {
      if (!map.has(p.id)) map.set(p.id, { id: p.id, label: p.label, color: p.color || '#9ca3af' });
    }
    return Array.from(map.values());
  }, []);
  const profileOptions = React.useMemo(
    () => (PROFILES || []).map((p) => ({
      id: String(p.id),
      label: p.label,
      color: p.color,
    })),
    [],
  );
  const [loading, setLoading] = useStateMd(true);
  const [saving, setSaving] = useStateMd(false);
  const [status, setStatus] = useStateMd(null);
  const [mode, setMode] = useStateMd('times');
  const [auto, setAuto] = useStateMd(true);
  const [intervalHours, setIntervalHours] = useStateMd(6);
  const [skipRecent, setSkipRecent] = useStateMd(0);
  const [selectedTimes, setSelectedTimes] = useStateMd([]);
  const [customScheduleSlots, setCustomScheduleSlots] = useStateMd([]);
  const [timesModalOpen, setTimesModalOpen] = useStateMd(false);
  const [platformsModalOpen, setPlatformsModalOpen] = useStateMd(false);
  const [profilesModalOpen, setProfilesModalOpen] = useStateMd(false);
  const [selectedPlatforms, setSelectedPlatforms] = useStateMd(() => new Set(platformOptions.map((p) => p.id)));
  const [selectedProfiles, setSelectedProfiles] = useStateMd(() => new Set(profileOptions.map((p) => p.id)));
  const [csvReport, setCsvReport] = useStateMd(true);
  const [warmEnabled, setWarmEnabled] = useStateMd(true);
  const [includeHiddenPlatform, setIncludeHiddenPlatform] = useStateMd(false);
  const [includeHiddenProfile, setIncludeHiddenProfile] = useStateMd(false);
  const [reportDownloading, setReportDownloading] = useStateMd(false);
  const [runBusy, setRunBusy] = useStateMd(false);
  const [stopBusy, setStopBusy] = useStateMd(false);
  const [runDetailOpen, setRunDetailOpen] = useStateMd(false);
  const prevRunningRef = React.useRef(false);

  const refreshAutoStatus = async () => {
    const st = await _fetchJson('/api/accounts/auto-refresh-status/').catch(() => null);
    setStatus(st);
    return st;
  };

  useEffect(() => {
    let mounted = true;
    (async () => {
      try {
        const [sched, st] = await Promise.all([
          _fetchJson('/api/accounts/schedule/'),
          _fetchJson('/api/accounts/auto-refresh-status/').catch(() => null),
        ]);
        if (!mounted || !sched) return;
        setMode(sched.mode || 'times');
        setAuto(!!sched.enabled);
        setIntervalHours(Number(sched.interval_hours || 6));
        setSkipRecent(Number(sched.skip_recent_hours ?? 0));
        const activeTimes = _scheduleTimesFromServer(sched);
        setSelectedTimes(activeTimes);
        setCustomScheduleSlots(activeTimes.filter((t) => !DEFAULT_AUTO_REFRESH_TIMES.includes(t)));
        setCsvReport(!!sched.auto_refresh_csv_report);
        setWarmEnabled(sched.refresh_warm_enabled !== false);
        setIncludeHiddenPlatform(!!sched.include_hidden_platform_accounts);
        setIncludeHiddenProfile(!!sched.include_hidden_profile_accounts);
        const srvPlat = Array.isArray(sched.auto_refresh_platforms) ? sched.auto_refresh_platforms : [];
        const allPlat = platformOptions.map((p) => p.id);
        setSelectedPlatforms(new Set(srvPlat.length ? srvPlat : allPlat));
        const srvProf = Array.isArray(sched.auto_refresh_profile_ids)
          ? sched.auto_refresh_profile_ids.map((x) => String(x))
          : [];
        const allProf = profileOptions.map((p) => p.id);
        setSelectedProfiles(new Set(srvProf.length ? srvProf : allProf));
        setStatus(st);
      } catch (e) {
        await uiAlert(`Не удалось загрузить расписание: ${e instanceof Error ? e.message : String(e)}`, 'Ошибка');
      } finally {
        if (mounted) setLoading(false);
      }
    })();
    return () => { mounted = false; };
  }, []);

  useEffect(() => {
    if (!status?.is_running && !runBusy && !status?.cancel_requested) return undefined;
    const timer = setInterval(() => { void refreshAutoStatus(); }, status?.cancel_requested ? 2000 : 7500);
    return () => clearInterval(timer);
  }, [status?.is_running, status?.cancel_requested, runBusy]);

  useEffect(() => {
    const wasRunning = !!prevRunningRef.current;
    const isRunning = !!status?.is_running;
    if (wasRunning && !isRunning) {
      void refreshAutoStatus();
      void onDataChanged?.();
    }
    prevRunningRef.current = isRunning;
  }, [status?.is_running, onDataChanged]);

  const buildSchedulePayload = (timesOverride = null) => {
    const times = auto && mode === 'times'
      ? _sortScheduleTimes(timesOverride ?? selectedTimes)
      : [];
    const allPlat = platformOptions.map((p) => p.id);
    const auto_refresh_platforms = selectedPlatforms.size >= allPlat.length
      ? []
      : Array.from(selectedPlatforms);
    const allProf = profileOptions.map((p) => p.id);
    const auto_refresh_profile_ids = selectedProfiles.size >= allProf.length
      ? []
      : Array.from(selectedProfiles).map((id) => (id === 'none' ? 'none' : Number(id)));
    return {
      enabled: auto,
      mode,
      interval_hours: Math.max(1, Number(intervalHours || 1)),
      skip_recent_hours: Math.max(0, Number(skipRecent ?? 0)),
      refresh_warm_enabled: !!warmEnabled,
      auto_refresh_csv_report: csvReport,
      include_hidden_platform_accounts: includeHiddenPlatform,
      include_hidden_profile_accounts: includeHiddenProfile,
      auto_refresh_platforms,
      auto_refresh_profile_ids,
      times,
    };
  };

  const platformSummary = _scopePickerSummary(selectedPlatforms.size, platformOptions.length);
  const profileSummary = _scopePickerSummary(selectedProfiles.size, profileOptions.length);

  const saveSchedule = async ({ silent = false, timesOverride = null } = {}) => {
    if (!silent) setSaving(true);
    try {
      await _postJson('/api/accounts/schedule/', buildSchedulePayload(timesOverride));
      await onDataChanged?.();
      if (!silent) await uiAlert('Расписание сохранено.', 'Расписание');
    } catch (e) {
      if (!silent) await uiAlert(`Ошибка сохранения: ${e instanceof Error ? e.message : String(e)}`, 'Ошибка');
      throw e;
    } finally {
      if (!silent) setSaving(false);
    }
  };

  const persistTimeSlots = async (nextTimes) => {
    if (!auto || mode !== 'times') return;
    try {
      await saveSchedule({ silent: true, timesOverride: nextTimes });
    } catch {
      await uiAlert('Не удалось сохранить время на сервер. Нажмите «Сохранить» внизу окна.', 'Расписание');
    }
  };

  const pillsRowTimes = _sortScheduleTimes([
    ...DEFAULT_AUTO_REFRESH_TIMES,
    ...customScheduleSlots,
  ]);

  const toggleTime = (timeValue) => {
    const t = String(timeValue || '').trim();
    if (!/^\d{2}:\d{2}$/.test(t)) return;
    const cur = _sortScheduleTimes(selectedTimes);
    const next = cur.includes(t)
      ? cur.filter((x) => x !== t)
      : _sortScheduleTimes([...cur, t]);
    setSelectedTimes(next);
    void persistTimeSlots(next);
  };

  const runNow = async () => {
    setRunBusy(true);
    try {
      const beforeRun = await refreshAutoStatus().catch(() => null);
      const beforeStartedAt = beforeRun?.started_at ? String(beforeRun.started_at) : '';
      if (beforeRun?.is_running) {
        await uiAlert('Автообновление уже выполняется.', 'Автообновление');
        return;
      }
      // Ensure skip/include settings are persisted before manual start.
      await saveSchedule({ silent: true });
      const candidates = _apiBaseCandidates();
      let started = false;
      let alreadyRunning = false;
      let lastErr = null;
      for (const base of candidates) {
        try {
          const res = await fetch(`${base}/api/accounts/auto-refresh-run-now/`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: '{}',
          });
          let body = null;
          try { body = await res.json(); } catch {}
          if (res.ok) {
            started = !!(body?.started ?? true);
            break;
          }
          if (res.status === 409) {
            alreadyRunning = true;
            break;
          }
          throw new Error(body?.detail || `HTTP ${res.status}`);
        } catch (e) {
          lastErr = e;
        }
      }
      if (alreadyRunning) {
        await refreshAutoStatus();
        await uiAlert('Автообновление уже выполняется.', 'Автообновление');
      } else if (started) {
        let st = null;
        const deadline = Date.now() + 20000;
        while (Date.now() < deadline) {
          st = await refreshAutoStatus();
          if (st?.is_running) break;
          const startedAt = st?.started_at ? String(st.started_at) : '';
          if (startedAt && startedAt !== beforeStartedAt) break;
          await new Promise((r) => setTimeout(r, 400));
        }
        if (st) setStatus(st);
        // Без модального окна: прогресс и браузеры видны в панели ниже.
      } else if (lastErr) {
        throw new Error(_apiTunnelDeadHint(lastErr instanceof Error ? lastErr : new Error(String(lastErr))));
      }
    } catch (e) {
      await uiAlert(`Не удалось запустить: ${e instanceof Error ? e.message : String(e)}`, 'Ошибка');
    } finally {
      setRunBusy(false);
    }
  };

  const stopNow = async () => {
    if (stopBusy) return;
    setStopBusy(true);
    try {
      setStatus((prev) => (prev ? { ...prev, cancel_requested: true } : prev));
      await _stopActiveRefreshPipeline(status?.active_pipeline);
      const st = await refreshAutoStatus();
      if (st?.cancel_requested || st?.is_running) {
        await uiAlert(
          'Остановка запрошена. Текущий аккаунт может ещё обрабатываться 1–3 мин — прогресс обновится автоматически.',
          'Автообновление',
        );
      } else {
        await uiAlert('Прогон остановлен или уже завершён.', 'Автообновление');
      }
    } catch (e) {
      const msg = String(e instanceof Error ? e.message : e || '');
      const st = await refreshAutoStatus().catch(() => null);
      if (msg.includes('HTTP 409')) {
        await uiAlert(
          st?.is_running
            ? 'Сервер не принял остановку. Обновите страницу или сбросьте состояние: manage.py clear_refresh_run_state --force'
            : 'Сейчас ничего не выполняется — кнопка «Остановить» активна только во время прогона.',
          'Автообновление',
        );
        return;
      }
      await uiAlert(`Не удалось остановить: ${msg}`, 'Ошибка');
    } finally {
      setStopBusy(false);
      const st = await refreshAutoStatus().catch(() => null);
      if (st && !st.is_running) {
        setStatus(st);
      }
    }
  };

  const downloadLastAutoRefreshReport = async () => {
    setReportDownloading(true);
    try {
      const candidates = _apiBaseCandidates();
      let blob = null;
      let lastStatus = 0;
      for (const base of candidates) {
        try {
          const res = await fetch(`${base}/api/accounts/auto-refresh-report/`);
          lastStatus = res.status;
          if (!res.ok) continue;
          blob = await res.blob();
          break;
        } catch (_) {}
      }
      if (!blob) {
        if (lastStatus === 404) {
          throw new Error('Отчёт не найден. Если запуск был прерван перезапуском бэка, новый CSV мог не успеть сохраниться.');
        }
        throw new Error(`HTTP ${lastStatus || 0}`);
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `auto-refresh-report-${new Date().toISOString().replace(/[:.]/g, '-')}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    } catch (e) {
      await uiAlert(`Не удалось скачать отчёт: ${e instanceof Error ? e.message : String(e)}`, 'Ошибка');
    } finally {
      setReportDownloading(false);
    }
  };

  if (loading) {
    return (
      <ModalShell title="Расписание обновлений" kicker="AUTOMATION" accent={accent} width={620} onClose={onClose}>
        <div className="mono" style={{ color: 'var(--ink-mute)' }}>Загрузка…</div>
      </ModalShell>
    );
  }

  return (
    <ModalShell title="Расписание обновлений" kicker="AUTOMATION" accent={accent} width={620} onClose={onClose}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '14px 16px', borderRadius: 12, background: 'rgba(255,255,255,0.025)', border: '1px solid var(--line)', marginBottom: 18 }}>
        <span style={{ fontSize: 14, fontWeight: 500 }}>Автообновление</span>
        <button onClick={() => {
          const next = !auto;
          setAuto(next);
          if (next && mode === 'times' && selectedTimes.length === 0) {
            setSelectedTimes([...DEFAULT_AUTO_REFRESH_TIMES]);
          }
        }} style={{
          width: 50, height: 26, borderRadius: 999, background: auto ? '#4ade80' : 'rgba(255,255,255,0.1)',
          border: 'none', cursor: 'pointer', position: 'relative', transition: 'all .2s',
        }}>
          <span style={{ position: 'absolute', top: 3, left: auto ? 27 : 3, width: 20, height: 20, borderRadius: 999, background: '#fff', transition: 'all .2s' }} />
        </button>
      </div>
      {!auto && (
        <p style={{ margin: '0 0 14px', fontSize: 12, color: 'var(--ink-mute)', lineHeight: 1.45 }}>
          Автообновление выключено — на бродкасте будет <span className="mono">AUTO · OFF</span>, слоты по времени не запускаются.
          Включите переключатель выше и нажмите «Сохранить», чтобы задать расписание.
        </p>
      )}

      <div style={{ padding: 16, borderRadius: 12, background: 'rgba(255,255,255,0.015)', border: '1px solid var(--line)', marginBottom: 12 }}>
        <label style={{ display: 'flex', gap: 12, alignItems: 'flex-start', cursor: 'pointer' }}>
          <span onClick={() => setCsvReport((v) => !v)} style={{ width: 18, height: 18, borderRadius: 5, background: csvReport ? '#4ade80' : 'transparent', border: '1px solid #4ade80', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0, marginTop: 1 }}>
            <span style={{ color: '#000', fontSize: 11, fontWeight: 800 }}>{csvReport ? '✓' : ''}</span>
          </span>
          <span>
            <div style={{ fontSize: 14, color: 'var(--ink)' }}>После завершения автообновления сохранять CSV-отчёт</div>
            <div style={{ fontSize: 12, color: 'var(--ink-mute)', marginTop: 4, lineHeight: 1.5 }}>Файл хранится на сервере; после завершения запуска его можно скачать здесь.</div>
          </span>
        </label>
        {status?.has_csv_report && (
          <div style={{ marginTop: 12, display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 10, flexWrap: 'wrap' }}>
            <button
              onClick={downloadLastAutoRefreshReport}
              disabled={reportDownloading}
              style={{ padding: '9px 14px', borderRadius: 10, border: '1px solid var(--line)', background: 'rgba(255,255,255,0.04)', color: 'var(--ink)', cursor: 'pointer', fontSize: 13, opacity: reportDownloading ? 0.6 : 1 }}
            >
              {reportDownloading ? 'Скачиваю…' : 'Скачать отчёт последнего автообновления (CSV)'}
            </button>
            {status?.report_generated_at && (
              <span className="mono" style={{ fontSize: 11, color: 'var(--ink-mute)' }}>
                Сформирован: {new Date(status.report_generated_at).toLocaleString('ru-RU')}
              </span>
            )}
          </div>
        )}
      </div>

      <div style={{ padding: 16, borderRadius: 12, background: 'rgba(255,255,255,0.015)', border: '1px solid var(--line)', marginBottom: 12 }}>
        <label style={{ display: 'flex', gap: 12, alignItems: 'flex-start', cursor: 'pointer' }}>
          <span onClick={() => setWarmEnabled((v) => !v)} style={{ width: 18, height: 18, borderRadius: 5, background: warmEnabled ? '#4ade80' : 'transparent', border: '1px solid #4ade80', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0, marginTop: 1 }}>
            <span style={{ color: '#000', fontSize: 11, fontWeight: 800 }}>{warmEnabled ? '✓' : ''}</span>
          </span>
          <span>
            <div style={{ fontSize: 14, color: 'var(--ink)' }}>Прогрев Facebook</div>
            <div style={{ fontSize: 12, color: 'var(--ink-mute)', marginTop: 4, lineHeight: 1.5 }}>
              Reels во 2-й вкладке параллельно съёму FB (пока идёт прогон). TikTok — manage.py warm_tiktok_session.
            </div>
          </span>
        </label>
      </div>

      <div style={{ padding: 16, borderRadius: 12, background: 'rgba(255,255,255,0.015)', border: '1px solid var(--line)', marginBottom: 18 }}>
        <div style={{ display: 'flex', gap: 16, flexWrap: 'wrap' }}>
          <label style={{ display: 'flex', gap: 8, alignItems: 'center', cursor: 'pointer', color: 'var(--ink-dim)', fontSize: 13 }}>
            <input type="checkbox" checked={includeHiddenPlatform} onChange={(e) => setIncludeHiddenPlatform(e.target.checked)} />
            Учитывать скрытые платформы
          </label>
          <label style={{ display: 'flex', gap: 8, alignItems: 'center', cursor: 'pointer', color: 'var(--ink-dim)', fontSize: 13 }}>
            <input type="checkbox" checked={includeHiddenProfile} onChange={(e) => setIncludeHiddenProfile(e.target.checked)} />
            Учитывать скрытые профили
          </label>
        </div>
      </div>

      <div style={{ display: 'flex', gap: 6, padding: 4, borderRadius: 12, background: 'rgba(255,255,255,0.025)', border: '1px solid var(--line)', marginBottom: 16 }}>
        {[['interval', 'Каждые N часов'], ['times', 'В определённое время']].map(([id, l]) => (
          <button key={id} onClick={() => setMode(id)} style={{
            flex: 1, padding: '10px 14px', borderRadius: 9, border: 'none', cursor: 'pointer',
            background: mode === id ? '#fff' : 'transparent',
            color: mode === id ? '#000' : 'var(--ink-dim)', fontSize: 13, fontWeight: 500,
          }}>{l}</button>
        ))}
      </div>

      <div className="mono" style={{
        fontSize: 11, color: 'var(--ink-mute)', letterSpacing: '0.2em', marginBottom: 10,
        opacity: auto ? 1 : 0.55,
      }}>ВРЕМЯ ОБНОВЛЕНИЯ · MSK</div>
      {mode === 'times' ? (
        <>
          <div style={{
            display: 'flex', flexWrap: 'wrap', gap: 8, alignItems: 'center', marginBottom: 8,
            opacity: auto ? 1 : 0.45, pointerEvents: auto ? 'auto' : 'none',
          }}>
            {pillsRowTimes.map((t) => (
              <Pill
                key={t}
                active={auto && selectedTimes.includes(t)}
                onClick={() => { if (auto) toggleTime(t); }}
                title={!auto
                  ? `${t}: автообновление выключено`
                  : (selectedTimes.includes(t) ? `${t}: в расписании (нажмите, чтобы убрать)` : `${t}: не в расписании (нажмите, чтобы добавить)`)}
              >
                <span className="mono">{t}</span>
              </Pill>
            ))}
            <button
              type="button"
              onClick={() => { if (auto) setTimesModalOpen(true); }}
              disabled={!auto}
              title={auto ? 'Управление временем автообновления' : 'Сначала включите автообновление'}
              aria-label="Управление временем автообновления"
              style={{
                width: 40,
                height: 40,
                borderRadius: 999,
                border: '1px solid var(--line)',
                background: 'rgba(255,255,255,0.04)',
                color: 'var(--ink-dim)',
                display: 'inline-flex',
                alignItems: 'center',
                justifyContent: 'center',
                cursor: auto ? 'pointer' : 'default',
                flexShrink: 0,
                opacity: auto ? 1 : 0.5,
              }}
            >
              <ClockIcon size={18} />
            </button>
          </div>
          <p style={{ margin: '0 0 18px', fontSize: 12, color: 'var(--ink-mute)', lineHeight: 1.45 }}>
            {auto
              ? 'Нажмите на время — включить или выключить слот (серый = выключен); изменения сразу пишутся на сервер. Дополнительные слоты — по иконке часов. Остальные настройки — кнопкой «Сохранить».'
              : 'Слоты неактивны, пока автообновление выключено (как на бродкасте: AUTO · OFF).'}
          </p>
          {timesModalOpen && (
            <ScheduleTimesEditorModal
              accent={accent}
              customSlots={customScheduleSlots}
              onClose={() => setTimesModalOpen(false)}
              onApply={(nextCustom) => {
                const prevCustom = customScheduleSlots;
                const removed = prevCustom.filter((c) => !nextCustom.includes(c));
                const added = nextCustom.filter((c) => !prevCustom.includes(c));
                setCustomScheduleSlots(_sortScheduleTimes(nextCustom));
                setSelectedTimes((prev) => {
                  let next = prev.filter((t) => !removed.includes(t));
                  for (const t of added) {
                    if (!next.includes(t)) next = [...next, t];
                  }
                  next = _sortScheduleTimes(next);
                  void persistTimeSlots(next);
                  return next;
                });
              }}
            />
          )}
        </>
      ) : (
        <input type="number" min={1} max={48} value={intervalHours} onChange={(e) => setIntervalHours(Number(e.target.value || 1))} style={{ width: '100%', marginBottom: 18, padding: '11px 14px', borderRadius: 10, background: 'rgba(255,255,255,0.025)', border: '1px solid var(--line-2)', color: 'var(--ink)', fontSize: 13, fontFamily: 'JetBrains Mono, monospace' }} />
      )}

      <div className="mono" style={{ fontSize: 11, color: 'var(--ink-mute)', letterSpacing: '0.2em', marginBottom: 10 }}>ОХВАТ АВТООБНОВЛЕНИЯ</div>
      <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8, marginBottom: 10 }}>
        <button
          type="button"
          onClick={() => setPlatformsModalOpen(true)}
          title="Какие платформы участвуют в автообновлении"
          style={{
            padding: '10px 14px',
            borderRadius: 999,
            border: '1px solid var(--line)',
            background: 'rgba(255,255,255,0.04)',
            color: 'var(--ink)',
            cursor: 'pointer',
            fontSize: 13,
            display: 'inline-flex',

function AddOneInline({ accent, onDataChanged, onClose }) {
  const isCompact = useIsMobile(1160);

  const [platform, setPlatform] = useStateMd(PLATFORMS[0]?.id || 'tiktok');
  const [username, setUsername] = useStateMd('');
  const [profileId, setProfileId] = useStateMd('none');
  const [busy, setBusy] = useStateMd(false);
  const [profileBusy, setProfileBusy] = useStateMd(false);
  const [profileEditorOpen, setProfileEditorOpen] = useStateMd(false);
  const createProfileInline = async ({ name, color }) => {
    const profileName = String(name || '').trim();
    if (!profileName) return;
    setProfileBusy(true);
    try {
      const created = await _postJson('/api/accounts/profiles/', { name: profileName, color: color || '#6366f1' });
      const createdId = created?.id != null ? String(created.id) : null;
      await onDataChanged?.();
      if (createdId) setProfileId(createdId);
      await uiAlert(`Профиль "${profileName}" добавлен.`, 'Профили');
      setProfileEditorOpen(false);
    } catch (e) {
      await uiAlert(`Не удалось добавить профиль: ${e instanceof Error ? e.message : String(e)}`, 'Ошибка');
    } finally {
      setProfileBusy(false);
    }
  };
  const addOne = async () => {
    if (!username.trim()) return;
    setBusy(true);
    try {
      await _postJson('/api/accounts/', {
        platform,
        username: username.trim().replace(/^@/, ''),
        profile_id: profileId === 'none' ? null : Number(profileId),
      });
      await onDataChanged?.();
      setUsername('');
      await uiAlert('Аккаунт добавлен.', 'Добавление аккаунта');
    } catch (e) {
      await uiAlert(`Ошибка добавления: ${e instanceof Error ? e.message : String(e)}`, 'Ошибка');
    } finally {
      setBusy(false);
    }
  };
  return (
    <ModalShell title="Добавить аккаунт" kicker="QUICK ADD" accent={accent} width={900} offsetY="-20%" onClose={onClose}>

        <div style={{ minWidth: 0 }}>
          <div className="mono" style={{ fontSize: 11, color: 'var(--ink-mute)', letterSpacing: '0.2em', marginBottom: 8 }}>ПЛАТФОРМА</div>
          <select value={platform} onChange={(e) => setPlatform(e.target.value)} style={{ width: '100%', padding: '11px 14px', borderRadius: 10, background: 'rgba(255,255,255,0.04)', border: '1px solid var(--line-2)', color: 'var(--ink)', fontSize: 13, fontFamily: 'inherit' }}>
            {PLATFORMS.map(p => <option key={p.id} value={p.id} style={{ color: '#ffffff', background: '#374151' }}>{p.label}</option>)}
          </select>
        </div>
        <div style={{ minWidth: 0 }}>
          <div className="mono" style={{ fontSize: 11, color: 'var(--ink-mute)', letterSpacing: '0.2em', marginBottom: 8 }}>USERNAME</div>
          <input value={username} onChange={(e) => setUsername(e.target.value)} placeholder="@username" style={{ width: '100%', padding: '11px 14px', borderRadius: 10, background: 'rgba(255,255,255,0.025)', border: '1px solid var(--line-2)', color: 'var(--ink)', fontSize: 14, fontFamily: 'JetBrains Mono, monospace' }} />
        </div>
        <div style={{ minWidth: 0 }}>
          <div className="mono" style={{ fontSize: 11, color: 'var(--ink-mute)', letterSpacing: '0.2em', marginBottom: 8 }}>ПРОФИЛЬ</div>
          <div style={{ display: 'grid', gridTemplateColumns: isCompact ? '1fr auto' : 'minmax(0,1fr) auto', gap: 8 }}>
            <ProfilePicker accent={accent} value={profileId} onChange={setProfileId} />
            <button
              onClick={() => setProfileEditorOpen(true)}
              disabled={profileBusy}
              style={{ padding: '11px 12px', borderRadius: 10, border: '1px solid var(--line)', background: 'rgba(255,255,255,0.04)', color: 'var(--ink)', cursor: profileBusy ? 'default' : 'pointer', fontSize: 13, opacity: profileBusy ? 0.7 : 1 }}

        </div>
      </div>
      <div style={{ display: 'flex', gap: 10, marginTop: 22, justifyContent: 'flex-end', flexDirection: isMobile ? 'column' : 'row' }}>

        <button onClick={addOne} disabled={busy} style={{ padding: '10px 24px', borderRadius: 10, background: accent, color: '#000', border: 'none', fontSize: 13, fontWeight: 600, cursor: 'pointer', opacity: busy ? 0.6 : 1 }}>{busy ? 'Добавление...' : 'Добавить'}</button>
