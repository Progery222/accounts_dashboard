server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25M;

    # Бэкенд резолвится в рантайме, чтобы nginx не падал при старте, если
    # контейнер backend ещё не готов или его нет вовсе (Railway: тут
    # location /api/ просто не используется, фронт ходит напрямую через
    # VITE_API_URL).
    resolver 127.0.0.11 8.8.8.8 valid=10s ipv6=off;

    # Django API.
    location /api/ {
        set $backend_upstream "${BACKEND_UPSTREAM}";
        proxy_pass http://$backend_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Refresh аккаунтов может быть долгим (Playwright скрап), не режем.
        proxy_read_timeout  600s;
        proxy_send_timeout  600s;
        proxy_connect_timeout 30s;
    }

    # Django admin.
    location /admin/ {
        set $backend_upstream "${BACKEND_UPSTREAM}";
        proxy_pass http://$backend_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django static (collectstatic, WhiteNoise) — без него админка без CSS.
    location /static/ {
        set $backend_upstream "${BACKEND_UPSTREAM}";
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        access_log off;
    }

    # /healthz/ бэкенда (с слэшем) — отправляем в backend, чтобы можно было
    # дёрнуть БД-проверку. /healthz без слэша — статичный ответ nginx.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
    location = /healthz/ {
        set $backend_upstream "${BACKEND_UPSTREAM}";
        proxy_pass http://$backend_upstream;
        access_log off;
    }

    # Кэш для статики Vite (хеши в именах).
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|webp|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # SPA fallback: любые маршруты отдают index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
