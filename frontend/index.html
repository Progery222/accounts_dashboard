<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AccountsStats</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
<meta name="theme-color" content="#4B38B8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   ТОКЕНЫ
   ============================================================ */
:root {
  --paper:       #FAF9F5;
  --surface:     #FFFFFF;
  --surface-2:   #FCFBF8;
  --ink:         #171614;
  --ink-2:       #55514A;
  --ink-3:       #8A857C;
  --line:        #E7E3DA;
  --line-2:      #D6D1C6;
  --line-soft:   #F1EDE5;
  --chip:        #F2EFE8;
  --seg-on:      #FFFFFF;
  /* Свой цвет каждой метрике: иначе пять одинаковых белых плиток */
  --m1: #5B44D9; --m1s: #EFECFD;
  --m2: #0F7080; --m2s: #E4F1F2;
  --m3: #B4356B; --m3s: #FBEAF0;
  --m4: #A15C00; --m4s: #FCF0E1;
  --m5: #1D6FA5; --m5s: #E7F0F8;
  --accent:      #4B38B8;
  --accent-ink:  #FFFFFF;
  --accent-soft: #EEEBFB;
  --accent-line: #C9C2F0;
  --accent-row:  #F8F6FE;
  --spark:       #C9C2F0;
  --pos:         #1B7F53;
  --neg:         #B0342A;
  --warn:        #A15C00;
  --pos-soft:    #E8F3ED;
  --neg-soft:    #FBEAE8;
  --warn-soft:   #FDF1E7;
  --overlay:     rgba(23,22,20,0.38);
  --shadow-sm:   0 1px 2px rgba(23,22,20,0.07);
  --shadow-md:   0 4px 16px rgba(23,22,20,0.10);
  --shadow-lg:   0 16px 48px rgba(23,22,20,0.20);
  --bar-ink:     #171614;
  --bar-surface: #2A2825;
  --bar-line:    #3A3833;
  --bar-text:    #F5F2EC;
  --bar-danger:  #F2A9A2;
}
[data-theme="dark"] {
  --paper:       #131215;
  --surface:     #1A191E;
  --surface-2:   #1E1D23;
  --ink:         #F2F0EC;
  --ink-2:       #ABA69E;
  --ink-3:       #7C776F;
  --line:        #2C2A31;
  --line-2:      #3A3841;
  --line-soft:   #232228;
  --chip:        #24232A;
  --seg-on:      #35333D;
  --m1: #9B8CFF; --m1s: #262138;
  --m2: #63D6C4; --m2s: #172B2A;
  --m3: #E88BC0; --m3s: #2E1D27;
  --m4: #E0A64A; --m4s: #2C2317;
  --m5: #7FB8E8; --m5s: #1B2733;
  --accent:      #9B8CFF;
  --accent-ink:  #16141F;
  --accent-soft: #262138;
  --accent-line: #3E3663;
  --accent-row:  #1E1B2A;
  --spark:       #5B4E96;
  --pos:         #4FBF8B;
  --neg:         #F0776B;
  --warn:        #E0A64A;
  --pos-soft:    #17281F;
  --neg-soft:    #2C1C1A;
  --warn-soft:   #2A2216;
  --overlay:     rgba(6,5,8,0.62);
  --shadow-sm:   0 1px 2px rgba(0,0,0,0.4);
  --shadow-md:   0 4px 16px rgba(0,0,0,0.45);
  --shadow-lg:   0 16px 48px rgba(0,0,0,0.6);
  --bar-ink:     #262430;
  --bar-surface: #35323F;
  --bar-line:    #46424F;
  --bar-text:    #F2F0EC;
  --bar-danger:  #F0776B;
}

/* Светлый неон: холодная бумага, голубой акцент, то же свечение. */
[data-theme="neon-light"] {
  --paper:       #F1F6FB;
  --surface:     #FFFFFF;
  --surface-2:   #F7FBFE;
  --ink:         #0F1A2A;
  --ink-2:       #46566E;
  --ink-3:       #7C8AA3;
  --line:        #DDE8F2;
  --line-2:      #C5D4E4;
  --line-soft:   #ECF3F9;
  --chip:        #E5EFF8;
  --seg-on:      #FFFFFF;
  --accent:      #0E7490;
  --accent-ink:  #FFFFFF;
  --accent-soft: #DFF2F8;
  --accent-line: #9FD6E6;
  --accent-row:  #EEF8FB;
  --spark:       #9FD6E6;
  --pos:         #0F8A6A;
  --neg:         #D93A5B;
  --warn:        #B06A00;
  --pos-soft:    #E1F5EF;
  --neg-soft:    #FBE7EB;
  --warn-soft:   #FBF0DE;
  --overlay:     rgba(15,26,42,0.34);
  --shadow-sm:   0 1px 2px rgba(15,26,42,0.07);
  --shadow-md:   0 6px 22px rgba(14,116,144,0.14);
  --shadow-lg:   0 18px 52px rgba(14,116,144,0.22);
  --bar-ink:     #0F1A2A;
  --bar-surface: #26364B;
  --bar-line:    #3A4B63;
  --bar-text:    #F1F6FB;
  --bar-danger:  #FF9AAC;
  --m1: #0E7490; --m1s: #DFF2F8;
  --m2: #2563C7; --m2s: #E5EDFB;
  --m3: #C2379A; --m3s: #FBE6F4;
  --m4: #B06A00; --m4s: #FBF0DE;
  --m5: #6D46D6; --m5s: #EDE7FC;
}
[data-theme="neon-light"] body {
  background-image:
    radial-gradient(60% 40% at 80% -8%, rgba(14,116,144,.13), transparent 62%),
    radial-gradient(50% 40% at 8% 2%, rgba(37,99,199,.10), transparent 60%);
  background-attachment: fixed;
}

/* Неон: тёмно-синяя база, малиновый акцент, мягкое свечение.
   Третья тема, а не замена — светлая и тёмная остаются. */
[data-theme="neon"] {
  --paper:       #090D1A;
  --surface:     #121A2E;
  --surface-2:   #17203A;
  --ink:         #EAEFFB;
  --ink-2:       #A3AECB;
  --ink-3:       #6B7799;
  --line:        #1F2A44;
  --line-2:      #2C3A5C;
  --line-soft:   #18213A;
  --chip:        #1A2440;
  --seg-on:      #2A3654;
  --accent:      #FF3B57;
  --accent-ink:  #0B1020;
  --accent-soft: #2A1226;
  --accent-line: #5A2338;
  --accent-row:  #1B1730;
  --spark:       #7A3A54;
  --pos:         #2FE0A8;
  --neg:         #FF5470;
  --warn:        #FFC24B;
  --pos-soft:    #0F2E28;
  --neg-soft:    #2E1220;
  --warn-soft:   #2E2413;
  --overlay:     rgba(4,7,16,0.74);
  --shadow-sm:   0 1px 2px rgba(0,0,0,0.5);
  --shadow-md:   0 8px 28px rgba(0,0,0,0.55);
  --shadow-lg:   0 18px 60px rgba(0,0,0,0.72);
  --bar-ink:     #1A2440;
  --bar-surface: #2A3654;
  --bar-line:    #3A486A;
  --bar-text:    #EAEFFB;
  --bar-danger:  #FF5470;
  --m1: #FF3B57; --m1s: #2A1220;
  --m2: #2FD9F5; --m2s: #0E2733;
  --m3: #C86BFF; --m3s: #241333;
  --m4: #FFC24B; --m4s: #2E2413;
  --m5: #4D8BFF; --m5s: #131F3D;
}
/* Свечение и стекло — только в неоне */
[data-theme="neon"] body {
  background-image:
    radial-gradient(60% 40% at 78% -8%, rgba(255,59,87,.14), transparent 62%),
    radial-gradient(50% 40% at 10% 4%, rgba(77,139,255,.10), transparent 60%);
  background-attachment: fixed;
}
[data-theme="neon"] .appbar,
[data-theme="neon"] .ribbon { background: rgba(18,26,46,.82); backdrop-filter: blur(12px); }
[data-theme="neon-light"] .appbar,
[data-theme="neon-light"] .ribbon { background: rgba(255,255,255,.78); backdrop-filter: blur(12px); }
[data-theme="neon"] .card { box-shadow: inset 0 1px 0 rgba(255,255,255,.035); }
[data-theme="neon-light"] .card { box-shadow: 0 1px 2px rgba(15,26,42,.05); }
[data-theme="neon"] .kpi .ico,
[data-theme="neon-light"] .kpi .ico { box-shadow: 0 0 14px -2px var(--tone); }
[data-theme="neon"] .kpi .val { text-shadow: 0 0 22px rgba(234,239,251,.10); }
[data-theme="neon"] .btn.pri { box-shadow: 0 0 0 1px rgba(255,59,87,.30), 0 6px 20px -6px rgba(255,59,87,.55); }
[data-theme="neon-light"] .btn.pri { box-shadow: 0 6px 20px -6px rgba(14,116,144,.65); }
[data-theme="neon"] .bar, [data-theme="neon"] .bar i,
[data-theme="neon-light"] .bar, [data-theme="neon-light"] .bar i { border-radius: 999px; }
[data-theme="neon"] .bar i,
[data-theme="neon-light"] .bar i { filter: drop-shadow(0 0 6px currentColor); }
[data-theme="neon"] .hours i,
[data-theme="neon-light"] .hours i { border-radius: 999px; filter: drop-shadow(0 0 5px var(--accent)); }
[data-theme="neon"] .ribbon .track i,
[data-theme="neon-light"] .ribbon .track i { box-shadow: 0 0 12px -2px var(--accent); }
[data-theme="neon"] .td:hover { background: rgba(255,59,87,.045); }
[data-theme="neon"] .pmark,
[data-theme="neon-light"] .pmark { box-shadow: inset 0 0 0 1px currentColor; }

/* ============================================================
   БАЗА
   ============================================================ */
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: 'Onest', 'Segoe UI', system-ui, sans-serif;
  font-size: 13px;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; }
input { font: inherit; color: inherit; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 6px; border: 3px solid var(--paper); }
.mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
.lbl { font-size: 10px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.grow { flex-grow: 1; }
.muted { color: var(--ink-3); }
.trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
svg { flex-shrink: 0; }

/* ============================================================
   КОМПОНЕНТЫ
   ============================================================ */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  height: 32px; padding: 0 11px;
  border: 1px solid var(--line-2); border-radius: 8px;
  background: var(--surface); color: var(--ink-2);
  font-size: 12px; font-weight: 500; white-space: nowrap;
  transition: background .12s, border-color .12s, color .12s;
}
.btn:hover { border-color: var(--ink-3); color: var(--ink); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.pri:hover { filter: brightness(1.08); color: var(--accent-ink); }
.btn.dgr { color: var(--neg); border-color: var(--neg-soft); }
.btn.dgr:hover { border-color: var(--neg); }
.btn.on { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); }
.btn.sm { height: 28px; padding: 0 9px; font-size: 11px; border-radius: 7px; }
.btn.ico { width: 32px; padding: 0; justify-content: center; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--chip); border-color: transparent; }
.btn:disabled { opacity: .55; cursor: default; pointer-events: none; }
.btn .spin-ico { animation: btnSpin .75s linear infinite; }
@keyframes btnSpin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .btn .spin-ico { animation: none; } }

.seg { display: flex; background: var(--chip); border-radius: 8px; padding: 2px; gap: 2px; }
.seg button {
  padding: 5px 10px; border-radius: 6px; font-size: 11px; font-weight: 500;
  color: var(--ink-3); font-family: 'IBM Plex Mono', monospace;
}
.seg button.on { background: var(--seg-on); color: var(--ink); box-shadow: var(--shadow-sm); }
.seg.ico button { width: 28px; height: 28px; padding: 0; display: flex; align-items: center; justify-content: center; }

.field {
  display: flex; align-items: center; gap: 8px;
  height: 32px; padding: 0 10px;
  border: 1px solid var(--line-2); border-radius: 8px;
  background: var(--surface); color: var(--ink-3);
}
.field:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.field input { border: none; outline: none; background: none; width: 100%; font-size: 12px; color: var(--ink); }
.field input::placeholder { color: var(--ink-3); }

.kbd {
  font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 500; color: var(--ink-3);
  border: 1px solid var(--line); background: var(--surface-2); border-radius: 4px; padding: 2px 6px;
}
.pill {
  display: inline-flex; align-items: center; gap: 5px;
  height: 18px; padding: 0 7px; border-radius: 5px;
  font-size: 10px; font-weight: 600; white-space: nowrap;
  border: none; cursor: default; font-family: inherit; line-height: 1;
}
button.pill { cursor: pointer; }
button.pill:hover { filter: brightness(1.12); }
button.pill.open { outline: 1px solid color-mix(in srgb, currentColor 35%, transparent); }
.pmark {
  width: 20px; height: 20px; border-radius: 6px; flex-shrink: 0;
  font-size: 9px; font-weight: 700; letter-spacing: .02em;
  display: flex; align-items: center; justify-content: center;
}
.dot { width: 6px; height: 6px; border-radius: 3px; flex-shrink: 0; }
.av { width: 30px; height: 30px; border-radius: 9px; background: var(--line-soft); flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: var(--ink-3); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.cbx {
  width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--line-2);
  display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer;
  position: relative; box-sizing: border-box;
}
.cbx.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
/* Увеличенная зона клика — по 18px чекбоксу в узкой колонке легко промахнуться. */
.cbx[data-act="sel"]::before,
.cbx[data-act="sel-page"]::before {
  content: "";
  position: absolute;
  inset: -12px;
}
.sw { width: 34px; height: 20px; border-radius: 10px; background: var(--line-2); position: relative; flex-shrink: 0; transition: background .15s; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 8px; background: #fff; transition: left .15s; }
.sw.on { background: var(--accent); }
.sw.on::after { left: 16px; }
.sw[data-act] { cursor: pointer; border: 0; padding: 0; display: inline-block; vertical-align: middle; }
.sw[data-act]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ============================================================
   КАРКАС
   ============================================================ */
/* Оболочка приложения зафиксирована по высоте окна: шапка, лента прогона и
   левый рельс всегда на месте, скроллится только рабочая область. */
#app { height: 100vh; display: flex; flex-direction: column; overflow: hidden; position: relative; z-index: 1; }
/* Фоновая россыпь значков площадок. Картинка собирается в JS из тех же
   глифов и цветов текущей темы, поэтому фон меняется вместе с ней. */
.bgfx {
  position: fixed; inset: -12px; z-index: 0; pointer-events: none;
  background-image: var(--bgfx); background-size: 340px 340px;
  filter: blur(1.1px); opacity: .05;
}
[data-theme="dark"] .bgfx { opacity: .07; }
[data-theme="neon-light"] .bgfx { opacity: .11; filter: blur(1.3px); }
[data-theme="neon"] .bgfx { opacity: .16; filter: blur(1.4px) drop-shadow(0 0 6px currentColor); }
@media (prefers-reduced-motion: reduce) { .bgfx { filter: blur(1px); } }

.appbar {
  height: 56px; flex-shrink: 0; z-index: 40;
  background: var(--surface); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 16px; padding: 0 16px;
}
.brand { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.brand-mark { width: 26px; height: 26px; border-radius: 8px; background: var(--ink); color: var(--paper); display: flex; align-items: center; justify-content: center; }
.brand-name { font-size: 14px; font-weight: 600; letter-spacing: -.01em; }
.cmd { width: min(460px, 46vw); }

.ribbon {
  height: 44px; flex-shrink: 0; z-index: 39;
  background: var(--surface); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 14px; padding: 0 16px;
}
.ribbon .track { flex-grow: 1; max-width: 380px; height: 5px; border-radius: 3px; background: var(--line-soft); overflow: hidden; }
.ribbon .track i { display: block; height: 5px; border-radius: 3px; background: var(--accent); transition: width .4s ease; }

.body { flex: 1 1 0; display: flex; min-height: 0; }

.rail {
  width: 236px; flex-shrink: 0; border-right: 1px solid var(--line);
  padding: 16px 12px; display: flex; flex-direction: column; gap: 22px;
  height: 100%; overflow-y: auto;
}
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button {
  display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px;
  border-radius: 8px; color: var(--ink-2); font-size: 13px; font-weight: 500; text-align: left;
}
.nav button:hover { background: var(--chip); }
.nav button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.rail-sec { display: flex; flex-direction: column; gap: 6px; }
.rail-sec .hd { display: flex; align-items: center; justify-content: space-between; padding: 0 10px; }
.rail-item {
  display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px;
  border-radius: 7px; font-size: 12px; color: var(--ink-2); border: 1px solid transparent; text-align: left; width: 100%;
}
.rail-item:hover { background: var(--chip); }
.rail-item.on { background: var(--surface); border-color: var(--line); color: var(--ink); font-weight: 500; }
.rail-sub { display: flex; flex-direction: column; gap: 1px; margin: 2px 0 4px 10px; padding-left: 8px; border-left: 1px solid var(--line); }
.rail-sub .rail-item { height: 28px; font-size: 12px; }
/* Чип применённого фильтра в шапке таблицы */
.chip-f {
  display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 9px;
  border: 1px solid var(--accent-line); background: var(--accent-soft); color: var(--accent);
  border-radius: 8px; font-size: 12px; font-weight: 500; max-width: 220px;
}
.chip-f:hover { border-color: var(--accent); }
.chip-f .trunc { max-width: 130px; }

.main { flex: 1 1 0; min-width: 0; padding: 20px 24px 96px; display: flex; flex-direction: column; overflow-y: auto; }
/* .main прокручивается сам, поэтому его дети не должны ужиматься под его высоту.
   Ширину страницы задаёт --page-max, содержимое центрируется: иначе на широком
   мониторе всё липнет к левому краю. */
.main > * { flex-shrink: 0; width: 100%; max-width: var(--page-max, 1680px); margin-inline: auto; }
/* В режиме таблицы прокручиваются только строки — KPI и фильтры остаются на месте */
.main.fixed { overflow: hidden; padding-bottom: 20px; }
.main.fixed .tbl { flex: 1 1 0; min-height: 0; }
.main.fixed .tbl-scroll { flex: 1 1 0; min-height: 0; overflow: auto; }
.page-hd { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.page-hd h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -.015em; }
.count { font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 500; color: var(--ink-2); background: var(--chip); border-radius: 6px; padding: 3px 7px; }

/* KPI */
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 12px; margin-bottom: 14px; }
.kpi { padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.kpi .val { font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500; letter-spacing: -.03em; line-height: 1; }
/* Одометр живого счётчика: разряд прокручивается, а не подменяется.
   Каждая цифра — окошко высотой в строку, внутри лента 0…9 дважды. Перенос
   через девятку едет вперёд на второй круг, после чего лента возвращается
   на тот же разряд уже без анимации — иначе она отматывалась бы назад.
   Цифры моноширинные, поэтому ширина окошка не скачет.
   Сдвиг ленты ставим прямым transform, а не через var(--i): незарегистрированные
   CSS-переменные не интерполируются, поэтому с ними переход не запускается
   вовсе — цифра прыгала бы, и transitionend не приходил. */
.odo { display: inline-flex; align-items: flex-start; }
/* line-height жёстко 1: шаг ленты — ровно 1em, а у эфира на .tv-hero-xl
   стоит .95, и без этого глиф внутри каждой ячейки съезжал на .05em,
   так что в разряде проступала соседняя цифра. */
.odo-c { display: block; height: 1em; overflow: hidden; line-height: 1; }
.odo-s { display: block; transform: translateY(0);
         transition: transform 3s cubic-bezier(.16, .72, .24, 1.06); }
.odo-s > i { display: block; height: 1em; line-height: 1; font-style: normal; }
@media (prefers-reduced-motion: reduce) { .odo-s { transition: none; } }
.kpi .hd { display: flex; align-items: center; gap: 8px; }
.kpi .hd .lbl { color: var(--tone); }
.kpi .ico { width: 22px; height: 22px; border-radius: 7px; flex-shrink: 0;
            background: var(--tone-soft); color: var(--tone);
            display: flex; align-items: center; justify-content: center; }
.acard { position: relative; }
.acard::before { content: ""; position: absolute; left: 14px; right: 14px; top: 0; height: 2px;
                 border-radius: 0 0 2px 2px; background: var(--pl); opacity: .85; }
.kpi .ft { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }

.delta { display: inline-flex; align-items: center; gap: 4px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 500; }
.delta.up { color: var(--pos); }
.delta.dn { color: var(--neg); }
.delta.ze { color: var(--ink-3); }

/* Фильтры */
.filters { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.sel {
  display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px;
  border: 1px solid var(--line-2); border-radius: 8px; background: var(--surface);
  font-size: 12px; font-weight: 500; color: var(--ink); white-space: nowrap;
}
.sel:hover { border-color: var(--ink-3); }
.sel.on { border-color: var(--accent-line); background: var(--accent-soft); color: var(--accent); }
.sel.open { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.sel > .trunc { max-width: 190px; }

/* Своё выпадающее меню вместо системного <select> */
.menu {
  position: fixed; z-index: 90;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  box-shadow: var(--shadow-md); padding: 6px; overflow-y: auto;
  animation: menuIn .12s cubic-bezier(.2,.7,.3,1);
}
@keyframes menuIn { from { opacity: 0; transform: translateY(-4px) } to { opacity: 1; transform: none } }
.menu button {
  display: flex; align-items: center; gap: 9px; width: 100%; min-height: 32px;
  padding: 0 9px; border-radius: 7px; font-size: 13px; color: var(--ink-2); text-align: left;
}
.menu button:hover { background: var(--chip); color: var(--ink); }
.menu button.on { color: var(--accent); font-weight: 600; }
.menu .mi-check { margin-left: auto; opacity: 0; flex-shrink: 0; }
.menu button.on .mi-check { opacity: 1; }
.menu .menu-hd { font-size: 10px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); padding: 8px 9px 4px; }

/* Таблица */
.tbl { overflow: hidden; display: flex; flex-direction: column; }
.tbl-scroll { overflow-x: auto; }
.tr { display: grid; align-items: center; padding: 0 16px; }
.th {
  height: 38px; border-bottom: 1px solid var(--line); background: var(--surface-2);
  position: sticky; top: 0; z-index: 5;
}
.th > div { font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.th button { display: inline-flex; align-items: center; gap: 4px; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; }
.th button:hover { color: var(--ink); }
.th .sorted { color: var(--accent); }
.td {
  border-bottom: 1px solid var(--line-soft); cursor: pointer;
  position: relative; transition: background .12s;
}
.td::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px;
  background: var(--accent); opacity: 0; transition: opacity .12s;
}
.td:last-child { border-bottom: none; }
.td:hover { background: var(--surface-2); }
.td:hover::before { opacity: .45; }
.td.sel { background: var(--accent-row); }
.td.sel::before { opacity: 1; }
/* Компактный режим: строки ниже, второстепенная подпись скрыта */
.tbl.dense .acc .d { display: none; }
.tbl.dense .acc { gap: 8px; }
.num { text-align: right; font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 500; }
.sub { font-family: 'IBM Plex Mono', monospace; font-size: 11px; }
.acc { display: flex; align-items: center; gap: 10px; min-width: 0; }
.acc .hn { display: flex; align-items: center; gap: 6px; }
.acc .h { font-size: 13px; font-weight: 600; letter-spacing: -.01em; }
.acc .d { font-size: 11px; color: var(--ink-3); margin-top: 1px; }
.tfoot { height: 44px; border-top: 1px solid var(--line); background: var(--surface-2); display: flex; align-items: center; padding: 0 16px; gap: 12px; flex-wrap: wrap; }
.pager { display: flex; align-items: center; gap: 4px; }
.pager button { min-width: 28px; height: 28px; border-radius: 7px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--ink-2); display: flex; align-items: center; justify-content: center; padding: 0 6px; }
.pager button:hover { background: var(--chip); }
.pager button.on { background: var(--accent); color: var(--accent-ink); font-weight: 500; }
.pager button:disabled { opacity: .4; cursor: default; }
.pager button:disabled:hover { background: none; }

/* Карточки */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap: 12px; }
.acard { padding: 14px; display: flex; flex-direction: column; gap: 12px; cursor: pointer; }
.acard:hover { border-color: var(--line-2); box-shadow: var(--shadow-sm); }
.acard.sel { border-color: var(--accent-line); background: var(--accent-row); }
.acard .row3 { display: flex; gap: 18px; border-top: 1px solid var(--line-soft); padding-top: 10px; }

/* Панель массовых действий */
.bulk {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 50;
  display: flex; align-items: center; gap: 6px; padding: 8px 8px 8px 14px;
  background: var(--bar-ink); border-radius: 12px; box-shadow: var(--shadow-lg);
  max-width: calc(100vw - 32px); overflow-x: auto;
  animation: barIn .2s cubic-bezier(.2,.7,.3,1);
}
.bulk .n { font-size: 12px; font-weight: 600; color: var(--bar-text); white-space: nowrap; }
.bulk .sep { width: 1px; height: 20px; background: var(--bar-line); margin: 0 4px; flex-shrink: 0; }
.bulk button {
  display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px;
  border-radius: 8px; background: var(--bar-surface); color: var(--bar-text);
  font-size: 12px; font-weight: 500; white-space: nowrap;
}
.bulk button:hover { filter: brightness(1.25); }
.bulk button.dgr { color: var(--bar-danger); }

/* Модалки */
@keyframes scrimIn { from { opacity: 0 } to { opacity: 1 } }
@keyframes modalIn { from { opacity: 0; transform: translateY(-10px) scale(.985) } to { opacity: 1; transform: none } }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 10px) } to { opacity: 1; transform: translate(-50%, 0) } }
@keyframes barIn   { from { opacity: 0; transform: translate(-50%, 14px) } to { opacity: 1; transform: translate(-50%, 0) } }
.no-anim .scrim, .no-anim .modal, .no-anim .bulk, .no-anim .menu { animation: none !important; }
.scrim { position: fixed; inset: 0; background: var(--overlay); z-index: 60; display: flex; align-items: flex-start; justify-content: center; padding: 60px 20px; overflow-y: auto; animation: scrimIn .14s ease; }
.modal { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-lg); width: 100%; max-width: 620px; animation: modalIn .18s cubic-bezier(.2,.7,.3,1); }
@media (prefers-reduced-motion: reduce) {
  .scrim, .modal, .bulk { animation: none !important; }
  * { transition-duration: .01ms !important; }
}
.modal.wide { max-width: 900px; }
.modal-hd { display: flex; align-items: center; gap: 10px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
.modal-hd h2 { margin: 0; font-size: 15px; font-weight: 600; }
.modal-bd { padding: 18px; display: flex; flex-direction: column; gap: 16px; }
.modal-ft { display: flex; align-items: center; gap: 8px; padding: 14px 18px; border-top: 1px solid var(--line); }

.frow { display: flex; align-items: center; gap: 12px; }
.frow > .lb { width: 200px; flex-shrink: 0; font-size: 12px; color: var(--ink-2); }
.fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px,1fr)); gap: 8px; }
.check { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); cursor: pointer; padding: 6px 8px; border-radius: 7px; }
.check:hover { background: var(--chip); }

/* Палитра команд */
.palette { max-width: 560px; overflow: hidden; }
.palette .inp { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.palette .inp input { flex-grow: 1; border: none; outline: none; background: none; font-size: 15px; }
.palette .list { max-height: 380px; overflow-y: auto; padding: 6px; }
.palette .it { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; cursor: pointer; }
.palette .it:hover, .palette .it.hi { background: var(--accent-soft); }


/* Деталь */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
.tabs button { padding: 9px 12px; font-size: 13px; font-weight: 500; color: var(--ink-3); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.two { display: grid; grid-template-columns: minmax(0,1fr) 300px; gap: 16px; align-items: start; }
.plist { display: flex; flex-direction: column; }
.prow { display: grid; grid-template-columns: 56px minmax(0,1fr) 96px 88px 88px 88px; gap: 12px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line-soft); }
.prow:last-child { border-bottom: none; }
.thumb { width: 56px; height: 42px; border-radius: 6px; background: var(--line-soft); overflow: hidden; }

/* Аналитика */
.ins { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px,1fr)); gap: 12px; }
.bars { display: flex; flex-direction: column; gap: 9px; }
.bar-row { display: grid; grid-template-columns: 78px minmax(0,1fr) 68px; gap: 10px; align-items: center; font-size: 12px; }
.bar { height: 8px; border-radius: 4px; background: var(--line-soft); overflow: hidden; }
.bar i { display: block; height: 8px; border-radius: 4px; background: var(--accent); }
.hours { display: grid; grid-template-columns: repeat(24, 1fr); gap: 2px; align-items: end; height: 88px; }
.hours i { display: block; background: var(--accent); border-radius: 2px 2px 0 0; min-height: 2px; }
.hours-x { display: grid; grid-template-columns: repeat(24, 1fr); gap: 2px; margin-top: 5px; }
.hours-x span { font-family: 'IBM Plex Mono', monospace; font-size: 8px; color: var(--ink-3); text-align: center; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 9px; border-radius: 7px; background: var(--chip); font-size: 12px; }

/* Настройки */
.sect { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
.sect > .hd { display: flex; align-items: center; gap: 10px; }
.sect > .hd h2 { margin: 0; font-size: 15px; font-weight: 600; }
.srow { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line-soft); }
.srow:last-child { border-bottom: none; }

/* Пустое состояние */
.empty { padding: 56px 20px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }

/* Фокус с клавиатуры */
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 7px; }
.td:focus-visible, .acard:focus-visible { outline-offset: -2px; }

/* Скелетон загрузки */
@keyframes sk { 0%, 100% { opacity: .5 } 50% { opacity: 1 } }
.sk { background: var(--line-soft); border-radius: 6px; animation: sk 1.25s ease-in-out infinite; }

/* Посты — плитка */
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px,1fr)); gap: 12px; padding: 14px; }
.pcard { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.pcard .ph { height: 118px; }
.pcard .pb { padding: 10px 11px; display: flex; flex-direction: column; gap: 7px; }

/* Полоса ошибки */
.errbar { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--neg); background: var(--neg-soft); color: var(--ink); font-size: 12px; }

/* Разбор списка в «Добавить аккаунты» и окно итога */
.addprev { font-size: 12px; color: var(--ink-2); margin-top: 8px; line-height: 1.5; }
.addbad { margin-top: 8px; border: 1px solid var(--warn); background: var(--warn-soft); border-radius: 8px; padding: 8px 10px 2px; font-size: 12px; }
.addbad-hd { font-weight: 600; color: var(--warn); margin-bottom: 2px; }
.addlist { max-height: 30vh; overflow-y: auto; }
.addsec .addlist { border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; }
.addsec h3 { margin: 0 0 6px; font-size: 12px; font-weight: 600; color: var(--ink); }
.addsec h3 .c { color: var(--ink-3); font-weight: 500; }
.addrow { display: grid; grid-template-columns: 64px minmax(0,1fr); gap: 2px 10px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 12px; }
.addrow:first-child { border-top: 0; }
.addrow .n { color: var(--ink-3); font-variant-numeric: tabular-nums; }
.addrow .t { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px; overflow-wrap: anywhere; color: var(--ink); }
.addrow .w { grid-column: 2; color: var(--ink-2); }

/* ============================================================
   ЭФИР TV — всегда тёмный, палитра своя
   ============================================================ */
.tv {
  position: fixed; inset: 0; z-index: 80; overflow: hidden;
  /* У эфира своя палитра — она темнее рабочих экранов даже в светлой теме,
     но следует за выбранной темой, а не прибита гвоздями к тёмной. */
  --tvbg: #0A0910; --tvink: #F4F2F7; --tvdim: #8B85A6; --tvmute: #5A5570;
  --tvline: #1C1A28; --tvsurf: #171526; --tvtrack: #1A1826; --tvborder: #2A2740;
  --tvaccent: #9B8CFF; --tvpos: #4FBF8B;
  --tvm1: #63D6C4; --tvm2: #E88BC0; --tvm3: #E0A64A;
  background: var(--tvbg); color: var(--tvink);
  font-family: 'Onest', system-ui, sans-serif;
  /* всё внутри эфира меряется и по ширине, и по высоте окна:
     экран может быть и ноутбучным, и настенным 1920×1080 */
  --tv-hero: clamp(36px, min(8.4vw, 12.4vh), 124px);
  --tv-mid:  clamp(19px, min(3.4vw, 4.8vh), 40px);
  --tv-sub:  clamp(13px, min(1.6vw, 2.3vh), 20px);
  --tv-gap:  clamp(10px, 3.6vh, 48px);
  --tv-ring: min(300px, 40vh, 30vw);
}
[data-theme="neon-light"] .tv {
  --tvbg: #F4F9FC; --tvink: #0F1A2A; --tvdim: #5A6B84; --tvmute: #93A2B8;
  --tvline: #DDE8F2; --tvsurf: #E8F2F8; --tvtrack: #E2EDF5; --tvborder: #C5D4E4;
  --tvaccent: #0E7490; --tvpos: #0F8A6A;
  --tvm1: #2563C7; --tvm2: #C2379A; --tvm3: #B06A00;
}
[data-theme="neon-light"] .tv::after {
  background:
    radial-gradient(90% 70% at 82% -14%, rgba(14,116,144,.16), transparent 60%),
    radial-gradient(70% 60% at 14% -10%, rgba(37,99,199,.12), transparent 62%),
    radial-gradient(80% 70% at -10% 110%, rgba(109,70,214,.10), transparent 58%),
    radial-gradient(70% 60% at 108% 108%, rgba(194,55,154,.10), transparent 60%);
}
[data-theme="neon"] .tv {
  --tvbg: #080C18; --tvink: #EAEFFB; --tvdim: #8A94B0; --tvmute: #5A6484;
  --tvline: #1B2440; --tvsurf: #16203A; --tvtrack: #16203A; --tvborder: #2C3A5C;
  --tvaccent: #FF3B57; --tvpos: #2FE0A8;
  --tvm1: #2FD9F5; --tvm2: #C86BFF; --tvm3: #FFC24B;
}
[data-theme="neon"] .tv::after {
  background:
    radial-gradient(90% 70% at 82% -14%, rgba(255,59,87,.30), transparent 60%),
    radial-gradient(70% 60% at 14% -10%, rgba(47,217,245,.16), transparent 62%),
    radial-gradient(80% 70% at -10% 110%, rgba(77,139,255,.18), transparent 58%),
    radial-gradient(70% 60% at 108% 108%, rgba(200,107,255,.16), transparent 60%);
}
[data-theme="light"] .tv {
  --tvbg: #FAF8F3; --tvink: #171614; --tvdim: #6E6A62; --tvmute: #9A958C;
  --tvline: #E7E3DA; --tvsurf: #F1EDE5; --tvtrack: #E9E4D9; --tvborder: #D6D1C6;
  --tvaccent: #4B38B8; --tvpos: #1B7F53;
  --tvm1: #0F7080; --tvm2: #B4356B; --tvm3: #A15C00;
}
.tv::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(90% 70% at 82% -14%, rgba(155,140,255,.30), transparent 60%),
    radial-gradient(70% 60% at 14% -10%, rgba(62,200,222,.16), transparent 62%),
    radial-gradient(80% 70% at -10% 110%, rgba(79,191,139,.18), transparent 58%),
    radial-gradient(70% 60% at 108% 108%, rgba(232,139,192,.16), transparent 60%);
  animation: tvAurora 26s ease-in-out infinite alternate;
}
[data-theme="light"] .tv::after {
  background:
    radial-gradient(90% 70% at 82% -14%, rgba(91,68,217,.13), transparent 60%),
    radial-gradient(70% 60% at 14% -10%, rgba(15,112,128,.10), transparent 62%),
    radial-gradient(80% 70% at -10% 110%, rgba(27,127,83,.10), transparent 58%),
    radial-gradient(70% 60% at 108% 108%, rgba(180,53,107,.09), transparent 60%);
}
@keyframes tvAurora {
  from { transform: translate3d(0, 0, 0) scale(1); opacity: .9 }
  to   { transform: translate3d(-2%, 1.5%, 0) scale(1.06); opacity: 1 }
}
@media (prefers-reduced-motion: reduce) { .tv::after { animation: none } }
.tv-bar { position: absolute; top: 0; left: 0; right: 0; height: 64px; display: flex; align-items: center; gap: 16px; padding: 0 40px; z-index: 3; }
/* Экран один: снизу больше ничего не стоит, поэтому цифрам отдана вся высота
   до нижнего края, а не до бывшей ленты. */
.tv-scene { position: absolute; inset: 64px 40px 40px; z-index: 2; overflow: hidden; }
.tv-num { font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; letter-spacing: -.035em; line-height: 1; }
.tv-lbl { font-size: clamp(9px, 1.3vh, 12px); font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--tvdim); }
.tv-hero { font-size: var(--tv-hero); font-weight: 500; }
/* Первая сцена без графиков — цифрам можно отдать всю ширину */
.tv-hero-xl { font-size: clamp(56px, min(16.5vw, 25vh), 300px); font-weight: 500; line-height: .95; }
.tv-mid-xl  { font-size: clamp(26px, min(5.6vw, 8vh), 84px);  font-weight: 500; }
.tv-mid  { font-size: var(--tv-mid);  font-weight: 500; }
.tv-metrics { display: flex; gap: clamp(20px, 3.4vw, 46px); margin-top: var(--tv-gap); flex-wrap: wrap; }
.tv-btn { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--tvborder); color: var(--tvdim); display: flex; align-items: center; justify-content: center; }
.tv-btn:hover { background: var(--tvtrack); color: var(--tvink); }
/* Строка сравнения площадок: имя — столбец — значения. Столбец тонкий,
   торец скруглён, между строками 2px фона, значения подписаны напрямую. */
.tv-prow {
  display: grid; align-items: center; gap: clamp(10px,1.6vw,22px);
  grid-template-columns: clamp(120px,13vw,190px) minmax(0,1fr) clamp(90px,9vw,130px) clamp(70px,7vw,100px) clamp(96px,10vw,140px);
  padding: clamp(2px,0.8vh,10px) 0;
}
.tv-pname { display: flex; align-items: center; gap: 9px; min-width: 0; font-size: clamp(13px,2.1vh,19px); }

let _seed = 987654321;
function rnd() { _seed = (_seed * 1103515245 + 12345) & 0x7fffffff; return _seed / 0x7fffffff; }
function ri(a, b) { return Math.floor(a + rnd() * (b - a + 1)); }

/* Именных аккаунтов выше — 48. На такой выборке половина срезов пустует
   («не обновлялись 3 дня» вообще ноль), и интерфейс нечем показать,
   поэтому досыпаем генератором до ~170. */
(function expandSeed() {
  if (!DEMO) return;
  const LAT1 = ['gorod','media','daily','sport','tech','moda','kino','auto','dom','fit',
                'travel','food','news','biz','game','photo','pets','music','art','life',
                'stroyka','sever','more','vecher','utro'];
  const RUS1 = ['Город','Медиа','Дневник','Спорт','Техно','Мода','Кино','Авто','Дом','Фитнес',
                'Путешествия','Еда','Новости','Бизнес','Игры','Фото','Питомцы','Музыка','Искусство','Жизнь',
                'Стройка','Север','Море','Вечер','Утро'];
  const LAT2 = ['lab','hub','pro','live','club','room','post','wave','zone','cast','times','point','box','line'];
  const RUS2 = ['Лаб','Хаб','Про','Лайв','Клуб','Рум','Пост','Волна','Зона','Каст','Таймс','Поинт','Бокс','Лайн'];
  const plats = PLATFORMS.map(function (p) { return p.v; });
  const seen = {};
  SEED.forEach(function (r) { seen[r[0]] = true; });
  for (let i = 0; SEED.length < 170 && i < LAT1.length * LAT2.length; i++) {
    const a = i % LAT1.length, b = Math.floor(i / LAT1.length) % LAT2.length;
    const pv = plats[(a * 7 + b * 3) % plats.length];
    const uname = pv === 'reddit' ? 'r/' + LAT1[a] + LAT2[b] : LAT1[a] + '_' + LAT2[b];
    if (seen[uname]) continue;
    seen[uname] = true;
    SEED.push([uname, RUS1[a] + ' ' + RUS2[b], pv,
               (a + b) % PROFILES.length + 1, (a * 3 + b) % OWNERS.length + 1]);
  }
})();

const HASHTAGS = ['#рек','#дляподписчиков','#обзор','#лайфхак','#новости','#спорт','#еда','#путешествия','#бизнес','#технологии','#мода','#дом'];

const ACCOUNTS = DEMO ? SEED.map(function (row, i) {
  const [username, display, platform, profileId, ownerId] = row;
  const base = ri(12, 1400) * 1000 + ri(0, 999);
  const followers = base;
  const views     = Math.round(followers * (8 + rnd() * 40));
  const likes     = Math.round(views * (0.05 + rnd() * 0.06));
  const posts     = ri(120, 4200);
  const clicks    = Math.round(followers * (0.01 + rnd() * 0.05));
  const trend     = rnd();                       // 0 — падает, 1 — растёт
  const k         = trend < 0.14 ? -1 : (trend < 0.2 ? 0 : 1);
  const gf        = (0.0002 + rnd() * 0.012) * k;
  const gv        = (0.004 + rnd() * 0.03) * (k < 0 ? 1 : 1);
  const gl        = (0.003 + rnd() * 0.025);
  const series = [];
  let cur = followers - Math.round(followers * gf * 30);
  for (let d = 0; d < 30; d++) { cur += Math.round(followers * gf * (0.6 + rnd() * 0.8)); series.push(cur); }
  series[29] = followers;
  const postList = [];
  for (let p = 0; p < 8; p++) {
    const pv = Math.round(views / posts * ri(4, 90));
    postList.push({
      id: i * 100 + p,
      title: POST_TITLES[ri(0, POST_TITLES.length - 1)],
      hashtag: HASHTAGS[ri(0, HASHTAGS.length - 1)],
      views: pv,
      likes: Math.round(pv * (0.04 + rnd() * 0.09)),
      comments: Math.round(pv * (0.002 + rnd() * 0.01)),
      viewDelta: Math.round(pv * (0.02 + rnd() * 0.35)),
      daysAgo: ri(0, 26),
      hue: ri(0, 359),
    });
  }
  postList.sort(function (a, b) { return b.viewDelta - a.viewDelta; });
  // Свежесть данных распределяем: без «протухших» пустует срез
  // «не обновлялись 3 дня», а он один из самых полезных в работе.
  const ur = rnd();
  const updated = ur < 0.50 ? ri(2, 240)          // минуты назад
                : ur < 0.78 ? ri(240, 1440)       // до суток
                : ur < 0.90 ? ri(1440, 4320)      // 1–3 дня
                : ri(4320, 26000);                // 3–18 дней
  const st = rnd();
  const banned = st > 0.975;
  const archived = !banned && st > 0.91;
  const unavailable = username === 'threads_lab' || username === 'meme_town' || rnd() > 0.95;
  return {
    id: i + 1, username, display, platform, profileId, ownerId,
    groupId: (i % GROUPS.length) + 1, countryId: (i % COUNTRIES.length) + 1,
    followers, views, likes, posts, clicks, series, postList,
    d: {
      1:  { f: Math.round(followers * gf),      v: Math.round(views * gv),      l: Math.round(likes * gl),      p: ri(0, 4),   c: Math.round(clicks * (rnd() * 0.04 - 0.01)) },
      7:  { f: Math.round(followers * gf * 6.4), v: Math.round(views * gv * 6.2), l: Math.round(likes * gl * 6.1), p: ri(2, 22),  c: Math.round(clicks * (rnd() * 0.16 - 0.04)) },
      30: { f: Math.round(followers * gf * 27),  v: Math.round(views * gv * 26),  l: Math.round(likes * gl * 25),  p: ri(10, 90), c: Math.round(clicks * (rnd() * 0.5 - 0.12)) },
    },
    updated,
    unavailable,
    archived,
    banned,
  };
}) : [];

(function restoreUi() {
  try {
    const o = JSON.parse(localStorage.getItem('as_ui') || '{}');
    PERSIST.forEach(function (k) { if (o[k] !== undefined && o[k] !== null) state[k] = o[k]; });

    if (!localStorage.getItem('as_period_all_default')) {
      state.period = 0;
      localStorage.setItem('as_period_all_default', '1');
      saveUi();
    } else if ([0, 1, 7, 30].indexOf(+state.period) < 0) {
      state.period = 0;
    } else {
      state.period = +state.period;

const NBSP = ' ';
function fmt(n) {
  if (n === null || n === undefined) return '—';
  const neg = n < 0; n = Math.abs(Math.round(n));
  const s = String(n).replace(/\B(?=(\d{3})+(?!\d))/g, NBSP);
  return (neg ? '−' : '') + s;
}
function comp(n) {
  if (n === null || n === undefined) return '—';
  const a = Math.abs(n);
  if (a >= 1e9) return (n / 1e9).toFixed(a >= 1e10 ? 0 : 2).replace('.', ',') + ' млрд';
  if (a >= 1e6) return (n / 1e6).toFixed(a >= 1e7 ? 0 : 2).replace('.', ',') + ' млн';
  if (a >= 1e4) return fmt(Math.round(n / 1e3)) + ' тыс.';
  return fmt(n);
}
function signed(n, compact) {
  if (n === null || n === undefined) return '—';
  if (n === 0) return '0';
  return (n > 0 ? '+' : '−') + (compact ? comp(Math.abs(n)) : fmt(Math.abs(n)));
}
/* 1 аккаунт / 2 аккаунта / 5 аккаунтов */
function plural(n, forms) {
  const a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return forms[2];
  if (b > 1 && b < 5)   return forms[1];
  if (b === 1)          return forms[0];
  return forms[2];
}
function ago(min) {
  if (min == null || !isFinite(min) || min < 0) return '—';
  if (min < 1) return 'сейчас';
  if (min < 60) return min + ' мин';
  if (min < 1440) return Math.floor(min / 60) + ' ч';
  return Math.floor(min / 1440) + ' дн';
}
function downloadText(filename, text) {
  const blob = new Blob([text], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
}
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }

/* Аватар: с живого API — картинка через прокси, без него — инициалы */
/* Заглушка аватарки красится детерминированно по имени — так список
   различается на глаз даже там, где у аккаунтов нет картинки. */

function avatarEl(a, px, radius) {
  px = px || 30; radius = radius || 9;

  const box = 'width:' + px + 'px;height:' + px + 'px;border-radius:' + radius + 'px';
  const plain = 'background:' + c.bg + ';color:' + c.fg + ';font-size:' + (px < 28 ? 9 : 11) + 'px';
  if (LIVE) {
    // Запасной вариант — инициалы, но подставляет их слушатель ниже, а не
    // атрибут onerror: там подстановка обрывала кавычки и ломала обработчик.
    return '<img class="av" src="' + API_BASE + '/api/accounts/' + a.id + '/avatar/" alt="" decoding="async" ' +
      'data-fb="' + esc(letters) + '" data-fbs="' + esc(box + ';' + plain) + '" ' +
      'style="' + box + ';' + plain + ';object-fit:cover">';

}
function postGrad(p) {

}
/* Превью поста: через наш прокси (CDN TikTok/IG часто недоступен из браузера). */
function postThumbEl(p, kind) {
  const grad = postGrad(p);
  const cls = kind === 'grid' ? 'ph' : 'thumb';
  const style = kind === 'grid'
    ? 'width:100%;height:118px;display:block;object-fit:cover;background:' + grad
    : 'object-fit:cover;background:' + grad;
  const src = (LIVE && p.id && !p.thumbMissing)
    ? (API_BASE + '/api/posts/' + p.id + '/thumbnail/')
    : (p.thumb || '');

      'data-fb-thumb="1" data-fbs="' + esc(grad) + '" data-fb-cls="' + cls + '" style="' + style + '">';

/* Аватарки грузятся не у всех: у кого нет — показываем инициалы.
   Событие error у картинок не всплывает, поэтому слушаем на перехвате. */
document.addEventListener('error', function (e) {
  const img = e.target;
  if (!img || img.tagName !== 'IMG' || !img.dataset) return;
  if (img.dataset.fbThumb) {
    const d = document.createElement('div');
    d.className = img.dataset.fbCls || 'thumb';
    d.setAttribute('style', 'background:' + (img.dataset.fbs || 'var(--line-soft)'));
    img.replaceWith(d);
    return;
  }
  if (img.dataset.fb === undefined) return;
  const d = document.createElement('div');
  d.className = 'av';
  d.textContent = img.dataset.fb;
  d.setAttribute('style', img.dataset.fbs || '');
  img.replaceWith(d);
}, true);

  const st = state.f.status.length ? state.f.status : ['live'];
  return (st.indexOf('live') >= 0 && !a.archived && !a.banned) ||
         (st.indexOf('archived') >= 0 && a.archived) ||
         (st.indexOf('banned') >= 0 && a.banned);
}
function countFor(k, id) {
  if (String(id) === FILTER_ALL_ID) {
    if (k === 'status') return ACCOUNTS.length;
    return ACCOUNTS.filter(matchesStatus).length;
  }
  return ACCOUNTS.filter(function (a) {
    if (k !== 'status' && !matchesStatus(a)) return false;
    if (k === 'status') {
      return id === 'live' ? (!a.archived && !a.banned) : id === 'archived' ? a.archived : a.banned;
    }
    return String(a[k]) === String(id);
  }).length;
}

const RAIL_FILTER_KEYS = ['platform', 'profileId', 'ownerId', 'groupId', 'countryId'];
/* Отбор без сортировки: им живут и список, и эфир — чтобы на табло попадало
   ровно то же, что в таблице, включая любой фильтр, добавленный позже. */
function filteredAccounts() {
  let list = ACCOUNTS.filter(matchesStatus);
  RAIL_FILTER_KEYS.forEach(function (k) {
    const sel = state.f[k];
    if (!sel.length) return;
    list = list.filter(function (a) { return sel.indexOf(String(a[k])) >= 0; });
  });
  if (state.q.trim()) {
    const q = state.q.trim().toLowerCase();
    list = list.filter(function (a) {
      return a.username.toLowerCase().indexOf(q) >= 0 || a.display.toLowerCase().indexOf(q) >= 0;
    });
  }
  return list;
}
/* Сужен ли набор относительно «весь домен, живые». Нужно эфиру: якоря живого
   счётчика бэкенд считает по домену целиком, и на срезе из них можно брать
   только долю прироста, а не абсолют. Пустой статус и явный ['live'] — одно
   и то же, поэтому такой выбор срезом не считаем. */
function railNarrowed() {
  if (state.q.trim()) return true;
  const st = state.f.status || [];
  if (st.length && !(st.length === 1 && st[0] === 'live')) return true;
  return RAIL_FILTER_KEYS.some(function (k) { return (state.f[k] || []).length > 0; });
}

function visible() {
  // На досках (Стенды, AI) «видимые» — аккаунты выбранного стенда/темы
  // с фильтром площадок: их рисует таблица, их же выделяют и выгружают.
  const list = isAi() ? aiFiltered() : filteredAccounts();
  const k = state.sort.key, dir = state.sort.dir === 'asc' ? 1 : -1;
  // Числовые колонки сортируем по тому же, что на экране:
  // All → абсолют, 1д/7д/30д → прирост за период.
  function metricSort(a, totalKey, deltaKey) {
    if (state.period === 0) return +a[totalKey] || 0;
    const d = delta(a, deltaKey);
    return d == null ? 0 : +d;
  }
  const get = {
    name: function (a) { return a.username; },
    f:    function (a) { return metricSort(a, 'followers', 'f'); },
    v:    function (a) { return metricSort(a, 'views', 'v'); },
    l:    function (a) { return metricSort(a, 'likes', 'l'); },
    p:    function (a) { return metricSort(a, 'posts', 'p'); },
    c:    function (a) { return metricSort(a, 'clicks', 'c'); },
    u:    function (a) { return -a.updated; },
    fd:   function (a) { return metricSort(a, 'followers', 'f'); },
    vd:   function (a) { return metricSort(a, 'views', 'v'); },
    ld:   function (a) { return metricSort(a, 'likes', 'l'); },
  }[k] || function (a) { return metricSort(a, 'views', 'v'); };
  list.sort(function (a, b) {
    const x = get(a), y = get(b);
    if (typeof x === 'string') return x.localeCompare(y) * dir;
    return (x - y) * dir;
  });
  return list;
}
function totals(list) {
  const t = { f:0, v:0, l:0, p:0, c:0, fd:0, vd:0, ld:0, pd:0, cd:0 };
  list.forEach(function (a) {
    t.f += a.followers; t.v += a.views; t.l += a.likes; t.p += a.posts; t.c += a.clicks;
    t.fd += delta(a,'f'); t.vd += delta(a,'v'); t.ld += delta(a,'l'); t.pd += delta(a,'p'); t.cd += delta(a,'c');
  });
  return t;
}

function kpiCard(label, value, d, series, compact, total, tone, icon, metric) {
  const n = tone || 1;
  const style = '--tone:var(--m' + n + ');--tone-soft:var(--m' + n + 's)';
  if (state.booting) {
    return '<div class="card kpi" aria-busy="true" style="' + style + '"><div class="lbl">' + label + '</div>' +
      '<div class="val"><span class="sk" style="display:block;height:24px;width:78%"></span></div>' +
      '<div class="ft"></div></div>';
  }
  // Та же логика, что у колонок таблицы: All = итог, иначе прирост; без зелёной строки.
  const main = metricMain(total != null ? total : value, d, compact);
  // С metric карточка открывает поп-ап с графиком этого показателя.
  const act = metric
    ? ' data-act="kpi-chart" data-v="' + metric + '" tabindex="0" role="button" aria-haspopup="dialog" aria-label="' + label + ': открыть график"'
    : '';
  return '<div class="card kpi" style="' + style + '"' + act + '>' +
    '<div class="hd"><span class="ico">' + ic(icon || 'users', 13) + '</span>' +
      '<span class="lbl">' + label + '</span>' +
      (metric ? '<span class="more" title="Открыть график">' + ic('chart', 13) + '</span>' : '') + '</div>' +
    '<div class="val">' + main + '</div>' +
    '<div class="ft">' +
      (series ? spark(series, d == null || d >= 0, 'var(--tone)') : '') +
    '</div></div>';
}

/* Аккаунты, которых последний прогон не коснулся.
   Отменённые от успешных по самим цифрам не отличить — у отменённых просто
   осталось старое «Обновлён». Поэтому сравниваем с началом последнего прогона:
   всё, что не обновлялось с тех пор, в нём и не обновилось.
   Если о прогоне ничего не известно, берём порог в сутки. */
function staleAccounts() {
  const list = visible();
  const started = state.run && state.run.startedAt;
  const cutoffMin = started ? (Date.now() - started) / 60000 : 24 * 60;
  return list.filter(function (a) {
    return !a.archived && !a.banned && a.updated > cutoffMin;

function domainItems(curId) {
  const list = (state.domains && state.domains.list) || [];

    return { v: 'dom|' + d.id, l: d.name, dot: d.color, on: curId === d.id };

function catalogMoveItems(catalogKey, curId) {
  const meta = catalogOf(catalogKey);
  if (!meta) return [];
  const list = meta.list() || [];
  const items = list.map(function (row) {
    return {
      v: 'mv|' + catalogKey + '|' + row.id,
      l: row.name,
      dot: row.color,
      on: +curId === +row.id,
    };
  });

function accountCatalogId(a, catalogKey) {
  if (!a) return 0;

  if (catalogKey === 'owner') return a.ownerId || 0;

/* Ссылка на профиль у площадки. Адрес нигде не хранился: mapAccount его не
   заполнял, поэтому `a.url` всегда был undefined — пункт «Открыть на площадке»
   не показывался никогда, а кнопка в карточке висела заглушкой-тостом.
   Собираем из платформы и логина по тем же правилам, что и воркеры. */
function accountUrl(a) {
  if (!a) return '';
  const u = String(a.username || '').trim().replace(/^@/, '');
  if (!u) return '';
  switch (a.platform) {
    case 'tiktok':    return 'https://www.tiktok.com/@' + encodeURIComponent(u);
    case 'instagram': return 'https://www.instagram.com/' + encodeURIComponent(u) + '/';
    case 'youtube':   return /^UC[\w-]{10,}$/i.test(u)
      ? 'https://www.youtube.com/channel/' + encodeURIComponent(u)
      : 'https://www.youtube.com/@' + encodeURIComponent(u);
    case 'telegram':  return 'https://t.me/' + encodeURIComponent(u);
    case 'x':         return 'https://x.com/' + encodeURIComponent(u);
    case 'threads':   return 'https://www.threads.com/@' + encodeURIComponent(u);
    // У Rumble канал живёт то на /user/, то на /c/. Воркер (platforms/rumble/parse.py)
    // пробует /user/ первым — ссылка идёт туда же, чтобы не расходиться с ним.
    case 'rumble':    return 'https://rumble.com/user/' + encodeURIComponent(u);
    case 'reddit':    return 'https://www.reddit.com/r/' + encodeURIComponent(u.replace(/^r\//, '')) + '/';
    // У Facebook логин бывает числовым id, и тогда vanity-адреса не существует.
    case 'facebook':  return /^\d{6,24}$/.test(u)
      ? 'https://www.facebook.com/profile.php?id=' + encodeURIComponent(u)
      : 'https://www.facebook.com/' + encodeURIComponent(u);
    default: return '';
  }
}

  if (!t) { state.menu = null; m.remove(); return; }
  const r = t.getBoundingClientRect();
  const w = Math.max(r.width, 200);
  const left = Math.max(12, Math.min(r.left, window.innerWidth - w - 12));
  const below = window.innerHeight - r.bottom - 14;
  const above = r.top - 14;
  const up = below < 190 && above > below;
  m.style.width = Math.round(w) + 'px';
  m.style.left = Math.round(left) + 'px';
  if (up) {
    m.style.top = 'auto';
    m.style.bottom = Math.round(window.innerHeight - r.top + 6) + 'px';
    m.style.maxHeight = Math.round(Math.min(340, above)) + 'px';
  } else {
    m.style.bottom = 'auto';

function tfoot(list, pages) { return '<div class="tfoot">' + tfootInner(list, pages) + '</div>'; }
function tfootInner(list, pages) {
  const from = (state.page - 1) * state.pageSize + 1;
  const to = Math.min(list.length, state.page * state.pageSize);
  let btns = '';
  for (let p = 1; p <= pages; p++) {
    if (pages > 7 && p > 2 && p < pages - 1 && Math.abs(p - state.page) > 1) {
      if (btns.indexOf('data-ell') < 0 || p === state.page + 2) { btns += '<button data-ell disabled>…</button>'; }
      continue;
    }
    btns += '<button class="' + (p === state.page ? 'on' : '') + '" data-act="page" data-v="' + p + '">' + p + '</button>';
  }
  return '<span class="mono" style="font-size:12px;color:var(--ink-2)">' + from + '–' + to + ' из ' + list.length + '</span>' +
    '<div class="grow"></div>' +
    '<div class="pager">' +
      '<button data-act="page" data-v="' + (state.page - 1) + '"' + (state.page === 1 ? ' disabled' : '') + '>' + ic('cleft', 12) + '</button>' +
      btns +
      '<button data-act="page" data-v="' + (state.page + 1) + '"' + (state.page === pages ? ' disabled' : '') + '>' + ic('cright', 12) + '</button>' +
    '</div>' +
    dd('size');
}

function lineChart(series, positive) {
  const w = 800, h = 200, pad = 8;
  const min = Math.min.apply(null, series), max = Math.max.apply(null, series);
  const r = (max - min) || 1;
  const x = function (i) { return (i / (series.length - 1) * (w - pad * 2) + pad).toFixed(1); };
  const y = function (v) { return (h - pad - (v - min) / r * (h - pad * 2)).toFixed(1); };
  const pts = series.map(function (v, i) { return x(i) + ',' + y(v); }).join(' ');
  const area = 'M' + x(0) + ',' + y(series[0]) + ' L' + pts.split(' ').join(' L') + ' L' + x(series.length - 1) + ',' + h + ' L' + x(0) + ',' + h + ' Z';
  const col = positive ? 'var(--accent)' : 'var(--neg)';
  return '<svg width="100%" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" style="display:block">' +
    [0.25, 0.5, 0.75].map(function (g) {
      return '<line x1="0" y1="' + (h * g) + '" x2="' + w + '" y2="' + (h * g) + '" stroke="var(--line-soft)" stroke-width="1" vector-effect="non-scaling-stroke"/>';
    }).join('') +
    '<path d="' + area + '" fill="' + col + '" opacity="0.10"/>' +
    '<polyline points="' + pts + '" fill="none" stroke="' + col + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>' +
  '</svg>';
}

function screenAnalytics() {
  if (state.booting) {
    return '<div class="main"><div class="page-hd"><h1>Аналитика</h1></div>' + analyticsSkeleton() + '</div>';
  }
  if (LIVE && !state.an.items && !state.an.loading) loadAnalytics();
  const waiting = LIVE && (state.an.loading || state.an.items === null);
  if (waiting) {
    return '<div class="main">' +
      '<div class="page-hd"><h1>Аналитика</h1>' + anScopeTag() + '<div class="grow"></div>' +
        dd('an-platform', state.an.platform !== 'all') +
        dd('an-sort') +
        '<div class="seg">' + AN_PERIOD_OPTS.map(function (p) {
          return '<button class="' + (state.an.period === p[0] ? 'on' : '') + '" data-act="an-period" data-v="' + p[0] + '">' + p[1] + '</button>';
        }).join('') + '</div>' +
      '</div>' + analyticsSkeleton() + '</div>';
  }
  const acc = isAi() ? aiInTopicAll() : ACCOUNTS.filter(function (a) { return !a.archived && !a.banned; });
  const ins = state.an.insights;

  /* Топ постов: с живым API — из analytics/top-posts, иначе из демо-данных */
  let top, totalPosts, demoPosts = [];
  if (LIVE) {
    top = state.an.items || [];
    totalPosts = state.an.total || 0;
  } else {
    const pool = state.an.platform === 'all' ? acc : acc.filter(function (a) { return a.platform === state.an.platform; });
    pool.forEach(function (a) { (a.postList || []).forEach(function (p) { demoPosts.push({ p: p, a: a }); }); });
    demoPosts.sort(function (x, y) {
      return state.an.sort === 'views' ? y.p.views - x.p.views : y.p.viewDelta - x.p.viewDelta;
    });
    top = demoPosts.slice(0, 10);
    totalPosts = demoPosts.length;
  }

  const byPlatform = PLATFORMS.map(function (pl) {
    const set = acc.filter(function (a) { return a.platform === pl.v; });
    let v = 0; set.forEach(function (a) { v += a.views; });
    return { pl: pl, n: set.length, v: v };
  }).filter(function (r) { return r.n > 0; }).sort(function (a, b) { return b.v - a.v; });
  const maxV = Math.max(1, Math.max.apply(null, byPlatform.map(function (r) { return r.v; }).concat([1])));

  /* Хештеги */
  let tags;
  if (LIVE) {
    tags = ((ins && ins.top_hashtags) || []).slice(0, 12).map(function (t) {
      const k = String(t.tag || '');
      return { k: k.charAt(0) === '#' ? k : '#' + k, n: t.count || 0 };
    });
  } else {
    const tc = {};
    demoPosts.forEach(function (o) { if (o.p.hashtag) tc[o.p.hashtag] = (tc[o.p.hashtag] || 0) + 1; });
    tags = Object.keys(tc).map(function (k) { return { k: k, n: tc[k] }; })
      .sort(function (a, b) { return b.n - a.n; }).slice(0, 12);
  }

  /* Часы публикации */
  let hours = null;
  if (LIVE) {
    const bh = (ins && ins.best_hours) || [];
    if (bh.length) {
      const arr = new Array(24).fill(0);
      bh.forEach(function (h) {
        const i = typeof h === 'number' ? h : (h.hour != null ? +h.hour : -1);
        const v = typeof h === 'number' ? 1 : (h.avg_views != null ? +h.avg_views : (h.count != null ? +h.count : 1));
        if (i >= 0 && i < 24) arr[i] = v;
      });
      if (arr.some(function (x) { return x > 0; })) hours = arr;
    }
  } else {
    hours = [];
    for (let h = 0; h < 24; h++) {
      const w = h >= 7 && h <= 22 ? (1 - Math.abs(h - 19) / 14) : 0.12;
      hours.push(Math.max(0.06, w * (0.7 + ((h * 37) % 11) / 30)));
    }
  }
  const maxH = hours ? (Math.max.apply(null, hours) || 1) : 1;
  const peakH = hours ? hours.indexOf(Math.max.apply(null, hours)) : -1;

  /* Дни недели */
  const DOW = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
  let days = null;
  if (LIVE) {
    const bw = (ins && ins.best_weekdays) || [];
    if (bw.length) {
      const arr = new Array(7).fill(0);
      bw.forEach(function (d) {
        const i = typeof d === 'number' ? d : (d.weekday != null ? +d.weekday : (d.day != null ? +d.day : -1));
        const v = typeof d === 'number' ? 1 : (d.avg_views != null ? +d.avg_views : (d.count != null ? +d.count : 1));
        if (i >= 0 && i < 7) arr[i] = v;
      });
      const mx = Math.max.apply(null, arr);
      if (mx > 0) days = arr.map(function (v, i) { return [DOW[i], v / mx]; });
    }
  } else {
    days = [['Пн',.62],['Вт',.71],['Ср',.78],['Чт',.83],['Пт',1],['Сб',.74],['Вс',.58]];
  }
  const noData = '<div style="font-size:12px;color:var(--ink-3);padding:8px 0">API не вернул данных за этот период</div>';

  return '<div class="main">' +
    '<div class="page-hd"><h1>Аналитика</h1>' + anScopeTag() + '<div class="grow"></div>' +
      dd('an-platform', state.an.platform !== 'all') +
      dd('an-sort') +
      '<div class="seg">' + AN_PERIOD_OPTS.map(function (p) {
        return '<button class="' + (state.an.period === p[0] ? 'on' : '') + '" data-act="an-period" data-v="' + p[0] + '">' + p[1] + '</button>';
      }).join('') + '</div>' +
    '</div>' +

    '<div class="card" style="margin-bottom:16px">' +
      '<div style="display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)">' +
        '<span style="font-size:14px;font-weight:600">Топ постов</span><span class="count">' + fmt(totalPosts) + '</span>' +
        (state.an.loading ? '<span style="font-size:12px;color:var(--ink-3)">загружаем…</span>' : '') + '</div>' +
      (top.length === 0
        ? '<div class="empty"><span style="color:var(--ink-3)">' + (state.an.loading ? 'Загружаем топ постов…' : 'За этот период постов нет') + '</span></div>'
        : '<div class="plist">' + top.map(function (o, i) {
        return '<div class="prow" style="grid-template-columns:24px 56px minmax(0,1fr) 96px 88px 88px">' +
          '<div class="mono" style="font-size:12px;color:var(--ink-3)">' + (i + 1) + '</div>' +
          postThumbEl(o.p) +
          '<div style="min-width:0"><div class="trunc" style="font-size:13px;font-weight:500">' + esc(o.p.title) + '</div>' +
            '<div class="trunc" style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-3);margin-top:3px">' +
            pmark(o.a.platform) + '<span class="trunc">@' + esc(o.a.username) + (o.p.hashtag ? ' · ' + esc(o.p.hashtag) : '') + '</span></div></div>' +
          '<div class="num">' + comp(o.p.views) + '</div>' +
          '<div class="num sub" style="color:var(--pos)">' + signed(o.p.viewDelta, true) + '</div>' +
          '<div class="num">' + comp(o.p.likes) + '</div>' +
        '</div>';
      }).join('') + '</div>') +
    '</div>' +

    '<div class="ins">' +
      '<div class="card" style="padding:16px"><div class="lbl" style="margin-bottom:14px">Сравнение платформ · просмотры</div>' +
        '<div class="bars">' + byPlatform.map(function (r) {
          return '<div class="bar-row"><span style="color:var(--ink-2)">' + r.pl.l + '</span>' +
            '<span class="bar"><i style="width:' + Math.round(r.v / maxV * 100) + '%;background:' + platHue(r.pl.v) + '"></i></span>' +
            '<span class="mono" style="text-align:right;font-size:12px">' + comp(r.v) + '</span></div>';
        }).join('') + '</div></div>' +

      '<div class="card" style="padding:16px"><div class="lbl" style="margin-bottom:14px">Лучшие часы публикации</div>' +
        (hours
          ? '<div class="hours">' + hours.map(function (v, h) {
              const on = v > maxH * 0.82;
              return '<i style="height:' + Math.max(2, Math.round(v / maxH * 100)) + '%;background:' + (on ? 'var(--accent)' : 'var(--accent-line)') + '" title="' + h + ':00"></i>';
            }).join('') + '</div>' +
            '<div class="hours-x">' + hours.map(function (v, h) { return '<span>' + (h % 4 === 0 ? h : '') + '</span>'; }).join('') + '</div>' +
            '<div style="font-size:12px;color:var(--ink-3);margin-top:10px">Пик — ' + peakH + ':00 по Москве</div>'
          : noData) + '</div>' +

      '<div class="card" style="padding:16px"><div class="lbl" style="margin-bottom:14px">Дни недели</div>' +
        (days
          ? '<div class="bars">' + days.map(function (d) {
              return '<div class="bar-row" style="grid-template-columns:36px minmax(0,1fr) 46px"><span style="color:var(--ink-2)">' + d[0] + '</span>' +
                '<span class="bar"><i style="width:' + Math.round(d[1] * 100) + '%"></i></span>' +
                '<span class="mono" style="text-align:right;font-size:12px">' + Math.round(d[1] * 100) + '%</span></div>';
            }).join('') + '</div>'
          : noData) + '</div>' +

      '<div class="card" style="padding:16px"><div class="lbl" style="margin-bottom:14px">Частые хештеги</div>' +
        (tags.length
          ? '<div class="tags">' + tags.map(function (t, i) {
              const n = (i % 5) + 1;
              return '<span class="tag" style="background:var(--m' + n + 's);color:var(--m' + n + ')">' +
                esc(t.k) + '<span class="mono" style="font-size:11px;opacity:.72">' + fmt(t.n) + '</span></span>';
            }).join('') + '</div>'
          : noData) + '</div>' +
    '</div>' +
  '</div>';
}

/* Сводка расписания на экране настроек — живые значения, не заглушки. */
function settingsScheduleSection() {
  const s = state.sched;
  let body;
  if (!s && state.schedError) {
    body = '<div class="card" style="padding:14px;font-size:13px;color:var(--warn)">' +
      'Не удалось загрузить: ' + esc(state.schedError) +
      ' <button class="btn sm" data-act="sched-reload" style="margin-left:8px">Повторить</button></div>';
  } else if (!s) {
    body = '<div class="card" style="padding:14px;font-size:13px;color:var(--ink-3)">Загрузка…</div>';
  } else {
    const mode = s.mode === 'times' ? 'times' : 'interval';
    const times = (s.times || []).slice().sort();
    const when = !s.enabled
      ? 'выключено'
      : (mode === 'times'
        ? (times.length ? 'по времени: ' + times.join(', ') : 'по времени, но часы не заданы')
        : ('каждые ' + (s.interval_hours || 6) + ' ч'));
    const skip = +s.skip_recent_hours || 0;
    const skipTxt = skip > 0
      ? (' · пропускать обновлённые за последние ' + skip + ' ч')
      : '';
    const tgIds = s.auto_refresh_telegram_chat_ids || [];
    const tgOn = !!s.auto_refresh_telegram_enabled;
    const archOn = !!(s.include_archived_accounts || s.include_banned_accounts);
    body = '<div class="card">' +
      '<div class="srow"><div style="flex-grow:1"><div style="font-size:13px;font-weight:500">Автообновление включено</div>' +
        '<div style="font-size:12px;color:var(--ink-3);margin-top:2px">' + esc(when) + esc(skipTxt) + '</div></div>' +
        '<button type="button" class="sw ' + (s.enabled ? 'on' : '') + '" data-act="sched-quick" data-v="enabled" ' +
          'role="switch" aria-checked="' + (s.enabled ? 'true' : 'false') + '"></button></div>' +
      '<div class="srow"><div style="flex-grow:1"><div style="font-size:13px;font-weight:500">Отчёт в Telegram</div>' +
        '<div style="font-size:12px;color:var(--ink-3);margin-top:2px">' +
          (tgOn
            ? ('CSV после каждого прогона · ' + (tgIds.length
              ? (tgIds.length + ' ' + plural(tgIds.length, ['получатель', 'получателя', 'получателей']))
              : 'получатели не заданы'))
            : 'выключен') +
        '</div></div>' +
        '<button class="btn sm" data-act="tg-test">Проверить</button>' +
        '<button type="button" class="sw ' + (tgOn ? 'on' : '') + '" data-act="sched-quick" data-v="auto_refresh_telegram_enabled" ' +
          'role="switch" aria-checked="' + (tgOn ? 'true' : 'false') + '"></button></div>' +
      '<div class="srow"><div style="flex-grow:1"><div style="font-size:13px;font-weight:500">Включать архив и баны</div>' +
        '<div style="font-size:12px;color:var(--ink-3);margin-top:2px">' +
          (archOn ? 'архивные и забаненные участвуют в автообновлении' : 'архивные и забаненные вне прогона') +
        '</div></div>' +
        '<button type="button" class="sw ' + (archOn ? 'on' : '') + '" data-act="sched-quick" data-v="include_archived_banned" ' +
          'role="switch" aria-checked="' + (archOn ? 'true' : 'false') + '"></button></div>' +
    '</div>';
  }
  return '<div class="sect"><div class="hd">' + ic('cal', 17) + '<h2>Расписание обновления</h2>' +
    '<div class="grow"></div>' +
    '<button class="btn" data-act="run-tab-open" data-v="schedule">Настроить</button></div>' +
    body + '</div>';

function scrapeEngineSection() {
  const cfg = state.scrape;

    body = '<div style="padding:14px;font-size:13px;color:var(--warn)">' +

    body = '<div style="padding:14px;font-size:13px;color:var(--ink-3)">Загрузка…</div>';

        ? '<div style="font-size:12px;color:var(--ink-3);margin:-4px 0 12px;line-height:1.45">' +

        '<div style="flex-grow:1;font-size:13px;font-weight:500">' + p.l + '</div>' +
        '<div class="seg">' +
          '<button class="' + (eng === 'playwright' ? 'on' : '') + '" data-act="scrape-eng" data-v="' + pv + '|playwright">Playwright</button>' +
          '<button class="' + (eng === 'apify' ? 'on' : '') + '" data-act="scrape-eng" data-v="' + pv + '|apify"' + apifyDis + '>Apify</button>' +
        '</div>' +
        '<button type="button" class="pill" data-act="scrape-fb" data-v="' + pv + '" ' +
          'title="Fallback: при сбое Playwright попробовать Apify в том же прогоне" ' +
          'style="background:' + (fbOn ? 'var(--accent-soft)' : 'var(--chip)') +
          ';color:' + (fbOn ? 'var(--accent)' : 'var(--ink-3)') + ';cursor:pointer;border:0">' +
          'fallback ' + (fbOn ? 'вкл' : 'выкл') + '</button>' +
      '</div>';
    }).join('') + '</div>';

    '</div>' + body + '</div>';
}

    return '<div class="tv" aria-busy="true"><div class="tv-bar">' +
      '<span class="sk" style="width:24px;height:24px;border-radius:7px;background:var(--tvsurf)"></span>' +
      '<span class="sk" style="width:110px;height:14px;background:var(--tvsurf)"></span>' +
      '<div class="grow"></div></div>' +
      '<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:40px">' +
        '<span class="sk" style="width:120px;height:14px;background:var(--tvsurf)"></span>' +
        '<span class="sk" style="width:min(70vw,420px);height:72px;background:var(--tvsurf);border-radius:12px"></span>' +
        '<div style="display:flex;gap:24px;margin-top:24px">' +
          [1,2,3,4].map(function () {
            return '<span class="sk" style="width:88px;height:48px;background:var(--tvsurf);border-radius:8px"></span>';
          }).join('') +
        '</div></div></div>';
  }
  /* Эфир показывает ровно тот же набор, что и список: домен накладывает бэкенд
     по адресу, всё остальное — рельс фильтров (площадка, профиль, владелец,
     группа, страна, статус, поиск) и период в шапке. Фильтры лежат в state.f и
     переживают перезагрузку, так что на стене достаточно один раз настроить
     список и открыть /efir. */
  const live = filteredAccounts();
  const t = totals(live);
  const now = new Date();
  const clock = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');

  /* Период из шапки: All — абсолют, 1д/7д/30д — прирост за период, ровно как
     в списке. Абсолют набора нужен и при периоде: по нему считается доля
     набора в домене для живого счётчика. */
  const byPeriod = state.period !== 0;
  function tvBase(absKey, dKey) { return byPeriod ? t[dKey] : t[absKey]; }

  /* Якоря живого счётчика бэкенд считает по домену целиком — ни по фильтрам,
     ни по периодам разбивки у них нет. Абсолют из якорей годится только когда
     на экране весь домен за всё время; в любом срезе берём долю набега —
     сколько домен набрал за окно, столько же прибавляем набору пропорционально
     его весу (см. vcApportion). Цифра своя, темп общий. */
  const whole = !railNarrowed() && !byPeriod;
  /* Измеренный прирост просмотров ровно по тем аккаунтам, что на экране. Пока
     у опорных точек нет разбивки (сутки после выкладки) — null, и остаётся
     прежний разнос прироста домена по весу набора. */
  const setGrowth = whole ? null : vcSetGrowth(live);
  function tvNum(key, base, abs) {
    if (whole) { const n = vcTotal(key); return fmt(n === null ? base : n); }
    if (key === 'views' && setGrowth !== null) {
      const pr = vcProgress();
      return fmt(pr === null ? base : Math.round(base + setGrowth * pr));
    }
    const n = vcApportion(base, abs, key);
    return fmt(n === null ? base : n);
  }
  function tvVc(key, base, abs) {
    const head = ' data-vc="' + key + '" data-vc-fmt="full"';
    if (whole) return head;
    if (key === 'views' && setGrowth !== null) {
      return head + ' data-vc-base="' + base + '" data-vc-growth="' + setGrowth + '"';
    }
    return head + ' data-vc-base="' + base + '" data-vc-abs="' + abs + '"';
  }

  /* Внизу — остальные показатели, помельче. Только подпись и число:
     приросты под цифрами убраны, на стене они читались как шум. */
  const sub = [
    ['Followers', 'followers', tvBase('f', 'fd'), t.f, 'var(--tvaccent)'],
    ['Likes', 'likes', tvBase('l', 'ld'), t.l, 'var(--tvm2)'],
    ['Posts', 'posts', tvBase('p', 'pd'), t.p, 'var(--tvm3)'],
    ['Accounts', '', live.length, 0, 'var(--tvm1)'],
  ];

  return '<div class="tv">' +
    '<div class="tv-bar">' +
      '<div style="width:24px;height:24px;border-radius:7px;background:var(--tvaccent);display:flex;align-items:center;justify-content:center">' +
        '<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="var(--tvbg)" stroke-width="1.8" stroke-linecap="round"><path d="M2 12.5 5.5 7l3 2.5L14 3"></path></svg></div>' +
      '<span style="font-size:13px;font-weight:600;letter-spacing:.02em">AccountsStats</span>' +
      /* При периоде на табло не абсолют, а прирост — без пометки цифра просто
         выглядит меньше, чем должна, и объяснить это на стене нечем. */
      '<span class="tv-lbl">Broadcast' + (byPeriod ? ' · ' + state.period + 'd' : '') + '</span>' +
      '<div class="grow"></div>' +
      (state.run.on
        ? '<span style="display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:15px;background:var(--tvsurf);font-size:12px">' +
          '<span style="width:7px;height:7px;border-radius:4px;background:var(--tvaccent)"></span>' +
          '<span class="tv-num" id="tv-run-done">' + state.run.done + ' / ' + state.run.total + '</span>' +
          '<span style="color:var(--tvdim)">обновление</span></span>'
        : '') +
      '<span class="tv-num" style="font-size:15px;color:var(--tvdim)">' + clock + '</span>' +
      '<button class="tv-btn" data-act="nav" data-v="accounts" aria-label="Выйти из эфира">' + ic('close', 16) + '</button>' +
    '</div>' +

    /* Один экран, без ротации. Главная цифра — просмотры, над ней подпись.
       Остальные показатели — отдельной группой у нижнего края. */
    '<div class="tv-scene on" data-scene="net" ' +
      'style="display:flex;flex-direction:column;align-items:center;justify-content:space-between;' +
      'text-align:center;padding:clamp(20px,8vh,104px) 0 clamp(14px,6vh,72px)">' +
      '<div style="max-width:100%">' +
        '<div class="tv-lbl" style="margin-bottom:clamp(6px,1.6vh,18px)">We were checked out:</div>' +
        '<div class="tv-num tv-hero-xl"' + tvVc('views', tvBase('v', 'vd'), t.v) +
          ' style="color:var(--tvink)">' + tvNum('views', tvBase('v', 'vd'), t.v) + '</div>' +
      '</div>' +
      '<div style="display:flex;justify-content:center;align-items:flex-start;' +
        'gap:clamp(20px,5vw,88px);flex-wrap:wrap;width:100%">' +
        sub.map(function (m) {
          const key = m[1], base = m[2], abs = m[3];
          return '<div style="min-width:0">' +
            '<div class="tv-lbl">' + m[0] + '</div>' +
            '<div class="tv-num tv-mid-xl"' + (key ? tvVc(key, base, abs) : '') +
              ' style="margin-top:clamp(4px,1.2vh,12px);color:' + m[4] + '">' +
              (key ? tvNum(key, base, abs) : fmt(base)) + '</div>' +
          '</div>';
        }).join('') +
      '</div>' +
    '</div>' +
  '</div>';
}

/* Эфир — один экран, без ротации: сцен больше нет, поэтому нет ни таймера

        '<button class="' + (mode === 'times' ? 'on' : '') + '" data-act="sched-mode" data-v="times">По времени</button>' +
      '</div></div>' +
    (mode === 'interval'
      ? '<div class="frow"><span class="lb">Интервал</span>' +
          '<div class="seg">' + [1, 3, 6, 12, 24].map(function (h) {
            return '<button class="' + (+schedField('interval_hours', 6) === h ? 'on' : '') + '" ' +
              'data-act="sched-int" data-v="' + h + '">' + h + ' ч</button>';

      : '<div><div class="lbl" style="margin-bottom:10px">Часы запуска' +
