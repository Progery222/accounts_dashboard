function collectSchedule() {
  const s = state.sched || {};
  return {
    enabled: !!s.enabled,
    mode: s.mode === 'times' ? 'times' : 'interval',
    times: (s.times || []).filter(function (t) { return SCHEDULE_TIME_SLOTS.indexOf(t) >= 0; }),
    interval_hours: +s.interval_hours || 6,
    skip_recent_hours: +s.skip_recent_hours || 0,
    auto_refresh_platforms: s.auto_refresh_platforms || [],
    auto_refresh_domain_ids: s.auto_refresh_domain_ids || [],
    auto_refresh_profile_ids: s.auto_refresh_profile_ids || [],
    auto_refresh_owner_ids: s.auto_refresh_owner_ids || [],
    auto_refresh_group_ids: s.auto_refresh_group_ids || [],
    auto_refresh_country_ids: s.auto_refresh_country_ids || [],
    include_hidden_profile_accounts: !!s.include_hidden_profile_accounts,
    include_unavailable_accounts: !!s.include_unavailable_accounts,
    include_archived_accounts: !!s.include_archived_accounts,
    include_banned_accounts: !!s.include_banned_accounts,
    auto_refresh_telegram_enabled: !!s.auto_refresh_telegram_enabled,
  };

async function loadSchedule(force) {
  if (DEMO || !LIVE) return;
  try {
    // Справочники всегда обновляем: иначе новая группа в домене не появится,
    // пока не перезагрузят страницу.
    const catsP = loadSchedCatalogs(true);
    if (!state.sched || force) {
      state.sched = await api('/api/accounts/schedule/');
      state.schedError = null;
    }
    await catsP;
  } catch (e) {
    state.schedError = String(e.message || e);
  }
  // Расписание живёт и в модалке, и в сводке настроек.
  if (state.route === 'settings') render();
  else if (document.getElementById('overlay')) paintOverlay();
  else render();
}

/* Сервер отвечает строкой «имя: причина» (или «имя — стенд») без площадки.
   Находим, какую ссылку из списка это касается, чтобы показать её целиком. */
function addServerRow(s, items, sep) {
  s = String(s || '');
  const at = s.indexOf(sep);
  const name = at >= 0 ? s.slice(0, at) : s;
  const why = at >= 0 ? s.slice(at + sep.length) : '';
  const low = name.replace(/^@/, '').toLowerCase();
  const same = items.filter(function (it) { return it.username.toLowerCase() === low; });
  const it = same.length === 1 ? same[0] : null;
  return { n: it ? plabel(it.platform) : '', t: it ? it.src : name, w: why || 'без пояснения' };
}
function addResultText(r) {
  const out = [];
  const put = function (title, rows) {
    if (!rows.length) return;
    out.push(title + ':');
    rows.forEach(function (x) { out.push((x.n ? x.n + ' · ' : '') + x.t + ' — ' + x.w); });
    out.push('');
  };
  put('Не прочитано', r.bad);
  put('Не добавились', r.errors);
  put('На другом стенде', r.elsewhere);
  return out.join('\n').trim();
}

function kcHover(e) {
  const plot = document.getElementById('kcplot');
  const kc = state.kc;

  const pts = kc.data.points, n = pts.length;
  const r = plot.getBoundingClientRect();
  const show = e && e.clientX >= r.left - 6 && e.clientX <= r.right + 6 && e.clientY >= r.top - 10 && e.clientY <= r.bottom + 10;
  const cross = document.getElementById('kccross'), dot = document.getElementById('kcdot'), tip = document.getElementById('kctip');
  if (!show) { [cross, dot, tip].forEach(function (el) { if (el) el.style.display = 'none'; }); return; }
  const i = Math.max(0, Math.min(n - 1, Math.round((e.clientX - r.left) / r.width * (n - 1))));
  const vals = pts.map(function (p) { return p.v; });
  // Та же шкала, что в kcPlot: координаты точки считаем по ней.
  let min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  if (min === max) { min -= Math.max(1, Math.abs(min) * .05); max += Math.max(1, Math.abs(max) * .05); }
  const padv = (max - min) * .08; min -= padv; max += padv;
  if (Math.min.apply(null, vals) >= 0 && min < 0) min = 0;
  const left = (n === 1 ? .5 : i / (n - 1)) * 100;
  const top = (1 - (pts[i].v - min) / (max - min)) * 100;
  cross.style.display = dot.style.display = tip.style.display = 'block';
  cross.style.left = left + '%';
  dot.style.left = left + '%'; dot.style.top = top + '%';
  tip.style.left = Math.max(8, Math.min(92, left)) + '%';
  const prev = i > 0 ? pts[i].v - pts[i - 1].v : null;
  tip.innerHTML = '<b>' + fmt(pts[i].v) + '</b>' + esc(i === n - 1 ? 'сейчас' : kcWhen(pts[i].t, kc.data.granularity)) +
    (prev ? ' · ' + (prev > 0 ? '+' : '−') + fmt(Math.abs(prev)) : '');
}

function captureScroll() {
  const pick = function (sel) {
    const el = document.querySelector(sel);

function restoreScroll(snap) {
  if (!snap) return;
  const apply = function (sel, s) {
    if (!s) return;
    const el = document.querySelector(sel);

    el.scrollTop = s.top;
    el.scrollLeft = s.left;
  };
  apply('.main', snap.main);
  apply('.rail', snap.rail);
  apply('.tbl-scroll', snap.tbl);
  // Браузер иногда сбрасывает scrollTop сразу после innerHTML — повторяем на кадре.

document.addEventListener('click', function (e) {

    if (state.menu) { state.menu = null; render(); }
    return;
  }
  const act = el.dataset.act, v = el.dataset.v;

  if (act === 'scrim' && e.target !== el) return;
  if (state.menu && act !== 'menu' && act !== 'mi') state.menu = null;

  switch (act) {
    case 'nav':
      state.route = v; state.selected.clear();
      if (v === 'analytics') {
        // При каждом заходе на экран — свежие данные, без чужих цифр с прошлого раза.
        state.an.items = null;
        state.an.insights = null;
        if (LIVE) loadAnalytics();
      }
      if (v === 'settings' && LIVE) { loadSessionsLive(); loadScrapeBackend(); loadSchedule(); }
      break;
    case 'retry-api': state.apiError = null; state.booting = true; render(); bootLive(); return;
    case 'open':
      if (e.target.closest('[data-act="sel"]')) return;
      state.route = 'detail'; state.detailId = +v; state.detailTab = 'posts';
      break;
    case 'tab':
      state.detailTab = 'posts';
      break;
    case 'post-view': state.postView = v; break;
    case 'theme':      toggleTheme(); break;
    case 'set-theme':  setTheme(v); break;
    case 'period':    state.period = +v; ensureDeltas(+v); break;
    case 'an-period': state.an.period = v; state.an.items = null; loadAnalytics(); break;

      paintChrome();
      paintMain();

    case 'page':      state.page = Math.max(1, +v); break;
    case 'sort':
      if (state.sort.key === v) state.sort.dir = state.sort.dir === 'desc' ? 'asc' : 'desc';
      else state.sort = { key: v, dir: v === 'name' ? 'asc' : 'desc' };
      break;
    case 'menu': state.menu = state.menu === v ? null : v; break;
    case 'cat': {
      const i = state.railOpen.indexOf(v);
      if (i >= 0) state.railOpen.splice(i, 1); else state.railOpen.push(v);
      break;
    }
    case 'fpick': {
      const cut = v.indexOf('|');
      const key = v.slice(0, cut), id = v.slice(cut + 1);

      if (id === FILTER_ALL_ID) {
        if (key === 'status') {

        } else {
          sel.length = 0;

        return;
      }
      if (aiCreates() && !state.add.standId) { toast('Выберите, куда добавить'); return; }
      // Закрываем форму ДО запуска: итог может сразу открыть окно «Что не добавилось».
      state.modal = null;
      state.addResult = null;
      if (aiCreates()) A.addToStand(state.add.text, addExtra(), state.add.platform, state.add.standId);
      else A.addAccounts(state.add.text, addExtra(), state.add.platform);
      break;
    }
    case 'addres-retry': {
      // Назад в форму с теми же метками — только проблемные ссылки, чтобы поправить их.
      const r = state.addResult;
      state.add.text = (r && r.retry) || '';
      state.addResult = null;
      state.modal = 'add';
      break;
    }
    case 'addres-copy': {
      const txt = state.addResult ? addResultText(state.addResult) : '';
      const done = function () { toast('Список скопирован'); };
      const fail = function () { toast('Не вышло скопировать — выделите текст в окне вручную'); };
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, fail);
        else fail();
      } catch (err) { fail(); }
      return;
    }
    case 'dense':      state.dense = !state.dense; break;
    case 'cols-reset': state.cols = DEFAULT_COLS.slice(); break;
    case 'col': {
      const i = state.cols.indexOf(v);
      if (i >= 0) { if (state.cols.length > 1) state.cols.splice(i, 1); }
      else state.cols = COLUMNS.filter(function (c) { return c.k === v || state.cols.indexOf(c.k) >= 0; })
                               .map(function (c) { return c.k; });
      break;
    }
    case 'sel': {
      const id = +v;
      const idx = el.dataset.idx != null ? +el.dataset.idx : -1;
      if (e.shiftKey && state.lastSel >= 0 && idx >= 0) {
        const all = visible();
        const page = all.slice((state.page - 1) * state.pageSize, state.page * state.pageSize);
        const from = Math.min(state.lastSel, idx), to = Math.max(state.lastSel, idx);
        for (let i = from; i <= to; i++) if (page[i]) state.selected.add(page[i].id);
      } else if (state.selected.has(id)) {
        state.selected.delete(id);
      } else {
        state.selected.add(id);
      }
      if (idx >= 0) state.lastSel = idx;
      paintSelection();
      return;
    }
    case 'sel-page': {
      const slice = visible().slice((state.page - 1) * state.pageSize, state.page * state.pageSize);
      const all = slice.every(function (a) { return state.selected.has(a.id); });
      slice.forEach(function (a) { if (all) state.selected.delete(a.id); else state.selected.add(a.id); });
      paintSelection();
      return;
    }
    case 'bulk': {
      const n = state.selected.size;
      if (v === 'clear') { state.selected.clear(); state.lastSel = -1; paintSelection(); return; }
      if (v === 'all')   { visible().forEach(function (a) { state.selected.add(a.id); }); paintSelection(); return; }
      const ids = Array.from(state.selected);
      if (v === 'refresh') { A.bulkRefresh(ids); return; }
      if (v === 'archive') {
        askConfirm({
          title: 'В архив', ok: 'В архив',
          text: 'Убрать ' + n + ' ' + plural(n, ['аккаунт', 'аккаунта', 'аккаунтов']) +
                ' в архив? Они пропадут из списка живых, но останутся в базе.',
          run: function () { A.bulkUpdate(ids, { is_archived: true }, 'В архиве'); state.selected.clear(); },
        });
        return;
      }
      if (v === 'ban') {
        askConfirm({
          title: 'Отметить баном', ok: 'Отметить',
          text: 'Пометить ' + n + ' ' + plural(n, ['аккаунт', 'аккаунта', 'аккаунтов']) + ' как забаненные?',
          run: function () { A.bulkUpdate(ids, { is_banned: true }, 'Помечены баном'); state.selected.clear(); },
        });
        return;
      }
      if (v === 'delete') {
        askConfirm({
          title: 'Удалить аккаунты', ok: 'Удалить', danger: true,
          text: 'Удалить ' + n + ' ' + plural(n, ['аккаунт', 'аккаунта', 'аккаунтов']) +
                ' вместе со снимками и постами?',
          note: 'Действие необратимо — восстановить можно только из бэкапа базы.',
          run: function () { A.bulkDelete(ids); state.selected.clear(); },
        });
        return;
      }
      toast('Массовое изменение: ' + v); return;
    }
    case 'edit-open': {
      const acc = ACCOUNTS.filter(function (x) { return x.id === +v; })[0];
      openEditAccount(acc);
      break;
    }
    case 'edit-save': {
      if (!state.edit) break;
      const miss = missingRequiredLabels(state.edit);
      if (miss.length) {
        toast('Укажите: ' + miss.join(', '));
        return;
      }
      A.saveEdit(state.edit);
      return;
    }
    case 'modal':
      state.modal = v;
      // Открывая форму добавления, подставляем домен текущей страницы:
      // с /reiz логично добавлять в reiz. Поменять всё равно можно.
      if (v === 'add') {
        state.add = { text: '', platform: '', domainId: addDefaultDomainId(),
                      profileId: 0, ownerId: 0, groupId: 0, countryId: 0 };
        if (aiCreates()) {
          const first = aiTopics()[0];
          state.add.standId = state.ai.topic !== 'all' ? +state.ai.topic : (first ? first.id : 0);
        }
      }
      break;
    // Кнопка в шапке открывает центр обновления. Запуск прогона —
    // отдельное действие внутри окна, чтобы не стартовать сбор по одному клику.
    case 'start-all':
      state.modal = 'refreshAll';
      state.runTab = state.run.on ? 'run' : 'schedule';
      state.runError = false;
      loadSchedule();
      break;
    case 'run-start':
      if (state.run.on) { state.runError = true; state.runTab = 'run'; break; }
      if (LIVE && !DEMO) {
        askConfirm({
          title: 'Запустить полный прогон', ok: 'Запустить',
          text: 'Обойти все аккаунты и обновить метрики. Прогон идёт в фоне, ход виден в этом же окне.',
          note: 'Это настоящий сбор с площадок вашими сессиями, а не тестовый запрос.',
          run: function () { state.runTab = 'run'; A.refreshAll(); },
        });
        break;
      }
      state.runTab = 'run';
      state.run.on = true; state.run.done = 0; state.run.cur = '@—';
      startRun();
      break;
    case 'run-report':
      if (DEMO || !LIVE) { toast('Демо-режим: отчёта нет'); return; }
      if (state.run.source === 'refresh_all') {
        window.open(API_BASE + '/api/accounts/refresh-all-report/', '_blank');
        return;
      }
      if (state.run.hasReport === false) { toast('Отчёт по последнему прогону ещё не сформирован'); return; }
      window.open(API_BASE + '/api/accounts/auto-refresh-report/', '_blank');
      return;
    case 'scrape-reload':
      loadScrapeBackend(true);
      return;
    case 'scrape-eng': {
      const cut = String(v || '').indexOf('|');
      if (cut < 0 || !state.scrape) break;
      const plat = v.slice(0, cut);
      const eng = v.slice(cut + 1);
      if (SCRAPE_ENGINE_PLATS.indexOf(plat) < 0) break;
      if (eng !== 'playwright' && eng !== 'apify') break;
      if (eng === 'apify' && !state.scrape.apify_enabled) {
        toast('Apify не настроен на сервере');
        return;
      }
      if (state.scrape[plat + '_backend'] === eng) return;
      const patchEng = {};
      patchEng[plat + '_backend'] = eng;
      A.saveScrapeBackend(patchEng);
      return;
    }
    case 'scrape-fb': {
      if (!state.scrape || SCRAPE_ENGINE_PLATS.indexOf(v) < 0) break;
      const key = v + '_fallback_enabled';
      const patchFb = {};
      patchFb[key] = !state.scrape[key];
      A.saveScrapeBackend(patchFb);
      return;
    }
    case 'confirm-ok': {
      const c = PENDING_CONFIRM;
      PENDING_CONFIRM = null; state.modal = null;
      // Только overlay: полный render() здесь сбрасывал скролл до завершения API.
      paintOverlay();
      if (c && c.run) c.run();
      return;
    }
    case 'cat-new':
      if (!v) break;
      openCatalogModal(v, 'create', null, state.route === 'settings' ? null : 'filter');
      break;
    case 'cat-edit': {
      const cut = v.indexOf('|');
      openCatalogModal(v.slice(0, cut), 'edit', +v.slice(cut + 1), null);
      break;
    }
    case 'cat-del': {
      const cut = v.indexOf('|');
      const kind = v.slice(0, cut), id = +v.slice(cut + 1);
      const meta = catalogOf(kind);
      const row = catalogFind(kind, id);
      if (!meta || !row) break;
      askConfirm({
        title: 'Удалить ' + meta.one + '?',
        text: '«' + esc(row.name) + '» будет удалён' +
          (row.count ? '. У ' + row.count + ' ' + plural(row.count, ['аккаунта', 'аккаунтов', 'аккаунтов']) +
            ' поле очистится' : '') + '.',
        ok: 'Удалить', danger: true,
        run: function () { A.deleteCatalog(kind, id); },
      });
      break;
    }
    case 'cat-color':
      if (state.catalog) state.catalog.color = v;
      break;
    case 'catalog-cancel': {
      const backAdd = state.catalog && state.catalog.selectInto === 'add';
      const backEdit = state.catalog && state.catalog.selectInto === 'edit';
      state.catalog = null;
      state.modal = backAdd ? 'add' : (backEdit ? 'edit' : null);
      break;
    }
    case 'catalog-save': {
      const el = document.getElementById('catname');
      if (el && state.catalog) state.catalog.name = el.value;
      const cat = state.catalog;
      if (!cat) break;
      const name = String(cat.name || '').trim();
      if (!name) { toast('Введите название'); return; }
      A.saveCatalog(cat);
      return;
    }
    case 'close':     state.modal = null; state.runError = false; PENDING_CONFIRM = null; state.catalog = null; state.edit = null; break;
    case 'scrim':     state.modal = null; state.runError = false; state.catalog = null; state.edit = null; break;
    case 'palette':   state.modal = 'palette'; state.paletteQ = ''; state.paletteI = 0; break;
    case 'pal-go': {
      const it = PALETTE_ITEMS[+v];
      if (!it) break;
      if (it.kind === 'a') it.d.go();
      else { state.route = 'detail'; state.detailId = it.d.id; state.detailTab = 'posts'; state.modal = null; }
      break;
    }
    case 'run-pause':
      // В LIVE паузы нет (только остановка на сервере) — кнопка скрыта в ribbon.
      if (LIVE && !DEMO) { toast('В живом режиме используйте «Остановить»'); return; }
      state.run.on = false; clearInterval(state.run.timer); toast('Прогон поставлен на паузу'); return;
    case 'run-stop':
      // Полоса сверху показывает и автообновление, и ручной сбор выбранных, и полный
      // прогон. Раньше кнопка всегда слала стоп полного прогона — для остальных
      // сервер отвечал «не запущен», и ничего не останавливалось.
      if (LIVE && !DEMO) {
        state.modal = null;
        const stop = state.run.source === 'refresh_all' ? A.refreshAllStop() : A.autoStop();
        Promise.resolve(stop).then(function () { setTimeout(pollRun, 1500); });
        return;
      }
      state.run.on = false; state.modal = null; clearInterval(state.run.timer); toast('Прогон остановлен'); return;
    case 'save':      state.modal = null; toast(v); return;
    case 'toast':     toast(v); return;
    case 'ai-topic':
      state.ai.topic = v; state.page = 1;
      // На «Аналитике» стенд — это срез данных: перечитываем топ постов по нему.
      if (state.route === 'analytics') {
        state.an.items = null; state.an.insights = null;
        if (LIVE) loadAnalytics();
      }
      break;
    case 'kpi-chart': kcOpen(v); return;
    case 'kc-period':
      if (state.kc && state.kc.period !== v) { state.kc.period = v; kcLoad(); }
      return;
    case 'stand-tool': {
      // «Убрать» и «Перенести» — та же форма, что «Новые аккаунты», в своём режиме.
      const cur = state.ai.topic !== 'all' ? +state.ai.topic : 0;
      state.add = { text: '', platform: '', domainId: addDefaultDomainId(),
                    profileId: 0, ownerId: 0, groupId: 0, countryId: 0, mode: v,
                    topicId: cur, pick: {}, pickQ: '' };
      if (v === 'move') {
        const other = aiTopics().filter(function (t) { return t.id !== cur; })[0];
        state.add.standId = other ? other.id : (cur || 0);
      }
      state.modal = 'add';
      paintOverlay();
      return;
    }
    case 'rm-pick': {
      const id = +v, pk = state.add.pick || (state.add.pick = {});
      const el = document.getElementById('addlist');
      if (el) state.add.text = el.value;
      if (pk[id]) delete pk[id]; else pk[id] = true;
      paintOverlay();
      return;
    }
    case 'ai-plat': {
      if (!v) state.ai.plats = [];
      else {
        const i = state.ai.plats.indexOf(v);
        if (i >= 0) state.ai.plats.splice(i, 1); else state.ai.plats.push(v);
      }
      break;
    }
    case 'ai-pick-open': aiPickOpen(); return;
    case 'ai-refresh': {
      // Только то, что на экране: выбранный стенд, площадки и поиск.
      const ids = aiVisible().map(function (a) { return a.id; });
      if (!ids.length) { toast('Нечего обновлять: на экране нет аккаунтов'); return; }
      if (state.run.on) { toast('Сейчас уже идёт обновление — дождитесь конца или остановите его'); return; }
      const t = state.ai.topic === 'all' ? null : aiTopic(state.ai.topic);
      const n = ids.length;
      askConfirm({
        title: 'Обновить статистику', ok: 'Обновить',
        text: 'Собрать свежие цифры по ' + n + ' ' + plural(n, ['аккаунту', 'аккаунтам', 'аккаунтам']) +
          (t ? ' ' + aiW().inOne.toLowerCase() + ' «' + esc(t.name) + '»' : ' ' + aiW().inAll.toLowerCase()) +
          '. Сбор идёт в фоне, ход виден в полосе сверху, там же его можно остановить.',
        note: 'Это настоящий сбор с площадок. Аккаунты, обновлённые совсем недавно, пропускаются.',
        run: function () { Promise.resolve(A.bulkRefresh(ids)).then(function () { setTimeout(pollRun, 1500); }); },
      });
      return;
    }
    case 'ait-emoji-open': {
      const k = v === 'new' ? 'new' : +v;
      state.ai.emojiFor = state.ai.emojiFor === k ? null : k;
      const ni = document.getElementById('ait-new-name'); if (ni) state.ai.newName = ni.value;
      paintBody(); return;
    }
    case 'ait-emoji-pick': {
      const i = String(v).indexOf('|');
      aiSetEmoji(String(v).slice(0, i), String(v).slice(i + 1)); return;
    }
    case 'ait-color': {
      const parts = String(v).split('|');
      aiTopicPatch(+parts[0], { color: parts[1] }); return;
    }
    case 'ait-add': aiTopicCreate(); return;
    case 'ait-del': {
      const t = aiTopic(v); if (!t) return;
      const n = t.account_ids.length;
      askConfirm({
        title: 'Удалить ' + aiW().acc + ' «' + esc(t.name) + '»?',
        text: n ? aiW().inOne + ' ' + n + ' ' + plural(n, ['аккаунт', 'аккаунта', 'аккаунтов']) + '. Сами аккаунты не удалятся: они останутся в своих доменах и ' + aiW().others + '.'
                : aiW().empty,
        ok: 'Удалить', danger: true,
        run: function () {
          apiSend('/api/accounts/topics/' + t.id + '/', undefined, 'DELETE')
            .then(function () {
              state.ai.topics = aiTopics().filter(function (x) { return x.id !== t.id; });
              if (String(state.ai.topic) === String(t.id)) state.ai.topic = 'all';
              toast(aiW().title + ' «' + t.name + '» ' + aiW().removed);
            })
            .catch(function (err) { toast('Не получилось: ' + (err.message || err)); })
            .finally(function () { paintBody(); });
        },
      });
      return;
    }
    case 'ai-pick-topic': if (state.ai.pick) state.ai.pick.topicId = +v; paintOverlay(); return;
    case 'ai-pick-toggle': {
      const p = state.ai.pick; if (!p) return;
      const id = +v, t = aiTopic(p.topicId); if (!t) return;
      if (p.busy[id] || aiTopicsOf(id).length) return;
      const row = (p.rows || []).filter(function (r) { return r.id === id; })[0];
      p.busy[id] = true; paintOverlay();
      aiToggle(t.id, id, 'add')
        .then(function () { toast('@' + (row ? row.username : id) + ' добавлен ' + aiW().prep + ' «' + t.name + '»'); })
        .catch(function (err) { toast('Не получилось: ' + (err.message || err)); })
        .finally(function () { if (state.ai.pick) delete state.ai.pick.busy[id]; paintOverlay(); paintBody(); });
      return;
    }
    case 'ai-remove': {
      const parts = String(v).split('|'), t = aiTopic(parts[0]), id = +parts[1];
      const a = ACCOUNTS.filter(function (x) { return x.id === id; })[0];
      aiToggle(+parts[0], id, 'remove')
        .then(function () { toast('@' + (a ? a.username : id) + ' убран ' + aiW().from + ' ' + aiW().gen + ' «' + (t ? t.name : '') + '»'); })
        .catch(function (err) { toast('Не получилось: ' + (err.message || err)); })
        .finally(function () { paintBody(); });
      return;
    }
    case 'f-reset':
      state.q = '';
      FILTERS.forEach(function (c) { state.f[c.k] = []; });
      state.page = 1; state.selected.clear();
      break;
    default: return;
  }
  // Адрес следует за экраном — одной точкой на все действия, а не в каждом
  // case по отдельности: маршрут меняют и рельс, и командная палитра, и выход из эфира.
  syncUrl();
  // Каждое действие трогает свой слой: клик в модалке не пересобирает таблицу.
  if (OVERLAY_ACTS.has(act)) paintOverlay();
  else if (MAIN_ACTS.has(act)) paintMain();
  else render();
});

/* Действия, которым хватает верхнего слоя (модалки, меню, панель выделения) */
const OVERLAY_ACTS = new Set([
  'menu', 'modal', 'close', 'scrim', 'run-tab', 'start-all', 'palette', 'add-mode',
  'sched-bool', 'sched-int', 'sched-skip', 'sched-mode', 'sched-time',
  'cat-new', 'cat-edit', 'cat-del', 'cat-color', 'catalog-cancel',
  'edit-open', 'addres-retry', 'add-move',
]);
/* Действия, меняющие список и рельс, но не шапку */
const MAIN_ACTS = new Set([
  'sel', 'sel-page', 'page', 'sort', 'dense', 'col', 'cols-reset', 'ai-topic', 'ai-plat',
  'fpick', 'f-clear', 'f-reset', 'cat', 'tab', 'post-view',
]);

/* Темы AI: название сохраняем при уходе из поля или по Enter. Сверяем с
   сохранённым названием, а не полагаемся на change: после перерисовки поле
   создаётся заново с черновиком, и браузер «изменения» уже не видит. */
function aiSaveTopicName(el) {
  const t = aiTopic(el.dataset.topicName), name = el.value.trim();
  if (!t) return;
  if (name === t.name) { delete state.ai.drafts[t.id]; return; }
  if (!name) { toast('Название не может быть пустым'); delete state.ai.drafts[t.id]; el.value = t.name; return; }
  aiTopicPatch(t.id, { name: name }, aiW().renamed);
}
document.addEventListener('focusout', function (e) {
  const el = e.target;
  if (el && el.isConnected && el.dataset && el.dataset.topicName) aiSaveTopicName(el);
});
document.addEventListener('change', function (e) {
  const el = e.target;
  if (!el || !el.dataset) return;
  if (el.dataset.emoFor) {
    const emo = el.value.trim();
    if (emo) aiSetEmoji(el.dataset.emoFor, emo);
  }
});
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Enter' || !e.target) return;
  if (e.target.id === 'ait-new-name') { e.preventDefault(); aiTopicCreate(); return; }
  if (e.target.dataset && e.target.dataset.topicName) { e.preventDefault(); aiSaveTopicName(e.target); return; }
  if (e.target.dataset && e.target.dataset.emoFor) { e.preventDefault(); e.target.blur(); }
});
let qTimer = null;
document.addEventListener('input', function (e) {
  if (e.target.id === 'ait-new-name') { state.ai.newName = e.target.value; return; }
  if (e.target.dataset && e.target.dataset.topicName) { state.ai.drafts[e.target.dataset.topicName] = e.target.value; return; }
  if (e.target.id === 'q') {
    // Перерисовка списка на каждое нажатие ощущается как залипание,
    // поэтому ждём паузу в наборе. Само поле — живой DOM, оно не мигает.
    state.q = e.target.value; state.page = 1;
    clearTimeout(qTimer);
    qTimer = setTimeout(function () { render(); }, 160);
    return;
  }
  if (e.target.id === 'rmq') {
    if (state.add) state.add.pickQ = e.target.value;
    clearTimeout(qTimer);
    qTimer = setTimeout(function () { paintOverlay(); }, 140);
    return;
  }
  if (e.target.id === 'aipq') {
    if (state.ai.pick) state.ai.pick.q = e.target.value;
    clearTimeout(qTimer);
    qTimer = setTimeout(function () { paintOverlay(); }, 140);
    return;
  }
  if (e.target.id === 'addlist') {
    state.add.text = e.target.value;
    clearTimeout(addPrevTimer);
    addPrevTimer = setTimeout(paintAddPreview, 180);
    return;
  }
  if (e.target.id === 'catname') {
    if (state.catalog) state.catalog.name = e.target.value;
    return;
  }
  if (e.target.id === 'cookiestext') { state.cookiesText = e.target.value; return; }
  if (e.target.id === 'pal')  { state.paletteQ = e.target.value; state.paletteI = 0; render(); }
});

/* Меню закрывается при прокрутке страницы и ресайзе: оно позиционировано
   по координатам кнопки. Скролл внутри самого .menu не трогаем — иначе
   длинный список «Действий» закрывался бы при попытке долистать. */
window.addEventListener('scroll', function (e) {
  if (!state.menu || menuPaintLock) return;
  const t = e.target;
  if (t && t.nodeType === 1 && t.closest && t.closest('.menu')) return;
  state.menu = null; render();
}, true);

document.addEventListener('keydown', function (e) {
  const act = document.activeElement;
  /* Строки и карточки — это div-ы: Enter и пробел им нужно раздать вручную */
  if ((e.key === 'Enter' || e.key === ' ') && act && act.matches && act.matches('[data-act="open"], [data-act="kpi-chart"], [data-act="rm-pick"]')) {
    e.preventDefault(); act.click(); return;
  }
  const typing = !!(act && (act.tagName === 'INPUT' || act.tagName === 'TEXTAREA' || act.isContentEditable));
  if (!typing && !state.modal && state.route !== 'tv') {
    if (e.key === '/') { e.preventDefault(); const q = document.getElementById('q'); if (q) q.focus(); return; }
  }
  /* Стрелки перемещают фокус по списку аккаунтов */
  if (!typing && (e.key === 'ArrowDown' || e.key === 'ArrowUp') && !state.modal && state.route === 'accounts') {
    const rows = Array.prototype.slice.call(document.querySelectorAll('[data-act="open"]'));
    if (rows.length) {
      const i = rows.indexOf(act);
      e.preventDefault();
      if (i < 0) rows[0].focus();
      else rows[Math.min(rows.length - 1, Math.max(0, i + (e.key === 'ArrowDown' ? 1 : -1)))].focus();
      return;
    }
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault(); state.modal = 'palette'; state.paletteQ = ''; state.paletteI = 0; render(); return;
  }
  if (state.route === 'tv') {
    // Экран один, переключать нечего — остаётся только выход.
    if (e.key === 'Escape') { state.route = 'accounts'; syncUrl(); render(); }
    return;
  }
  if (e.key === 'Escape') {
    if (state.menu) { state.menu = null; render(); }
    else if (state.modal === 'catalog') {
      const backAdd = state.catalog && state.catalog.selectInto === 'add';
      const backEdit = state.catalog && state.catalog.selectInto === 'edit';
      state.catalog = null;
      state.modal = backAdd ? 'add' : (backEdit ? 'edit' : null);
      render();
    }
    else if (state.modal) { state.modal = null; state.catalog = null; state.edit = null; render(); }
    else if (state.selected.size) { state.selected.clear(); render(); }
    return;
  }
  if (state.modal === 'catalog' && e.key === 'Enter' && act && act.id === 'catname') {
    e.preventDefault();
    if (state.catalog) state.catalog.name = act.value;
    A.saveCatalog(state.catalog);
    return;
  }
  if (state.modal === 'palette') {
    if (e.key === 'ArrowDown') { e.preventDefault(); state.paletteI = Math.min(PALETTE_ITEMS.length - 1, state.paletteI + 1); render(); }
    if (e.key === 'ArrowUp')   { e.preventDefault(); state.paletteI = Math.max(0, state.paletteI - 1); render(); }
    if (e.key === 'Enter') {
      const it = PALETTE_ITEMS[state.paletteI];
      if (it) {
        if (it.kind === 'a') it.d.go();
        else { state.route = 'detail'; state.detailId = it.d.id; state.detailTab = 'posts'; state.modal = null; }
        render();
      }
    }
  }
});

/* ============================================================
   15. ЖИВЫЕ ДАННЫЕ — Django API
   Без ?demo=1 сиды очищены: при ошибке API список пуст, а не «демо».
   ============================================================ */
let LIVE = false;
/* Демо-режим объявлен выше (DEMO): без него сиды очищены до первой отрисовки. */
const API_PORT = '8000';            // порт Django локально (manage.py runserver); переопределяется as_api_base
const API_BASE = (function () {
  try { const o = localStorage.getItem('as_api_base'); if (o) return o.replace(/\/+$/, ''); } catch (e) {}
  if (location.protocol === 'file:') return 'http://127.0.0.1:' + API_PORT;
  if (location.port === API_PORT) return '';
  // Dev-статика (:5174/:5173) → Django на API_PORT. Прод (nginx :80/:9082/:443) — same-origin /api.
  const p = String(location.port || '');
  const localUi = p === '5174' || p === '5173';
  const loopback = location.hostname === '127.0.0.1' || location.hostname === 'localhost';
  if (localUi || (loopback && p && p !== '80' && p !== '443' && p !== '9082' && p !== '9080')) {
    return location.protocol + '//' + location.hostname + ':' + API_PORT;
  }
  return '';
})();
const ACC_QS = 'include_hidden=1&archived=all&banned=all';

/* ============================================================
   ДОМЕН — самый верхний фильтр

   Домен — это кусок пути. Пустой путь показывает всю сеть, /reiz — только
   аккаунты reiz. Дальше домен уезжает в заголовке X-Domain на каждый запрос:
   так не нужно переписывать полсотни адресов, и бэкенд сужает выдачу сам.

   Поддомены сознательно не разбираем: у dashboard-new.atom-farm.com первая
   часть хоста — это само приложение, и приняв её за домен, мы получили бы
   «домен не найден» на главной.

   Слово efir зарезервировано: это не арендатор, а сводный эфир по всем
   доменам сразу.
   ============================================================ */
const DOMAIN_AGGREGATE = 'efir';
const RESERVED_PATH = { api: 1, admin: 1, media: 1, static: 1, healthz: 1, index: 1 };
/* Экраны, у которых есть свой адрес. Первым куском пути они значат «экран без
   домена», вторым — «этот экран внутри домена»: /analytics и /reiz/analytics. */
const SCREEN_SEG = { efir: 'tv', analytics: 'analytics', settings: 'settings' };
const SEG_BY_ROUTE = { tv: DOMAIN_AGGREGATE, analytics: 'analytics', settings: 'settings' };
const PATH_SEGS = (location.pathname || '').split('/').filter(Boolean)
  .map(function (s) { return s.toLowerCase(); });
const DOMAIN = (function () {
  const seg = PATH_SEGS[0];
  if (!seg || RESERVED_PATH[seg] || /\./.test(seg)) return '';
  // /analytics — это экран, а не домен; /efir — сводный эфир, он тоже домен.
  if (SCREEN_SEG[seg] && seg !== DOMAIN_AGGREGATE) return '';
  return seg;
})();
/* Эфир открывается двумя адресами: /efir — сводный по всем доменам,
   /reiz/efir — только по своему. Данные сужает та же логика домена, поэтому
   отдельного кода эфиру не нужно: он показывает ровно то, что ему видно. */
const TV_ON_LOAD = PATH_SEGS[0] === DOMAIN_AGGREGATE || PATH_SEGS[1] === DOMAIN_AGGREGATE;
/* Префикс для ссылок внутри интерфейса, чтобы переходы не теряли домен. */
const DOMAIN_PREFIX = DOMAIN && DOMAIN !== DOMAIN_AGGREGATE ? '/' + DOMAIN : '';

/* ---- адрес следует за экраном --------------------------------------
   Раньше интерфейс адрес не трогал совсем. Пришли по старой ссылке вида
   ?route=tv или /emu — и она висела в строке, пока вы ходите по экранам,
   будто приложение её само подставляет. Плюс на любой экран нельзя было
   дать ссылку и не работало «назад».
   Теперь адрес пересобирается из домена и экрана, а чужие параметры из
   строки убираем: приложение читает только demo. */
const KEEP_PARAMS = { demo: 1 };
function routeUrl(route) {
  const seg = SEG_BY_ROUTE[route] || '';
  const base = DOMAIN === DOMAIN_AGGREGATE ? '' : DOMAIN_PREFIX;
  let path = base + (seg ? '/' + seg : '') || '/';
  const keep = [];
  try {
    new URLSearchParams(location.search).forEach(function (val, key) {
      if (KEEP_PARAMS[key]) keep.push(key + '=' + encodeURIComponent(val));
    });
  } catch (e) {}
  return path + (keep.length ? '?' + keep.join('&') : '');
}
/* Полный переход на другой домен с сохранением текущего экрана
   (/analytics, /settings, эфир). DOMAIN — константа из pathname, поэтому
   history.pushState недостаточно: нужен reload по новому адресу. */
function goDomain(slug) {
  const want = String(slug || '');
  // All и /efir — одна «вся сеть»; не гоняем лишний reload между ними
  // при выборе All, если уже смотрим сводку (кроме смены экрана ниже).
  const hereAll = !DOMAIN || DOMAIN === DOMAIN_AGGREGATE;
  if (!want && hereAll && state.route !== 'tv') return;
  if (want && want === DOMAIN) return;
  const route = state.route === 'detail' ? 'accounts' : state.route;
  const screen = SEG_BY_ROUTE[route] || '';
  let path;
  if (!want) {
    // All: аккаунты всей сети (не /efir — тот открывает эфир через нав).
    path = screen && screen !== DOMAIN_AGGREGATE ? '/' + screen : '/';
  } else if (want === DOMAIN_AGGREGATE || screen === DOMAIN_AGGREGATE) {
    path = want === DOMAIN_AGGREGATE
      ? '/' + DOMAIN_AGGREGATE
      : '/' + want + '/' + DOMAIN_AGGREGATE;
  } else if (screen) {
    path = '/' + want + '/' + screen;
  } else {
    path = '/' + want;
  }
  const keep = [];
  try {
    new URLSearchParams(location.search).forEach(function (val, key) {
      if (KEEP_PARAMS[key]) keep.push(key + '=' + encodeURIComponent(val));
    });
  } catch (e) {}
  location.assign(path + (keep.length ? '?' + keep.join('&') : ''));
}
function syncUrl(replace) {
  // Карточку аккаунта своим адресом не отмечаем: у неё нет собственного
  // маршрута, и подменять его на список было бы враньём про «назад».
  const route = state.route === 'detail' ? 'accounts' : state.route;
  const url = routeUrl(route);
  if (url === location.pathname + location.search) return;
  try {
    history[replace ? 'replaceState' : 'pushState']({ route: route }, '', url);
  } catch (e) {}
}
window.addEventListener('popstate', function () {
  const segs = (location.pathname || '').split('/').filter(Boolean).map(function (s) { return s.toLowerCase(); });
  const last = segs[segs.length - 1];
  const route = (last && SCREEN_SEG[last]) || 'accounts';
  if (route === state.route) return;
  state.route = route;
  state.detailId = null;
  render();
});
function domainHeaders(extra, opts) {
  const h = extra || {};
  // Расписание глобальное: справочники грузим по всем доменам, без X-Domain.
  if (DOMAIN && !(opts && opts.allDomains)) h['X-Domain'] = DOMAIN;
  return h;
}

async function api(path, opts) {
  const r = await fetch(API_BASE + path, {
    headers: domainHeaders({ Accept: 'application/json' }, opts),
  });
  if (!r.ok) throw new Error('HTTP ' + r.status + ' на ' + path);
  return r.json();
}
function minutesSince(iso) {
  if (!iso) return 999999;
  const t = Date.parse(iso);
  return isNaN(t) ? 999999 : Math.max(0, Math.round((Date.now() - t) / 60000));
}
function deltasOf(r) {
  return { f: r.follower_delta || 0, v: r.view_delta || 0, l: r.like_delta || 0,
           p: r.post_delta || 0, c: r.link_click_delta || 0 };
}
function mapAccount(r) {
  const d = deltasOf(r);
  return {
    id: r.id, username: r.username, display: r.display_name || r.username, platform: r.platform,
    domainId: r.domain_id || 0, domainName: r.domain_name || '',
    profileId: r.profile_id || 0, ownerId: r.owner_id || 0, groupId: r.group_id || 0, countryId: r.country_id || 0,
    followers: r.follower_count || 0, views: r.view_count || 0, likes: r.like_count || 0,
    posts: r.post_count || 0, clicks: r.link_click_count || 0,
    series: null, postList: null,
    d: { 1: d, 7: d, 30: d },
    updated: minutesSince(r.updated_at),
    unavailable: !!r.profile_unavailable, archived: !!r.is_archived, banned: !!r.is_banned,
  };
}
/* «night&#39;s» → «night's». Сервер уже раскодирует, это страховка для старых
   записей: textarea разбирает только сущности, теги в ней не создаются. */
const ENTITY_RE = /&(?:#\d{1,7}|#x[0-9a-f]{1,6}|[a-z][a-z0-9]{1,31});/i;
function decodeEntities(s) {
  s = String(s || '');
  if (!ENTITY_RE.test(s)) return s;
  const ta = document.createElement('textarea');
  ta.innerHTML = s;
  return ta.value;
}
function mapPost(p) {
  const tags = Array.isArray(p.hashtags) ? p.hashtags : [];
  const txt = decodeEntities(p.description).trim();
  return {
    id: p.id,
    title: txt ? txt.split('\n')[0].slice(0, 90) : 'Пост ' + (p.external_id || p.id),
    hashtag: tags.length ? (String(tags[0]).charAt(0) === '#' ? tags[0] : '#' + tags[0]) : '',
    views: p.view_count || 0, likes: p.like_count || 0, comments: p.comment_count || 0,
    viewDelta: p.view_delta || 0,
    daysAgo: p.posted_at ? Math.round(minutesSince(p.posted_at) / 1440) : 0,
    hue: ((p.id || 0) * 47) % 360,
    thumb: p.thumbnail_url || '',
    thumbMissing: !!p.thumbnail_missing,
    url: p.post_url || '',
  };
}

const deltaLoaded = { 1: false, 7: false, 30: false };
/* Запрос уже в пути: без этого флага быстрые щелчки по периоду в шапке шлют
   второй такой же запрос, пока первый не вернулся. */
const deltaPending = { 1: false, 7: false, 30: false };
async function ensureDeltas(period) {
  if (!LIVE || deltaLoaded[period] || deltaPending[period]) return;
  deltaPending[period] = true;
  try {
    const rows = await api('/api/accounts/?' + ACC_QS + '&delta_period_days=' + period);
    const by = {}; rows.forEach(function (r) { by[r.id] = r; });
    ACCOUNTS.forEach(function (a) { const r = by[a.id]; if (r) a.d[period] = deltasOf(r); });
    deltaLoaded[period] = true;
    render();
  } catch (e) { deltaLoaded[period] = false; }
  finally { deltaPending[period] = false; }
}

async function loadPosts(a) {
  a._postsLoading = true;
  try {
    const rows = await api('/api/accounts/' + a.id + '/posts/?delta_period_days=' + state.period);
    a.postList = (Array.isArray(rows) ? rows : (rows.results || [])).map(mapPost);
  } catch (e) { a.postList = []; }
  a._postsLoading = false;
  if (state.route === 'detail' && state.detailId === a.id) render();
}

/* Точечное обновление прогресса. Полная перерисовка тут недопустима:
   опрос идёт каждые 4 секунды, и страница моргала бы всё время простоя. */
function paintRun() {
  const pct = state.run.total ? Math.round(state.run.done / state.run.total * 100) : 0;
  // Эфир рисует прогон своей плашкой, ленты #rb-done там нет. Без этой ветки
  // ветка «лента должна быть, но её нет» звала render() на каждый опрос, то
  // есть раз в 4 секунды пересобирала одометр — цифры подменялись без
  // анимации, барабан не успевал докрутиться (у него 1.8–2.1 с).
  const tvDone = document.getElementById('tv-run-done');
  if (tvDone) {
    tvDone.textContent = state.run.done + ' / ' + state.run.total;
    paintRunModal(pct);
    return;
  }
  const done = document.getElementById('rb-done');
  if (state.run.on) {
    if (!done) { render(); return; }          // лента должна быть, но её нет
    const bar = document.getElementById('rb-bar');
    const cur = document.getElementById('rb-cur');
    done.textContent = state.run.done + ' / ' + state.run.total;
    if (bar) bar.style.width = pct + '%';
    if (cur) cur.textContent = 'Сейчас: ' + state.run.cur;
  } else if (done) {
    render();                                  // прогон кончился — лента лишняя
    return;
  }
  paintRunModal(pct);
}
/* Окно «Обновление» тоже обновляем по месту, иначе оно моргает вместе с фоном. */
function paintRunModal(pct) {
  const p = document.getElementById('rm-pct');
  if (!p) return;
  p.textContent = pct + '%';
  const b = document.getElementById('rm-bar');
  if (b) b.style.width = pct + '%';
  const c = document.getElementById('rm-count');
  const u = document.getElementById('rm-cur');
  if (c) c.textContent = state.run.done + ' из ' + state.run.total + ' аккаунтов';
  if (u) {
    u.textContent = 'Сейчас: ' + state.run.cur +
      (state.run.failed ? ' · ошибок ' + state.run.failed : '') +
      ' · осталось ~' + Math.max(1, Math.round((state.run.total - state.run.done) / 16)) + ' мин';
  }
}
/* Итог прогона человеческим языком. Пропущенные и отменённые называем прямо:
   молчание о них выглядит как поломка. Причину берём из ответа сервера. */
function runFinishedToast(s) {
  const items = (s.run_detail && s.run_detail.items) || [];
  const by = {};
  items.forEach(function (i) { by[i.status] = (by[i.status] || 0) + 1; });
  const ok = s.success_accounts || 0;
  const failed = s.failed_accounts || 0;
  const skipped = by.skipped || 0;
  const cancelled = by.cancelled || 0;
  if (!ok && !failed && (skipped || cancelled)) {
    // Ничего не собралось — объясняем почему, словами самого сервера.
    const why = (items.filter(function (i) { return i.detail; })[0] || {}).detail || '';
    toast('Ничего не обновилось: ' +
      (skipped ? skipped + ' пропущено' : '') +
      (skipped && cancelled ? ', ' : '') +
      (cancelled ? cancelled + ' отменено' : '') +
      (why ? ' — ' + why : ''));
    return;
  }
  const parts = ['Обновлено ' + ok];
  if (failed) parts.push('ошибок ' + failed);
  if (skipped) parts.push('пропущено ' + skipped);
  if (cancelled) parts.push('отменено ' + cancelled);
  toast(parts.join(', '));
}

let pollTimer = null;
async function pollRun() {
  if (!LIVE) return;
  try {
    const s = await api('/api/accounts/auto-refresh-status/');
    const was = state.run.on;
    state.run.on    = !!s.is_running;
    state.run.total = s.total_accounts || 0;
    state.run.done  = s.processed_accounts || 0;
    state.run.cur   = s.current_account ? '@' + s.current_account : '—';
    state.run.failed = s.failed_accounts || 0;
    state.run.source = s.active_pipeline === 'refresh_all' ? 'refresh_all' : (s.source || '');
    state.run.hasReport = !!s.has_csv_report;
    // Начало последнего прогона нужно, чтобы отличить «обновился в нём»
    // от «не обновлялся»: отменённые от успешных иначе не отличить.
    const st = s.started_at ? Date.parse(s.started_at) : NaN;
    state.run.startedAt = isFinite(st) ? st : state.run.startedAt || 0;
    // Прогон только что закончился — говорим чем. Раньше интерфейс отчитывался
    // одним «отправлено» сразу после запуска и больше ничего не говорил: прогон мог
    // закончиться за секунду, всё пропустив, и выглядело это как «кнопка не работает».
    if (was && !state.run.on) runFinishedToast(s);

}

/* ============================================================
   ЖИВОЙ СЧЁТЧИК (только эфир: /efir и /<домен>/efir)

   На странице «Аккаунты» KPI — актуальные суммы из БД, без анимации.
   В эфире рост идёт с 10:00 до 20:00 по Москве: от «вчера в 10:00» к
   «сегодня в 10:00». После 20:00 цифра заморожена до следующих 10:00.
   Тик — раз в секунду; прирост размазан по всем ~36 000 секундам окна
   (где-то +1/+2, где-то 0), а не «съеден» в начале.

   Случайность детерминированная — сеется от даты окна, поэтому во всех
   вкладках и у всех зрителей число совпадает и не сбрасывается при

   ============================================================ */
const VC_TICK_MS = 1000;

function vcSeed(s) {                       // строка окна -> 32-битное зерно
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

  let a = seed >>> 0;

    a = (a + 0x6D2B79F5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

}
/* Накопленная прибавка по тикам. Веса положительные, поэтому ряд не убывает —
   счётчик не может пойти назад. В последнем тике сумма ровно равна приросту.
   Прирост меньше числа тиков → часть секунд даёт +0 (тик «пропускается»). */
function vcSteps(growth, seed, ticks) {
  const n = Math.max(1, ticks | 0);
  const cum = new Int32Array(n + 1);
  if (growth <= 0) return cum;
  const rnd = vcRand(seed);
  const w = new Float64Array(n);
  let sum = 0;
  for (let i = 0; i < n; i++) { w[i] = 0.15 + rnd() * 1.7; sum += w[i]; }
  let acc = 0;
  for (let i = 0; i < n; i++) {
    acc += w[i];
    cum[i + 1] = Math.round(growth * acc / sum);
  }
  cum[n] = growth;
  return cum;
}
/* Кто мы и какие домены вообще есть. Ответ нужен только для подписи в шапке —
   сужает выдачу всё равно бэкенд, по заголовку. */
function applyDomainsPayload(d) {
  if (!d) { state.domains = null; return; }
  const cur = (d.domains || []).filter(function (x) { return x.slug === d.current; })[0] || null;
  state.domains = { current: cur, unknown: d.unknown || null, list: d.domains || [],
                    unassigned: d.unassigned_accounts || 0 };
  [PROFILES, OWNERS, GROUPS, COUNTRIES].forEach(function (arr) {
    arr.forEach(function (r) {
      if (!r.domainId) { r.domainName = ''; return; }
      const hit = state.domains.list.filter(function (x) { return x.id === r.domainId; })[0];
      r.domainName = hit ? hit.name : '';
    });
  });
}
function applyViewsAnchorsPayload(a) {
  if (!a) { state.vc = null; return; }
  const start = Date.parse(a.window_start);
  const end = Date.parse(a.window_end);
  if (!isFinite(start) || !isFinite(end) || end <= start) { state.vc = null; return; }
  const ticks = Math.max(1, Math.round((end - start) / VC_TICK_MS));
  const nextAt = Date.parse(a.next_window_start);
  const m = {};
  const src = a.metrics || {};
  Object.keys(src).forEach(function (key) {
    const p = src[key];
    if (!p || p.prev === null || p.prev === undefined) return;
    const growth = Math.max(0, p.growth || 0);
    m[key] = {
      prev: p.prev,
      growth: growth,
      source: p.source,
      cum: vcSteps(growth, vcSeed(a.window_start + ':' + key), ticks),
    };
  });
  if (!Object.keys(m).length) { state.vc = null; return; }
  state.vc = {
    // Прирост по аккаунтам за окно: по нему считается точный рост любого среза.
    ag: (a.account_growth && Object.keys(a.account_growth).length) ? a.account_growth : null,
    start: start,
    end: end,
    // Новые якоря — в следующие 10:00; после 20:00 просто стоим на финише.
    next: isFinite(nextAt) ? nextAt : (start + 24 * 60 * 60 * 1000),
    ticks: ticks,

async function loadDomains() {

async function loadViewsAnchors() {

/* Число для первой отрисовки: живое, если якоря есть, иначе как в базе. */
function vcOr(fallback, key) {
  const n = vcTotal(key);
  return n === null ? fallback : n;
}
/* Текущее показываемое число, либо null — тогда рисуем как раньше, из базы. */
function vcTotal(key) {
  const v = state.vc;
  if (!v) return null;
  const p = v.m[key || 'views'];
  if (!p) return null;
  const ticks = v.ticks || VC_TICKS_FALLBACK;
  const k = Math.floor((Date.now() + v.skew - v.start) / VC_TICK_MS);
  if (k < 0) return p.prev;                 // ещё не 10:00 — стартовое
  if (k >= ticks) return p.prev + p.growth;  // после 20:00 — заморозка
  return p.prev + p.cum[k];
}
/* Своя цифра, растущая в темпе домена. Якоря приходят по домену целиком, и на
   срезе (фильтры рельса) или на приросте за период абсолют из них брать
   нельзя — зато можно взять долю набега: домен за окно набрал (n − prev), и
   набору достаётся эта величина пропорционально его весу abs/prev.
     base — что показываем сейчас по базе (абсолют или прирост за период),
     abs  — абсолют того же показателя по набору, нужен только ради веса.
   Это разнесённый общий прирост, а не измеренный прирост набора: точные
   цифры даёт перечитывание списка, барабан лишь держит их живыми. */
/* Доля окна, уже пройденная: 0 в 10:00, 1 к 20:00. Берём из ряда просмотров —
   именно он задаёт темп всему табло. */
function vcProgress() {
  const v = state.vc;
  if (!v) return null;
  const p = v.m.views;
  if (!p || !p.growth) return null;
  const n = vcTotal('views');
  if (n === null) return null;
  const d = (n - p.prev) / p.growth;
  return d < 0 ? 0 : (d > 1 ? 1 : d);
}
/* Точный прирост набора за окно: складываем измеренный прирост ровно тех
   аккаунтов, что сейчас на экране. Работает при любом сочетании фильтров —
   по суммам домена или площадки сочетание не собрать, а по аккаунтам да.
   null, пока у опорных точек нет разбивки: тогда остаётся vcApportion. */
function vcSetGrowth(list) {
  const ag = state.vc && state.vc.ag;
  if (!ag) return null;
  let sum = 0;
  for (let i = 0; i < list.length; i++) sum += +ag[String(list[i].id)] || 0;
  return sum;
}
function vcApportion(base, abs, key) {
  const v = state.vc;
  if (!v) return null;
  const p = v.m[key || 'views'];
  if (!p || !p.prev) return null;
  const n = vcTotal(key);

}
/* Обновляем только сами цифры, не пересобирая слой. */
function vcPaint() {
  if (!state.vc || state.route !== 'tv') return;
  const els = document.querySelectorAll('[data-vc]');
  for (let i = 0; i < els.length; i++) {
    const ds = els[i].dataset;
    // data-vc-growth — измеренный прирост набора: ведём базу к нему по ходу окна.
    // data-vc-base без него — срез или период без разбивки: разносим прирост домена.
    let n;
    if (ds.vcGrowth !== undefined) {
      const pr = vcProgress();
      n = pr === null ? null : Math.round(+ds.vcBase + (+ds.vcGrowth) * pr);
    } else if (ds.vcBase !== undefined) {
      n = vcApportion(+ds.vcBase, +ds.vcAbs, ds.vc);
    } else {
      n = vcTotal(ds.vc);
    }
    if (n === null) continue;
    vcSet(els[i], ds.vcFmt === 'comp' ? comp(n) : fmt(n));
  }
}

/* --- одометр -------------------------------------------------------
   Рисунок числа: где цифра, где разделитель. Если он поменялся (число
   выросло на разряд), одометр пересобираем целиком. */
/* Барабан: при тике раз в секунду докрутка должна уложиться в тик —
   без полного оборота, только переход на соседнюю цифру. */
const VC_ROLL_MS = 720;
const VC_ROLL_STEP_MS = 35;
const VC_ROLL_EASE = 'cubic-bezier(.16, .72, .24, 1.06)';
const VC_SPIN_TURNS = 0;
function vcReduceMotion() {
  try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
  catch (e) { return false; }
}

function vcShape(s) { return s.replace(/\d/g, '#'); }
function isDigit(ch) { return ch >= '0' && ch <= '9'; }

function vcSet(el, s) {
  const nextNum = +s.replace(/\D/g, '');
  const prevNum = +(el.dataset.vcNum === undefined ? NaN : el.dataset.vcNum);
  if (isFinite(prevNum) && nextNum === prevNum) {
    const odo = el.firstElementChild;
    if (odo && odo.classList && odo.classList.contains('odo') && odo.dataset.shape === vcShape(s)) {
      return; // заморозка / тик +0 — не трогаем барабан
    }
  }
  el.dataset.vcNum = nextNum;
  const odo = el.firstElementChild;
  if (!odo || !odo.classList || !odo.classList.contains('odo') || odo.dataset.shape !== vcShape(s)) {
    vcBuild(el, s);
    return;
  }
  // Скачок — это не тик счётчика, а подмена числа: первая замена значения из
  // базы на живое или новые якоря в 10:00. Крутить его незачем.
  //
  // Раньше скачок узнавали по числу изменившихся разрядов (> 3). Мерка
  // оказалась негодной: у просмотров обычный шаг тика — это и есть 4–5
  // разрядов (20 161 479 -> 20 174 658), поэтому просмотры пересобирались
  // на каждом тике и не крутились вообще, а лайки с их «+1» крутились
  // нормально. Считаем не разряды, а величину: тик прибавляет малую долю
  // числа, подмена меняет его заметно или вовсе уводит вниз.
  const step = nextNum - prevNum;
  if (!(isFinite(prevNum) && step >= 0 && step <= Math.max(1000, prevNum * 0.01))) {
    vcBuild(el, s);
    return;
  }
  const cells = odo.children;
  let order = 0;
  for (let i = 0; i < s.length; i++) {
    if (!isDigit(s[i])) continue;
    // Порядковый номер считаем только по меняющимся разрядам: иначе у числа с
    // неподвижными старшими разрядами лесенка начиналась бы с большой задержки.
    const moves = (+cells[i].dataset.i) % 10 !== +s[i];
    vcRoll(cells[i], +s[i], moves ? order++ : 0);
  }
}
/* Первая сборка (и после каждой перерисовки слоя) — без анимации:
   иначе число «прилетало» бы с нуля при любом клике по фильтру. */
function vcBuild(el, s) {
  const odo = document.createElement('span');
  odo.className = 'odo';
  odo.dataset.shape = vcShape(s);
  for (let i = 0; i < s.length; i++) {
    const cell = document.createElement('span');
    cell.className = 'odo-c';
    if (isDigit(s[i])) {
      const strip = document.createElement('span');
      strip.className = 'odo-s';
      strip.style.transition = 'none';
      for (let k = 0; k < 30; k++) {       // три круга 0…9: оборот барабана + перенос разряда
        const d = document.createElement('i');
        d.textContent = String(k % 10);
        strip.appendChild(d);
      }
      strip.style.transform = 'translateY(-' + s[i] + 'em)';
      cell.dataset.i = s[i];             // позиция ленты, 0…19
      cell.appendChild(strip);
    } else {
      cell.textContent = s[i];             // разделитель разрядов, он неподвижен
    }
    odo.appendChild(cell);
  }
  el.textContent = '';
  el.appendChild(odo);
  void odo.offsetWidth;                    // позиции применились — включаем переходы
  const strips = odo.getElementsByClassName('odo-s');
  for (let i = 0; i < strips.length; i++) strips[i].style.transition = '';
}
function vcRoll(cell, next, order) {
  const strip = cell.firstElementChild;
  if (!strip) return;
  let idx = +cell.dataset.i;               // где стоит лента: 0…19
  const cur = idx % 10;                    // какая цифра при этом видна
  if (cur === next) return;
  // Со второго круга снимаем перед новой прокруткой, а не по transitionend:
  // в фоновой вкладке переходы не идут и событие не приходит, а для экрана на
  // стене это как раз обычный режим — лента доползла бы до конца и сломалась.
  // Скачка не видно: цифра на позиции idx и на позиции idx−10 одна и та же.
  if (idx >= 10) {
    idx = cur;
    strip.style.transition = 'none';
    strip.style.transform = 'translateY(-' + idx + 'em)';
    void strip.offsetWidth;
    strip.style.transition = '';
  }
  // Счётчик только растёт, поэтому крутим всегда вперёд: при переносе через
  // девятку уезжаем на следующий круг ленты. Сверху добавляем полный оборот —
  // без него разряд просто переставлялся на соседнюю цифру, а нужен барабан.
  const spin = vcReduceMotion() ? 0 : VC_SPIN_TURNS * 10;
  const target = (next > cur ? next : next + 10) + spin;
  const ms = VC_ROLL_MS + (order || 0) * VC_ROLL_STEP_MS;
  strip.style.transition = vcReduceMotion()
    ? 'none'
    : 'transform ' + ms + 'ms ' + VC_ROLL_EASE;
  cell.dataset.i = target;
  strip.style.transform = 'translateY(-' + target + 'em)';
  // Досылаем цифру на место, даже если переход не отработал. В фоновой или
  // притормаживаемой вкладке анимации не идут вовсе — а для экрана на стене
  // это обычный режим, и разряд остался бы застывшим на полпути.
  clearTimeout(cell._settle);
  cell._settle = setTimeout(function () {
    if (+cell.dataset.i !== target) return;      // уже уехал дальше
    strip.style.transition = 'none';
    strip.style.transform = 'translateY(-' + (target % 10) + 'em)';
    void strip.offsetWidth;
    strip.style.transition = '';
    cell.dataset.i = target % 10;
  }, ms + 800);
}
function vcStart() {
  clearInterval(vcTimer);
  // Барабан только на стене (/efir и /<домен>/efir), не на «Аккаунтах».
  if (!state.vc || state.route !== 'tv') return;
  vcPaint();
  vcTimer = setInterval(function () {
    const v = state.vc;
    // Новые якоря — в следующие 10:00 (не в 20:00: там просто стоим).
    const reloadAt = v && (v.next || v.end);
    if (v && reloadAt && Date.now() + v.skew >= reloadAt) { loadViewsAnchors(); return; }
    if (state.route !== 'tv') { clearInterval(vcTimer); return; }
    vcPaint();
  }, VC_TICK_MS);
}

/* Задачи настроек (вход, импорт куков) идут фоном: сразу возвращается
   job_id, результат приходит позже. Ответ берём у сервера, а не придумываем. */
async function waitSettingsJob(jobId, tries) {
  if (!jobId) return null;
  const max = tries || 60;
  for (let i = 0; i < max; i++) {
    await new Promise(function (r) { setTimeout(r, 1000); });
    let j = null;
    try { j = await api('/api/settings/job/' + encodeURIComponent(jobId) + '/'); } catch (e) { continue; }
    if (!j) continue;
    if (j.status === 'done') return j;
    if (j.status === 'error') { const e = new Error(j.message || 'Не удалось'); throw e; }
  }
  throw new Error('Сервер не ответил за минуту — посмотрите состояние сессий позже');
}

async function loadSessionsLive() {
  try {
    const s = await api('/api/settings/status/');
    const out = [];
    PLATFORMS.forEach(function (pl) {
      const st = s[pl.v];
      if (!st) return;
      let ok = !!st.has_session;
      let note = ok ? 'активна' : 'нет сессии';
      const soonest = (st.cookies || []).map(function (c) { return c.expires_ts; })
        .filter(function (x) { return x; }).sort(function (x, y) { return x - y; })[0];
      if (ok && soonest) {
        const days = Math.round((soonest * 1000 - Date.now()) / 86400000);
        if (days < 0)       { ok = false;  note = 'истекла'; }
        else if (days <= 3) { ok = 'warn'; note = 'истекает через ' + days + ' ' + plural(days, ['день','дня','дней']); }
        else                { note = 'до ' + new Date(soonest * 1000).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }); }
      }
      out.push({ p: pl.v, ok: ok, note: note });
    });
    if (out.length) { SESSIONS.length = 0; out.forEach(function (x) { SESSIONS.push(x); }); }
    if (state.route === 'settings') render();
  } catch (e) {}
}

async function loadAnalytics() {
  if (!LIVE || state.an.loading) return;
  state.an.loading = true;
  state.an.error = null;
  if (state.route === 'analytics') paintBody();
  const q = '&platform=' + (state.an.platform === 'all' ? '' : state.an.platform) +

/* ============================================================
   ЗАПИСЬ В API
   Читающая часть выше. Здесь всё, что меняет данные на сервере
   или дёргает площадки. Каждое действие: запрос -> уведомление
   с ответом сервера -> перезагрузка списка.
   ============================================================ */
async function apiSend(path, body, method) {
  const r = await fetch(API_BASE + path, {
    method: method || 'POST',
    headers: domainHeaders({ 'Content-Type': 'application/json', Accept: 'application/json' }),
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  let data = null;
  try { data = await r.json(); } catch (e) { /* пустой ответ — это нормально */ }
  if (!r.ok) {
    const err = new Error((data && (data.detail || data.error)) || ('HTTP ' + r.status));
    err.status = r.status;
    throw err;
  }
  return data || {};
}

/* Перечитать список аккаунтов после изменения. */
async function reloadAccounts() {
  if (!LIVE) return;
  const rows = await api('/api/accounts/?' + ACC_QS + '&delta_period_days=' + state.period);
  ACCOUNTS.length = 0;
  rows.forEach(function (r) { ACCOUNTS.push(mapAccount(r)); });
  Object.keys(deltaLoaded).forEach(function (k) { deltaLoaded[k] = +k === state.period; });
}

/* Обёртка: блокирует запрос в демо, показывает ошибку сервера как есть. */
async function run(fn, okMsg, opts) {
  if (DEMO || !LIVE) { toast('Демо-режим: запрос не отправлен'); return null; }
  try {
    const res = await fn();
    if (!opts || opts.reload !== false) await reloadAccounts();
    if (okMsg) toast(typeof okMsg === 'function' ? okMsg(res) : okMsg);
    render();
    return res;
  } catch (e) {
    toast('Не получилось: ' + e.message);
    render();
    return null;
  }
}

const A = {
  refreshOne: function (id) {
    if (state.refreshing && state.refreshing[id]) return Promise.resolve(null);
    setRefreshing(id, true);
    render();
    return run(
      function () { return apiSend('/api/accounts/' + id + '/refresh/'); },
      'Аккаунт обновлён'
    ).finally(function () {
      setRefreshing(id, false);
      render();
    });
  },
  bulkRefresh: function (ids) {
    setRefreshing(ids, true);
    render();
    return run(function () { return apiSend('/api/accounts/bulk-refresh/', { ids: ids }); },
      ids.length + ' ' + plural(ids.length, ['аккаунт отправлен', 'аккаунта отправлены', 'аккаунтов отправлено']) + ' на обновление'
    ).finally(function () {
      setRefreshing(ids, false);
      render();
    });
  },
  bulkUpdate: function (ids, fields, msg) {
    const body = Object.assign({ ids: ids }, fields);
    return run(function () { return apiSend('/api/accounts/bulk-update/', body); },
      function (r) { return msg + ' — изменено ' + (r.updated != null ? r.updated : ids.length); });
  },
  bulkDelete: function (ids) {
    return run(function () { return apiSend('/api/accounts/bulk-delete/', { ids: ids }); },
      function (r) { return 'Удалено ' + (r.deleted != null ? r.deleted : ids.length); });
  },
  /* Перенос в домен. Внутри домена перенесённый аккаунт из списка пропадёт —
     он теперь в другом, поэтому так и пишем, чтобы это не выглядело пропажей. */
  setDomain: function (ids, domainId) {
    const list = (state.domains && state.domains.list) || [];
    const d = list.filter(function (x) { return x.id === domainId; })[0];

/* Разбор поля «ссылки или @имена». Платформу определяем по домену,
   иначе оставляем выбранную в форме. */
const HOST_PLATFORM = [
  ['tiktok.com', 'tiktok'], ['instagram.com', 'instagram'], ['youtube.com', 'youtube'],
  ['youtu.be', 'youtube'], ['t.me', 'telegram'], ['telegram.me', 'telegram'],
  ['twitter.com', 'x'], ['x.com', 'x'], ['threads.net', 'threads'], ['threads.com', 'threads'],
  ['facebook.com', 'facebook'], ['fb.com', 'facebook'], ['rumble.com', 'rumble'],
  ['reddit.com', 'reddit'],
];
/* Старый интерфейс разбора — только прочитанные аккаунты. */
function parseAccountLines(text, fallbackPlatform) {
  return parseAccountInput(text, fallbackPlatform).items.map(function (it) {
    return { username: it.username, platform: it.platform };
  });
}
/* Похоже на ссылку: со схемой или «домен/путь». «@lotte.de.vries80» — не ссылка. */
function isAccountUrl(c) {
  return /^https?:\/\/\S/i.test(c) || /^(?:www\.)?(?:[a-z0-9-]+\.)+[a-z]{2,}\/\S*/i.test(c);
}
/* Разбор поля целиком. Строка может быть строкой таблицы: «@ник ссылка @ник
   ссылка … Имя Фамилия ссылка БАН» — тогда берём КАЖДУЮ ссылку, а слова рядом
   пропускаем. Раньше бралась только первая ссылка строки: из семи площадок
   доходил один TikTok, остальные молча терялись. Всё, что прочитать нельзя,
   возвращаем с номером строки и причиной, а не выбрасываем. */
/* Для «Убрать» и «Перенести»: голое @имя без ссылки и без выбранной площадки
   ищем на всех площадках, а не только в TikTok (так подставляет разбор). */
function standItems(p, fallbackPlatform) {
  return p.items.map(function (it) {
    const bare = !fallbackPlatform && !/[./]/.test(String(it.src || '').replace(/^@/, '').split(/[/?#]/)[0]) && !isAccountUrl(it.src || '');
    return { username: it.username, platform: bare ? '' : it.platform };
  });
}
function parseAccountInput(text, fallbackPlatform) {
  const items = [], bad = [], seen = {};
  let dup = 0;
  String(text || '').split(/\r?\n/).forEach(function (rawLine, li) {
    const n = 'стр. ' + (li + 1);
    rawLine.split(/[,;]+/).forEach(function (chunk) {
      const line = chunk.trim();
      if (!line) return;
      const tokens = line.split(/\s+/).filter(Boolean);
      const urls = tokens.filter(isAccountUrl);
      let pieces;
      if (urls.length) pieces = urls;
      else if (tokens.length === 1 || tokens.every(function (t) { return t.charAt(0) === '@'; })) pieces = tokens;
      else {
        bad.push({ n: n, t: line, w: 'нет ссылки, а слов несколько — непонятно, какое из них имя. Нужна ссылка или одно @имя' });
        return;
      }
      pieces.forEach(function (piece) {
        const r = parseAccountPiece(piece, fallbackPlatform);
        if (r.why) { bad.push({ n: n, t: piece, w: r.why }); return; }
        const key = r.platform + ':' + r.username.toLowerCase();
        if (seen[key]) { dup++; return; }
        seen[key] = true;
        items.push({ username: r.username, platform: r.platform, src: piece, n: n });
      });
    });
  });
  return { items: items, bad: bad, dup: dup };
}
/* Одна ссылка или одно имя → {username, platform} или {why}. */
function parseAccountPiece(line, fallbackPlatform) {
  let platform = fallbackPlatform || 'tiktok';
  let username = line;
  // http(s) необязателен: в буфер часто попадает www.youtube.com/@имя
  const m = line.match(/^(?:https?:\/\/)?([^/\s]+)(\/[^?\s#]*)?/i);
  if (m && /[./]/.test(m[1])) {
    const host = m[1].toLowerCase().replace(/^(?:www|m|mobile)\./, '');
    const hit = HOST_PLATFORM.filter(function (h) {
      return host === h[0] || host.endsWith('.' + h[0]);
    })[0];
    if (hit) platform = hit[1];
    else if (isAccountUrl(line)) return { why: 'сайт ' + host + ' не поддерживается' };
    const parts = (m[2] || '').split('/').filter(Boolean).map(function (p) {
      try { return decodeURIComponent(p); } catch (e) { return p; }
    });
    const p0 = (parts[0] || '').toLowerCase();
    if (hit && !parts.length && !/[?&]id=\d/i.test(line)) return { why: 'в ссылке нет имени аккаунта' };
    if (platform === 'youtube') {
      if (host === 'youtu.be' || ['watch', 'shorts', 'live', 'playlist', 'embed'].indexOf(p0) >= 0) {
        return { why: 'это ссылка на видео — нужна ссылка на канал (youtube.com/@имя)' };
      }
      username = youtubeUsernameFromParts(parts, host);
    } else if (platform === 'facebook') {
      if (p0 === 'share') {
        return { why: 'ссылка «Поделиться» не показывает, чей профиль: откройте её и скопируйте адрес страницы из браузера' };
      }
      if (p0 === 'people' && /^\d{6,24}$/.test(parts[2] || '')) username = parts[2];
      else if (['groups', 'watch', 'reel', 'videos', 'photo', 'photo.php', 'story.php', 'permalink.php', 'events', 'posts'].indexOf(p0) >= 0) {
        return { why: 'это ссылка на пост или группу, а не на профиль' };
      } else {
        // regex выше отрезает ?id=… — иначе username стал бы «profile.php»
        // и upsert не находил уже существующий числовой id в БД.
        username = facebookUsernameFromLine(line, parts);
        if (!username) return { why: 'в ссылке нет id профиля' };
      }
    } else if (platform === 'tiktok' && (/^v[mt]\./.test(host) || p0 === 't')) {
      return { why: 'короткая ссылка — откройте её и скопируйте адрес профиля' };
    } else if (platform === 'instagram' && ['p', 'reel', 'reels', 'tv', 'explore'].indexOf(p0) >= 0) {
      return { why: 'это ссылка на публикацию, а не на профиль' };
    } else if (platform === 'x' && ['i', 'intent', 'home', 'search', 'hashtag'].indexOf(p0) >= 0) {
      return { why: 'в ссылке нет имени аккаунта' };
    } else if (parts.length) {
      // Имя — первый сегмент: x.com/имя/status/…, t.me/имя/123, tiktok.com/@имя/video/….
      // Служебные префиксы пропускаем: rumble.com/user/имя, reddit.com/r/имя.
      username = parts[0];
      const skip = { rumble: ['user', 'c'], reddit: ['r', 'u', 'user'], telegram: ['s'], instagram: ['stories'] }[platform] || [];
      if (skip.indexOf(p0) >= 0 && parts[1]) username = parts[1];
    } else {
      username = host;
    }
  }
  username = String(username || '').replace(/^@/, '').replace(/[?#].*$/, '').trim();
  if (!username) return { why: 'не нашёл имя аккаунта' };
  if (/\s/.test(username) || username.length > 100) return { why: 'не похоже на имя аккаунта' };
  return { username: username, platform: platform };
}
/* /@handle, /@handle/videos, /channel/UC…, /c/name, /user/name — не брать
   последний сегмент вслепую (иначе videos/about затирают кириллический @). */
function youtubeUsernameFromParts(parts, host) {
  if (!parts.length) return host || '';
  const a = parts[0];
  const al = a.toLowerCase();
  if (al === 'channel' && parts[1]) return parts[1];
  if ((al === 'c' || al === 'user') && parts[1]) return parts[1].replace(/^@/, '');
  if (a.charAt(0) === '@') return a.slice(1);
  if (/^UC[\w-]{10,}$/i.test(a)) return a;
  return a.replace(/^@/, '');
}
/* Как на бэкенде: profile.php?id=N → цифры; vanity → slug; путь из цифр → id. */
function facebookUsernameFromLine(line, parts) {
  const idm = String(line || '').match(/[?&]id=(\d{6,24})\b/i);
  if (idm) return idm[1];
  if (!parts || !parts.length) return '';
  const a = parts[0];
  const al = String(a || '').toLowerCase();
  if (al === 'profile.php') return '';
  if (/^\d{6,24}$/.test(a)) return a;
  return String(a || '').replace(/^@/, '');
}

/* Подтверждение для необратимого. Только overlay — иначе скролл страницы
   уезжает наверх ещё до ответа пользователя. */
let PENDING_CONFIRM = null;
function askConfirm(o) {
  PENDING_CONFIRM = o;
  state.modal = 'confirm';
  if (document.getElementById('overlay')) paintOverlay();
  else render();
}
function modalConfirm() {
  const c = PENDING_CONFIRM;
  if (!c) return '';
  const body = '<div style="font-size:13px;color:var(--ink-2);line-height:1.5">' + c.text + '</div>' +
    (c.note ? '<div class="errbar">' + ic('alert', 16) + '<div>' + c.note + '</div></div>' : '');
  const ft = '<div class="grow"></div><button class="btn" data-act="close">Отмена</button>' +
    '<button class="btn ' + (c.danger ? 'dgr' : 'pri') + '" data-act="confirm-ok">' + esc(c.ok || 'Продолжить') + '</button>';
  return modalShell(c.title, body, ft);
}

function applyCatalogRows(profiles, owners, groups, countries) {
  const domName = function (id) {
    if (!id || !state.domains || !state.domains.list) return '';
    const d = state.domains.list.filter(function (x) { return x.id === id; })[0];
    return d ? d.name : '';
  };
  PROFILES.length = 0;
  (profiles || []).forEach(function (p) {
    const domainId = p.domain_id || 0;
    PROFILES.push({
      id: p.id, name: p.name, color: p.color || '#8A857C',
      hidden: !!p.is_hidden, count: p.account_count || 0,
      domainId: domainId, domainName: domName(domainId),
    });
  });
  OWNERS.length = 0;
  (owners || []).forEach(function (o) {
    const domainId = o.domain_id || 0;
    OWNERS.push({
      id: o.id, name: o.name, color: o.color || '#6366f1', count: o.account_count || 0,
      domainId: domainId, domainName: domName(domainId),
    });
  });
  GROUPS.length = 0;
  (groups || []).forEach(function (g) {
    const domainId = g.domain_id || 0;
    GROUPS.push({
      id: g.id, name: g.name, color: g.color || '#6366f1', count: g.account_count || 0,
      domainId: domainId, domainName: domName(domainId),
    });
  });
  COUNTRIES.length = 0;
  (countries || []).forEach(function (c) {
    const domainId = c.domain_id || 0;
    COUNTRIES.push({
      id: c.id, name: c.name, color: c.color || '#6366f1', count: c.account_count || 0,
      domainId: domainId, domainName: domName(domainId),
    });
  });
}

async function bootLive() {
  if (DEMO) {
    // Данные-заглушки уже в памяти, имитация прогона запущена в startRun()
    state.booting = false;
    render();
    return;
  }
  try {
    const settled = await Promise.all([
      // У «Стендов» своих справочников нет: для формы берём общие.
      api('/api/accounts/profiles/?include_hidden_profiles=1', { allDomains: aiCreates() }),
      api('/api/accounts/owners/', { allDomains: aiCreates() }),
      api('/api/accounts/groups/', { allDomains: aiCreates() }),
      api('/api/accounts/countries/', { allDomains: aiCreates() }),
      api('/api/accounts/?' + ACC_QS + '&delta_period_days=' + state.period),
      api('/api/accounts/domains/').catch(function () { return null; }),
      api('/api/accounts/views-anchors/').catch(function () { return null; }),
    ]);
    const profiles = settled[0], owners = settled[1], groups = settled[2], countries = settled[3];
    const rows = settled[4], domainsPayload = settled[5], anchorsPayload = settled[6];
    applyCatalogRows(profiles, owners, groups, countries);
    ACCOUNTS.length = 0;  rows.forEach(function (r) { ACCOUNTS.push(mapAccount(r)); });
    applyDomainsPayload(domainsPayload);
    applyViewsAnchorsPayload(anchorsPayload);
    if (isAi()) await loadAiTopics();

    deltaLoaded[state.period] = true;
    LIVE = true;
    state.apiError = null;
    state.booting = false;
    clearInterval(state.run.timer);      // выключаем имитацию прогона
    state.run.on = false;
    render();                            // vcStart внутри render при route=tv
    pollRun();
    // Опрос статуса заводим один раз: bootLive() зовётся ещё и по «Повторить»
    // после ошибки API, а незапомненный интервал потом не остановить.
    clearInterval(pollTimer);
    pollTimer = setInterval(pollRun, 4000);
    loadSessionsLive();
    if (state.route === 'settings') { loadScrapeBackend(); loadSchedule(); }
  } catch (e) {
    LIVE = false;
    state.apiError = String(e.message || e);
    state.booting = false;
    render();
  }
}


/* Пересобираем при переходе через контрольные размеры окна: на узком экране
   список всегда карточками, в невысоком — обычная прокрутка страницы. */
function layoutKey() {
  return (isNarrow() ? 'n' : '') + (window.innerHeight >= 680 && window.innerWidth >= 1080 ? 'r' : '');
}
let wasLayout = layoutKey();
let resizeT = null;
window.addEventListener('resize', function () {
  if (state.menu) { state.menu = null; render(); }
  clearTimeout(resizeT);
  resizeT = setTimeout(function () {
    const k = layoutKey();
    if (k !== wasLayout) { wasLayout = k; render(); }
  }, 120);
});

/* Имитация идущего прогона.
   Тик обновляет только ленту, а не всю страницу: полный re-render каждые
   3 секунды сбрасывал бы фокус, выделение текста и позицию скролла. */
function startRun() {
  clearInterval(state.run.timer);
  state.run.timer = setInterval(runTick, 3000);
}
function runTick() {
  if (!state.run.on) return;
  state.run.done = Math.min(state.run.total, state.run.done + Math.floor(Math.random() * 3));
  const pool = ACCOUNTS.filter(function (a) { return !a.archived && !a.banned; });
  state.run.cur = '@' + pool[Math.floor(Math.random() * pool.length)].username;
  if (state.run.done >= state.run.total) {
    state.run.on = false; clearInterval(state.run.timer); render(); toast('Прогон завершён'); return;
  }
  if (state.modal === 'refreshAll') { paintOverlay(); return; }
  const done = document.getElementById('rb-done');
  const bar  = document.getElementById('rb-bar');
  const cur  = document.getElementById('rb-cur');
  if (!done || !bar || !cur) return;
  done.textContent = state.run.done + ' / ' + state.run.total;
  bar.style.width = Math.round(state.run.done / state.run.total * 100) + '%';
  cur.textContent = 'Сейчас: ' + state.run.cur + ' · осталось ~' + Math.max(1, Math.round((state.run.total - state.run.done) / 16)) + ' мин';
}
/* Экран берём из адреса: /efir и /<домен>/efir — эфир, /analytics и
   /settings — свои экраны. Сохранённый маршрут тут не спрашиваем: адрес
   главнее. Заодно переписываем строку без чужих параметров — старые ссылки
   вроде ?route=tv больше не висят в адресе. */
if (TV_ON_LOAD) {
  state.route = 'tv';
} else {
  const last = PATH_SEGS[PATH_SEGS.length - 1];
  if (last && SCREEN_SEG[last]) state.route = SCREEN_SEG[last];
}
syncUrl(true);

/* Первая отрисовка — скелетон, пока идут запросы к API */
render();
bootLive();
</script>
