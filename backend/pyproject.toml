[tool.poetry]
name = "dashboard-backend"
version = "0.0.0"
description = "Django API дашборда (аккаунты, скрапинг, расписание)."
authors = ["Dashboard"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
django = ">=5.1"
djangorestframework = ">=3.15"
django-cors-headers = ">=4.4"
# Колёса psycopg-binary под Windows + обычный CPython 3.13; не использовать Python 3.13 free-threading для этого venv.
psycopg = { version = ">=3.1.12", extras = ["binary"] }
python-dotenv = ">=1.0"
httpx = ">=0.27"
playwright = ">=1.44"
apscheduler = ">=3.10"
gunicorn = ">=22.0"
dj-database-url = ">=2.2"
whitenoise = ">=6.7"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
